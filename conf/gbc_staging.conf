# DOSBox Staging settings for Gold Box Companion, The All-Seeing Eye and
# Ultimapper 5. Load this after the game's own config, e.g.
#   dosbox.exe -conf <game>\dosbox.conf -conf gbc_staging.conf

[sdl]
# The tools find the DOSBox window by its title; keep "DOSBox Staging" in it
# (Staging's default, dosbox=auto, drops it while a program runs).
window_titlebar = program=name dosbox=always cycles=on mouse=full

[webserver]
# The tools read and write the game's memory through the HTTP API.
webserver_enabled = on
# Optional: the patched tools find the API on whichever port this DOSBox
# listens on (Staging's defaults vary: 8086, 8080). Set one here if you like.
webserver_port = 8086
