      '-',
      { label: 'Debug', sub: [
        { label: 'Debug-mode', key: 'Ctrl+D', checked: s.debug, act: toggleDebug }, '-',
        { label: 'Editor', key: 'Ctrl+E', act: () => Editor.open() }, '-',
        { label: 'Forward time by 1 hour', key: 'Ctrl+T', act: forwardTime }, '-',
        { label: 'Exit combat', key: 'Ctrl+X', act: exitCombat }, '-',
        { label: 'Dump TLK during talk', act: dumpTlk }, '-',
        { label: 'Dump memory to file', act: dumpMemory }, '-',
        { label: 'Debug log', key: 'Ctrl+L', act: () => LogWin.open() }] },
      '-', { label: 'Quit', key: 'Ctrl+Q', act: quit },
    ];
  },
  build(items, x, y, parent) {
    const m = el('div', { className: 'menu' });
    for (const it of items) {
      if (it === '-') { m.append(el('div', { className: 'sep' })); continue; }
      const mi = el('div', { className: 'mi' + (it.checked ? ' chk' : '') + (it.sub ? ' sub' : '') + (it.disabled ? ' dis' : '') },
        el('span', { textContent: it.label }), el('span', { className: 'k', textContent: it.key || '' }));
      if (it.sub) mi.onmouseenter = () => {
        m.querySelectorAll('.mi.open').forEach(o => o.classList.remove('open'));
        m.querySelectorAll(':scope ~ .menu').forEach(o => o.remove());
        this.closeFrom(m);
        mi.classList.add('open');
        const r = mi.getBoundingClientRect();
        this.build(it.sub, r.right - 2, r.top - 4, m);
      };
      else mi.onmouseenter = () => { m.querySelectorAll('.mi.open').forEach(o => o.classList.remove('open')); this.closeFrom(m); };
      if (!it.sub && !it.disabled) mi.onclick = () => { this.hide(); it.act(); };
      m.append(mi);
    }
    document.body.append(m);
    m.dataset.level = parent ? +parent.dataset.level + 1 : 0;
    const r = m.getBoundingClientRect();
    m.style.left = Math.max(0, Math.min(x, innerWidth - r.width - 2)) + 'px';
    m.style.top = Math.max(0, Math.min(y, innerHeight - r.height - 2)) + 'px';
    return m;
  },
  closeFrom(m) {
    const lvl = +m.dataset.level;
    document.querySelectorAll('.menu').forEach(o => { if (+o.dataset.level > lvl) o.remove(); });
  },
  show(x, y) { this.hide(); this.build(this.items(), x, y, null); },
  hide() { document.querySelectorAll('.menu').forEach(m => m.remove()); },
};
document.addEventListener('mousedown', ev => { if (!ev.target.closest('.menu')) Menu.hide(); });

/* --------------------------------------------------------- dialogs */

const Dlg = {
  z: 40,
  make(id, title, w) {
    let d = document.getElementById(id);
    if (d) { d.style.zIndex = ++this.z; return d; }
    d = el('div', { id, className: 'dlg' });
    const head = el('header', {}, el('span', { className: 't', textContent: title }),
      el('button', { textContent: '✕', onclick: () => d.remove() }));
    const body = el('div', { className: 'body' });
    d.append(head, body);
    d.style.width = w + 'px';
    d.style.left = Math.max(10, (innerWidth - w) / 2) + 'px';
    d.style.top = '60px';
    d.style.zIndex = ++this.z;
    document.body.append(d);
    let drag = null;
    head.onmousedown = e => { if (e.target.tagName === 'BUTTON') return; drag = [e.clientX - d.offsetLeft, e.clientY - d.offsetTop]; d.style.zIndex = ++this.z; };
    document.addEventListener('mousemove', e => { if (drag) { d.style.left = e.clientX - drag[0] + 'px'; d.style.top = e.clientY - drag[1] + 'px'; } });
    document.addEventListener('mouseup', () => drag = null);
    return d;
  },
  closeTop() {
    const all = [...document.querySelectorAll('.dlg')];
    if (all.length) all.sort((a, b) => b.style.zIndex - a.style.zIndex)[0].remove();
  },
};

/* ------------------------------------------------------ lists window
 * The original's spells and inventory window (its Inventory_Form): one canvas, drawn as its
 * 459068 (spells) and 459BE4 (inventory) draw their bitmap, again when what it shows changed
 * in the save or when told to. Its client area is the original's 648 x 776 (the original's
 * when its HUD isn't shown; with the HUD it first covers DOSBox and the HUD). Keys: Esc hides
 * it; Up / Down (8 / 2 on the keypad), Home and End move the choice; PageDown / PageUp make
 * the window 16 pixels shorter / taller in its proportions; Enter mixes the chosen spell; Tab
 * switches lists; R puts the window back. The mouse: moving chooses the row under it, a left
 * click mixes that, a right click switches lists. The choice goes after 10 seconds (50 ticks
 * of the original's 200 ms timer) without either. */

// the original's spell list, by name within each circle: save index (0-47) and the reagents
// needed (bit 0 ash ... bit 7 mandrake), Ultimapper's (Rel Xen Bet's and In Quas Xen's differ
// from SPELLS')
const LIST_SPELLS = [[3, 6], [5, 20], [2, 6], [1, 33], [0, 1], [4, 10], [6, 17], [7, 5], [9, 64], [11, 134], [10, 136],
  [8, 17], [14, 41], [15, 104], [17, 24], [16, 42], [13, 33], [12, 129], [18, 33], [22, 24], [19, 7], [20, 168], [21, 24],
  [23, 72], [25, 21], [24, 25], [26, 17], [28, 74], [29, 145], [27, 138], [34, 104], [32, 133], [30, 145], [31, 192],
  [35, 201], [33, 129], [40, 81], [41, 196], [39, 192], [38, 155], [36, 208], [37, 96], [47, 148], [45, 145], [42, 159],
  [44, 193], [43, 156], [46, 161]];
// the inventory's names for 21A-289 (the spells' only count for the column width) and the
// headings before items; the quest items (bytes, FF owned) and the reagents (2AA-2B1)
const LIST_ITEMS = ['Leather Helm', 'Chain Coif', 'Iron Helm', 'Spiked Helm', 'Small Shield', 'Large Shield',
  'Spiked Shield', 'Magic Shield', 'Jewelled Shield', 'Cloth', 'Leather', 'Ring Mail', 'Scale', 'Chain', 'Plate',
  'Mystic Armor', 'Dagger', 'Sling', 'Club', 'Flaming Oil', 'Main Gauche', 'Spear', 'Throwing Axe', 'Short Sword',
  'Mace', 'Morning Star', 'Bow', 'Arrows', 'Crossbow', 'Quarrels', 'Long Sword', '2H Hammer', '2H Axe', '2H Sword',
  'Halberd', 'Chaos Sword', 'Magic Bow', 'Silver Sword', 'Magic Axe', 'Glass Sword', 'Jeweled Sword', 'Mystic Sword',
  'Invisibility Ring', 'Protection Ring', 'Regeneration Ring', 'Amulet of Turning', 'Spiked Collar', 'Ankh',
  ...SPELLS.map(s => s[0]),
  'Vas Lor (Light)', 'Rel Hur (Change Wind)', 'In Sanct (Protection)', 'In An (Negate Magic)', 'In Quas Wis (Peer Map)',
  'Kal Xen Corp (Summon Daemon)', 'In Mani Corp (Resurrect)', 'An Tym (Time Stop)', 'Blue (Awaken)', 'Yellow (Heal)',
  'Red (Cure Poison)', 'Green (Poison)', 'Orange (Sleep)', 'Purple (Rat)', 'Black (Invisibility)', 'White (X-Ray)'];
const LIST_HEADS = [[0, 'HELMETS'], [4, 'SHIELDS'], [9, 'ARMOR'], [16, 'WEAPONS'], [42, 'RINGS'], [45, 'AMULETS'],
  [96, 'SCROLLS'], [104, 'POTIONS']];
const LIST_QUEST = [[0x209, 'Grapple'], [0x20A, 'Magic carpet'], [0x214, 'Spy glass'], [0x215, 'HMS Cape plans'],
  [0x216, 'Sextant'], [0x217, 'Pocket watch'], [0x218, 'Black Badge'], [0x20D, 'Amulet of Lord British'],
  [0x20E, 'Crown of Lord British'], [0x20F, 'Sceptre of Lord British'], [0x212, 'Shard of Cowardice'],
  [0x210, 'Shard of Falsehood'], [0x211, 'Shard of Hatred'], [0x219, 'Sandalwood Box']];
const LIST_REAGENTS = ['Sulfur Ash', 'Ginseng', 'Garlic', 'Spider Silk', 'Blood Moss', 'Black Pearl', 'Nightshade',
  'Mandrake Root'];
// Verdana's character height (lfHeight -px) for a cell height (lfHeight +h, 0-50), as GDI picks
// it (the same ascent, descent and widths); cells 8 and 9 have the widths of 6 and 7 with
// GDI's own ascent and descent: [px, ascent, descent] (measured on Windows)
const VERDANA_CELL = [1, 1, 1, 2, 3, 4, 5, 6, [6, 7, 1], [7, 7, 2], 8, 8, 9, 11, 12, 12, 13, 14, 15, 16, 17, 17, 18, 19,
  19, 20, 22, 22, 23, 24, 24, 25, 26, 27, 28, 29, 30, 30, 31, 32, 33, 34, 35, 35, 36, 37, 38, 39, 40, 41, 41];

const Lists = {
  mode: 0, sel: 0, rows: 0, rects: [], can: [], seen: {}, force: false, idle: 0, pos: null,
  w: 648, h: 776, home: [648, 776],   // the client area (its paint box and bitmap), the first one
  frame: [16, 39],         // the window around it (a fixed window's on Windows 10 / 11): PageUp / PageDown size that
  // Spells / Inventory in the menu, S / I, a click on the HUD's right part: that list, nothing
  // chosen; shown already, the window back in its place (the original's 469A4C)
  open(mode) {
    if (!Game.save) return;
    this.mode = mode === 'inventory' ? 1 : 0;
    this.sel = 0; this.idle = Date.now();
    const shown = document.getElementById('lists');
    if (shown && this.pos) [shown.style.left, shown.style.top] = this.pos;
    this.force = true;
    this.window().focus();
    this.refresh();
  },
  // the window, made when it isn't shown; its caption the list's
  window() {
    let d = document.getElementById('lists');
    if (!d) {
      d = Dlg.make('lists', '', this.w + 2);
      const body = d.querySelector('.body');
      Object.assign(body.style, { padding: '0', overflow: 'hidden', background: '#000' });
      const c = el('canvas', { id: 'listsCanvas', width: this.w, height: this.h });
      c.style.display = 'block';
      body.replaceChildren(c);
      d.tabIndex = -1;
      d.onkeydown = e => this.key(e);
      c.onmousemove = e => this.move(e);
      c.onmousedown = e => this.down(e);
      c.oncontextmenu = e => e.preventDefault();
      d.querySelector('header button').onclick = () => this.close();
      if (this.pos) [d.style.left, d.style.top] = this.pos;
      else this.pos = [d.style.left, d.style.top];   // its first place kept, as the original keeps it
      this.force = true;
    } else Dlg.make('lists');
    d.querySelector('.t').textContent = this.mode ? 'Inventory' : 'Spells';
    return d;
  },
  // hidden: nothing chosen, the place kept
  close() {
    const d = document.getElementById('lists');
    if (!d) return;
    this.pos = [d.style.left, d.style.top];
    d.remove();
    this.sel = 0;
  },
  // a new client size; home: the size R goes back to as well (the test gives the original's)
  size(w, h, frame, home) {
    if (frame) this.frame = frame;
    if (home) this.home = [w, h];
    this.w = w; this.h = h;
    const c = document.getElementById('listsCanvas');
    if (c) { c.width = w; c.height = h; document.getElementById('lists').style.width = w + 2 + 'px'; }
    this.force = true;
  },
  // PageDown / PageUp: the window 16 pixels shorter (not below 400 either way) / taller, as wide
  // as its proportions say
  resize(d) {
    let W = this.w + this.frame[0], H = this.h + this.frame[1];
    if (H <= 0 || (d < 0 && (W - 16 < 400 || H - 16 < 400))) return false;
    const ratio = Math.fround(W / H);
    H += d;
    W = Math.trunc(H * ratio);
    this.size(W - this.frame[0], H - this.frame[1]);
    return true;
  },
  at(e) { const r = e.target.getBoundingClientRect(); return [Math.floor(e.clientX - r.left), Math.floor(e.clientY - r.top)]; },
  // the row at a point (1 up), 0 for none
  hit(x, y) {
    for (let i = 1; i <= this.rows; i++) {
      const r = this.rects[i];
      if (r && r[0] <= x && r[1] <= y && x <= r[2] && y <= r[3]) return i;
    }
    return 0;
  },
  move(e) {
    this.idle = Date.now();
    const was = this.sel;
    this.sel = this.hit(...this.at(e));
    if (this.sel !== was) { this.force = true; this.refresh(); }
  },
  down(e) {
    if (e.button === 0) { this.idle = Date.now(); this.sel = this.hit(...this.at(e)); this.mix(); }
    else if (e.button === 2) { this.mode ^= 1; this.window(); this.force = true; this.refresh(); }
  },
  key(e) {
    const k = e.keyCode;
    this.idle = Date.now();
    if (k === 27) { e.preventDefault(); e.stopPropagation(); this.close(); return; }
    if (k === 38 || k === 104) { if (this.sel > 1) { this.sel--; this.force = true; } }
    else if (k === 40 || k === 98) { if (this.sel < this.rows) { this.sel++; this.force = true; } }
    else if (k === 36) { if (this.sel > 1) { this.sel = 1; this.force = true; } }
    else if (k === 35) { if (this.sel < this.rows) { this.sel = this.rows; this.force = true; } }
    else if (k === 34) this.resize(-16);
    else if (k === 33) this.resize(16);
    else if (k === 13) this.mix();
    else if (k === 9) { this.mode ^= 1; this.window(); this.force = true; }
    else if (k === 82) { this.place(); this.force = true; }
    if (![9, 13, 33, 34, 35, 36, 38, 40, 82, 98, 104].includes(k)) { e.stopPropagation(); return; }   // the main window's keys aren't this one's
    e.preventDefault(); e.stopPropagation();
    if (this.force) this.refresh();
  },
  // R: the window shown as if new (the original's FormShow): nothing chosen, back in its first
  // size and place, which it keeps
  place() {
    this.sel = 0; this.idle = Date.now();
    this.pos = null;
    this.size(...this.home);
    const d = document.getElementById('lists');
    if (d) {
      d.style.left = Math.max(10, (innerWidth - this.w - 2) / 2) + 'px'; d.style.top = '60px';
      this.pos = [d.style.left, d.style.top];
    }
  },
  // every tick, as the original's position timer: the choice gone after 10 s, then a redraw
  // when needed
  tick() {
    if (!document.getElementById('lists')) return;
    if (this.sel > 0 && Date.now() - this.idle >= 10000) { this.sel = 0; this.idle = Date.now(); this.force = true; }
    this.refresh();
  },
  // the original's 45A504: drawn again when told to, or when what the list shows changed (spells:
  // their counts and the reagents; inventory: 209-289 and the reagents)
  refresh() {
    const c = document.getElementById('listsCanvas');
    if (!c || !Game.save) return;
    const s = Game.save, seen = this.seen, same = (k, from, to) => seen[k] && seen[k].every((v, i) => v === s[from + i]);
    const changed = this.force || !same('reagents', 0x2AA, 0x2B2) ||
      (this.mode ? !same('items', 0x21A) || !same('quest', 0x209) : !same('spells', 0x24A));
    this.force = false;
    if (!changed) return;
    const g = c.getContext('2d');
    g.fillStyle = '#000000';
    g.fillRect(0, 0, c.width, c.height);
    if (this.mode) this.drawInventory(g, c.width, c.height); else this.drawSpells(g, c.width, c.height);
    for (const [k, from, n] of [['reagents', 0x2AA, 8], ['items', 0x21A, 112], ['quest', 0x209, 17], ['spells', 0x24A, 48]])
      if (k === 'reagents' || (this.mode ? k !== 'spells' : k === 'spells')) seen[k] = [...s.subarray(from, from + n)];
  },
  font(g, cell) {
    const f = VERDANA_CELL[clamp(cell, 0, VERDANA_CELL.length - 1)];
    if (Array.isArray(f)) Gdi.font(g, f[0], 'Verdana', f[1], f[2], cell);
    else Gdi.font(g, f, 'Verdana', undefined, undefined, cell);
  },
  // L, N, spell, effect, how many can be mixed (the scarcest needed reagent, none at 99), the
  // reagents: a band of headings and the party's reagents above
  drawSpells(g, W, H) {
    const s = Game.save, m = round(W / 50), fh = Math.trunc((H - 2 * m - 58) / 50), half = Math.trunc(fh / 2);
    this.font(g, fh);
    const tw = t => Gdi.width(g, t);
    const w8 = tw('8'), w888 = tw('888'), wMan = tw('MAN'), wSp = tw('   ');
    const wName = Math.max(...LIST_SPELLS.map(([o]) => tw(SPELLS[o][0]))), wEff = Math.max(...LIST_SPELLS.map(([o]) => tw(SPELLS[o][3])));
    const x0 = Math.trunc((W - w8 - w888 - wName - wEff - 9 * wMan - 7 * wSp - 7 * fh) / 2);
    let y = Math.trunc((H - 50 * fh - 58) / 2);
    const text = (t, x, colour) => { g.fillStyle = colour; Gdi.text(g, t, x, y); };
    const right = (t, x, w, colour) => text(t, x + w - tw(t), colour);
    this.rects = [];
    g.fillStyle = '#222222';
    g.fillRect(x0 - half, y, W - 2 * x0 + 2 * half, fh);
    let x = x0;
    text('L', x, '#888888'); x += w8 + fh;
    right('N', x, w888, '#888888'); x += w888 + fh;
    text('SPELL', x, '#888888'); x += wName + fh;
    text('EFFECT', x, '#888888'); x += wEff + 2 * fh;
    right('CAN MIX', x, wMan, '#888888'); x += 2 * fh + wMan;
    for (const a of REAGENT_ABBR) { right(a.toUpperCase(), x, wMan, '#888888'); x += wMan + wSp; }
    y += fh + 5;
    x = x0 + w8 + w888 + wName + wEff + wMan + 7 * fh;
    for (let r = 0; r < 8; r++) {
      const v = s[0x2AA + r];
      right(v ? String(v) : '-', x, wMan, v ? '#888888' : '#444444');
      x += wMan + wSp;
    }
    y += fh + 5;
    this.can = [];
    LIST_SPELLS.forEach(([o, mask], k) => {
      const i = k + 1, n = s[0x24A + o];
      this.rects[i] = [x0, y, W - x0, y + fh];
      let can = 0;
      if (n < 99) for (let r = 0; r < 8; r++) {
        if (!(mask >> r & 1)) continue;
        const v = s[0x2AA + r];
        if (!v) { can = 0; break; }
        if (v < can || can === 0) can = v;
      }
      this.can[i] = can;
      let colour;
      if (this.sel === i) {
        g.fillStyle = '#222266';
        g.fillRect(x0 - half, y, W - 2 * x0 + 2 * half, fh);
        colour = n > 0 ? '#CCCCCC' : '#888888';
      } else colour = n > 0 ? '#AAAAAA' : '#444444';
      x = x0;
      text(String(Math.trunc((i - 1) / 6) + 1), x, colour); x += w8 + fh;
      right(String(n), x, w888, colour); x += w888 + fh;
      text(SPELLS[o][0], x, colour); x += wName + fh;
      text(SPELLS[o][3], x, colour); x += 2 * fh + wEff;
      right(can > 0 ? String(can) : '-', x, wMan, can > 0 ? '#228822' : '#444444'); x += 2 * fh + wMan;
      for (let r = 0; r < 8; r++) {
        if (mask >> r & 1) right(REAGENT_ABBR[r], x, wMan, s[0x2AA + r] > 0 ? '#228822' : '#882222');
        else right('-', x, wMan, '#444444');
        x += wMan + wSp;
      }
      y += fh + 1;
    });
    this.rows = LIST_SPELLS.length;
  },
  // three columns: helmets, shields, armour, then the quest items; weapons, rings, amulets;
  // scrolls and potions, then the reagents; a count (FF of a quest item: 1) and a name each,
  // an effect after it greyer
  drawInventory(g, W, H) {
    const s = Game.save, m = round(W / 20), fh = Math.trunc((H - 2 * m - 44) / 44), line = fh + 1;
    this.rows = 0; this.rects = [];
    this.font(g, fh);
    const tw = t => Gdi.width(g, t);
    const w999 = tw('999'), wSp = tw('   '), colW = Math.max(...LIST_ITEMS.map(tw)) + w999 + wSp;
    const y0 = Math.trunc((H - 44 * fh - 44) / 2);
    let x = Math.trunc((W - 3 * colW) / 2), y = y0, col1 = [0, 0], off = 0x21A;
    const text = (t, x, colour) => { g.fillStyle = colour; Gdi.text(g, t, x, y); };
    const count = (v, x, quest) => {
      const t = v === 0 ? '-' : quest && v === 255 ? '1' : String(v);
      text(t, x + w999 - tw(t), v ? '#CCCCCC' : '#444444');
    };
    [[0, 15], [16, 47], [96, 111]].forEach(([first, last], part) => {
      if (part === 0) col1[0] = x;
      else { if (part === 1) col1[1] = y; x += colW; }
      if (part === 2) off = 0x27A;
      y = y0;
      for (let k = first; k <= last; k++) {
        const head = LIST_HEADS.find(h => h[0] === k);
        if (head) {
          if (k > first) y += 2 * line;
          text(head[1], x, '#CCCCCC');
          y += 2 * line;
        }
        count(s[off], x);
        let name = LIST_ITEMS[k], note = '';
        const p = name.indexOf('(');
        if (p >= 0) { note = name.slice(p); name = name.slice(0, p); }
        text(name, x + w999 + wSp, '#888888');
        if (note) text('  ' + note, x + w999 + wSp + tw(name), '#555555');
        off++;
        y += line;
      }
    });
    y += 2 * line;
    text('REAGENTS', x, '#CCCCCC');
    y += 2 * line;
    LIST_REAGENTS.forEach((name, r) => {
      count(s[0x2AA + r], x);
      text(name, x + w999 + wSp, '#888888');
      y += line;
    });
    [x, y] = col1;
    y += 2 * line;
    text('QUEST ITEMS', x, '#CCCCCC');
    y += 2 * line;
    for (const [o, name] of LIST_QUEST) {
      count(s[o], x, true);
      text(name, x + w999 + wSp, '#888888');
      y += line;
    }
  },
  // Enter or a click: the chosen spell mixed, as the original's 4698E8 does it
  mix() { if (this.mode === 0 && this.sel > 0 && this.sel <= this.rows) mixSpell(this.sel); },
};

// mixes one of the list's spell row (1 up) as the original: when the game is found, no hostile
// creature counted in the last combat look and the list can mix one, the spell's count + 1 and
// each needed reagent the party has - 1
async function mixSpell(row) {
  const s = Game.save;
  if (!s || !Game.active || Game.hostiles > 0 || !Lists.can[row]) return;
  const [o, mask] = LIST_SPELLS[row - 1];
  await Game.writeSave(0x24A + o, [s[0x24A + o] + 1 & 255]);
  for (let r = 0; r < 8; r++) if (mask >> r & 1 && s[0x2AA + r]) await Game.writeSave(0x2AA + r, [s[0x2AA + r] - 1]);
}

/* ----------------------------------------------------------- editor
 * The original's editor (Debug, Editor): its form with its controls at their places and by
 * their names (the test reads them so). Shown, it lists the 16 records' names, fills the
 * party's consumables, quest items, karma and item list from the last poll and picks the
 * first record; a click on a record fills that record's fields. - and + change the chosen
 * item's count in the list (0 to 99). Save changes writes, from the last poll with the
 * controls over it: the record, 202-219 (consumables, quest items), karma when it changed
 * and the counts the list has (21A-289, 2AA-2B1). A number that isn't one keeps the old
 * value; hit points, experience, food and gold become 30 then, like the original's. */

// the program's names for the equipment bytes 0-2F (its combo boxes have the same)

// Delphi's StrToIntDef: spaces before, a sign, decimal or $ / 0x hex digits; anything else, or
// a number out of the Integer range, gives the default
function strToIntDef(s, def) {
  const m = /^ *([+-]?)(?:(?:\$|0x|x)([0-9a-f]+)|(\d+))$/i.exec(s);
  if (!m) return def;
  const v = m[2] !== undefined ? parseInt(m[2], 16) : parseInt(m[3], 10), r = m[1] === '-' ? -v : v;
  return r < -2147483648 || r > 2147483647 ? def : r;
}

// like the original: level + 1, hit points and their maximum = level x 30,
// one of STR / DEX / INT + 1
// the original's: the first six records in the party with the experience for the next
// level (up to 8): level + 1, hit points and their maximum = level x 30, and one of
// STR / DEX / INT below 30 + 1, chosen at random
const AutoLevel = {
  check() {
    const s = Game.save;
    for (let i = 0; i < 16; i++) {
      const o = 2 + i * 32, level = s[o + 0x16];
      if (s[o + 0x1F] !== 0 || level >= 8) continue;
      if ((s[o + 0x14] | s[o + 0x15] << 8) < LEVEL_XP[level]) continue;
      const nl = level + 1, hp = nl * 30, name = Game.recordName(o, 10);
      Game.writeSave(o + 0x16, [nl]);
      Game.writeSave(o + 0x10, [hp & 255, hp >> 8, hp & 255, hp >> 8]);
      const cands = [0, 1, 2].filter(k => s[o + 0x0C + k] < 30);
      if (cands.length) {
        const k = cands[Math.floor(Math.random() * cands.length)];
        Game.writeSave(o + 0x0C + k, [s[o + 0x0C + k] + 1]);
        log(`${name} reached experience level ${nl}. Increased ${['STR', 'DEX', 'INT'][k]}.`);
      } else log(`${name} reached experience level ${nl}.`);
    }
  },
};

 * Keys go into the BIOS keyboard buffer through the memory API, so the game
 * window doesn't have to have the focus. */

const BIOS_HEAD = 0x41A, BIOS_TAIL = 0x41C;
async function pushKey(scan, ascii) {
  const b = await Api.read(BIOS_HEAD, 4);
  const head = b[0] | b[1] << 8, tail = b[2] | b[3] << 8;
  const next = tail + 2 >= 0x3E ? 0x1E : tail + 2;
  if (next === head) return false;
  await Api.write(0x400 + tail, Uint8Array.of(ascii, scan));
  await Api.write(BIOS_TAIL, Uint8Array.of(next & 255, next >> 8));
  return true;
}

    if (!this.on) return;
    this.on = false; $('#qf').classList.add('hidden');
    Render.draw();
  },
  // a weapon's range from DATA.OVL (1684 + item - 10), 0 for anything else
  range(item) { const ovl = Files.data['DATA.OVL']; return ovl && item >= 0x10 && item < 0x2A ? ovl[0x1674 + item] : 0; },
  itemName(i) { return i < 0x30 ? HUD_ITEMS[i] : '-'; },
  key(name) { return pushKey(...KEYS[name]); },
  tick() {
    if (!this.on || this.busy || Date.now() < this.next || Game.area() !== 'combat') return;
    this.next = Date.now() + Settings.v.qfInterval;
    const cb = Game.combat();
    let job;
    if (cb.hostiles === 0 && Game.save[0x2F2] === 0)
      job = this.reequipAll().then(() => { log(''); log('No hostile creatures found! Stopped quickfight.'); this.stop(true); });
    else {
      // whose turn it is (a friendly combatant): the original takes its place from the save's
      // unit table and its name from whoever stands there
      const unit = cb.units[cb.active], u = Game.unit(cb.active);
      if (!unit || !unit.friendly) return;
      const c = inMap(u.x, u.y) ? cb.cells[u.y * 11 + u.x] : null;
      job = this.act(cb, { ...unit, x: u.x, y: u.y, name: c ? c.name : '' });
    }
    this.busy = true;
    job.catch(e => console.warn('Quickfight:', e)).finally(() => { this.busy = false; });
  },
  async act(cb, me) {
    const b = await Api.read(BIOS_HEAD, 4);
    if ((b[0] | b[1] << 8) !== (b[2] | b[3] << 8)) return;   // the game hasn't taken the last key yet
    const s = Game.save, idx = me.i, rec = 2 + idx * 32, name = me.name;
    let noWeapon = true, ranged = false, range = 0;
    for (const off of [0x1B, 0x1C, 0x1D]) {
      const it = s[rec + off];
      if (it >= 0x10 && it < 0x2A) noWeapon = false;
      if (RANGED.has(it)) { ranged = true; range = Math.max(range, this.range(it)); }
      else if (REACH.has(it)) range = Math.max(range, this.range(it));
    }
    log(`${name}: At ${pad2(me.x)},${pad2(me.y)}, armed with ${this.armedWith(rec)}.`);
    const aiming = s[0x2F2] === 1;
    let aimRange = 0;
    if (aiming) {
      const w = s[0x2F7];
      if (w >= 0x10 && w < 0x2A) aimRange = range = this.range(w);
      else if (w === 3 || w === 6) aimRange = range = 1;
      if (w !== 0) log(`${name}: In aim-mode with weapon ${this.itemName(w)} (range ${aimRange}).`);
    }
    const adj = this.adjacent(cb, me);
    if (adj) {
      if (noWeapon || ranged) {
        log(`${name}: Needs to equip a melee weapon.`);
        if (await this.equip(idx, EQUIP_PREF)) return;
      }
      log(`${name}: Plans to attack ${adj.name} at ${pad2(adj.x)},${pad2(adj.y)}.`);
      if (!aiming) { log(`${name}: Sending keypress [A].`); await this.key('a'); }
      else await this.aim(name, adj, true);
      return;
    }
    const spiral = this.spiral(me.x, me.y, 11);
    this.distances(cb, me);
    if (range > 1) {
      const t = this.inRange(cb, spiral, me, range);
      if (t) {
        log(`${name}: Plans to shoot ${t.name} at ${pad2(t.x)},${pad2(t.y)}.`);
        if (!aiming) { log('Sending keypress [A].'); await this.key('a'); }
        else await this.aim(name, t, aimRange > 0);
        return;
      }
    }
    if (aiming) { log(`${name}: Crosshair active but can not find a target! Sending keypress [SPACE].`); await this.key('space'); return; }
    const walk = this.reachable(cb, spiral);
    if (walk) {
      const d = dirTo(me.x, me.y, walk.sx, walk.sy);
      log(`${name}: Plans to move towards ${walk.name} at ${pad2(walk.x)},${pad2(walk.y)}. Sending keypress [${DIR_NAME[d]}].`);
      await this.key(DIR_KEY[d]);
      return;
    }
    if (!ranged && await this.equip(idx, RANGED_PREF)) return;
    const far = this.inRange(cb, spiral, me, 20);
    if (far) {
      const d = this.stepDir(cb, me, far);
      if (d) {
        log(`${name}: All creatures are out of range. Moving towards ${far.name} at ${pad2(far.x)},${pad2(far.y)}. Sending keypress [${DIR_NAME[d]}].`);
        await this.key(DIR_KEY[d]);
        return;
      }
    }
    log(`${name}: Can not reach any opponent! Sending keypress [SPACE].`);
    await this.key('space');
  },
  // brings the crosshair (2F3/2F4) onto the target and fires: Enter when it is there,
  // a step with an arrow key, or straight there when insta-aiming is on and allowed
  async aim(name, t, instaOk) {
    const s = Game.save, cx = s[0x2F3], cy = s[0x2F4];
    if (cx === t.x && cy === t.y) {
      log(`${name}: Crosshair at target ${pad2(cx)},${pad2(cy)}. Sending keypress [ENTER].`);
      await this.key('enter'); return;
    }
    if (Settings.v.qfAim && instaOk) {
      log(`${name}: Insta-aiming crosshair to ${pad2(t.x)},${pad2(t.y)} and sending keypress [ENTER].`);
      await Game.writeSave(0x2F3, [t.x, t.y]);
      await this.key('enter'); return;
    }
    const d = dirTo(cx, cy, t.x, t.y), nx = cx + DIR[d][0], ny = cy + DIR[d][1];
    log(`${name}: Moving crosshair from ${pad2(cx)},${pad2(cy)} to ${pad2(nx)},${pad2(ny)}. Sending keypress [${DIR_NAME[d]}].`);
    await this.key(DIR_KEY[d]);
  },
  // the neighbour (eight directions) with the fewest hit points that isn't friendly
  adjacent(cb, me) {
    let best = null;
    for (const [dx, dy] of NEAR8) {
      const x = me.x + dx, y = me.y + dy;
      if (!inMap(x, y)) continue;
      const c = cb.cells[y * 11 + x];
      if (c.friendly || c.hp <= 0) continue;
      if (!best || c.hp < best.hp) best = { x, y, hp: c.hp, name: c.name };
    }
    return best;
  },
  // the cells around (cx, cy) ring by ring, each ring clockwise from its top left corner
  spiral(cx, cy, n) {
    const out = [], add = (x, y) => { if (inMap(x, y) && out.length < 122) out.push([x, y]); };
    for (let r = 1; r <= n; r++) {
      let x = cx - r, y = cy - r;
      for (let k = -r; k <= r; k++) { add(x, y); if (k < r) x++; else y++; }
      for (let k = 1 - r; k <= r; k++) { add(x, y); if (k < r) y++; else x--; }
      for (let k = 1 - r; k <= r; k++) { add(x, y); if (k < r) x--; else y--; }
      for (let k = 1 - r; k <= r - 1; k++) { add(x, y); if (k < r) y--; }
    }
    return out;
  },
  // every walkable cell's ring distance from the unit (0 where nobody can walk)
  distances(cb, me) {
    for (const c of cb.cells) c.dist = 0;
    const set = (x, y, r) => { if (inMap(x, y) && cb.cells[y * 11 + x].walk) cb.cells[y * 11 + x].dist = r; };
    for (let r = 0; r < 12; r++) {
      for (let x = me.x - r; x <= me.x + r; x++) { set(x, me.y - r, r); set(x, me.y + r, r); }
      for (let y = me.y - r; y <= me.y + r; y++) { set(me.x - r, y, r); set(me.x + r, y, r); }
    }
  },
  // the first unit along the spiral that isn't friendly and lies within the range
  inRange(cb, spiral, me, range) {
    for (const [x, y] of spiral) {
      const c = cb.cells[y * 11 + x];
      if (c.hp > 0 && !c.friendly && round(Math.hypot(x - me.x, y - me.y)) <= range) return { x, y, name: c.name };
    }
    return null;
  },
  // the first unit along the spiral a path leads to: it walks from the unit towards us
  // over walkable cells by falling ring distance, and the cell next to us it ends on
  // is where we step to
  reachable(cb, spiral) {
    const me = cb.units[cb.active];
    for (const [x, y] of spiral) {
      const c = cb.cells[y * 11 + x];
      if (c.hp <= 0 || c.friendly) continue;
      const step = this.walk(cb, x, y, me.x, me.y);
      if (step) return { x, y, name: c.name, sx: step[0], sy: step[1] };
    }
    return null;
  },
  walk(cb, fx, fy, tx, ty) {
    if (!inMap(fx, fy) || !inMap(tx, ty)) return null;
    const seen = new Uint8Array(121);
    let x = fx, y = fy;
    while (!this.nextTo(x, y, tx, ty)) {
      let best = 0, bestDist = 0;
      for (let d = 1; d <= 4; d++) {
        const nx = x + DIR[d][0], ny = y + DIR[d][1];
        if (!inMap(nx, ny) || seen[ny * 11 + nx]) continue;
        const dist = cb.cells[ny * 11 + nx].dist;
        if (dist > 0 && (dist < bestDist || best === 0)) { bestDist = dist; best = d; }
      }
      if (!best) return null;
      x += DIR[best][0]; y += DIR[best][1];
      seen[y * 11 + x] = 1;
    }
    return [x, y];
  },
  nextTo(x, y, tx, ty) {
    for (let d = 1; d <= 4; d++) if (x + DIR[d][0] === tx && y + DIR[d][1] === ty && inMap(tx, ty)) return d;
    return 0;
  },
  // a step towards the target along the longer axis first, onto a walkable cell
  stepDir(cb, me, t) {
    const walk = (x, y) => inMap(x, y) && cb.cells[y * 11 + x].walk;
    const vert = [[me.y < t.y, me.x, me.y + 1, 3], [me.y > t.y, me.x, me.y - 1, 1]];
    const horz = [[me.x < t.x, me.x + 1, me.y, 2], [me.x > t.x, me.x - 1, me.y, 4]];
    for (const [ok, x, y, d] of Math.abs(me.x - t.x) < Math.abs(me.y - t.y) ? [...vert, ...horz] : [...horz, ...vert])
      if (ok && walk(x, y)) return d;
    return 0;
  },
  // puts the first pair (weapon, off-hand) of the list into the character's hands that
  // the party owns (bows want arrows, crossbows quarrels), moving the items between the
  // hands and the inventory; true when it did, or when the hands already hold that pair
  async equip(idx, list) {
    const s = Game.save, rec = 2 + idx * 32, have = [s[rec + 0x1B], s[rec + 0x1C]], name = Game.recordName(rec);
    const inv = it => s[0x21A + it];
    for (const want of list) {
      if (want[0] === have[0] && want[1] === have[1]) return true;
      const ok = want.every((w, k) => w === have[k] || w === 0xFF
        || (inv(w) > 0 && !((w === 0x1A || w === 0x24) && !inv(0x1B)) && !(w === 0x1C && !inv(0x1D))));
      if (!ok) continue;
      for (let k = 0; k < 2; k++) {
        if (want[k] === have[k]) continue;
        if (have[k] !== 0xFF) await Game.writeSave(0x21A + have[k], [inv(have[k]) + 1]);
        if (want[k] !== 0xFF) await Game.writeSave(0x21A + want[k], [inv(want[k]) - 1]);
        await Game.writeSave(rec + 0x1B + k, [want[k]]);
      }
      const n = want.map(w => this.itemName(w));
      if (want[0] === 0xFF) { if (want[1] !== 0xFF) log(`${name}: Equips ${n[1]}.`); }
      else log(want[1] === 0xFF ? `${name}: Equips ${n[0]}.` : `${name}: Equips ${n[0]} / ${n[1]}.`);
      return true;
    }
    return false;
  },
  // when the fight is over: everyone back to their best melee gear
  async reequipAll() { for (let i = 0; i < Math.min(6, Game.partySize); i++) await this.equip(i, EQUIP_PREF); },
  // "armed with ..." as the original puts it: the hands, and a spiked helm counts
  armedWith(rec) {
    const s = Game.save, parts = [];
    if (s[rec + 0x19] === 0xFF && s[rec + 0x1B] === 0xFF && s[rec + 0x1C] === 0xFF) return 'bare hands';
    if (s[rec + 0x19] === 3) parts.push(HUD_ITEMS[3]);
    for (const off of [0x1B, 0x1C]) {
      const it = s[rec + off];
      if (it >= 0x10 && it < 0x2A) { const r = this.range(it); parts.push(HUD_ITEMS[it] + (r > 0 ? ` (range ${r})` : '')); }
      else if (it < 0x30) parts.push(HUD_ITEMS[it]);
    }
    return parts.join(' / ');
  },
};

/* --------------------------------------------------- debug actions */

// the original's teleport (debug mode, Ctrl + click): the position, and on the large maps
// the 2x2 chunks around it as the game keeps them in memory (DS:6618, chunk by chunk,
// their origin at 2F5/2F6); in a small map not onto a unit's cell; in combat it moves
// the party member whose turn it is onto a free cell
async function teleport(c) {
  if (!Settings.v.debug || !Game.save) return;
  const s = Game.save, area = Game.area(), x = c.x, y = c.y;
  if (x < 0 || y < 0) return;   // the original compares unsigned: -1 is out of every range
  if (area === 'world' || area === 'under') {
    if (x > 255 || y > 255) return;
    await Game.writeSave(0x2F0, [x, y]);
    const ox = chunkOrigin(x), oy = chunkOrigin(y), m = U5.large(area === 'under'), buf = new Uint8Array(1024);
    await Game.writeSave(0x2F5, [ox, oy]);
    let k = 0;
    for (const [bx, by] of [[ox, oy], [ox + 16, oy], [ox, oy + 16], [ox + 16, oy + 16]])
      for (let yy = by; yy < by + 16; yy++) for (let xx = bx; xx < bx + 16; xx++) buf[k++] = xx < 256 && yy < 256 ? m[yy * 256 + xx] : 0;
    await Api.write(Game.base + MAPBUF, buf);
    Render.lens = false;
  } else if (area === 'small') {
    if (x > 31 || y > 31) return;
    for (let i = 0; i < 32; i++) { const u = Game.unit(i); if (u.x === x && u.y === y) return; }
    await Game.writeSave(0x2F0, [x, y]);
  } else if (area === 'dungeon') {
    if (x > 7 || y > 7) return;
    await Game.writeSave(0x2F0, [x, y]);
  } else {
    const cb = Game.combat(), idx = cb.active;
    if (x > 10 || y > 10 || idx > Game.partySize - 1 || !cb.cells[y * 11 + x].walk) return;
    await Game.writeSave(0x6B4 + idx * 8 + 2, [x, y]);
    await Api.write(Game.base + COMBAT_UNITS + idx * 8 + 6, Uint8Array.of(x, y));
  }
}

// the original's: the hour (2D9 and its copy at 2DA) one on, round the clock
async function forwardTime() {
  if (!Game.save) return;
  let h = Game.save[0x2D9] + 1;
  if (h > 23) h = 0;
  await Game.writeSave(0x2D9, [h, h]);
}

// what the original does: 1 at 2FD, which lets Esc at the combat prompt escape (dungeon
// rooms excepted), then half a second later Esc
async function exitCombat() {
  if (!Game.save) return;
  await Game.writeSave(0x2FD, [1]);
  await sleep(500);
  await pushKey(...KEYS.esc);
}
// the original's Dump TLK during talk: the log shown; the game's talk buffer (1000 bytes at
// DS:B22E) up to its first C0 made a TLK file of one entry, its listing without the first two
// and the last four lines the log's text (none: two lines logged)
const TALK_BUFFER = 0xB22E;
async function dumpTlk() {
  if (!Game.base) return;
  LogWin.open();
  let mem;
  try { mem = await Api.read(Game.base + TALK_BUFFER, 1000); } catch { return; }
  const end = mem.indexOf(0xC0);
  if (end < 0) { log(''); log('Could not find a proper TLK-entry!'); return; }
  const file = new Uint8Array(end + 7);
  file.set([1, 0, 1, 0, 6, 0]);
  file.set(mem.subarray(0, end + 1), 6);
  const lines = tlkListing(file).slice(2);
  LogWin.set(lines.slice(0, Math.max(0, lines.length - 4)));
}

// the original's: the 64 KB of the game's data segment as Memory_Dump.UM5 (it writes the file
// into its folder and opens that)
async function dumpMemory() {
  if (!Game.base) return;
  download(new Blob([await Api.read(Game.base, 0x10000)]), 'Memory_Dump.UM5');
}

function download(blob, name) {
  const a = el('a', { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

// the original's Save map as bitmap: the map as shown, a bitmap named (its save dialog's
// suggestion) World.bmp, Underworld.bmp, <location>_z<level>.bmp (a basement -1),
// Combat.bmp, else Map.bmp
function saveMapImage() {
  if (!Game.save) return;
  const loc = Game.loc, z = Game.save[0x2EF];
  const name = loc === 0 && z === 0 ? 'World.bmp' : loc === 0 && z === 0xFF ? 'Underworld.bmp'
    : loc >= 1 && loc <= 40 ? `${LOC_NAMES[loc]}_z${z > 127 ? z - 256 : z}.bmp` : loc === 0xFF ? 'Combat.bmp' : 'Map.bmp';
  download(new Blob([bmpOf(Render.canvas)]), name);
}
// a canvas as a 24-bit Windows bitmap (rows bottom up, 4-byte aligned)
function bmpOf(c) {
  const w = c.width, h = c.height, d = c.getContext('2d').getImageData(0, 0, w, h).data;
  const row = (w * 3 + 3) & ~3, b = new Uint8Array(54 + row * h), v = new DataView(b.buffer);
  v.setUint16(0, 0x4D42, true); v.setUint32(2, b.length, true); v.setUint32(10, 54, true);
  v.setUint32(14, 40, true); v.setInt32(18, w, true); v.setInt32(22, h, true); v.setUint16(26, 1, true);
  v.setUint16(28, 24, true); v.setUint32(34, row * h, true);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const s = ((h - 1 - y) * w + x) * 4, o = 54 + y * row + x * 3;
    b[o] = d[s + 2]; b[o + 1] = d[s + 1]; b[o + 2] = d[s];
  }
  return b;
}

// the original's Backup saved game: when the game folder has SAVED.GAM, a description asked
// for; BRIT.OOL, SAVED.GAM, SAVED.OOL and UNDER.OOL (those there) and Explored.UM5 (the
// page's explored maps, in its format) as a zip download (the original copies them into a
// folder of Save backups\). A folder chosen in the browser (no webserver's) is chosen again.
async function backupSaves() {
  if (!Files.base && !Files.saveSnapshot) {
    alert('Choose the game folder again: the backup takes the saved game from there.');
    const inp = $('#folderInput');
    inp.value = '';
    inp.onchange = () => {
      Files.saveSnapshot = {};
      for (const f of inp.files) if (SAVE_FILES.includes(f.name.toUpperCase()) && f.webkitRelativePath.split('/').length <= 2)
        Files.saveSnapshot[f.name.toUpperCase()] = f;
      backupSaves();
    };
    inp.click();
    return;
  }
  if (!(await Files.readNow('SAVED.GAM'))) return;
  const desc = prompt('Backup save game\nEnter a description for the save game', '');
  if (desc === null) return;
  const entries = [];
  for (const n of SAVE_FILES) { const b = await Files.readNow(n); if (b) entries.push([n, b]); }
  entries.push(['Explored.UM5', await Explored.file()]);   // the explored maps in the original's format
  // named as the original's folder under Save backups\: "yyyy-mm-dd - hh.nn - " and the
  // description without <>:"/\|?*{}%=' and double spaces, trimmed
  const t = new Date(), clean = desc.replace(/[<>:"/\\|?*{}%=']/g, '').replace(/ {2,}/g, ' ').trim();
  download(zipStore(entries), `${t.getFullYear()}-${pad2(t.getMonth() + 1)}-${pad2(t.getDate())} - ${pad2(t.getHours())}.${pad2(t.getMinutes())} - ${clean}.zip`);
  Files.saveSnapshot = null;
}

// a minimal "stored" (uncompressed) zip writer
function zipStore(entries) {
  const crcTable = Array.from({ length: 256 }, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
  const crc = d => { let c = 0xFFFFFFFF; for (const b of d) c = crcTable[(c ^ b) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const parts = [], central = [];
  let off = 0;
  for (const [name, data] of entries) {
    const nm = new TextEncoder().encode(name), c = crc(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint32(14, c, true);
    h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nm.length, true);
    parts.push(new Uint8Array(h.buffer), nm, data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint32(16, c, true);
    cd.setUint32(20, data.length, true); cd.setUint32(24, data.length, true); cd.setUint16(28, nm.length, true);
    cd.setUint32(42, off, true);
    central.push(new Uint8Array(cd.buffer), nm);
    off += 30 + nm.length + data.length;
  }
  const size = central.reduce((a, p) => a + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, size, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}

/* -------------------------------------------------------- log, help */

/* The original's log (its Log_Form, Debug log): written only with its debug_log setting on
 * (Data\Settings.txt; here the window's checkbox), a line "hh:nn:ss:  text" put first (an
 * empty one for none), 51 lines at most. */
let logLines = [];
function log(text) {
  if (!Settings.v.debugLog) return;
  while (logLines.length > 50) logLines.pop();
  logLines.unshift(text ? `${new Date().toTimeString().slice(0, 8)}:  ${text}` : '');
  LogWin.show();
}
const LogWin = {
  open() {
    const d = Dlg.make('logwin', 'Log', 752);
    const body = d.querySelector('.body');
    if (!body.querySelector('#log')) {
      Object.assign(body.style, { padding: '0', height: '312px', background: '#000' });
      const cb = el('input', { type: 'checkbox', checked: !!Settings.v.debugLog,
        onchange: () => { Settings.v.debugLog = cb.checked; Settings.save(); } });
      d.querySelector('header .t').after(el('label', { className: 'muted', title: "The original's debug_log setting" }, cb, ' log'));
      body.append(el('div', { id: 'log' }));
    }
    this.show();
  },
  show() { const l = document.querySelector('#log'); if (l) l.textContent = logLines.join('\n'); },
  // the TLK dump: the log's text replaced
  set(lines) { logLines = lines.slice(); this.show(); },
};
const Help = {
  open() {
    const d = Dlg.make('help', 'Ultimapper 5', 560);
    d.querySelector('.body').innerHTML = `
      <p>A web version of Joonas Hirvonen's Ultimapper 5 for DOSBox Staging. It reads Ultima V's memory through
      DOSBox Staging's HTTP API.</p>
      <p><b>Map:</b> left click on the world map toggles the zoom view; right click opens the menu.
      PgUp / PgDn change the size. In debug mode (Ctrl+D), Ctrl+click teleports. A click while quickfight runs
      stops it.</p>
      <p><b>HUD:</b> click the clock area for the spell list, right-click it for the inventory. In the spell list,
      Tab or right-click switches lists and a click or Enter mixes one spell. The editor is in the Debug menu.</p>
      <p><b>Keys:</b> S spells, I inventory, Q quickfight, Ctrl+E editor, Ctrl+T forward time, Ctrl+L log,
      Ctrl+S backup, Esc closes a window.</p>`;
  },
};

loop();
</script>
