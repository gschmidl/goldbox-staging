<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultimapper 5</title>
<style>
:root {
  --bg: #000; --panel: #101010; --line: #2c2c2c; --text: #dcdcdc; --dim: #5c5c5c;
  --green: #0a6a0a; --red: #7c0606; --xp: #b5700f; --hl: #f2e05a; --menu: #1c1c1c; --sel: #2c4a78;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 13px/1.35 Tahoma, Verdana, "Segoe UI", system-ui, sans-serif; }
#app { display: flex; flex-direction: column; height: 100vh; }
#bar { display: flex; align-items: center; gap: 8px; padding: 3px 8px; background: #161616;
  border-bottom: 1px solid var(--line); white-space: nowrap; min-height: 28px; }
#title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.chip { padding: 0 8px; border-radius: 9px; background: #333; font-size: 12px; }
.chip.ok { background: #0b4d0b; } .chip.bad { background: #6a1010; } .chip.warn { background: #6a5410; }
button, select, input { background: #222; color: var(--text); border: 1px solid #484848; border-radius: 3px;
  padding: 2px 8px; font: inherit; }
button { cursor: pointer; } button:hover { background: #333; }
input[type=number] { width: 70px; }
#hud { display: block; width: 100%; background: #000; border-bottom: 2px solid #333; }
#hud.hidden { display: none; }
#mapwrap { position: relative; flex: 1; overflow: auto; background: #000; }
#map { display: block; margin: 0 auto; }
#tip { position: fixed; pointer-events: none; background: #222e; border: 1px solid #555; padding: 2px 6px;
  font-size: 12px; display: none; z-index: 30; white-space: pre; }
#msg { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); max-width: 560px;
  text-align: center; color: #bbb; }
#msg h2 { font-weight: normal; color: #eee; }
.menu { position: fixed; background: var(--menu); border: 1px solid #555; min-width: 230px; padding: 3px 0;
  z-index: 50; box-shadow: 3px 3px 10px #000c; user-select: none; }
.menu .mi { padding: 3px 22px 3px 24px; position: relative; display: flex; justify-content: space-between;
  gap: 24px; cursor: default; white-space: nowrap; }
.menu .mi:hover, .menu .mi.open { background: var(--sel); }
.menu .mi.dis { color: var(--dim); }
.menu .mi.chk::before { content: "\2713"; position: absolute; left: 7px; }
.menu .mi.sub::after { content: "\25B8"; position: absolute; right: 8px; }
.menu .mi .k { color: #999; }
.menu .sep { height: 1px; background: #444; margin: 3px 0; }
.dlg { position: fixed; z-index: 40; background: #121212; border: 1px solid #555; box-shadow: 4px 4px 14px #000c;
  display: flex; flex-direction: column; max-height: 92vh; }
.dlg header { display: flex; align-items: center; gap: 8px; padding: 4px 8px; background: #1f1f1f; cursor: move;
  user-select: none; border-bottom: 1px solid #333; }
.dlg header .t { flex: 1; }
.dlg .body { padding: 8px 10px; overflow: auto; }
.list { border-collapse: collapse; width: 100%; font-size: 12px; }
.list td, .list th { padding: 1px 6px; text-align: left; white-space: nowrap; }
.list th { color: #aaa; font-weight: normal; border-bottom: 1px solid #333; position: sticky; top: 0; background: #121212; }
.list tr.sel td { background: var(--sel); }
.list tr.na td { color: var(--dim); }
.list tr:hover td { background: #1d2a3d; }
.n { text-align: right !important; }
#log { font: 13px Consolas, monospace; white-space: pre-wrap; color: #aaaaaa; background: #000; min-height: 100%; }
.grid2 { display: grid; grid-template-columns: auto auto; gap: 4px 10px; align-items: center; }
/* the editor: the original's form (817 x 544, its colours and fonts) */
.edf { position: relative; width: 817px; height: 544px; background: #aaa; color: #000; font: 13px Tahoma, Verdana, sans-serif; user-select: none; }
.edf > *, .edf .eg > * { position: absolute; box-sizing: border-box; margin: 0; }
.edf .el { white-space: nowrap; line-height: 16px; text-align: right; }
.edf input[type=text], .edf select { font: 13px Tahoma, Verdana, sans-serif; background: #ccc; color: #000; border: 1px solid #666; border-radius: 0; padding: 0 2px; }
.edf button { font: 13px Tahoma, Verdana, sans-serif; background: #d4d0c8; color: #000; border: 1px solid #555; padding: 0; }
.edf button:disabled { color: #888; }
.edf .eg { border: 1px solid #777; box-shadow: 1px 1px #eee, inset 1px 1px #eee; }
.edf .eg .egt { left: 8px; top: -9px; padding: 0 1px; background: #aaa; white-space: pre; }
.edf .ec { display: flex; align-items: center; gap: 3px; white-space: nowrap; }
.edf .ec input { margin: 0; }
.edf .elb { background: #ccc; border: 1px solid #666; overflow-y: auto; overflow-x: hidden; }
.edf .elb > div { height: 16px; line-height: 16px; padding: 0 2px; white-space: pre; cursor: default; }
.edf .elb > div.sel { background: #0a246a; color: #fff; }
.edf .elb.mono > div { font: 15px Consolas, monospace; height: 18px; line-height: 18px; }
.muted { color: #888; }
.hidden { display: none !important; }
a { color: #8ab4f8; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span id="title">Ultimapper 5</span>
    <span id="qf" class="chip hidden">Quickfight</span>
    <span id="dbg" class="chip warn hidden">Debug</span>
    <span id="conn" class="chip">connecting</span>
    <button id="menuBtn" title="Menu (or right-click the map)">&#9776;</button>
  </div>
  <canvas id="hud" width="640" height="0"></canvas>
  <div id="mapwrap">
    <canvas id="map" width="512" height="512"></canvas>
    <div id="msg"></div>
  </div>
</div>
<div id="tip"></div>
<input id="folderInput" type="file" webkitdirectory multiple class="hidden">

  height(g) { const [a, d] = this.metrics(g); return a + d; },

  width(g, s) { let w = 0; for (const ch of s) w += this.charWidth(g, ch); return w; },

  },
  // the original's centred text (its 455E50): (w - width) div 2 and (h - height) div 2 in
  centred(g, s, l, t, w, h) { this.text(g, s, l + Math.trunc((w - this.width(g, s)) / 2), t + Math.trunc((h - this.height(g)) / 2)); },
};

/* ---------------------------------------------------------------- API */

const Api = {
  async read(addr, len) {
    const r = await fetch(`/api/v1/memory/${addr}/${len}`,
      { headers: { Accept: 'application/octet-stream' }, cache: 'no-store' });
    if (!r.ok) throw new Error(`read ${hex(addr, 6)}: HTTP ${r.status}`);
    return new Uint8Array(await r.arrayBuffer());
  },
  async write(addr, bytes) {
    const r = await fetch(`/api/v1/memory/${addr}`, { method: 'PUT',
      headers: { 'Content-Type': 'application/octet-stream' }, body: bytes });
    if (!r.ok) throw new Error(`write ${hex(addr, 6)}: HTTP ${r.status}`);
  },
  async info() {
    const r = await fetch('/api/v1/dosbox/info', { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  },
  async memSize() {
    let lo = 1 << 20, hi = 2 ** 32;
    while (hi - lo > 4096) {
      const mid = Math.floor((lo + hi) / 2);
      try { await this.read(mid - 1, 1); lo = mid; } catch { hi = mid; }
    }
    return lo;
  },
};

const DB = {
  db: null,
  open() {
    return this.db ??= new Promise((res, rej) => {
      const q = indexedDB.open('ultimapper5', 1);
      q.onupgradeneeded = () => { q.result.createObjectStore('files'); q.result.createObjectStore('kv'); };
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  },
  async op(store, mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const q = fn(db.transaction(store, mode).objectStore(store));
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  },
  get: (s, k) => DB.op(s, 'readonly', o => o.get(k)),
  put: (s, k, v) => DB.op(s, 'readwrite', o => o.put(v, k)),
  del: (s, k) => DB.op(s, 'readwrite', o => o.delete(k)),
  keys: s => DB.op(s, 'readonly', o => o.getAllKeys()),
};

const Files = {
  data: {},          // name (upper case) -> Uint8Array
  pdfs: new Set(),   // the manuals that were in the game folder
  pdfUrls: {},       // ... and where the webserver has them (?data=)
  async loadCached() {
    for (const n of DATA_FILES) {
      const b = await DB.get('files', n);
      if (b) this.data[n] = new Uint8Array(b);
    }
    for (const k of Object.keys(MANUALS)) if (await DB.get('files', 'PDF:' + k)) this.pdfs.add(k);
    return this.ok();
  },
  ok() { return ['TILES.16', 'BRIT.DAT', 'UNDER.DAT', 'TOWNE.DAT', 'DATA.OVL'].every(n => this.data[n]); },
  /* The character's name in the game folder's SAVED.GAM (10 characters from offset 2), which
   * the original reads when it finds the game and after a character was created: while
   * the game in memory has another name, it shows its "does not match" message.  null when
   * the file can't be read. */
  saveName: null, base: null,
  // a file of the game folder as it is now: from the webserver (?data=), or the folder
  // chosen in the browser (a snapshot: null once the file changed)
  async readNow(name) {
    try {
      if (this.base) {
        for (const n of [name, name.toLowerCase(), name[0] + name.slice(1).toLowerCase()]) {
          const r = await fetch(this.base + encodeURIComponent(n), { cache: 'no-store' });
          if (r.ok) return new Uint8Array(await r.arrayBuffer());
        }
      } else if (this.saveSnapshot && this.saveSnapshot[name]) {
        return new Uint8Array(await this.saveSnapshot[name].arrayBuffer());
      }
    } catch { }
    return null;
  },
  async readSave() { const b = await this.readNow('SAVED.GAM'); return b && b.length >= 12 ? b : null; },
  async readSaveName() {
    const b = await this.readSave();
    if (!b) { this.saveName = null; return null; }
    let s = '';
    for (let k = 2; k < 12 && b[k]; k++) s += String.fromCharCode(b[k]);
    this.saveName = s;
    return b;
  },
  // the original's Explored.UM5, taken over once per version (its size and contents)
  async importExplored() {
    const f = await this.readNow('EXPLORED.UM5');
    if (!f || f.length < 0x49000) return;
    let h = 0;
    for (let i = 0; i < f.length; i++) h = (h * 31 + f[i]) | 0;
    const sig = `${f.length}:${h}`;
    if ((await DB.get('kv', 'imported:explored.um5')) === sig) return;
    await Explored.store(f);
    await DB.put('kv', 'imported:explored.um5', sig);
  },
  // ?data=<folder>: the game files from a folder the webserver serves (relative to this page)
  async importUrl(base) {
    if (!base.endsWith('/')) base += '/';
    this.base = base;
    const got = async name => {
      for (const n of [name, name.toLowerCase(), name[0] + name.slice(1).toLowerCase()]) {
        const r = await fetch(base + encodeURIComponent(n), { cache: 'no-store' });
        if (r.ok) return r.arrayBuffer();
      }
      return null;
    };
    for (const n of DATA_FILES) {
      const b = await got(n);
      if (!b) continue;
      this.data[n] = new Uint8Array(b);
      await DB.put('files', n, b);
    }
    if (!this.data['TILES.16']) throw new Error(`No Ultima V files at ${base}`);
    // the manuals the original's menu offers when they are in the game folder
    this.pdfs.clear(); this.pdfUrls = {};
    for (const [key, name] of Object.entries(MANUALS)) {
      const url = base + encodeURIComponent(name);
      if ((await fetch(url, { method: 'HEAD', cache: 'no-store' }).catch(() => null))?.ok) { this.pdfs.add(key); this.pdfUrls[key] = url; }
    }
    U5.reset();
  },
  async importList(fileList) {
    const top = new Map();
    for (const f of fileList) {
      const parts = (f.webkitRelativePath || f.name).split('/');
      if (parts.length <= 2) top.set(f.name.toUpperCase(), f);
    }
    if (!top.has('TILES.16') || !top.has('DATA.OVL'))
      throw new Error('That folder has no TILES.16 / DATA.OVL. Choose the Ultima V game folder.');
    for (const n of DATA_FILES) {
      const f = top.get(n);
      if (!f) continue;
      const b = await f.arrayBuffer();
      this.data[n] = new Uint8Array(b);
      await DB.put('files', n, b);
    }
    for (const [key, name] of Object.entries(MANUALS)) {
      const f = top.get(name.toUpperCase());
      if (f) { await DB.put('files', 'PDF:' + key, f); this.pdfs.add(key); }
    }
    this.saveSnapshot = {};
    for (const n of SAVE_FILES) { const f = top.get(n); if (f) this.saveSnapshot[n] = f; }
    if (top.get('EXPLORED.UM5')) this.saveSnapshot['EXPLORED.UM5'] = top.get('EXPLORED.UM5');
    this.base = null;
    U5.reset();
  },
};

// Ultima V's LZW (*.16 files): 4-byte length, then 9..12-bit codes, 0x100 = reset, 0x101 = end
function lzw(src) {
  const size = src[0] | src[1] << 8 | src[2] << 16 | src[3] << 24;
  const out = new Uint8Array(size);
  let o = 0, bit = 32, width = 9, next = 0x102, prev = null;
  const dict = [], nbits = src.length * 8;
  const code = () => {
    if (bit + width > nbits) return -1;
    let v = 0;
    for (let i = 0; i < width; i++, bit++) v |= ((src[bit >> 3] >> (bit & 7)) & 1) << i;
    return v;
  };
  while (o < size) {
    const c = code();
    if (c < 0 || c === 0x101) break;
    if (c === 0x100) { width = 9; next = 0x102; dict.length = 0; prev = null; continue; }
    let s;
    if (c < 0x100) s = [c];
    else if (dict[c]) s = dict[c];
    else if (c === next && prev) s = prev.concat(prev[0]);
    else throw new Error('bad LZW code ' + c);
    for (const b of s) out[o++] = b;
    if (prev && next < 4096) {
      dict[next++] = prev.concat(s[0]);
      if (next >= (1 << width) && width < 12) width++;
    }
    prev = s;
  }
  return out;
}

const U5 = {
  atlas: null, atlasT: null, worldMap: null, underMap: null, smallMaps: {}, names: null, monsters: null,
  reset() { this.atlas = this.atlasT = this.worldMap = this.underMap = this.names = this.monsters = null; this.smallMaps = {}; },
  tiles() {
    if (this.atlas || !Files.data['TILES.16']) return this.atlas;
    const raw = lzw(Files.data['TILES.16']);
    const c = document.createElement('canvas');
    c.width = 32 * 16; c.height = 16 * 16;
    const g = c.getContext('2d'), img = g.createImageData(c.width, c.height);
    const pal = EGA.map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
    for (let t = 0; t < 512; t++) {
      const tx = (t % 32) * 16, ty = (t >> 5) * 16;
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
        const b = raw[t * 128 + y * 8 + (x >> 1)], ci = x & 1 ? b & 15 : b >> 4;
        const p = ((ty + y) * c.width + tx + x) * 4;
        [img.data[p], img.data[p + 1], img.data[p + 2]] = pal[ci];
        img.data[p + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    return this.atlas = c;
  },
  // the tiles with black transparent, for what the original draws with its transparent flag
  tilesT() {
    if (this.atlasT || !this.tiles()) return this.atlasT;
    const c = document.createElement('canvas');
    c.width = 512; c.height = 256;
    const g = c.getContext('2d');
    g.drawImage(this.atlas, 0, 0);
    const img = g.getImageData(0, 0, 512, 256), d = img.data;
    for (let p = 0; p < d.length; p += 4) if (!(d[p] | d[p + 1] | d[p + 2])) d[p + 3] = 0;
    g.putImageData(img, 0, 0);
    return this.atlasT = c;
  },
  // the 48 monster names in DATA.OVL (from 32B, one after the other), made singular
  // and lower-cased after the first letter of each word, as the original lists them
  monsterName(tile) {
    if (!this.monsters) {
      const ovl = Files.data['DATA.OVL'], list = [];
      let p = 0x32B;
      for (let i = 0; ovl && i < 48; i++) {
        let n = '';
        for (let k = 0; k < 20 && ovl[p + k]; k++) n += String.fromCharCode(ovl[p + k]);
        n = [...n].map((ch, k) => k === 0 || n[k - 1] === ' ' ? ch : ch.toLowerCase()).join('');
        list.push(n === 'Headlesses' ? 'Headless' : n.endsWith('s') ? n.slice(0, -1) : n);
        while (ovl[p]) p++;
        p++;
      }
      this.monsters = list;
    }
    return this.monsters[tile] || '';
  },
  large(under) {
    const key = under ? 'underMap' : 'worldMap';
    if (this[key]) return this[key];
    const src = Files.data[under ? 'UNDER.DAT' : 'BRIT.DAT'], ovl = Files.data['DATA.OVL'];
    if (!src || !ovl) return null;
    const m = new Uint8Array(65536);
    let serial = 0;
    for (let ch = 0; ch < 256; ch++) {
      const water = !under && ovl[0x3886 + ch] === 0xFF;
      const cx = (ch & 15) * 16, cy = (ch >> 4) * 16;
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++)
        m[(cy + y) * 256 + cx + x] = water ? 1 : src[serial++];
    }
    return this[key] = m;
  },
  small(loc, z) {
    const s = SMALL[loc];
    if (!s) return null;
    const idx = s.first + (z - s.low), key = s.file + ':' + idx;
    if (this.smallMaps[key]) return this.smallMaps[key];
    const f = Files.data[s.file];
    if (!f || idx < s.first || idx >= s.first + s.floors) return null;
    return this.smallMaps[key] = f.slice(idx * 1024, idx * 1024 + 1024);
  },
  dungeon(loc, z) {
    const f = Files.data['DUNGEON.DAT'];
    if (!f || loc < 33 || loc > 40) return null;
    const o = ((loc - 33) * 8 + (z & 7)) * 64;
    return f.slice(o, o + 64);
  },
  locXY(loc) {
    const ovl = Files.data['DATA.OVL'];
    return ovl ? [ovl[0x1E9A + loc - 1], ovl[0x1EC2 + loc - 1]] : null;
  },
  // the name of the NPC with dialogue number n at a small-map location (merchants
  // have 81-88 instead of a script), from the *.NPC and *.TLK files
  npcName(loc, n) {
    if (!this.names) this.names = buildNpcNames();
    return n >= 0x81 && n <= 0x88 ? MERCHANTS[n - 0x81] : this.names[loc]?.[n] || '';
  },
};

// merchants have these dialog numbers (81-88) instead of a script
const MERCHANTS = ['Weapon dealer', 'Barkeeper', 'Horse seller', 'Ship seller', 'Magic seller', 'Guildmaster', 'Healer',
  'Innkeeper'];

function buildNpcNames() {
  const names = {};
  for (const [dat, locs] of SMALL_FILES) {
    const base = dat.replace('.DAT', '');
    const npc = Files.data[base + '.NPC'], tlk = Files.data[base + '.TLK'];
    if (!npc || !tlk) continue;
    const talk = parseTlkNames(tlk);
    locs.forEach((loc, i) => {
      const rec = npc.subarray(i * 0x240, (i + 1) * 0x240), list = {};
      for (let s = 0; s < 32; s++) {
        const dlg = rec[0x220 + s];
        if (dlg >= 1 && dlg <= 0x80 && !(dlg in list)) list[dlg] = npcLabel(talk[dlg] || '');
      }
      names[loc] = list;
    });
  }
  return names;
}

/* Talk scripts (*.TLK): lines end with 00; A0-A1, A5-DA, E1-FA are characters
 * (minus 80), most bytes below 81 are words from DATA.OVL's list at 104C, 81-8F
 * are commands, 91-9B labels (90 before one starts its definition, 90 9F ends
 * the script). The dump is the original's "Dump TLK during talk" format. */
const TLK_CODES = ['avatar', 'end', 'pause', 'join party', 'gold', 'change', 'or', 'ask name', 'increase karma',
  'decrease karma', 'call guards', 'if knows name / else', 'new line', 'rune', 'wait for key'];
const TLK_WORD = (() => {   // talk byte -> index in the word list (the list has gaps)
  const m = {}, add = (a, b, off) => { for (let i = a; i <= b; i++) m[i] = i + off; };
  add(1, 7, -1); add(9, 27, -2); add(29, 49, -3); add(51, 64, -4); add(66, 66, -5); add(68, 69, -6); add(71, 71, -7);
  add(76, 128, -11);
  return m;
})();

function tlkWords() {
  const ovl = Files.data['DATA.OVL'], words = [];
  let s = '';
  for (let i = 0x104C; i < 0x104C + 0x24E; i++) {
    if (ovl[i] === 0) { words.push(s); s = ''; } else s += String.fromCharCode(ovl[i]);
  }
  return words;
}

/* The original's TLK listing (its 45B8CC), of a TLK file's bytes: for each entry "Index n at
 * $offset (length n)" and an empty line, then its bytes to the next entry's (the last to the
 * file's last byte): characters, words of the word list (a space before when the line has no
 * space at its end, one after), codes as "<name> ", "<gold -nnn> " (three characters after it),
 * "<goto label_n> ", "<code_nnn> "; a 0 ends a line (trimmed; the first five labelled Name,
 * Description, Greeting, Job and Bye, an empty line after them); 90 is an empty line and
 * "label_n:", 9F the line "<end_dialog>"; after an entry an empty line, 120 "=" and another. */
const TLK_FIELDS = ['Name', 'Description', 'Greeting', 'Job', 'Bye'];
function tlkListing(t) {
  const words = tlkWords(), out = [], n = t[0] | t[1] << 8, entries = [];
  for (let i = 0; i < n; i++) entries.push([t[2 + i * 4] | t[3 + i * 4] << 8, t[4 + i * 4] | t[5 + i * 4] << 8]);
  entries.forEach(([npc, off], i) => {
    const last = i < entries.length - 1 ? entries[i + 1][1] : t.length - 1;
    out.push(`Index ${npc} at $${off.toString(16).toUpperCase()} (length ${last - off})`, '');
    let s = '', field = 0;
    const space = () => { if (s && !s.endsWith(' ')) s += ' '; };
    for (let p = off; p <= last; p++) {
      const b = t[p];
      if (b === 0) {
        s = delphiTrim(s);
        if (field < 5) s = `${TLK_FIELDS[field].padEnd(12)}: ${s}`;
        out.push(s);
        if (++field === 5) out.push('');
        s = '';
      } else if ((b >= 0xA0 && b <= 0xA1) || (b >= 0xA5 && b <= 0xDA) || (b >= 0xE1 && b <= 0xFA)) s += String.fromCharCode(b - 0x80);
      else if (b < 0x81) { space(); s += `${words[TLK_WORD[b]] ?? ''} `; }
      else if (b <= 0x8F) {
        space();
        if (b === 0x85) {
          let g = '';
          for (let k = p + 1; k <= p + 3 && k < t.length && t[k]; k++) g += String.fromCharCode(t[k] - 0x80);
          s += `<gold -${g}> `;
          p += 3;
        } else s += `<${TLK_CODES[b - 0x81]}> `;
      } else if (b === 0x90) { p++; out.push('', `label_${t[p] - 0x91}:`); }
      else if (b >= 0x91 && b <= 0x9A) { space(); s += `<goto label_${b - 0x91}> `; }
      else if (b === 0x9F) out.push('<end_dialog>');
      else { space(); s += `<code_${String(b).padStart(3, '0')}> `; }
    }
    out.push('', '='.repeat(120), '');
  });
  return out;
}

// TLK: count (uint16), then (npc number uint16, offset uint16) pairs.  An NPC's name is
// the first line of its script, decoded as the original decodes it (characters, words of
// the word list, "<...>" for codes), cut before a "<" and before a ".", Delphi-trimmed
const delphiTrim = s => s.replace(/^[\x00-\x20]+|[\x00-\x20]+$/g, '');
function parseTlkNames(t) {
  const out = {}, words = tlkWords();
  const n = t[0] | t[1] << 8;
  for (let i = 0; i < n; i++) {
    const num = t[2 + i * 4] | t[3 + i * 4] << 8, off = t[4 + i * 4] | t[5 + i * 4] << 8;
    let s = '';
    for (let p = off; p < t.length; p++) {
      const b = t[p];
      if (b === 0) break;
      if ((b >= 0xA0 && b <= 0xA1) || (b >= 0xA5 && b <= 0xDA) || (b >= 0xE1 && b <= 0xFA)) { s += String.fromCharCode(b - 0x80); continue; }
      if (s && !s.endsWith(' ')) s += ' ';
      if (b >= 0x81) { s += '<'; break; }   // a code: the name ends before its "<...>"
      s += (TLK_WORD[b] !== undefined && words[TLK_WORD[b]] !== undefined ? words[TLK_WORD[b]] : '') + ' ';
    }
    let name = delphiTrim(s);
    for (const stop of ['<', '.']) { const k = name.indexOf(stop); if (k >= 0) name = delphiTrim(name.slice(0, k)); }
    out[num] = name;
  }
  return out;
}
// what the original makes of a TLK name for the map: the first letter up and the rest
// down (its 4615F0), at most 30 characters, two exceptions, else every word capitalised
// with " The " as " the " (45C224)
function npcLabel(raw) {
  const lower = s => s.replace(/[A-Z]/g, ch => ch.toLowerCase()), upper = s => s.replace(/[a-z]/g, ch => ch.toUpperCase());
  let s = raw ? upper(raw[0]) + lower(raw.slice(1)) : '';
  s = s.slice(0, 30);
  if (s.includes('A scraggly, tortured soul')) return 'Tortured soul';
  if (s.includes('Johne, captain johne')) return 'Johne';
  s = delphiTrim(lower(s));
  let out = '', cap = true;
  for (const ch of s) { if (ch === ' ') { cap = true; out += ch; } else { out += cap ? upper(ch) : ch; cap = false; } }
  return out.split(' The ').join(' the ');
}

/* ------------------------------------------------------- game state */

const DS_COPYRIGHT = 0x18, SAVE = 0x55B6, VIEW = 0xAB12, MAPBUF = 0x6618, SAVE_LEN = 4192;
// in combat (location FF): the 11x11 combat map (rows of 32 bytes) and the 32
// 8-byte combatant records (see Game.combat)
const COMBAT_MAP = 0xAD24, COMBAT_UNITS = 0xBA24;
const COPYRIGHT = 'MS Run-Time Library - Copyright (c) 1988, Microsoft Corp';

const Game = {
  base: null, save: null, view: null, mapbuf: null, cmap: null, cunits: null, info: null, lastOk: 0, tick: 0,
  wasDead: false, charmedSlots: new Set(), lastChunk: [0, 0],
  hostiles: 0,   // the hostile creatures of the last look at a fight (kept after it: mixing waits for 0)
  get loc() { return this.save[0x2ED]; },
  get facing() { return this.save[0x105D]; },   // in dungeons: 0 north, 1 east, 2 south, 3 west
  get partySize() { return this.save[0x2B5]; },
  get z() { const z = this.save[0x2EF]; return z > 127 ? z - 256 : z; },
  get x() { return this.save[0x2F0]; },   // in combat: the combatant whose turn it is
  get y() { return this.save[0x2F1]; },
  get under() { return this.loc === 0 && this.save[0x2EF] === 0xFF; },
  area() {
    const l = this.loc;
    if (l === 0) return this.under ? 'under' : 'world';
    if (l === 0xFF) return 'combat';
    if (l >= 33 && l <= 40) return 'dungeon';
    return 'small';
  },
  areaKey() {
    const a = this.area();
    return a === 'world' ? 'w' : a === 'under' ? 'u' : a === 'combat' ? 'c' : `${a[0]}${this.loc}_${this.z}`;
  },
  // map unit i of the save (6B4, 32 x 8 bytes): tile - 100, a second tile, x, y, floor; unit 0
  // is the party (tile 1C, the Avatar)
  unit(i) {
    const o = 0x6B4 + i * 8, s = this.save;
    return { tile: s[o], tile2: s[o + 1], x: s[o + 2], y: s[o + 3], z: s[o + 4] };
  },
  // the name in a character record (up to 12 characters, as the original reads it)
  recordName(o, n = 12) {
    let name = '';
    for (let k = 0; k < n && this.save[o + k]; k++) name += String.fromCharCode(this.save[o + k]);
    return name;
  },
  // the name of map unit i: the save's NPC table (9B8, 32 x 16 bytes) links a unit (byte C)
  // to its dialogue number (byte A)
  unitName(i) {
    const s = this.save, loc = this.loc;
    if (loc < 1 || loc > 32) return '';
    for (let k = 0; k < 32; k++) {
      const o = 0x9B8 + k * 16;
      if (s[o + 0xC] === i) return U5.npcName(loc, s[o + 0xA]);
    }
    return '';
  },
  // everyone in the party at 0 hit points
  partyDead() {
    for (let i = 0; i < 16; i++) {
      const o = 2 + i * 32;
      if (this.save[o + 0x1F] === 0 && (this.save[o + 0x10] | this.save[o + 0x11] << 8) !== 0) return false;
    }
    return true;
  },
  /* The combat as the original reads it: the 11x11 map at DS:AD24 (rows of 32) and the
   * 32 8-byte combatant records at DS:BA24: hit points (monsters), present, flags,
   * party record / monster tile, -, -, x, y.  Flag 08 = asleep, 10 = invisible,
   * 80 and 01: one of them = friendly, both = charmed, neither = hostile.  Objects
   * of the save's unit table (tiles 1-13, 1E, 1F) lie on the map too.  Cells know
   * whether they can be walked on and who stands there. */
  combat() {
    if (this._combat && this._combat.tick === this.tick) return this._combat;
    const cells = [];
    for (let y = 0; y < 11; y++) for (let x = 0; x < 11; x++) {
      const t = this.cmap[y * 32 + x];
      cells.push({ tile: t, walk: WALKABLE[t], unit: -1, hp: 0, friendly: false, name: '', dist: 0 });
    }
    for (let i = 0; i < 32; i++) {
      const u = this.unit(i);
      if (u.x > 10 || u.y > 10) continue;
      const c = cells[u.y * 11 + u.x];
      if (u.tile >= 1 && u.tile <= 13) { c.walk = 0; c.tile = 0x100 + u.tile; }
      else if (u.tile === 0x1E) c.tile = 0x11E;
      else if (u.tile === 0x1F) c.tile = 0x11F;
    }
    const party = this.partySize, units = [], charmed = new Set();
    let hostiles = 0;
    for (let i = 0; i < 32; i++) {
      const r = this.cunits.subarray(i * 8, i * 8 + 8);
      if (!r[1]) { units.push(null); continue; }
      const u = { i, tile: r[3], x: r[6], y: r[7], hp: 0, name: '', pc: -1, asleep: false, hidden: false, charmed: false, friendly: false };
      if (i > party - 1) { u.hp = r[0]; if (u.tile < 0x30) u.name = U5.monsterName(u.tile); }
      else {
        const o = 2 + r[3] * 32;
        u.hp = this.save[o + 0x10] | this.save[o + 0x11] << 8;
        u.name = this.recordName(o);
        u.pc = r[3];
      }
      if (u.x < 11 && u.y < 11 && u.hp > 0) {
        const c = cells[u.y * 11 + u.x], f = r[2];
        c.unit = i; c.walk = 0; c.hp = u.hp; c.name = u.name;
        if (f & 8) u.asleep = true;
        if (f & 0x10 && !(f & 0x80) && !(f & 1)) u.hidden = true;
        if (f & 0x80 && f & 1) { u.charmed = true; if (i < 6 && r[3] < 6) charmed.add(r[3]); hostiles++; }
        else if (!(f & 0x80) && !(f & 1)) hostiles++;
        else { u.friendly = true; c.friendly = true; }
      }
      units.push(u);
    }
    const u0 = this.unit(0);
    // the game shows the combat screen without a fight going on: the camp, or 233,233
    const over = (u0.tile === 0x6C && u0.x === 5 && u0.y === 6) || (this.x === 0xE9 && this.y === 0xE9);
    this.charmedSlots = charmed;
    return this._combat = { tick: this.tick, cells, units, hostiles, over, active: this.save[0x2F8] };
  },
  u16(o) { return this.save[o] | this.save[o + 1] << 8; },
  party() {
    const list = [];
    for (let i = 0; i < 16 && list.length < 6; i++) {
      const o = 2 + i * 32, r = this.save.subarray(o, o + 32);
      if (r[0x1F] !== 0) continue;
      let name = '';
      for (let k = 0; k < 9 && r[k]; k++) name += String.fromCharCode(r[k]);
      list.push({ index: i, off: o, name, gender: r[9], cls: r[10], status: r[11], str: r[12], dex: r[13],
        int: r[14], mp: r[15], hp: r[16] | r[17] << 8, maxhp: r[18] | r[19] << 8, xp: r[20] | r[21] << 8,
        level: r[22], eq: [...r.subarray(0x19, 0x1F)] });
    }
    return list;
  },
  async find() {
    const needle = new TextEncoder().encode(COPYRIGHT);
    const chunk = 0x10000;
    let carry = new Uint8Array(0);
    for (let a = 0; a < 0x100000; a += chunk) {
      const d = await Api.read(a, chunk);
      const buf = new Uint8Array(carry.length + d.length);
      buf.set(carry); buf.set(d, carry.length);
      const i = indexOfBytes(buf, needle);
      if (i >= 0) {
        const base = a - carry.length + i - DS_COPYRIGHT;
        const save = await Api.read(base + SAVE, SAVE_LEN);
        if (save[0x2B5] >= 1 && save[0x2B5] <= 6 && save[2] >= 0x20) return base;
      }
      carry = d.subarray(d.length - needle.length);
    }
    return null;
  },
  async poll() {
    const [save, view, mapbuf, cmap, cunits] = await Promise.all([Api.read(this.base + SAVE, SAVE_LEN),
      Api.read(this.base + VIEW, 352), Api.read(this.base + MAPBUF - 5, 1029),
      Api.read(this.base + COMBAT_MAP, 352), Api.read(this.base + COMBAT_UNITS, 256)]);
    return { save, view, mapbuf: mapbuf.subarray(5), cmap, cunits };
  },
  async writeSave(off, bytes) {
    await Api.write(this.base + SAVE + off, Uint8Array.from(bytes));
    this.save.set(bytes, off);
  },
};

function indexOfBytes(hay, needle) {
  const first = needle[0];
  outer: for (let i = hay.indexOf(first); i >= 0 && i <= hay.length - needle.length; i = hay.indexOf(first, i + 1)) {
    for (let k = 1; k < needle.length; k++) if (hay[i + k] !== needle[k]) continue outer;
    return i;
  }
  return -1;
}

/* ---------------------------------------------------- exploration */

/* The explored maps as the original keeps them: a working copy in memory, which is what
 * was kept when the game is found (the original's Explored.UM5 in the game folder; here
 * the browser's store, which takes that file over once per version of it), and which is
 * kept again only when the game has been saved: the original looks at SAVED.GAM's date
 * every 5 seconds, the page at its contents.  When SAVED.GAM can't be read again (a folder
 * chosen in the browser gives a snapshot), every change is kept at once. */
const Explored = {
  maps: {}, dirty: new Set(), gen: 0, fromStore: true,
  size(key) { return key === 'w' || key === 'u' ? 256 : key[0] === 'd' ? 8 : 32; },
  get(key) {
    if (!this.maps[key]) {
      const m = this.maps[key] = new Uint8Array(this.size(key) ** 2);
      if (this.fromStore) DB.get('kv', 'exp:' + key).then(b => {
        if (!b || this.maps[key] !== m) return;
        const old = new Uint8Array(b);
        for (let i = 0; i < m.length; i++) m[i] |= old[i];
        this.gen++; Render.draw();
      });
    }
    return this.maps[key];
  },
  // the game found: the working copy is what was kept
  reload() { this.maps = {}; this.fromStore = true; this.dirty.clear(); this.gen++; },
  // keep the working copy (the game was saved); after "unexplore all" what isn't in it is gone
  async persist() {
    if (!this.fromStore) {
      for (const k of await DB.keys('kv')) if (String(k).startsWith('exp:') && !this.maps[String(k).slice(4)]) await DB.del('kv', k);
      this.fromStore = true;
    }
    for (const [k, m] of Object.entries(this.maps)) await DB.put('kv', 'exp:' + k, m.buffer.slice(0));
    this.dirty.clear();
  },
  // the original's Explored.UM5 (world, underworld, 32 places x 5 floors, 8 dungeons x 8
  // levels) into the store, replacing what it held
  async store(f) {
    for (const k of await DB.keys('kv')) if (String(k).startsWith('exp:')) await DB.del('kv', k);
    const put = (key, o, n) => { const m = f.subarray(o, o + n); if (m.some(v => v)) return DB.put('kv', 'exp:' + key, m.slice().buffer); };
    await put('w', 0, 0x10000); await put('u', 0x10000, 0x10000);
    for (let loc = 1; loc <= 32; loc++) for (let s = 0; s < 5; s++) await put(`s${loc}_${s - 1}`, 0x20000 + (loc - 1) * 0x1400 + s * 0x400, 0x400);
    for (let loc = 33; loc <= 40; loc++) for (let z = 0; z < 8; z++) await put(`d${loc}_${z}`, 0x48000 + (loc - 33) * 0x200 + z * 0x40, 0x40);
  },
  // marks one cell; nothing wraps around the edges, like the original
  mark(key, x, y) {
    const n = this.size(key);
    if (x < 0 || y < 0 || x >= n || y >= n) return false;
    const m = this.get(key);
    if (m[y * n + x]) return false;
    m[y * n + x] = 1; this.dirty.add(key); this.gen++;
    return true;
  },
  fill(key, v) { this.get(key).fill(v); this.dirty.add(key); this.gen++; Render.draw(); },
  // what a gem or an In Quas Wis shows: on the large maps the 2x2 chunks the game
  // has in memory around the party, elsewhere the whole floor
  peer() {
    const area = Game.area(), key = Game.areaKey();
    if (area === 'world' || area === 'under') {
      const x0 = chunkOrigin(Game.x), y0 = chunkOrigin(Game.y);
      for (let y = y0; y < y0 + 32; y++) for (let x = x0; x < x0 + 32; x++) this.mark(key, x, y);
    } else if (area !== 'combat') this.fill(key, 1);
  },
  // "Unexplore all": the working copy, as the original's (kept with the next saved game)
  clearAll() { this.maps = {}; this.fromStore = false; this.dirty.add('*'); this.gen++; Render.draw(); },
  shown(area) {
    const s = Settings.v;
    return area === 'world' ? s.worldExplored : area === 'under' ? s.underworldExplored
      : area === 'dungeon' ? s.dungeonsExplored : area === 'combat' || s.townsExplored;
  },
  // what was kept, in the original's Explored.UM5 layout: world and underworld (256 x 256
  // each), the small maps (32 places x 5 floors x 32 x 32), the dungeons
  async file() {
    const out = new Uint8Array(0x20000 + 0x28000 + 0x1000);
    for (const k of await DB.keys('kv')) {
      const key = String(k);
      if (!key.startsWith('exp:')) continue;
      const m = new Uint8Array(await DB.get('kv', key)), id = key.slice(4), p = id.match(/^([sd])(\d+)_(-?\d+)$/);
      const off = id === 'w' ? 0 : id === 'u' ? 0x10000 : !p ? -1
        : p[1] === 's' ? 0x20000 + (+p[2] - 1) * 0x1400 + (+p[3] + 1) * 0x400 : 0x48000 + (+p[2] - 33) * 0x200 + +p[3] * 0x40;
      if (off >= 0 && off + m.length <= out.length) out.set(m, off);
    }
    return out;
  },
};
// SAVED.GAM as seen when the game was found or last saved (null: it can't be read again)
const SaveWatch = {
  stamp: null,
  async tick() {
    const b = await Files.readSave(), s = b ? Array.from(b).join(',') : null;
    if (s === null) { if (Explored.dirty.size) await Explored.persist(); return; }
    if (this.stamp !== null && s !== this.stamp) await Explored.persist();
    this.stamp = s;
  },
};
setInterval(() => { if (Game.base !== null && Game.save) SaveWatch.tick(); }, 5000);
// the origin of the 2x2 chunks around a position, as the game and the original compute it
const chunkOrigin = v => clamp(Math.trunc((v - 5) / 16) * 16, 0, 0xE0);

// the small-map cells in view this tick (what units are drawn on)
const Visible = { cells: new Uint8Array(32 * 32) };

/* What the original marks as explored each tick: on the large maps the 11x11 cells around
 * the party; in a small map the view window's cells that aren't FF, if the view agrees
 * with the map in memory (it lags behind on a change of place); in a dungeon the cell and
 * its neighbours.  Nothing wraps, and nothing is marked while the area's "explored"
 * setting shows everything anyway. */
function markVisible() {
  const area = Game.area(), key = Game.areaKey(), S = Settings.v, x = Game.x, y = Game.y;
  if (area === 'combat') return;
  if (area === 'world' || area === 'under') {
    if (area === 'world' ? S.worldExplored : S.underworldExplored) return;
    for (let dy = -5; dy <= 5; dy++) for (let dx = -5; dx <= 5; dx++) Explored.mark(key, x + dx, y + dy);
    return;
  }
  if (area === 'dungeon') {
    if (S.dungeonsExplored) return;
    for (const [dx, dy] of DUNGEON_NEAR) Explored.mark(key, x + dx, y + dy);
    return;
  }
  Visible.cells.fill(0);
  if (x < 32 && y < 32) Visible.cells[y * 32 + x] = 1;
  if (S.townsExplored) return;
  const v = Game.view, m = Game.mapbuf;
  let agree = true;
  check: for (let r = 0; r < 11; r++) for (let c = 0; c < 11; c++) {
    const mx = x - 5 + c, my = y - 5 + r, t = v[r * 32 + c];
    if (mx < 0 || my < 0 || mx >= 32 || my >= 32 || t === 0 || t === 0xFF) continue;
    if (m[my * 32 + mx] !== t) { agree = false; break check; }
  }
  // the original's second pass stops after a row when they disagree: the view's top row
  // is marked even then
  for (let r = 0; r < (agree ? 11 : 1); r++) for (let c = 0; c < 11; c++) {
    const mx = x - 5 + c, my = y - 5 + r;
    if (mx < 0 || my < 0 || mx >= 32 || my >= 32 || v[r * 32 + c] === 0xFF) continue;
    Visible.cells[my * 32 + mx] = 1;
    Explored.mark(key, mx, my);
  }
}

/* ------------------------------------------------------------ HUD */

/* The HUD as the original paints it: as wide as the game window, 11 units high (a unit
 * is a fiftieth of the width), six columns of a character each - name in a box coloured
 * by status, equipment with class, level and stats on the right, magic points, the
 * experience bar, the hit point bar - and the clock with keys, skull keys, torches and
 * gems on the right.  A click on that part opens the spell list, a right click the
 * inventory. */
const Hud = {
  canvas: $('#hud'), last: '', side: null,
  draw() {
    const c = this.canvas, s = Game.save, S = Settings.v;
    c.classList.toggle('hidden', !S.hud || !Game.active);
    if (!s || !S.hud || !Game.active) { this.last = ''; return; }
    const W = $('#mapwrap').clientWidth || 640, u = round(W / 50), H = u * 11;
    const sig = [W, ...s.subarray(2, 0x202), s[0x2D9], s[0x2DB], s[0x206], s[0x20B], s[0x208], s[0x207], ...Game.charmedSlots].join();
    if (sig === this.last) return;
    this.last = sig;
    if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
    const g = c.getContext('2d');
    g.fillStyle = '#000000'; g.fillRect(0, 0, W, H);
    const col = round((W - 6 * u + round(u * 0.5) - 5 * u) / 6);
    g.strokeStyle = '#444444'; g.lineWidth = 1;
    for (let k = 1; k <= 6; k++) {
      const x = k * (col + u) + 0.5;
      g.beginPath(); g.moveTo(x, round(u / 2)); g.lineTo(x, H - round(u / 2)); g.stroke();
    }
    const font = size => Gdi.font(g, pt(size));
    // right aligned: TextOut at the right edge minus TextWidth, like the original
    const text = (t, x, y, colour, align = 'left') => {
      g.fillStyle = colour; Gdi.text(g, t, align === 'right' ? x - Gdi.width(g, t) : x, y);
    };
    const centred = (t, x, y, w, h, colour) => { g.fillStyle = colour; Gdi.centred(g, t, x, y, w, h); };
    let cx = round(u * 0.5);
    for (let k = 0; k < 6; k++, cx += col + u) {
      const o = 2 + k * 32;
      if (s[o + 0x1F] !== 0) continue;
      let y = H - round(u * 1.75);
      const hp = s[o + 0x10] | s[o + 0x11] << 8, max = s[o + 0x12] | s[o + 0x13] << 8, st = s[o + 0x0B], level = s[o + 0x16];
      this.bar(g, cx, y, col, u, st === 0x44 ? 'D E A D' : null, HP_COLOURS, max, hp);
      y -= round(u * 0.75);
      if (level >= 1 && level <= 7) {
        const xp = s[o + 0x14] | s[o + 0x15] << 8;
        this.bar(g, cx, y, col, round(u * 0.2), '', XP_COLOURS, LEVEL_XP[level] - LEVEL_XP[level - 1], xp - LEVEL_XP[level - 1]);
      } else this.bar(g, cx, y, col, round(u * 0.2), '', XP_FULL_COLOURS, 1, 1);
      y -= round(u * 1.25);
      font(round(u * 0.5));
      text(String(s[o + 0x0F]), cx + col, y, '#CCCCCC', 'right');
      font(round(u * 0.4));
      for (let slot = 0x1E; slot >= 0x19; slot--, y -= u) {
        const it = s[o + slot];
        text(it === 0xFF ? SLOTS[slot - 0x19] : HUD_ITEMS[it] || '-', cx, y, it === 0xFF ? '#333333' : '#999999');
      }
      font(round(u * 0.5));
      let ry = y + u;
      text(String.fromCharCode(s[o + 0x0A]) + ' ' + level, cx + col, ry, '#999999', 'right');
      ry += round(u * 1.25);
      for (let a = 0; a < 3; a++, ry += u) text(String(s[o + 0x0C + a]), cx + col, ry, '#999999', 'right');
      y -= round(u * 0.5);
      g.fillStyle = Game.charmedSlots.has(k) ? '#660066' : st === 0x44 ? '#1A1A1A' : st === 0x50 ? '#660000' : st === 0x53 ? '#666600' : '#006600';
      g.fillRect(cx, y, col, u);
      // the name in capitals (the original's UpperCase: a to z only)
      centred(Game.recordName(o).replace(/[a-z]/g, ch => ch.toUpperCase()), cx, y, col, u, '#EEEEEE');
    }
    const sx = 6 * (col + u), sw = round(u * 4.5);
    this.side = [sx - u, 0, W, H];
    let y = round(u * 0.75);
    font(round(u * 0.5));
    centred(`${pad2(s[0x2D9])}:${pad2(s[0x2DB])}`, sx, y, sw, u, '#EEEEEE');
    const fh = pt(round(u * 0.5));
    y += round(fh * 2.5);
    for (const [label, off] of [['Keys', 0x206], ['Skull keys', 0x20B], ['Torches', 0x208], ['Gems', 0x207]]) {
      centred(label, sx, y, sw, fh, '#999999'); y += round(fh * 1.25);
      centred(String(s[off]), sx, y, sw, fh, '#EEEEEE'); y += round(fh * 1.75);
    }
    g.strokeStyle = '#444444'; g.strokeRect(0.5, 0.5, W - 1, H - 1);
  },
  // a bar: dark background, the part filled in one of five colours by the fraction,
  // the text in the middle ("value / max" when none is given, nothing for '')
  bar(g, x, y, w, h, label, colours, max, value) {
    g.fillStyle = '#191919'; g.fillRect(x, y, w, h);
    if (max > 0) {
      // in the original's single precision: the fraction, then the width times it, cut
      const fill = Math.min(w, Math.trunc(w * Math.fround(value / max)));
      const idx = Math.min(4, Math.trunc(Math.fround(value * (4 / max))));
      if (idx >= 0) { g.fillStyle = colours[idx]; g.fillRect(x, y, fill, h); }
    }
    if (label === null) label = `${value} / ${max}`;
    if (!label) return;
    Gdi.font(g, pt(round(h * 0.5))); g.fillStyle = '#EEEEEE';
    Gdi.centred(g, label, x, y, w, h);
  },
};
Hud.canvas.addEventListener('mousedown', ev => {
  const r = Hud.canvas.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, b = Hud.side;
  if (!Game.save || !Game.active || !b || x < b[0] || y < b[1] || x > b[2] || y > b[3]) return;
  ev.preventDefault();   // the focus left with the list window, as the original gives it
  Lists.open(ev.button === 0 ? 'spells' : 'inventory');
});
Hud.canvas.addEventListener('contextmenu', ev => ev.preventDefault());

/* ------------------------------------------------------------ map
 * Drawn the way the original draws its map window (a square, 512 to 1600 pixels
 * there): the large maps as one coloured pixel per tile stretched to the window,
 * small maps and combat from 16-pixel tiles, dungeons from a 128-pixel drawing at a
 * whole-number scale.  Texts are Verdana, like its bitmap's font. */

// the dungeon cell types the original draws with tiles (over #333333)
const DUNGEON_TILES = { 1: [200], 2: [201], 3: [200, 201], 4: [257], 5: [216], 7: [257], 11: [78], 12: [78], 13: [78],
  14: [184], 15: [184] };
const DUNGEON_INFO = { 0: 'corridor', 1: 'ladder up', 2: 'ladder down', 3: 'ladders up and down', 4: 'chest',
  5: 'fountain', 6: 'trap', 7: 'open chest', 8: 'magic field', 10: 'room', 11: 'wall', 12: 'wall',
  13: 'secret door', 14: 'door', 15: 'room' };
// half as bright, the original's frame colour for a combatant's square
const halfBright = hex => '#' + [1, 3, 5].map(i => Math.min(255, round(parseInt(hex.slice(i, i + 2), 16) * 0.5)).toString(16).padStart(2, '0')).join('');

const Render = {
  mouse: [-1, -1], mousePx: [-1, -1], lastMove: 0, lastClient: [null, null], lens: false, canvas: $('#map'), dungeonBox: null,
  base: null, baseKey: '', small: null, smallKey: '', mask: null, maskKey: '',
  work: document.createElement('canvas'), dungeon: document.createElement('canvas'),
  // the map window's size: the setting (512 to 1600), or what fits the window
  size() {
    const wrap = $('#mapwrap'), z = Settings.v.size;
    return z > 0 ? z : Math.max(64, Math.min(wrap.clientWidth, wrap.clientHeight));
  },
  current() {
    if (!Game.save) return null;
    const area = Game.area(), loc = Game.loc, z = Game.z;
    if (area === 'world' || area === 'under') {
      const m = U5.large(area === 'under');
      return m && { area, n: 256, tiles: m, key: Game.areaKey() };
    }
    if (area === 'dungeon') {   // the dungeon's levels are in the save (3B4, 64 bytes a level)
      const o = 0x3B4 + (z & 7) * 64;
      return { area, n: 8, cells: Game.save.subarray(o, o + 64), key: Game.areaKey() };
    }
    if (area === 'combat') {
      const cb = Game.combat();
      return { area, n: 11, tiles: cb.cells.map(c => c.tile), combat: cb, key: 'c' };
    }
    if (loc < 1 || loc > 32) return null;
    return { area, n: 32, tiles: Game.mapbuf, key: Game.areaKey() };   // the floor as the game has it now
  },
  // Delphi's FrameRect: a one pixel line just inside the rectangle
  frame(g, l, t, r, b) { if (r > l && b > t) g.strokeRect(l + 0.5, t + 0.5, r - l - 1, b - t - 1); },
  tile(g, t, x, y, transparent) {
    const a = transparent ? U5.tilesT() : U5.tiles();
    if (a) g.drawImage(a, (t % 32) * 16, (t >> 5) * 16, 16, 16, x, y, 16, 16);
  },
  textHeight(g) { return Gdi.height(g); },
  // the area at 16 pixels a tile
  baseImage(cur) {
    const key = cur.key + ':' + cur.tiles.join(',');
    if (this.baseKey === key) return this.base;
    const n = cur.n, c = document.createElement('canvas');
    c.width = c.height = n * 16;
    const g = c.getContext('2d');
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const t = cur.tiles[y * n + x];
      if (cur.area !== 'combat' || t > 0) this.tile(g, t, x * 16, y * 16);
    }
    this.base = c; this.baseKey = key;
    return c;
  },
  // a large map at one pixel per tile, in the original's colours
  smallImage(cur) {
    if (this.smallKey === cur.key) return this.small;
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const g = c.getContext('2d'), img = g.createImageData(256, 256);
    for (let i = 0; i < 65536; i++) {
      const rgb = TILE_RGB[cur.tiles[i]] || TILE_RGB[0];
      img.data.set([rgb[0], rgb[1], rgb[2], 255], i * 4);
    }
    g.putImageData(img, 0, 0);
    this.small = c; this.smallKey = cur.key;
    return c;
  },
  maskImage(cur) {
    const key = cur.key + ':' + Explored.gen;
    if (this.maskKey === key) return this.mask;
    const n = cur.n, exp = Explored.get(cur.key);
    const c = this.mask && this.mask.width === n ? this.mask : document.createElement('canvas');
    c.width = c.height = n;
    const g = c.getContext('2d'), img = g.createImageData(n, n);
    for (let i = 0; i < n * n; i++) img.data[i * 4 + 3] = exp[i] ? 0 : 255;
    g.putImageData(img, 0, 0);
    this.mask = c; this.maskKey = key;
    return c;
  },
  prepare() {
    const W = this.size(), c = this.canvas;
    if (c.width !== W || c.height !== W) { c.width = c.height = W; }
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.lineWidth = 1;
    g.fillStyle = '#000000'; g.fillRect(0, 0, W, W);
    return [g, W];
  },
  // a message instead of the map, the original's way: Verdana, grey, the lines centred
  message(text) {
    const [g, W] = this.prepare();
    Gdi.font(g, pt(round(W / 35))); g.fillStyle = '#CCCCCC';
    const lines = text.split('\n'), lh = Gdi.height(g);
    let y = Math.trunc((W - lh * lines.length) / 2);
    for (const l of lines) { Gdi.text(g, l, Math.trunc((W - Gdi.width(g, l)) / 2), y); y += lh; }
  },
  draw() {
    const msg = $('#msg');
    if (!Game.save) return;
    if (!U5.tiles()) {
      if (!$('#pickBtn')) {
        msg.innerHTML = '<h2>Choose the Ultima V game folder</h2><p>Ultimapper reads the maps and tiles from the ' +
          'game\'s files (TILES.16, BRIT.DAT, ...). Your browser keeps a copy, so this is needed once.</p>' +
          '<p><button id="pickBtn">Choose folder&hellip;</button></p>';
        $('#pickBtn').onclick = () => pickFolder();
      }
      return;
    }
    if (msg.innerHTML) msg.innerHTML = '';
    const cur = this.current();
    if (!cur) return;
    const [g, W] = this.prepare();
    if (cur.area === 'world' || cur.area === 'under') this.drawLarge(g, cur, W);
    else if (cur.area === 'dungeon') this.drawDungeon(g, cur, W);
    else if (cur.area === 'combat') this.drawCombat(g, cur, W);
    else this.drawSmall(g, cur, W);
    this.follow(W);
  },
  drawLarge(g, cur, W) {
    const S = Settings.v, under = cur.area === 'under', cell = W / 256;
    const showAll = under ? S.underworldExplored : S.worldExplored, exp = Explored.get(cur.key);
    g.drawImage(this.smallImage(cur), 0, 0, W, W);
    if (!showAll) g.drawImage(this.maskImage(cur), 0, 0, W, W);
    if (S.debug) {   // the 16x16 chunks, and the 2x2 of them the game keeps in memory (2F5/2F6)
      g.strokeStyle = '#000000';
      for (let k = 1; k < 16; k++) {
        const p = round(k * 16 * cell) + 0.5;
        g.beginPath(); g.moveTo(p, 0); g.lineTo(p, W); g.stroke();
        g.beginPath(); g.moveTo(0, p); g.lineTo(W, p); g.stroke();
      }
      const ox = Game.save[0x2F5], oy = Game.save[0x2F6];
      g.strokeStyle = '#FFFF00';
      this.frame(g, round(ox * cell), round(oy * cell), round((ox + 32) * cell), round((oy + 32) * cell));
    }
    if (under ? S.underworldTitles : S.worldTitles) {
      Gdi.font(g, pt(clamp(Math.trunc(W / 65), 8, 16)));
      const titles = [];
      for (let loc = 1; loc <= 40; loc++) {
        const xy = U5.locXY(loc);
        if (!xy) continue;
        let [x, y] = xy;
        if (!showAll && !exp[y * 256 + x]) continue;
        if (!under) {
          if ([2, 19, 20, 21, 25, 40].includes(loc)) continue;
          const sh = TITLE_SHIFTS[loc];
          if (sh) { x += sh[0]; y += sh[1]; }
        } else if (loc !== 25 && (loc < 33 || loc > 40)) continue;
        titles.push([x, y, LOC_NAMES[loc]]);
      }
      EXTRA_TITLES[under ? 'under' : 'world'].forEach(([x, y, name], i) => {
        if (!showAll && !exp[y * 256 + x]) return;
        if (!under && i === 1) { x -= 7; y += 1; }
        titles.push([x, y, name]);
      });
      for (const [x, y, name] of titles) this.title(g, round(x * cell), round(y * cell), name);
    }
    if (S.partyLocation) {   // the party's cell in white, the 11x11 the game shows framed in grey
      const px = round(Game.x * cell), py = round(Game.y * cell), cs = round(cell), a = round(cell * 5), b = round(cell * 6);
      g.fillStyle = '#FFFFFF'; g.fillRect(px, py, cs, cs);
      g.strokeStyle = '#CCCCCC';
      this.frame(g, px - a, py - a, px + b, py + b);
      this.frame(g, px - a - 1, py - a - 1, px + b + 1, py + b + 1);
    }
    if (this.lens) this.drawLens(g, cur, W);
  },
  // a title: centred on x with its bottom at y, white over a black shadow 2 pixels off
  title(g, x, y, name) {
    const w = Gdi.width(g, name), h = Gdi.height(g), tx = x - Math.trunc(w / 2), ty = y - h;
    g.fillStyle = '#000000'; Gdi.text(g, name, tx + 2, ty + 2);
    g.fillStyle = '#FFFFFF'; Gdi.text(g, name, tx, ty);
  },
  // the zoom view: an odd number of tiles (a 64th of the window) around the mouse tile,
  // the tiles at double size, in the half of the window away from the mouse; it shows
  // the map as it is, explored or not
  drawLens(g, cur, W) {
    let tiles = (W >> 1) >> 5;
    if (!(tiles & 1)) tiles--;
    tiles = Math.max(1, tiles);
    const L = tiles * 16, half = tiles >> 1, m = { x: this.mouse[0], y: this.mouse[1] }, lc = this.work;
    lc.width = lc.height = L;
    const lg = lc.getContext('2d');
    lg.fillStyle = '#000000'; lg.fillRect(0, 0, L, L);
    for (let r = 0; r < tiles; r++) for (let k = 0; k < tiles; k++) {
      const tx = m.x - half + k, ty = m.y - half + r;
      if (tx >= 0 && ty >= 0 && tx < 256 && ty < 256) this.tile(lg, cur.tiles[ty * 256 + tx], k * 16, r * 16);
    }
    const bottom = this.mousePx[1] <= Math.trunc(W / 2);
    const x0 = Math.trunc((W - 2 * L) / 2), y0 = Math.trunc((Math.trunc(W / 2) - 2 * L) / 2) + (bottom ? Math.trunc(W / 2) : 0);
    g.drawImage(lc, 0, 0, L, L, x0, y0, 2 * L, 2 * L);
    g.strokeStyle = '#AAAAAA';
    this.frame(g, x0, y0, x0 + 2 * L, y0 + 2 * L);
    this.frame(g, x0 - 1, y0 - 1, x0 + 2 * L + 1, y0 + 2 * L + 1);
    const mx = Math.trunc(W / 2), my = Math.trunc(W / 4) - 16 + (bottom ? Math.trunc(W / 2) : 0);
    g.strokeStyle = '#FFFFFF';
    this.frame(g, mx - 16, my, mx + 16, my + 32);
    this.frame(g, mx - 17, my - 1, mx + 17, my + 33);
  },
  drawSmall(g, cur, W) {
    const S = Settings.v, cell = W / 32, f = this.work, zb = Game.save[0x2EF];
    f.width = f.height = 512;
    const fg = f.getContext('2d');
    fg.imageSmoothingEnabled = false;
    // the explored cells' tiles (the others black), then the save's units on this floor
    // where the view shows them (anywhere once "towns explored" is on), drawn whole, over
    // explored and unexplored cells alike; the party's own sprite (tile 1C) only with
    // "party location"
    fg.drawImage(this.baseImage(cur), 0, 0);
    if (!S.townsExplored) fg.drawImage(this.maskImage(cur), 0, 0, 512, 512);
    for (let i = 0; i < 32; i++) {
      const u = Game.unit(i);
      if (!u.tile || u.z !== zb || u.x >= 32 || u.y >= 32 || (u.tile === 0x1C && !S.partyLocation)) continue;
      if (!S.townsExplored && !Visible.cells[u.y * 32 + u.x]) continue;
      this.tile(fg, 0x100 + u.tile, u.x * 16, u.y * 16);
    }
    g.drawImage(f, 0, 0, 512, 512, 0, 0, W, W);
    if (S.npcNames) {
      Gdi.font(g, pt(clamp(Math.trunc(W / 60), 8, 16)));
      for (let i = 0; i < 32; i++) {
        const u = Game.unit(i);
        if (!u.tile || u.z !== zb || u.x >= 32 || u.y >= 32) continue;
        if (!S.townsExplored && !Visible.cells[u.y * 32 + u.x]) continue;
        const name = Game.unitName(i);
        if (name) this.label(g, round(u.x * cell + 8), round(u.y * cell), name);
      }
    }
    {   // the mouse's cell framed in yellow (at -1, -1 a corner of it shows)
      const [mx, my] = this.mouse, l = round(mx * cell), t = round(my * cell), r = round((mx + 1) * cell) + 1, b = round((my + 1) * cell) + 1;
      g.strokeStyle = '#FFFF00';
      this.frame(g, l - 1, t - 1, r, b);
      this.frame(g, l - 2, t - 2, r + 1, b + 1);
    }
  },
  // an NPC's name: white in a black box above the point
  label(g, x, y, text) {
    const w = Gdi.width(g, text), h = Gdi.height(g), tx = x - Math.trunc(w / 2), ty = y - (h + 4);
    g.fillStyle = '#000000'; g.fillRect(tx - 5, ty - 2, w + 10, h + 5);
    g.fillStyle = '#FFFFFF'; Gdi.text(g, text, tx, ty);
  },
  // a dungeon level: 8x8 cells of 16 pixels - corridors #333333, walls and doors,
  // ladders, chests and fountains as tiles, the party as an arrow - at a scale of 1 to 4
  // in the middle of the window, framed in grey
  drawDungeon(g, cur, W) {
    const S = Settings.v, exp = Explored.get(cur.key), d = this.dungeon;
    d.width = d.height = 128;
    const dg = d.getContext('2d');
    dg.fillStyle = '#000000'; dg.fillRect(0, 0, 128, 128);
    for (let i = 0; i < 64; i++) {
      if (!S.dungeonsExplored && !exp[i]) continue;
      const x = (i & 7) * 16, y = (i >> 3) * 16;
      dg.fillStyle = '#333333'; dg.fillRect(x, y, 16, 16);
      // walls and doors whole, from the original's image list; ladders, chests and
      // fountains through a bitmap with black see-through, as the original draws them
      const type = cur.cells[i] >> 4;
      for (const t of DUNGEON_TILES[type] || []) this.tile(dg, t, x, y, type < 11);
    }
    if (S.partyLocation && Game.facing < 4) {   // the party: an arrow the way it faces (the original has bitmaps for this)
      dg.save(); dg.translate(Game.x * 16 + 8, Game.y * 16 + 8); dg.rotate(Game.facing * Math.PI / 2);
      dg.fillStyle = '#00AA00';
      dg.beginPath(); dg.moveTo(0, -7); dg.lineTo(6, 0); dg.lineTo(2, 0); dg.lineTo(2, 7); dg.lineTo(-2, 7); dg.lineTo(-2, 0); dg.lineTo(-6, 0);
      dg.closePath(); dg.fill();
      dg.restore();
    }
    const f = clamp(Math.trunc(W / 128), 1, 4), ox = Math.trunc((W - 128 * f) / 2), oy = ox;
    g.drawImage(d, 0, 0, 128, 128, ox, oy, 128 * f, 128 * f);
    g.strokeStyle = '#666666';
    this.frame(g, ox, oy, ox + 128 * f, oy + 128 * f);
    this.dungeonBox = [ox, oy, 16 * f];
  },
  // the combat: the map's tiles, then a square for every combatant with its hit points
  // ("Z" asleep) - blue for the one whose turn it is, green friendly, red hostile, purple
  // charmed, invisible ones only in debug mode -, the crosshair while aiming and a Q
  // while quickfight runs.  Nothing but the tiles when the screen isn't a fight.
  drawCombat(g, cur, W) {
    const cb = cur.combat, S = Settings.v;
    g.drawImage(this.baseImage(cur), 0, 0, 176, 176, 0, 0, W, W);
    const cell = round(W / 176 * 16), m = round(cell * 0.125);
    if (!cb.over) {
      Gdi.font(g, pt(round(cell * 0.2)));
      for (const u of cb.units) {
        if (!u || u.hp === 0 || (u.hidden && !S.debug) || u.x > 10 || u.y > 10) continue;
        const colour = u.i === cb.active ? '#5555FF' : u.charmed ? '#AA22AA' : u.friendly ? '#22AA22' : '#BB2222';
        const x = u.x * cell, y = u.y * cell, l = m + x + 1, t = m + y + 1, r = x + cell - m, b = y + cell - m;
        g.fillStyle = colour; g.fillRect(l, t, r - l, b - t);
        g.strokeStyle = halfBright(colour);
        this.frame(g, l, t, r, b); this.frame(g, l + 1, t + 1, r - 1, b - 1);
        g.fillStyle = '#FFFFFF';
        Gdi.centred(g, u.asleep ? 'Z' : String(u.hp), l, t, r - l, b - t);
      }
      if (Game.save[0x2F2] === 1) {
        const ax = Game.save[0x2F3], ay = Game.save[0x2F4];
        if (ax < 11 && ay < 11) {
          g.strokeStyle = '#FFFFFF';
          this.frame(g, ax * cell, ay * cell, ax * cell + cell + 1, ay * cell + cell + 1);
          this.frame(g, ax * cell + 1, ay * cell + 1, ax * cell + cell, ay * cell + cell);
        }
      }
      if (Quickfight.on) {
        Gdi.font(g, pt(round(cell * 0.75)));
        const qx = W - (cell >> 1) - Gdi.width(g, 'Q'), qy = cell >> 2;
        g.fillStyle = '#000000'; Gdi.text(g, 'Q', qx + 3, qy + 3);
        g.fillStyle = '#FFFF00'; Gdi.text(g, 'Q', qx, qy);
      }
    }
    {   // the mouse's cell framed three pixels thick, at an eleventh of the window a cell
      const [mx, my] = this.mouse, f = Math.fround(W / 11);
      const l = round(mx * f), t = round(my * f), r = (mx + 1) * f, b = (my + 1) * f;
      g.strokeStyle = '#FFFF00';
      this.frame(g, l, t, round(r), round(b));
      this.frame(g, l - 1, t - 1, round(r + 1), round(b + 1));
      this.frame(g, l - 2, t - 2, round(r + 2), round(b + 2));
    }
  },
  // keeps the party in sight when the map is bigger than the window
  follow(W) {
    const w = $('#mapwrap');
    if (W <= w.clientWidth && W <= w.clientHeight) return;
    const cur = this.current();
    if (!cur || cur.area === 'combat') return;
    const cell = W / cur.n, px = Game.x * cell, py = Game.y * cell, m = 3 * cell;
    if (px < w.scrollLeft + m || px > w.scrollLeft + w.clientWidth - m) w.scrollLeft = px - w.clientWidth / 2;
    if (py < w.scrollTop + m || py > w.scrollTop + w.clientHeight - m) w.scrollTop = py - w.clientHeight / 2;
  },
  // the cell under the mouse, mapped as the original maps it (the large maps round)
  cellAt(ev) {
    const cur = this.current();
    if (!cur) return null;
    const r = this.canvas.getBoundingClientRect(), W = this.canvas.width;
    const px = Math.trunc(ev.clientX - r.left), py = Math.trunc(ev.clientY - r.top);
    if (px < 0 || py < 0 || px >= W || py >= W) return null;
    // the original's 46DD8C, an axis at a time: large maps round the position over a
    // 256th of the window; small maps divide by W div 32, combat by W div 11; in a
    // dungeon -1 outside its square, else the position in it divided by an eighth
    const axis = (p, o) => {
      if (cur.n === 256) return round(p / (W / 256));
      if (cur.n === 32) return Math.trunc(p / (W >> 5));
      if (cur.n === 8) {
        const [ox, , cs] = this.dungeonBox || [0, 0, 16], end = ox + cs * 8;
        return p < ox || p > end ? -1 : Math.trunc((p - ox) / ((end - ox) >> 3));
      }
      return Math.trunc(p / Math.trunc(W / 11));
    };
    return { x: axis(px), y: axis(py), px, py, cur };
  },
};

/* -------------------------------------------------------- title bar */

function updateTitle() {
  if (!Game.save) return;
  const a = Game.area(), m = Render.mouse;
  let t;
  if (a === 'world') t = `World - ${pad3(Game.x)},${pad3(Game.y)}`;
  else if (a === 'under') t = `Underworld - ${pad3(Game.x)},${pad3(Game.y)}`;
  else if (a === 'combat') { const cb = Game.combat(); t = !cb.over && cb.hostiles > 0 ? 'Combat' : 'Ultimapper 5'; }
  else if (a === 'dungeon') t = `Dungeon ${LOC_NAMES[Game.loc]} - Level ${Game.z + 1} - ${pad3(Game.x)},${pad3(Game.y)}`;
  else t = `${LOC_NAMES[Game.loc] || 'Location ' + Game.loc} - ${Game.save[0x2EF] === 0xFF ? 'Basement' : 'Level ' + (Game.z + 1)} - ${pad3(Game.x)},${pad3(Game.y)}`;
  if (m[0] >= 0 && m[1] >= 0 && a !== 'combat') t += ` - ${pad3(m[0])},${pad3(m[1])}`;
  $('#title').textContent = t;
  document.title = t + ' - Ultimapper 5';
}

/* ------------------------------------------------------- main loop */

let lastLoc = [0, 0], lastPeer = null, readFails = 0;

async function loop() {
  Settings.load();
  await Files.loadCached().catch(() => {});
  const dataUrl = new URLSearchParams(location.search).get('data');
  if (dataUrl) await Files.importUrl(dataUrl).catch(e => console.warn(e));
  try {
    Game.info = await Api.info();
  } catch {
    $('#conn').textContent = 'no API';
    $('#conn').className = 'chip bad';
    $('#msg').innerHTML = '<h2>DOSBox Staging\'s API is not reachable</h2><p>Open this page through DOSBox Staging\'s ' +
      'webserver, e.g. <b>http://localhost:8086/ultimapper5.html</b>, with <code>webserver_enabled = on</code> ' +
      'in its config.</p>';
    return;
  }
  for (;;) {
    try {
      if (Game.base === null) {
        setConn('searching', 'warn');
        $('#msg').innerHTML = Game.save ? '' : '<h2>Waiting for Ultima V</h2><p>Start the game and choose ' +
          '<i>Journey Onward</i>. Ultimapper finds it by itself.</p>';
        Game.base = await Game.find();
        if (Game.base === null) { await sleep(2000); continue; }
        // the original's two lines (Delphi's %x), its addresses DOSBox's memory as the API
        // gives the originals (from 1000000)
        log(`DATA.OVL at $${(0x1000000 + Game.base).toString(16).toUpperCase()}`);
        log(`SAVED.GAM at $${(0x1000000 + Game.base + SAVE).toString(16).toUpperCase()}`);
        lastLoc = [0, 0]; lastPeer = null; readFails = 0; Game.lastChunk = [0, 0];
        // as the original when it finds the game: the saved game's name and date, the
        // explored maps from what was kept
        const save = await Files.readSaveName();
        SaveWatch.stamp = save ? Array.from(save).join(',') : null;
        await Files.importExplored();
        Explored.reload();
      }
      let d;
      try {
        d = await Game.poll();
      } catch (e) {   // like the original: say so, give the game up after 20 failures in a row
        log('Error while reading memory!');
        if (++readFails >= 20) { Game.base = null; readFails = 0; }
        throw e;
      }
      readFails = 0;
      if (d.save[0x2B5] < 1 || d.save[0x2B5] > 6) { Game.base = null; continue; }
      Object.assign(Game, d);
      Game.tick++;
      Game.lastOk = Date.now();
      setConn(`DOSBox ${Game.info.version.split(' ')[0]}`, 'ok');
      onUpdate();
      Lists.tick();   // the original's position timer: whatever the game shows
    } catch (e) {
      setConn('DOSBox not answering', 'bad');
      await sleep(1500);
    }
    await sleep(100);
  }
}

function setConn(text, cls) { const c = $('#conn'); c.textContent = text; c.className = 'chip ' + cls; }

/* One tick, as the original's read timer: the states that show a message instead of the
 * map (character generation, not in the game, dead), then exploration, the gem / peer
 * check, auto level-up, quickfight and the drawing. */
function onUpdate() {
  const s = Game.save, loc = Game.loc;
  // (the chunk origin is the one seen last tick, like the original's: none yet right after finding the game)
  if (s[0x6B4] === 0 && s[0x6B6] === 0 && loc === 13 && Game.x === 15 && Game.y === 15 && s[0x2EF] === 0 && !Game.lastChunk[0] && !Game.lastChunk[1]) {
    Game.chargen = true;
    Render.message(CHARGEN_TEXT); Hud.draw(); return;
  }
  // after the character creation the original reads SAVED.GAM's name again and skips a tick
  if (Game.chargen) { Game.chargen = false; Files.readSaveName(); return; }
  // the HUD shows only while the game is "active": since the names last matched
  if (loc === 0x40 || loc === 0x42 || (Files.saveName !== null && Game.recordName(2, 10) !== Files.saveName)) {
    Game.active = false; Hud.draw();
    Render.message(NOT_PLAYING_TEXT); return;
  }
  Game.active = true;
  if (loc > 40 && loc !== 0xFF) return;
  if (loc !== 0xFF) { Quickfight.stop(true); Game.charmedSlots.clear(); }
  Game.lastChunk = [s[0x2F5], s[0x2F6]];
  // the original's: the location and z against the last ones (0, 0 when the game is found)
  if (loc !== lastLoc[0] || s[0x2EF] !== lastLoc[1]) {
    log(''); log(`Location changed to ${loc} (z = ${s[0x2EF]}).`);
    lastLoc = [loc, s[0x2EF]];
  }
  const dead = Game.partyDead() || ((loc === 17 || loc === 0xFF) && s[0x6B4 + 8] === 0x74 && s[0x6B4 + 10] === 5 && s[0x6B4 + 11] === 2);
  if (dead) {
    if (!Game.wasDead) { log(''); log('You have died!'); }
    Game.wasDead = true;
    Quickfight.stop(true);
    Render.message('You have died!'); Hud.draw();
    $('#title').textContent = document.title = 'Ultimapper 5';
    return;
  }
  Game.wasDead = false;
  if (loc === 0xFF) Game.hostiles = Game.combat().hostiles;
  const peer = [s[0x207], s[0x271], s[0x27E]];   // gems, In Quas Wis mixed, In Quas Wis scrolls
  if (lastPeer && Settings.v.peerExplore && peer.some((v, i) => v < lastPeer[i])) Explored.peer();
  lastPeer = peer;
  markVisible();
  if (Settings.v.autoLevelUp && loc !== 0xFF) AutoLevel.check();
  Quickfight.tick();
  Hud.draw();
  updateTitle();
  Render.draw();
}

/* ---------------------------------------------------------- events */

const cv = Render.canvas;
// The mouse's cell, as the original keeps it: -1, -1 until the mouse moves over the map,
// kept when it leaves, and back to -1, -1 three seconds after it last moved (the yellow
// frame and the title's second coordinates go with it)
cv.addEventListener('mousemove', ev => {
  // the browser repeats a move where the mouse stands when the page's layout changes;
  // only real moves count, as for the original
  if (ev.clientX === Render.lastClient[0] && ev.clientY === Render.lastClient[1]) return;
  Render.lastClient = [ev.clientX, ev.clientY];
  const c = Render.cellAt(ev);
  if (!c) return;
  Render.lastMove = Date.now();
  const moved = c.x !== Render.mouse[0] || c.y !== Render.mouse[1];
  Render.mouse = [c.x, c.y]; Render.mousePx = [c.px, c.py];
  showTip(ev, c);
  updateTitle();
  // the original repaints when the cell changes, where the mouse shows: small maps and
  // combat (the yellow cell), and the large maps while the zoom view follows it
  const a = Game.save ? Game.area() : '';
  if (moved && (a === 'small' || a === 'combat' || (Render.lens && (a === 'world' || a === 'under')))) Render.draw();
});
cv.addEventListener('mouseleave', () => { $('#tip').style.display = 'none'; });
setInterval(() => {
  if (Date.now() - Render.lastMove < 3000 || (Render.mouse[0] === -1 && Render.mouse[1] === -1)) return;
  Render.mouse = [-1, -1]; Render.mousePx = [-1, -1];
  updateTitle(); Render.draw();
}, 200);
cv.addEventListener('mousedown', ev => {
  if (!Game.save) return;
  if (ev.button === 0 && Quickfight.on) { Quickfight.stop(); return; }
  const c = Render.cellAt(ev);
  if (!c) return;
  if (ev.ctrlKey && ev.button === 0) { if (Settings.v.debug) teleport(c); return; }
  if (ev.button === 0 && Game.loc === 0) { Render.lens = !Render.lens; Render.draw(); }
});
cv.addEventListener('contextmenu', ev => { ev.preventDefault(); Menu.show(ev.clientX, ev.clientY); });
$('#menuBtn').onclick = ev => { const r = ev.target.getBoundingClientRect(); Menu.show(r.right - 240, r.bottom); };
window.addEventListener('resize', () => { Hud.last = ''; Hud.draw(); Render.draw(); });

function showTip(ev, c) {
  const tip = $('#tip');
  if (!c || !Game.save || c.x < 0 || c.y < 0 || c.x >= c.cur.n || c.y >= c.cur.n) { tip.style.display = 'none'; return; }
  const lines = [`${pad3(c.x)},${pad3(c.y)}`];
  if (c.cur.tiles) lines[0] += `  tile ${hex(c.cur.tiles[c.y * c.cur.n + c.x], 2)}`;
  if (c.cur.cells) lines[0] += `  cell ${hex(c.cur.cells[c.y * 8 + c.x], 2)}`;
  if (c.cur.area === 'combat') {
    for (const u of c.cur.combat.units) if (u && u.x === c.x && u.y === c.y && u.hp > 0 && (!u.hidden || Settings.v.debug))
      lines.push(`${u.name || 'unit ' + u.i}  HP ${u.hp}${u.asleep ? ', asleep' : ''}${u.charmed ? ', charmed' : ''}`);
    tip.textContent = lines.join('\n');
    tip.style.display = 'block';
    tip.style.left = ev.clientX + 14 + 'px';
    tip.style.top = ev.clientY + 14 + 'px';
    return;
  }
  for (let i = 1; i < 32; i++) {
    const u = Game.unit(i);
    if (u.tile && u.x === c.x && u.y === c.y && (c.cur.area !== 'small' || u.z === Game.save[0x2EF])) {
      const name = c.cur.area === 'small' ? Game.unitName(i) : '';
      lines.push(`${name || 'unit ' + i} (sprite ${hex(0x100 + u.tile, 3)})`);
    }
  }
  if (c.cur.n === 256) for (let loc = 1; loc <= 40; loc++) {
    const xy = U5.locXY(loc);
    if (xy && xy[0] === c.x && xy[1] === c.y && (c.cur.area === 'under') === (loc >= 33)) lines.push(LOC_NAMES[loc]);
  }
  tip.textContent = lines.join('\n');
  tip.style.display = 'block';
  tip.style.left = ev.clientX + 14 + 'px';
  tip.style.top = ev.clientY + 14 + 'px';
}

document.addEventListener('keydown', ev => {
  if (ev.target.closest('input, select, textarea')) return;
  if (Quickfight.on && !ev.ctrlKey) { Quickfight.stop(); ev.preventDefault(); return; }
  const k = ev.key.toLowerCase();
  const act = ev.ctrlKey ? { d: toggleDebug, e: () => Editor.open(), t: forwardTime, x: exitCombat, l: () => LogWin.open(),
    s: backupSaves, q: quit }[k]
    : { s: () => Lists.open('spells'), i: () => Lists.open('inventory'), q: () => Quickfight.toggle(),
      pageup: () => sizeBy(16), pagedown: () => sizeBy(-16), escape: () => { Menu.hide(); Dlg.closeTop(); } }[k];
  if (act) { ev.preventDefault(); act(); }
});

// the map window's size, like the original's: 512 to 1600 pixels, in steps of 16
function setSize(n) { Settings.v.size = n; Settings.save(); Hud.last = ''; Render.draw(); }
function sizeBy(d) {
  const n = Render.size() + d;
  if (n < 512 || n > 1600) return;
  setSize(n);
}
