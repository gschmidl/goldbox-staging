<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold Box Companion</title>
<style>
:root {
  --bg: #000; --text: #dcdcdc; --dim: #6c6c6c; --menu: #1c1c1c; --sel: #2c4a78; --line: #2c2c2c;
  --green: #0a7a0a; --red: #7c0606; --good: #3cd43c; --bad: #ff4848;
  --rock: #a28440; --floor: #ececec; --grid: #d6d6d6; --wall: #5c4a38;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 13px/1.35 Tahoma, Verdana, "Segoe UI", system-ui, sans-serif; }
#app { display: flex; flex-direction: column; height: 100vh; }
#bar { display: flex; align-items: center; gap: 8px; padding: 3px 8px; background: #161616;
  border-bottom: 1px solid var(--line); white-space: nowrap; min-height: 28px; }
#title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.chip { padding: 0 8px; border-radius: 9px; background: #333; font-size: 12px; }
.chip.ok { background: #0b4d0b; } .chip.bad { background: #6a1010; } .chip.warn { background: #6a5410; }
#nodata { cursor: pointer; }
button, select, input, textarea { background: #222; color: var(--text); border: 1px solid #484848; border-radius: 3px;
  padding: 2px 8px; font: inherit; }
button { cursor: pointer; } button:hover { background: #333; }
input[type=number] { width: 70px; }
#hud { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(110px, 1fr); padding: 4px 0 6px;
  border-bottom: 1px solid #333; overflow-x: auto; font-family: Verdana, sans-serif; }
#hud.hidden { display: none; }
.pc { padding: 0 8px; border-right: 1px solid #666; min-width: 0; display: flex; flex-direction: column; }
.pc .fx { font-family: "Arial Narrow", Arial, sans-serif; line-height: 15px; min-height: 15px; flex: 1; overflow: hidden; }
.pc .fx div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc .fx .g { color: #22ff22; } .pc .fx .b { color: #ff2222; } .pc .fx .n { color: #aaa; }
.pc .icon { width: 48px; height: 48px; margin: 6px auto 4px; border: 1px solid #999; background: #555;
  image-rendering: pixelated; display: block; cursor: pointer; }
.pc .icon.flash { border-color: #550000; } .pc .icon.none { border-color: #222; }
.pc .nm { text-align: center; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: #aaa; cursor: pointer; }
.pc .nm.dis { color: #ff2222; }
.pc .xp { height: 4px; background: #000; margin: 4px 0; } .pc .xp i { display: block; height: 100%; background: #666; }
.pc .hp { position: relative; height: 22px; background: #000; text-align: center; }
.pc .hp i { position: absolute; left: 0; top: 0; bottom: 0; background: #007700; }
.pc .hp span { position: relative; line-height: 22px; color: #eee; }
#hudmenu { position: fixed; z-index: 35; background: #000; display: flex; flex-direction: column; justify-content: flex-end;
  gap: 7px; padding: 8px 8px 10px; box-sizing: border-box; }
#hudmenu .row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 7px; }
#hudmenu button { background: #000; border: 1px solid #888; border-radius: 0; color: #ccc; font: 10px Verdana, sans-serif; padding: 3px 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hudmenu button:hover:not(:disabled) { color: #fff; border-color: #bbb; }
#hudmenu button:disabled { color: #555; border-color: #444; cursor: default; }
#mapwrap { position: relative; flex: 1; overflow: auto; background: #b2944e; }
#map { display: block; margin: 0 auto; }
#tip { position: fixed; pointer-events: none; background: #fffbe8; color: #222; border: 1px solid #776;
  padding: 3px 7px; font-size: 12px; display: none; z-index: 30; max-width: 460px; white-space: pre-wrap; }
#msg { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); max-width: 600px;
  text-align: center; color: #2b2010; }
#msg h2 { font-weight: normal; }
.menu { position: fixed; background: var(--menu); border: 1px solid #555; min-width: 230px; padding: 3px 0;
  z-index: 50; box-shadow: 3px 3px 10px #000c; user-select: none; }
.menu .mi { padding: 3px 22px 3px 24px; position: relative; display: flex; justify-content: space-between;
  gap: 24px; cursor: default; white-space: nowrap; }
.menu .mi:hover, .menu .mi.open { background: var(--sel); }
.menu .mi.dis { color: var(--dim); }
.menu .mi.chk::before { content: "\2713"; position: absolute; left: 7px; }
.menu .mi.sub::after { content: "\25B8"; position: absolute; right: 8px; }
.menu .mi .k { color: #999; }
.menu .sep { height: 1px; background: #444; margin: 3px 0; }
.dlg { position: fixed; z-index: 40; background: #121212; border: 1px solid #555; box-shadow: 4px 4px 14px #000c;
  display: flex; flex-direction: column; max-height: 92vh; }
.dlg header { display: flex; align-items: center; gap: 8px; padding: 4px 8px; background: #1f1f1f; cursor: move;
  user-select: none; border-bottom: 1px solid #333; }
.dlg header .t { flex: 1; }
.dlg .body { padding: 8px 10px; overflow: auto; }
.list { border-collapse: collapse; width: 100%; font-size: 12px; }
.list td, .list th { padding: 1px 6px; text-align: left; white-space: nowrap; }
.list th { color: #aaa; font-weight: normal; border-bottom: 1px solid #333; position: sticky; top: 0; background: #121212; }
.list tr:hover td { background: #1d2a3d; }
#log { font: 12px/1.3 Consolas, monospace; white-space: pre-wrap; }
.ed { display: grid; grid-template-columns: 150px 1fr; gap: 12px; }
.ed .chars button { display: block; width: 100%; text-align: left; margin-bottom: 3px; }
.ed .chars button.sel { background: var(--sel); }
.cols { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: auto auto; gap: 3px 8px; align-items: center; margin-top: 6px; }
.fields td { padding: 1px 4px; } .fields input, .fields select { padding: 0 4px; }
input.changed, select.changed { border-color: #c8a020; }
fieldset { border: 1px solid #444; } legend { color: #bbb; }
.muted { color: #999; }
.hidden { display: none !important; }
</style>
</head>

<div id="app">
  <div id="bar">
    <span id="title">Gold Box Companion</span>
    <span id="dbg" class="chip warn hidden">Debug</span>
    <span id="game" class="chip hidden"></span>

    <button id="menuBtn" title="Menu">&#9776;</button>

  <div id="hud"></div>
  <div id="mapwrap">
    <canvas id="map" width="512" height="512"></canvas>
    <div id="msg"></div>

</div>
<div id="tip"></div>
<input id="folderInput" type="file" webkitdirectory multiple class="hidden">

'use strict';
/* Gold Box Companion for DOSBox Staging - a rewrite of Joonas Hirvonen's
 * Gold Box Companion 2.65 as a web page. It reads and writes the game's memory
 * through DOSBox Staging's HTTP API (/api/v1/memory), which also serves this
 * page.
 *
 * Per game (from GBC's Game.dat): two byte patterns in the program find its
 * base; at fixed distances from the base lie far pointers to the first
 * character and to the current map, the map's GEO/area numbers, the party's
 * position and the party size. Characters form a list (a far pointer to the
 * next one in each record); each has a list of 9-byte effects. The current
 * map is 4 x 256 bytes: N/E walls, S/W walls (a nibble each), events, doors
 * (2 bits per side). */

const $ = (s, r = document) => r.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  for (const k of kids) e.append(k);
  return e;
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hex = (n, w = 4) => n.toString(16).toUpperCase().padStart(w, '0');
const pad2 = n => String(n).padStart(2, '0');

/* ---------------------------------------------------------------- API */

const Api = {
  async read(addr, len) {
    const r = await fetch(`/api/v1/memory/${addr}/${len}`,
      { headers: { Accept: 'application/octet-stream' }, cache: 'no-store' });
    if (!r.ok) throw new Error(`read ${hex(addr, 6)}: HTTP ${r.status}`);
    return new Uint8Array(await r.arrayBuffer());
  },
  async write(addr, bytes) {
    const r = await fetch(`/api/v1/memory/${addr}`, { method: 'PUT',
      headers: { 'Content-Type': 'application/octet-stream' }, body: bytes });
    if (!r.ok) throw new Error(`write ${hex(addr, 6)}: HTTP ${r.status}`);
  },
  async info() {
    const r = await fetch('/api/v1/dosbox/info', { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  },
};
const far = (b, o = 0) => ((b[o + 2] | b[o + 3] << 8) << 4) + (b[o] | b[o + 1] << 8);

/* ------------------------------------------------- browser storage */

const DB = {
  db: null,
  open() {
    return this.db ??= new Promise((res, rej) => {
      const q = indexedDB.open('gbc', 1);
      q.onupgradeneeded = () => { q.result.createObjectStore('files'); q.result.createObjectStore('kv'); };
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  },
  async op(store, mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const q = fn(db.transaction(store, mode).objectStore(store));
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  },
  get: (s, k) => DB.op(s, 'readonly', o => o.get(k)),
  put: (s, k, v) => DB.op(s, 'readwrite', o => o.put(v, k)),
  del: (s, k) => DB.op(s, 'readwrite', o => o.delete(k)),
  keys: s => DB.op(s, 'readonly', o => o.getAllKeys()),
};

const Settings = {
  v: { icons: true, xpMeter: true, effects: true, mapMarks: 'notes', debug: false, zoom: 0, hud: true,
       autoId: false, fixDrain: false, fixStats: false, autoAmmo: false, ammoAmount: 50, ammoMaxPlus: {}, cheat: false, fruaDesign: '' },
  load() { try { Object.assign(this.v, JSON.parse(localStorage.getItem('gbc.settings') || '{}')); } catch {} },
  save() { try { localStorage.setItem('gbc.settings', JSON.stringify(this.v)); } catch {} },
};

}
async function restoreRaces() {

// FIX DRAIN (GBC's): a member with drained levels gets the fields of its
// last undrained record back (kept per party slot while the page is open, so
// in Pool of Radiance only within the session the levels were lost in): hit
// points, THAC0, saves, level highest, experience, levels and spell slots
// (those not when zero), each through the pending rules; then the drained
// counts are cleared and the stats fixed. Without such a record the games
// that keep the highest levels (Pools of Darkness, the later Krynn games,
// the Savage Frontier games, FRUA) give them back from there, with the
// highest experience and hit points, and clear those
const Snap = {};
const FIX_DRAIN = [49, 124, 125, 55, 56, 57, 58, 59, 86, 63, ...range(68, 76), ...range(174, 192)].map(fname);
const SKIP_ZERO = range(174, 191).map(fname);
async function fixDrain() {
  const f = Game.f;
  let fixed = 0;
  for (const [i, p] of Game.party.entries()) {
    if (!(p.drained > 0)) continue;
    const w = new Pending(p), snap = Snap[i];
    if (snap && snap.name === Game.name(p) && snap.r.length === p.r.length) {
      for (const name of FIX_DRAIN) {
        if (!f[name]) continue;
        const v = fieldOf(snap.r, name);
        if (v === 0 && SKIP_ZERO.includes(name)) continue;
        if (w.ok(name, v)) w.set(name, v);
      }
      w.set('drained_levels', 0); w.set('drained_hps', 0);
    } else if (f.highest_level_cleric) {
      let top = Game.field(p, 'level_highest_1') || 0;
      for (const { cls } of p.xpi?.classes || []) {
        const hl = 'highest_level_' + cls, lv = 'level_' + cls;
        if (!f[hl] || !f[lv]) continue;
        const v = Game.field(p, hl);
        if (v > 0 && w.ok(lv, v)) { w.set(lv, v); top = Math.max(top, v); }
      }
      w.set('level_highest_1', top);
      if (Game.field(p, 'highest_experience') > Game.field(p, 'experience')) w.set('experience', Game.field(p, 'highest_experience'));
      if (Game.field(p, 'highest_hps') > Game.field(p, 'hit_points_maximum')) w.set('hit_points_maximum', Game.field(p, 'highest_hps'));
      for (let id = 89; id <= 97; id++) w.set(fname(id), 0);
      w.set('highest_experience', 0); w.set('highest_hps', 0);
    } else continue;
    await w.flush();
    fixed++;
    log(`${Game.name(p)}: drained levels fixed`);
  }
  if (fixed) for (const p of Game.party) await Leveler.fixStats(p);
}
/* ------------------------------------------------------------ music
 * GBC_Audio: GBC's Music folder (picked): Music\NN. <game>.txt points the
 * world map, combat, victory and each area (by area number) to subfolders;
 * a random file from the folder plays, the next one when it ends. Browsers
 * play MP3, OGG and WAV (not the tracker formats GBC_Audio also took). Esc
 * or right click on the HUD stops it, F1/F2 change the volume. */

const Music = {
  dirs: null, configs: {}, audio: new Audio(), want: '', stopped: false, victory: false,
  pick() {
    const inp = el('input', { type: 'file', webkitdirectory: true, multiple: true });
    inp.onchange = async () => {
      const dirs = {};
      for (const f of inp.files) {
        const parts = f.webkitRelativePath.split('/'), i = parts.findIndex(p => p.toLowerCase() === 'music');
        const rest = (i >= 0 ? parts.slice(i + 1) : parts.slice(1));
        if (rest.length === 1 && /^\d\d\. .*\.txt$/i.test(rest[0])) this.configs[+rest[0].slice(0, 2) - 1] = parseMusic(await f.text());
        else if (rest.length >= 2 && /\.(mp3|ogg|wav|m4a|flac)$/i.test(f.name)) (dirs[rest.slice(0, -1).join('/').toLowerCase()] ??= []).push(f);
      }
      this.dirs = dirs; this.stopped = false; this.want = '';
      log(`Music: ${Object.values(dirs).reduce((n, l) => n + l.length, 0)} files in ${Object.keys(dirs).length} folders`);
      this.update();
    };
    inp.click();
  },
  folder() {
    const c = this.configs[Game.g] || {}, sub = (c.subfolder || '').replace(/\\/g, '/').replace(/\/?$/, '/').replace(/^\/$/, '');
    if (this.victory) return sub + (c.victory || 'Victory');
    if (Game.inCombat) return sub + (c.combat || 'Combat');
    if (Game.world) return sub + (c.world || 'World');
    return sub + (c.areas?.[Game.area] || 'Town');
  },
  update() {
    if (!this.dirs || this.stopped || Game.g < 0) return;
    const want = this.folder().replace(/[\\/]+$/, '').toLowerCase();
    if (want === this.want && !this.audio.paused) return;
    this.want = want;
    const list = this.dirs[want];
    if (!list?.length) { this.audio.pause(); return; }
    const f = list[Math.random() * list.length | 0];
    if (this.audio.src) URL.revokeObjectURL(this.audio.src);
    this.audio.src = URL.createObjectURL(f);
    this.audio.onended = () => { if (this.victory) this.victory = false; this.want = ''; this.update(); };
    this.audio.play().catch(() => {});
  },
  stop() { this.stopped = true; this.audio.pause(); log('Music stopped'); },
  volume(d) { this.audio.volume = Math.max(0, Math.min(1, this.audio.volume + d)); },
};
function parseMusic(text) {
  const tag = name => text.match(new RegExp(`<${name}>\\s*([^<]*?)\\s*</${name}>`, 'i'))?.[1] || '';
  const areas = {};
  for (const m of text.matchAll(/<area_(\d+)_folder>\s*([^<]*?)\s*<\/area_\d+_folder>/gi)) areas[+m[1]] = m[2];
  return { subfolder: tag('subfolder'), world: tag('world_folder'), combat: tag('combat_folder'), victory: tag('victory_folder'), areas };
}

// GBC's view of a character's experience: per class the level, the table
// name (the class with the Krynn cleric's god, knight's order or mage's
// robe: "cleric_mishakal"), the Experience.dat table, the game's maximum
// level from Levels.txt and the experience the next level needs; over the
// classes the most experience a current level needed and the least a next
// one needs (the XP meter runs between them) and whether somebody can
// train; a dual-classed character's former class
function xpInfo(p) {
  const f = Game.f, V = VALUES[Game.g + 1] || {}, L = Leveler.levels(), exp = Data.exp || [];
  const text = (key, list) => { const s = f[key] && list ? list[Game.field(p, key)] || '' : ''; return s === '-' ? '' : s; };
  const god = text('god', V.god), knight = text('knight', V.knight), robe = text('robe', V.robe);
  const suffixOf = c => c === 'cleric' ? god : c === 'mage' ? robe : c === 'knight' ? knight : '';
  const info = { classes: [], maxCur: 0, minNext: 0, able: false, xp: Game.field(p, 'experience') || 0, former: null };
  for (const c of ((V.cls || [])[Game.field(p, 'class')] || '').split('/').map(s => s.trim()).filter(Boolean).slice(0, 3)) {
    let level = f['level_' + c] ? Game.field(p, 'level_' + c) : -1;
    if (level < 0) level = f.level_highest_1 ? Game.field(p, 'level_highest_1') : -1;
    if (level < 0) break;
    const suffix = suffixOf(c), tableName = suffix ? `${c}_${suffix}` : c;
    const maxLevel = L?.max?.[tableName] || 0, atMax = maxLevel > 0 && level === maxLevel;
    const table = exp.find(t => t.cls === c && t.god === (c === 'cleric' ? god : '') && t.knight === (c === 'knight' ? knight : '') &&
      t.robe === (c === 'mage' ? robe : ''));
    let next = 0;
    if (table) {
      if (level < 40) {
        next = table.xp[level + 1];
        if (Game.g === 2 && c === 'paladin' && level + 1 === 15) next = 2459233;   // GBC's number for Secret of the Silver Blades
        if (!atMax && !(info.minNext && next >= info.minNext)) info.minNext = next;
      }
      if (level >= 1 && level <= 40 && !(info.maxCur && table.xp[level] <= info.maxCur)) info.maxCur = table.xp[level];
      if (!atMax && next <= info.xp) info.able = true;
    }
    info.classes.push({ cls: c, level, tableName, table, maxLevel, atMax, next });
  }
  if (f.level_highest_2 && Game.field(p, 'level_highest_2') > 0) for (const c of CLASSES) {
    const lv = f['former_level_' + c] ? Game.field(p, 'former_level_' + c) : 0;
    if (lv > 0) { const s = suffixOf(c); info.former = { cls: c, level: lv, tableName: s ? `${c}_${s}` : c }; break; }
  }
  return info;
}

/* -------------------------------------------------------- combat icons
 * Composed like GBC does from its per-game sheets (Games\NN. ..\): Head.bmp
 * over Body.bmp, 24x24 cells, row = icon size - 1, column = the head or body
 * number, recoloured with the character's six icon colour bytes the way the
 * games do it (the sheets' EGA colours 1 2 3 4 6 7 take the low nibbles of
 * body, arm, leg, hair, shield, weapon, colours 9 10 11 12 14 15 the high
 * ones); Icon.bmp by icon number in the games without heads and bodies;
 * <NAME>_1.bmp for NPCs; Death_1.bmp for the dead. Initials without the GBC
 * folder. */

const EGA = [[0, 0, 0], [0, 0, 170], [0, 170, 0], [0, 170, 170], [170, 0, 0], [170, 0, 170], [170, 85, 0], [170, 170, 170],
  [85, 85, 85], [85, 85, 255], [85, 255, 85], [85, 255, 255], [255, 85, 85], [255, 85, 255], [255, 255, 85], [255, 255, 255]];
const ICON_PARTS = ['icBody', 'icArm', 'icLeg', 'icHair', 'icShield', 'icWeapon'], ICON_BASE = [1, 2, 3, 4, 6, 7];
const isDead = p => Game.field(p, 'status') === (Game.g >= 10 ? 3 : 6);   // the Buck Rogers games number them differently

const Icons = {
  sheets: {},   // `${game}:${file}` -> ImageData, null when missing
  async sheet(name) {
    const k = `${Game.g}:${name.toLowerCase()}`;
    if (k in this.sheets) return this.sheets[k];
    const buf = await Data.file(Game.g, name);
    let img = null;
    if (buf) try {
      const bmp = await createImageBitmap(new Blob([buf]));
      const c = el('canvas', { width: bmp.width, height: bmp.height }), g = c.getContext('2d', { willReadFrequently: true });
      g.drawImage(bmp, 0, 0);
      img = g.getImageData(0, 0, bmp.width, bmp.height);
    } catch {}
    return this.sheets[k] = img;
  },
  // the 24x24 cell (col, row) of a sheet as RGBA bytes
  async cell(name, col, row) {
    const s = await this.sheet(name);
    if (!s || (col + 1) * 24 > s.width || (row + 1) * 24 > s.height) return null;
    const out = new Uint8ClampedArray(24 * 24 * 4);
    for (let y = 0; y < 24; y++) out.set(s.data.subarray(((row * 24 + y) * s.width + col * 24) * 4, ((row * 24 + y) * s.width + col * 24 + 24) * 4), y * 96);
    return out;
  },
  async picture(p) {
    if (isDead(p)) { const d = await this.cell('Death_1.bmp', 0, 0); if (d) return d; }
    const own = await this.cell(Game.name(p) + '_1.bmp', 0, 0);
    if (own) return own;
    if (Game.f.iconHead) {
      const row = Math.max(0, Math.min(1, (Game.field(p, 'iconSize') || 1) - 1));
      const body = await this.cell('Body.bmp', Game.field(p, 'iconBody'), row);
      const head = await this.cell('Head.bmp', Game.field(p, 'iconHead'), row);
      if (!body) return null;
      if (head) for (let i = 0; i < body.length; i += 4)   // the head over the body; 55 55 55 is the background
        if (head[i] !== 85 || head[i + 1] !== 85 || head[i + 2] !== 85) body.set(head.subarray(i, i + 4), i);
      const map = EGA.map((_, i) => i);
      ICON_PARTS.forEach((k, i) => { const v = Game.field(p, k) || 0; map[ICON_BASE[i]] = v & 15; map[ICON_BASE[i] + 8] = v >> 4; });
      for (let i = 0; i < body.length; i += 4) {
        const c = EGA.findIndex(e => e[0] === body[i] && e[1] === body[i + 1] && e[2] === body[i + 2]);
        if (c >= 0 && map[c] !== c) body.set(EGA[map[c]], i);
      }
      return body;
    }
    if (Game.f.icon) return this.cell('Icon.bmp', Game.field(p, 'icon'), 0);
    return null;
  },
  canvas(p) {
    const c = el('canvas', { className: 'icon', width: 48, height: 48 }), g = c.getContext('2d');
    const initials = () => {
      g.fillStyle = '#555'; g.fillRect(0, 0, 48, 48);
      g.fillStyle = '#cfcfcf'; g.font = 'bold 18px Tahoma'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(Game.name(p).slice(0, 2), 24, 25);
    };
    initials();
    this.picture(p).then(px => {
      if (!px) { c.classList.add('none'); return; }
      const t = el('canvas', { width: 24, height: 24 });
      t.getContext('2d').putImageData(new ImageData(px, 24, 24), 0, 0);
      g.imageSmoothingEnabled = false; g.drawImage(t, 0, 0, 48, 48);
    }).catch(() => {});
    return c;
  },
};

const Store = {
  explored: {}, notes: {}, dirty: new Set(), gen: 0,

  flush() {

/* --------------------------------------------- Unlimited Adventures
 * FRUA's maps are the design's geoNNN.dat files (NNN = the game's GEO 2 byte):
 * at 1A/1B the height and width (up to 24 x 24), at 8E the map's name (16
 * characters), at 142 the cells, 6 bytes each (north, east, south, west wall
 * bytes, event number, one more), at ECA 2000 bytes of encounter data. Like
 * GBC, the page finds both blocks in the game's memory when the map changes
 * and reads the walls from there. The design folder is the one named in
 * START.DAT (the shell's last choice) unless the settings name another. */
const Frua = {
  design: '', cache: {}, geo: -1, wallAddr: 0, eventAddr: 0, data: null, rec: null, retryAt: 0,
  reset() { Object.assign(this, { design: '', cache: {}, geo: -1, wallAddr: 0, eventAddr: 0, data: null, rec: null, retryAt: 0 }); },
  async designFolder() {
    if (this.design) return this.design;
    if (Settings.v.fruaDesign) return this.design = Settings.v.fruaDesign;
    const f = await Files.get('START.DAT');
    if (f) {
      let n = '';
      for (const b of f.data) { if (!b) break; n += String.fromCharCode(b); }
      if (/\.dsn$/i.test(n)) return this.design = n;
    }
    return '';
  },
  // the design's geo file of a GEO number: { w, h, name, walls, events }, or null
  async load(n) {
    if (n in this.cache) return this.cache[n];
    const dsn = await this.designFolder();
    if (!dsn) return this.cache[n] = null;
    const f = await Files.get(`${dsn}/GEO${String(n).padStart(3, '0')}.DAT`);
    if (!f || f.data.length < 0x169A) return this.cache[n] = null;
    const d = f.data, h = d[0x1A], w = d[0x1B];
    let name = '';
    for (let k = 0; k < 16 && d[0x8E + k]; k++) name += String.fromCharCode(d[0x8E + k]);
    return this.cache[n] = { w, h, name, walls: d.slice(0x142, 0x142 + w * h * 6), events: d.slice(0xECA, 0xECA + 2000) };
  },
  // GBC's search: the file's wall and encounter blocks somewhere in the first megabyte
  async locate(rec) {
    const mem = new Uint8Array(0x100000);
    for (let a = 0; a < mem.length; a += 0x10000) mem.set(await Api.read(a, 0x10000), a);
    const w = indexOf(mem, rec.walls), e = w < 0 ? -1 : indexOf(mem, rec.events);
    if (w < 0) log(' - ERROR: Can not find map wall data from the memory!');
    else if (e < 0) log(' - ERROR: Can not find map event data from the memory!');
    return w >= 0 && e >= 0 ? [w, e] : null;
  },
  // each tick: the map's live cells; a changed GEO loads its file and looks for it
  async poll() {
    const n = Game.area;
    if (n !== this.geo) { this.geo = n; this.rec = null; this.data = null; this.wallAddr = 0; this.retryAt = 0; }
    if (!this.rec) {
      if (Date.now() < this.retryAt) return;
      this.retryAt = Date.now() + 2000;
      const rec = await this.load(n);
      if (!rec) {
        if (!this.failed) log(await this.designFolder() ? ` - ERROR: Can not open map file "geo${String(n).padStart(3, '0')}.dat"!`
          : 'FRUA: the design folder is not known (START.DAT or the settings) - the map stays off');
        this.failed = true;
        return;
      }
      this.failed = false;
      log(` - Map changed to "${rec.name}" (GEO ${n}).`);
      const at = await this.locate(rec);
      if (!at) return;
      [this.wallAddr, this.eventAddr] = at;
      this.rec = rec;
      log(` - Map wall data found at $${hex(this.wallAddr, 6)}.`);
      log(` - Map event data found at $${hex(this.eventAddr, 6)}.`);
    }
    this.data = await Api.read(this.wallAddr, this.rec.w * this.rec.h * 6);
  },

// GBC's colours
const MAPC = { bg: '#b2944e', cell: '#aa8c46', flagged: '#a2843e', wall: '#594a2d', door: '#cccccc', party: '#00aa00',
  partyEdge: '#005500', note: '#f2843e', combatBg: '#a2843e', grid: '#8a722a' };

// GBC's drawing mode of every cell side: the area's table by wall type (8
// for any wall when the area is not in Game.dat); a mode 8 on one side puts
// 8 on the neighbour's facing side too; the area's special walls [type,
// door mask, mode] override a side whose type matches and whose door bits
// cover the mask; a mode 8 side with either of its door bits set is a door
function wallModes() {
  const M = Game.mv, W = M.w, H = M.h, rec = Game.areaRec(), modes = rec?.modes, special = rec?.special || [];
  const side = [0, 1, 2, 3].map(() => new Int8Array(W * H));
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) for (let s = 0; s < 4; s++) {
    const t = wall(x, y, s);
    // FRUA (GBC): a wall byte with a type in its low nibble is a wall when its three
    // top bits are set, a door otherwise

    if (side[0][i] === 8 && y > 0) side[2][i - W] = 8;
    if (side[1][i] === 8 && x < W - 1) side[3][i + 1] = 8;
    if (side[2][i] === 8 && y < H - 1) side[0][i + W] = 8;
    if (side[3][i] === 8 && x > 0) side[1][i - 1] = 8;

  if (M.frua) return side;

      if (a >= 21 && a <= 24) { sl = (a - 21) * s + 10; st = 10; } else { sl = (a - 25) * s + 10 + R(s * 1.25); st = s + 10; }

      const F = { 51: [0, 0, 0.25, 0.27], 52: [0.25, 0, 0.25, 0.27], 53: [0.18, 0.23, 0.25, 0.27], 54: [0.42, 0.23, 0.265, 0.27],
        55: [0.265, 0.462, 0.275, 0.275], 56: [0.5, 0.462, 0.277, 0.275], 57: [0.72, 0.462, -1, 0.275] }[a];
      if (!F) return;
      sl = l = (F[0] ? R(D * F[0]) : 0) + 10; st = t = (F[1] ? R(D * F[1]) : 0) + 10;
      r = F[2] < 0 ? D + 10 : l + R(D * F[2]); b = t + R(D * F[3]);

    g.strokeStyle = '#fff'; g.lineWidth = 2; g.strokeRect(l + 1, t + 1, r - l - 2, b - t - 2);
    const cell = Math.trunc(s / 16), px = sl + Game.x * cell, py = st + Game.y * cell;
    const cx = px + (gateway ? Math.trunc(cell * 0.2) : cell), cy = py + (gateway ? Math.trunc(cell * 0.2) : cell);
    const h = Math.trunc(Math.trunc(s / 10) / 2), fc = Game.facing;

async function loop() {
  Settings.load();
  $('#dbg').classList.toggle('hidden', !Settings.v.debug);
  const q = new URLSearchParams(location.search);
  if (q.get('gbcdata')) await importGbcUrl(q.get('gbcdata')).catch(e => log(e.message));
  if (q.get('gamedata')) Files.url = q.get('gamedata').replace(/\/?$/, '/');
  await Data.load();
  try { Game.dosbox = await Api.info(); }
  catch {
    setConn('no API', 'bad');
    $('#msg').innerHTML = '<h2>DOSBox Staging\'s API is not reachable</h2><p>Open this page through DOSBox Staging\'s ' +
      'webserver, e.g. <b>http://localhost:8086/gbc.html</b>, with <code>webserver_enabled = on</code> in its config.</p>';
    return;
  }
  let lastArea = '';
  for (;;) {
    try {
      if (Game.g < 0) {
        setConn('searching', 'warn');
        $('#msg').innerHTML = '<h2>Waiting for a Gold Box game</h2><p>Start the game, load a saved game and begin ' +
          'playing. Gold Box Companion finds the game by itself.</p>';
        if (!await Game.find()) { await sleep(2000); continue; }
        $('#msg').innerHTML = '';
        $('#game').textContent = SHORT[Game.g]; $('#game').title = GAME_NAMES[Game.g]; $('#game').classList.remove('hidden');
        log(`${GAME_NAMES[Game.g]} found, base ${hex(Game.base, 6)}`);
        Game.fresh = true;
      }
      await Game.poll();
      if (!Game.party.length) { await sleep(500); }
      else if (Game.fresh) {   // GBC stores the spells after each search, and fixes stats when that is on
        Game.fresh = false; await storeSpells(true);
        if (Settings.v.fixStats) await fixAllStats();
      }
      afterCombat();
      Music.update();
      if (++Game.ticks % 8 === 0) await itemChores();
      setConn(`DOSBox ${Game.dosbox.version.split(' ')[0]}`, 'ok');
      const key = Store.key();
      if (key !== lastArea) { lastArea = key; Render.notes = await Store.notesOf(); }
      partyExplore();
      Hud.draw();
      updateTitle();
      Render.draw();
    } catch (e) {
      setConn('DOSBox not answering', 'bad');
      Game.g = -1;
      await sleep(1500);
    }
    await sleep(250);
  }
}

// what GBC's statistics window shows for the combatant under the mouse:
// its number, name and cell; hit points; the scores (strength with its
// exceptional part), saves, magic resistance; AC and THAC0 as the games
// count them (60 less the value); attacks per round with the dice; the
// flags by their names (the format's list, GBC's own when it has none,
// "?" left out); then the effects
const FLAGS1 = ['affected by dispel evil', 'mammal', 'penalty to hit dwarf', 'extra damage from ranger', 'snake', 'penalty to hit gnome',
  'animal', 'dwarf has bonus to hit'];
const FLAGS2 = ['true giant', 'may be held or charmed', 'reptile', 'immune to death magic', 'immune to poison', 'immune to decapitation',
  'immune to confusion', 'dragon'];
function combatantText(e) {
  const p = e.c, f = Game.f, V = VALUES[Game.g + 1] || {}, F = key => Game.field(p, key);
  const lines = [`${e.k}. ${Game.name(p)} (${e.x},${e.y})`, `HP ${Math.max(0, F('hit_points_current'))} / ${Math.max(0, F('hit_points_maximum'))}`, ''];
  const scores = [];
  ['str_current', 'int_current', 'wis_current', 'dex_current', 'con_current', 'cha_current', 'tch_current'].forEach((k, i) => {
    if (!f[k]) return;
    let s = String(F(k));
    if (i === 0 && f.str_exc_current) { let x = F('str_exc_current'); if (x > 0) { if (x === 100) x = 0; s += ` (${String(x).padStart(2, '0')})`; } }
    scores.push(s);
  });
  if (scores.length) lines.push(`Scores: ${scores.join(' / ')}`);
  const saves = range(1, 8).map(i => 'save_' + i).filter(k => f[k]).map(k => F(k));
  if (saves.length) lines.push(`Saves: ${saves.join(' / ')}`);
  if (f.magic_resistance) lines.push(`Magic resistance: ${F('magic_resistance')}`);
  lines.push('', `AC: ${60 - F('ac_current')}`, `THAC0: ${60 - F('thac0_current')}`, '');
  const apr = n => n % 2 ? (n / 2).toFixed(1) : String(n / 2);
  if (F('attacks') > 0) lines.push(`${apr(F('attacks'))} attacks per round (${F('current_rolls')}d${F('current_dice')}+${F('current_modifier')})`);
  if (F('attacks_2') > 0) lines.push(`${apr(F('attacks_2'))} attacks per round (${F('current_rolls_2')}d${F('current_dice_2')}+${F('current_modifier_2')})`);
  lines.push('');
  let any = false;
  for (const [k, list, defs] of [['flags_1', V.flags1, FLAGS1], ['flags_2', V.flags2, FLAGS2]]) {
    if (!f[k]) continue;
    const v = F(k);
    for (let bit = 0; bit < 8; bit++) {
      if (!(v & 1 << bit)) continue;
      const name = list?.[bit] || defs[bit];
      if (name === '?') continue;
      lines.push(name); any = true;
    }
  }
  if (any) lines.push('');
  for (const [, s] of effectLines(p)) lines.push(s);
  return lines.join('\n').replace(/\n+$/, '');
}

function pickFolder() {
  const inp = $('#folderInput');
  inp.value = '';
  inp.onchange = async () => {
    const byGame = {};
    for (const f of inp.files) {
      const parts = f.webkitRelativePath.split('/');
      // Resources\Character file formats\NN. <game>.txt: the record layouts for the editor
      const fm = parts.at(-2)?.toLowerCase() === 'character file formats' && parts.at(-1).match(/^(\d\d)\. .*\.txt$/i);
      if (fm) { (byGame[+fm[1] - 1] ??= {})['format.txt'] = f; continue; }
      if (parts.at(-2)?.toLowerCase() === 'data' && parts.at(-1).toLowerCase() === 'experience.dat') { await Data.importExperience(await f.arrayBuffer()); continue; }
      const i = parts.findIndex(p => p.toLowerCase() === 'games');
      if (i < 0 || parts.length !== i + 3) continue;
      const m = parts[i + 1].match(/^(\d\d)\. /);
      if (!m) continue;
      (byGame[+m[1] - 1] ??= {})[parts[i + 2]] = f;
    }
    let n = 0;
    for (const [g, files] of Object.entries(byGame)) {
      const bufs = {};
      // the game's own files (not Game.dat.orig and other backups)
      for (const [name, f] of Object.entries(files)) if (/\.(dat|txt|bmp)$/i.test(name)) bufs[name] = await f.arrayBuffer();
      await Data.importGame(+g, bufs); n++;
    }
    log(n ? `GBC data imported for ${n} games` : 'No Games folder found: choose the Gold Box Companion folder');
    Icons.sheets = {}; Hud.last = ''; Render.draw(); updateTitle();
  };
  inp.click();
}
// ?gbcdata=<GBC folder the webserver serves>: the files every game has; the
// rest (NPC icons, world maps) are fetched when needed
async function importGbcUrl(base) {
  if (!base.endsWith('/')) base += '/';
  for (let g = 0; g < 12; g++) {
    const dir = `${base}Games/${encodeURIComponent(GAME_INFO[g].dir)}/`, bufs = {};
    for (const name of ['Game.dat', 'Effects.txt', 'XP.txt', 'Levels.txt', 'Icons.txt', 'Head.bmp', 'Body.bmp', 'Icon.bmp',
      'Death_1.bmp', 'Death_2.bmp', 'Passwords.txt']) {
      const r = await fetch(dir + name, { cache: 'no-store' });
      if (r.ok) bufs[name] = await r.arrayBuffer();
    }
    const fr = await fetch(`${base}Resources/Character%20file%20formats/${encodeURIComponent(GAME_INFO[g].dir)}.txt`, { cache: 'no-store' });
    if (fr.ok) bufs['format.txt'] = await fr.arrayBuffer();
    if (Object.keys(bufs).length) await Data.importGame(g, bufs);
    Data.urls[g] = dir;
  }
  const ex = await fetch(`${base}Data/Experience.dat`, { cache: 'no-store' });
  if (ex.ok) await Data.importExperience(await ex.arrayBuffer());
  log(`GBC data imported from ${base}`);
}

/* ------------------------------------------------------ game folder
 * Picked with the folder dialog (Chromium: a folder handle that can also
 * write), or served by the webserver (?gamedata=<folder>). Saved games are in
 * the folder itself or in SAVE\. */

const Files = {
  list: null, dir: null, url: '', after: null,
  has() { return !!(this.list || this.dir || this.url); },
  async handle(path) {
    let d = this.dir;
    const parts = path.split('/');
    for (const p of parts.slice(0, -1)) d = await d.getDirectoryHandle(p);
    return d.getFileHandle(parts.at(-1));
  },
  async get(path) {   // { data, date } or null; any case
    try {
      if (this.dir) {
        const parts = path.split('/');
        let d = this.dir;
        for (const p of parts.slice(0, -1)) {
          let next = null;
          for await (const [n, h] of d.entries()) if (h.kind === 'directory' && n.toLowerCase() === p.toLowerCase()) next = h;
          if (!next) return null;
          d = next;
        }
        for await (const [n, h] of d.entries()) if (h.kind === 'file' && n.toLowerCase() === parts.at(-1).toLowerCase()) {
          const f = await h.getFile(); return { data: new Uint8Array(await f.arrayBuffer()), date: f.lastModified, name: n };
        }
        return null;
      }
      if (this.list) {
        const f = this.list.find(f => f.webkitRelativePath.split('/').slice(1).join('/').toLowerCase() === path.toLowerCase());
        return f ? { data: new Uint8Array(await f.arrayBuffer()), date: f.lastModified, name: f.name } : null;
      }
      if (this.url) {
        const r = await fetch(this.url + path, { cache: 'no-store' });
        return r.ok ? { data: new Uint8Array(await r.arrayBuffer()), date: Date.parse(r.headers.get('Last-Modified')) || 0, name: path.split('/').at(-1) } : null;
      }
    } catch {}
    return null;
  },
  // the saved game's files in the folder or SAVE\ (the one that has SAVGAM*); FRUA's in the design's folder
  async save(name) {
    if (Game.g === 9) { const dsn = await Frua.designFolder(); return dsn ? (await this.get(`${dsn}/${name}`)) || (await this.get(`${dsn}/SAVE/${name}`)) : null; }
    return (await this.get(name)) || (await this.get('SAVE/' + name));
  },
  // the names of the files in the folder and in SAVE\ (null when the webserver serves the folder: it can't be listed)
  async names() {
    const out = [];
    try {
      if (this.dir) {
        for await (const [n, h] of this.dir.entries()) {
          if (h.kind === 'file') out.push(n);
          else if (n.toLowerCase() === 'save') for await (const [m, hh] of h.entries()) if (hh.kind === 'file') out.push('SAVE/' + m);
        }
        return out;
      }
      if (this.list) return this.list.map(f => f.webkitRelativePath.split('/').slice(1).join('/')).filter(p => /^(SAVE\/)?[^/]+$/i.test(p));
    } catch {}
    return null;
  },
  async blobUrl(name) {   // for PDFs: a URL to open
    if (this.url) { const r = await fetch(this.url + name, { method: 'HEAD' }).catch(() => null); return r?.ok ? this.url + name : null; }
    const f = await this.get(name);
    return f ? URL.createObjectURL(new Blob([f.data], { type: 'application/pdf' })) : null;
  },
  pick(after) {
    this.after = after || null;
    const done = async () => { log('Game folder chosen'); Wizard.refresh(); if (this.after) { const a = this.after; this.after = null; a(); } };
    if (window.showDirectoryPicker) {
      showDirectoryPicker({ id: 'goldbox', mode: 'readwrite' }).then(d => { Object.assign(this, { dir: d, list: null, url: '' }); done(); },
        e => { if (e.name !== 'AbortError') this.pickInput(done); });
      return;
    }
    this.pickInput(done);
  },
  pickInput(done) {
    const inp = el('input', { type: 'file', webkitdirectory: true, multiple: true });
    inp.onchange = () => { Object.assign(this, { list: [...inp.files].filter(f => f.webkitRelativePath.split('/').length <= 3), dir: null, url: '' }); done(); };
    inp.click();
  },
};

// the saved games A-J: where the party is and when it was saved
async function savedGames() {
  const h = Data.games[Game.g]?.header, areas = Data.games[Game.g]?.areas || [];
  const pat = h?.files?.find(f => /^SAVGAM/i.test(f)) || 'SAVGAM%s.DAT', out = [];
  for (const letter of 'ABCDEFGHIJ') {
    const f = await Files.save(pat.replace(/%s/i, letter));
    if (!f) continue;
    const s = h?.save, at = o => o >= 0 && o < f.data.length ? f.data[o] : -1;

    const a = Game.g === 9 && area >= 0 ? await Frua.load(area) : areas.find(a => a.geo === geo && a.area === area);
    out.push({ letter, date: f.date, where: a ? a.name : geo >= 0 ? `GEO ${geo}, area ${area}` : '',

const fmtDate = ms => { const t = new Date(ms); return `${t.getFullYear()}-${pad2(t.getMonth() + 1)}-${pad2(t.getDate())}  ${pad2(t.getHours())}:${pad2(t.getMinutes())}`; };

// BACKUP SAVE: the newest saved game's files as a zip. GBC copies SAVGAM<slot>*,
// CHRDAT<slot>* and VAULT<slot>*, in Secret of the Silver Blades VAULT.DAT and
// in Gateway to the Savage Frontier VAULT.<slot>, to SAVE STORAGE\<slot> -
// <description>; a folder the webserver serves can't be listed, so the
// files named in Game.dat's header are taken then
async function backupSave() {
  if (!Files.has()) { alert('Choose the game folder first: the backup takes the saved game from there.'); Files.pick(backupSave); return; }
  const saves = await savedGames();
  if (!saves.length) { alert('No saved games in the game folder.'); return; }
  const s = saves[0], L = s.letter.toUpperCase(), entries = [], names = await Files.names();
  const wanted = n => { const u = n.toUpperCase().replace(/^SAVE\//, ''); return u.startsWith('SAVGAM' + L) || u.startsWith('CHRDAT' + L) || u.startsWith('VAULT' + L) ||
    (Game.g === 2 && u === 'VAULT.DAT') || (Game.g === 7 && u === 'VAULT.' + L); };
  if (names) { for (const n of names) if (wanted(n)) { const f = await Files.get(n); if (f) entries.push([f.name, f.data]); } }
  else {
    const pats = Data.games[Game.g]?.header?.files || ['SAVGAM%s.DAT'];
    for (const p of pats) {
      if (!/%d/.test(p)) { const f = await Files.save(p.replace(/%s/i, L)); if (f) entries.push([f.name, f.data]); continue; }
      for (let i = 1; i <= 8; i++) { const f = await Files.save(p.replace(/%s/i, L).replace('%d', i)); if (f) entries.push([f.name, f.data]); }
    }
    for (const n of [Game.g === 2 ? 'VAULT.DAT' : '', Game.g === 7 ? 'VAULT.' + L : '']) if (n) { const f = await Files.save(n); if (f) entries.push([f.name, f.data]); }
  }
  if (!entries.length) { alert(`No files of save slot ${L} found.`); return; }
  const desc = prompt(`Backup save slot ${L}: enter description for save backup`, `${s.where} ${s.pos}`.trim());
  if (desc === null) return;
  download(zipStore(entries), `${SHORT[Game.g]} save ${L} - ${desc.replace(/[^\w ,.-]+/g, '')}.zip`);
  log(`Saved game ${L} backed up (${entries.length} files)`);
}
function zipStore(entries) {
  const crcTable = Array.from({ length: 256 }, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
  const crc = d => { let c = 0xFFFFFFFF; for (const b of d) c = crcTable[(c ^ b) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const parts = [], central = [];
  let off = 0;
  for (const [name, data] of entries) {
    const nm = new TextEncoder().encode(name), c = crc(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint32(14, c, true);
    h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nm.length, true);
    parts.push(new Uint8Array(h.buffer), nm, data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint32(16, c, true);
    cd.setUint32(20, data.length, true); cd.setUint32(24, data.length, true); cd.setUint16(28, nm.length, true);
    cd.setUint32(42, off, true);
    central.push(new Uint8Array(cd.buffer), nm);
    off += 30 + nm.length + data.length;
  }
  const size = central.reduce((a, p) => a + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, size, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}

/* ------------------------------------------------------------ items
 * A character's items are a list of records (far pointer to the first in the
 * character): the name as the game shows it (string), the pointer to the
 * next item, then 17 bytes from the item tables (base type, three name parts,
 * bonus, save bonus, readied, cursed, unidentified bits, weight, amount,
 * value, three properties); where they are comes from Game.dat's header. */

// base types of arrows, bolts and darts per game (GBC's table) and, from its
// Configuration.txt, the plus up to which they are topped up (-1: never)
const AMMO = [[73, 28, 9], [73, 28, 9], [30, 12, 5], [30, 12, 5], [30, 5], [30, 5], [30, 12, 5], [73, 28, 9], [30, 12, 5], [30, 12, 5], null, null];
const AMMO_MAX_PLUS = [0, 0, 1, 2, 0, 1, 2, 0, 1, 1, -1, -1];
const ammoMaxPlus = () => (Settings.v.ammoMaxPlus && typeof Settings.v.ammoMaxPlus === 'object' ? Settings.v.ammoMaxPlus[Game.g] : undefined) ?? AMMO_MAX_PLUS[Game.g];
const Items = {
  layout() { return Data.games[Game.g]?.header?.item || null; },
  async list(p) {
    const L = this.layout(), f = Game.f, out = [];
    if (!L || !f.items) return out;
    let a = far(p.r, f.items[0]);
    for (let i = 0; i < 60 && a; i++) {
      const raw = await Api.read(a, Math.max(L.size, L.dax + 17));
      out.push({ addr: a, raw, orig: raw.slice() });
      a = far(raw, L.next);
    }
    return out;
  },
  off(k) { const L = this.layout(); return L.dax + L.fields[k]; },
  get(it, k, n = 1) { const o = this.off(k); return n === 2 ? it.raw[o] | it.raw[o + 1] << 8 : it.raw[o]; },
  set(it, k, v, n = 1) { const o = this.off(k); it.raw[o] = v & 255; if (n === 2) it.raw[o + 1] = v >> 8 & 255; },
  // the name as GBC composes it: the three name parts in order from Game.dat's
  // item names, the amount when more than one; Secret of the Silver Blades'
  // bundles of scrolls (base type 73) by their amount
  compose(it) {
    const names = Data.games[Game.g]?.texts?.items || [], o = this.off('name'), amount = this.get(it, 'amount');
    let s = '';
    for (let k = 0; k < 3; k++) { const id = it.raw[o + k]; if (id > 0 && names[id]) s += ' ' + names[id]; }
    s = s.trim();
    if (Game.g === 2 && this.get(it, 'base') === 73) return `Bundle of ${amount} Scrolls (DON'T EDIT)`;
    return amount > 1 ? `${s} (${amount})` : s;
  },
  // GBC writes the 17 bytes from the item tables; the game composes the name
  async write(it) {
    const L = this.layout();
    await Api.write(it.addr + L.dax, it.raw.slice(L.dax, L.dax + 17));
    it.orig = it.raw.slice();
  },
  async writeByte(it, k, v) { this.set(it, k, v); await Api.write(it.addr + this.off(k), Uint8Array.of(v)); },
};
// AUTO ID: identify the items in the inventories when their number changes;
// AUTO-AMMO: keep arrows, bolts and darts (up to the plus set) at the amount set
let lastItemCount = -1;
async function itemChores() {
  if (Game.g < 0 || !Items.layout() || inCombat()) return;
  const count = Game.party.reduce((n, p) => n + (Game.field(p, 'nItems') || 0), 0);
  const identify = Settings.v.autoId && count !== lastItemCount;
  lastItemCount = count;
  const ammo = Settings.v.autoAmmo && Settings.v.ammoAmount > 0 && AMMO[Game.g] ? AMMO[Game.g].filter(Boolean) : null, maxPlus = ammoMaxPlus();
  if (!identify && !ammo) return;
  for (const p of Game.party) for (const it of await Items.list(p)) {
    if (identify && Items.get(it, 'unid')) {
      const want = scrollMask(it);
      if (want !== Items.get(it, 'unid')) { await Items.writeByte(it, 'unid', want); log(`Identified: ${Items.compose(it)}`); }
    }
    if (ammo && ammo.includes(Items.get(it, 'base')) && Items.get(it, 'amount') < Settings.v.ammoAmount && Items.get(it, 'bonus') <= maxPlus)
      await Items.writeByte(it, 'amount', Settings.v.ammoAmount);
  }
}
// what GBC leaves unidentified: in the Krynn games a scroll (base type 39)
// keeps the name part that tells its spell hidden (bit 0x10 or 0x20, by the
// third name part), as the games do it
function scrollMask(it) {
  if (![4, 5, 6].includes(Game.g) || Items.get(it, 'base') !== 39) return 0;
  const p3 = it.raw[Items.off('name') + 2];
  if (Game.g !== 6) return p3 === 0x77 ? 0x20 : p3 === 0x78 ? 0x10 : 0;
  return p3 === 0x88 || p3 === 0x98 ? 0x10 : p3 === 0x89 || p3 === 0x97 ? 0x20 : 0;
}

 * Every field of the record from GBC's character file formats (loaded with

 * inventory, the effects and the combat icon. Writes go straight into memory
 * ("Apply changes"); not in combat, as GBC says. */

const DEFAULT_COLORS = [0x91, 0xA2, 0xB3, 0xC4, 0xE6, 0xF7];
const Editor = {

  let v = value, m;
  if ((m = name.match(/^thief_([1-8])$/)) && cls === 'thief') {
    const k = +m[1] - 1, dex = Game.field(p, 'dex_current'), race = (VALUES[Game.g + 1]?.race || [])[Game.field(p, 'race')];
    if (dex >= 9 && dex <= 25) v += THIEF_DEX[dex - 9][k];
    if (THIEF_RACE[race]) v += THIEF_RACE[race][k];
  } else if ((m = name.match(/^cleric_spells_([1-4])$/)) && cls === 'cleric') {
    const wis = Game.field(p, 'wis_current');
    if (wis >= 13 && wis <= 25) v += WIS_BONUS[Math.min(wis, 18) - 13][+m[1] - 1];
  }
  return v;
}
// GBC's line for a change in the level-up dialog
function describeChange(name, v) {
  let m;
  if (name === 'thac0_base') return `thac0 -> ${60 - v}`;
  if (name === 'ac_base') return `ac -> ${60 - v}`;
  if (name === 'attacks' || name === 'attacks_2') return `attacks -> ${v % 2 ? (v / 2).toFixed(1) : v / 2} per round`;
  if (name === 'movement_base') return `movement -> ${v}`;
  if ((m = name.match(/^save_([1-5])$/))) return `save ${m[1]} (${SAVE_NAMES[m[1] - 1]}) -> ${v}`;
  if ((m = name.match(/^thief_([1-8])$/))) return `thief skill ${m[1]} (${THIEF_SKILLS[m[1] - 1]}) -> ${v}`;
  if ((m = name.match(/^(cleric|mage|druid)_spells_(\d)$/))) return `${m[1]} level ${m[2]} spells per day -> ${v}`;
  return `${name.replace(/_/g, ' ')} -> ${v}`;
}
// AC and THAC0 current follow a new base (GBC: by the base's change)
function adjustCurrentAcThac0(p, w) {
  for (const [base, cur] of [['ac_base', 'ac_current'], ['thac0_base', 'thac0_current']]) {
    const nb = w.v.get(base);
    if (!(nb > 0)) continue;
    const v = Game.field(p, cur) + (nb - Game.field(p, base));
    if (w.ok(cur, v)) w.set(cur, v);
  }
}

const Leveler = {
  skip: new Set(), cur: null,
  levels() {
    const d = Data.games[Game.g], t = d?.files?.['levels.txt'];
    if (!t) return null;
    return d._levels ??= parseLevels(new TextDecoder('latin1').decode(t));
  },
  anyone() { return Game.g >= 0 && Game.party.some(p => p.xpi?.able); },
  // GBC's search for the next level-up: the first member (not skipped) able
  // to train; of its classes the one whose next level needs the least
  // experience the member has, not past the game's maximum level
  next() {
    if (!this.levels()) return null;
    for (const [i, p] of Game.party.entries()) {
      if (this.skip.has(i) || !p.xpi?.able) continue;
      let best = null;
      for (const c of p.xpi.classes) {
        if (!(c.next <= p.xpi.xp)) continue;
        if (c.maxLevel > 0 && c.level + 1 > c.maxLevel) continue;
        if (best && c.next >= best.c.next) continue;
        const plan = this.plan(p, c, c.level + 1);
        if (plan) best = { c, plan };
      }
      if (best) return { p, i, cls: best.c, level: best.c.level + 1, plan: best.plan };
    }
    return null;
  },
  // what a level sets: the pending changes, the spells learnt, the notes
  // for the dialog, the spells to choose from (GBC's FUN_0009f188)
  plan(p, c, level) {
    const L = this.levels(), entries = L.sec[`${c.tableName} ${level}`], f = Game.f, former = p.xpi.former;
    if (!entries?.length) return null;
    const w = new Pending(p), notes = [], known = [];
    if (former && level <= former.level + 1) notes.push(`dual-class: was formerly ${former.cls}, level ${former.level}`);
    const take = (e, cls, slotOfFormer) => {
      const sp = spellByKey(e.name);
      if (sp) { if (!spellKnown(p.r, sp) && !known.includes(sp)) { known.push(sp); notes.push(`${sp.cls} spell: ${sp.name}`); } return; }
      if (!f[e.name] || e.value < 0 || e.value > 255) return;
      const v = slotOfFormer ? e.value : adjustValue(p, cls, e.name, e.value);
      if (w.ok(e.name, v)) { w.set(e.name, v); notes.push(describeChange(e.name, v)); }
    };
    for (const e of entries) {
      if (e.name === 'hp_add') {
        if (former && level <= former.level) { notes.push(`no hit points added until character reaches level ${former.level + 1}`); continue; }
        const gain = hpGain(p, c.cls, e.raw), hpMax = Game.field(p, 'hit_points_maximum');
        w.set('hit_points_maximum', hpMax + gain); w.set('hit_points_current', hpMax + gain);
        if (f.hit_points_rolled) w.set('hit_points_rolled', Game.field(p, 'hit_points_rolled') + gain);
        notes.push(`+${gain} hit points`);
        continue;
      }
      take(e, c.cls, false);
    }
    if (former && former.level + 1 === level) {
      const first = L.sec[`${former.tableName} 1`], old = L.sec[`${former.tableName} ${former.level}`];
      if (!first?.length || !old?.length) return null;   // GBC: "Can not find level-up info"
      notes.push('', 'restoring former class properties:');
      const il = first.find(e => e.name === 'item_limits');
      if (il && il.value >= 0 && f.item_limits) { const v = Game.field(p, 'item_limits') | il.value; w.set('item_limits', v); notes.push(itemLimitNames(v)); }
      for (const e of old) if (e.name !== 'item_limits') take(e, former.cls, /_spells_\d$/.test(e.name));
    }
    return { w, notes, known, choices: this.spellChoices(p, c, w, entries, known) };
  },
  // the spells a mage (or a ranger who casts) may pick one of: those of the
  // levels with spells per day (the new count when it changes; for the
  // ranger the line's) that are not known yet
  spellChoices(p, c, w, entries, known) {
    if (c.cls !== 'mage' && c.cls !== 'ranger') return null;
    const slots = Array(10).fill(0);
    if (c.cls === 'mage') for (let L = 1; L <= 9; L++) { const k = `mage_spells_${L}`; slots[L] = Math.max(0, Game.field(p, k) || 0); if (w.v.get(k) > 0) slots[L] = w.v.get(k); }
    else for (const e of entries) { const m = e.name.match(/^mage_spells_(\d)$/); if (m) slots[+m[1]] = e.value; }
    return (Data.games[Game.g]?.spells || []).filter(s => s.cls === 'mage' && slots[s.level] > 0 && !spellKnown(p.r, s) && !known.includes(s));
  },
  open() {
    if (!notInCombat('Level up')) return;
    if (!this.levels()) { alert("Level up needs GBC's Levels.txt (menu: GBC folder)."); return; }
    this.skip = new Set();
    this.cur = this.next();
    if (!this.cur) { alert('No characters found to level-up!'); return; }
    this.show();
  },
  step() {
    this.cur = this.next();
    if (!this.cur) { document.getElementById('leveler')?.remove(); return; }
    this.show();
  },
  show() {
    const cur = this.cur, d = Dlg.make('leveler', 'Level up', 640), body = d.querySelector('.body'), { p, cls, level, plan } = cur;
    let pick = null;
    const sel = plan.choices?.length ? el('select', { size: Math.min(12, plan.choices.length + 1), style: 'min-width:220px' }) : null;
    if (sel) {
      for (const s of plan.choices) sel.append(el('option', { value: s.id, textContent: `${s.level}: ${s.name}` }));
      sel.onchange = () => { pick = plan.choices.find(s => s.id === +sel.value) || null; };
    }
    body.replaceChildren(
      el('div', { style: 'display:flex;gap:14px;align-items:center' }, Icons.canvas(p),
        el('div', {}, el('h3', { textContent: Game.name(p), style: 'margin:0' }), el('div', { textContent: `is ready to advance as ${cls.cls} to level ${level}` }))),
      el('div', { style: 'display:flex;gap:12px;align-items:flex-start;margin-top:8px' },
        el('pre', { textContent: plan.notes.join('\n'), style: 'flex:1;max-height:320px;overflow:auto;font:12px/1.4 Consolas,monospace;margin:0' }),
        sel ? el('div', {}, el('div', { className: 'muted', textContent: 'New spell:' }), sel) : ''),
      el('div', { style: 'display:flex;gap:8px;margin-top:8px' },
        el('button', { textContent: 'Level up', onclick: () => this.levelUp(pick) }),
        el('button', { textContent: 'Skip', onclick: () => { this.skip.add(cur.i); this.step(); } }),
        el('button', { textContent: 'Exit', onclick: () => d.remove() })));
  },
  // GBC's LEVEL UP: the warning for a dual-classed former paladin or ranger
  // regaining its class, the spell picked, then the level, level highest,
  // AC and THAC0 current, able to train 0, and everything pending written
  async levelUp(pick) {
    const { p, cls, level, plan } = this.cur, former = p.xpi.former;
    if (former && ['paladin', 'ranger'].includes(former.cls) && former.level + 1 === level) {
      const fx = former.cls === 'paladin' ? '$08' : Game.g === 1 || Game.g === 7 ? '$86' : '$69';
      const msg = 'This is a dual-class character and this level up will make\nthe character regain former class abilities.\n\n' +
        `Add the effect ${fx} to the character with the Save Game Editor afterwards.\n\nSee the manual for more info.`;
      if (Game.g === 9) { alert(msg); return; }
      if (!confirm(msg)) return;
    }
    if (pick) await learnSpell(p, pick);
    for (const s of plan.known) await learnSpell(p, s);
    const w = plan.w, lv = `level_${cls.cls}`;
    if (Game.f[lv]) w.set(lv, level);
    w.set('level_highest_1', level);
    adjustCurrentAcThac0(p, w);
    w.set('able_to_train', 0);
    await w.flush();
    log(`${Game.name(p)}: ${cls.cls} level ${level}`);
    Hud.last = '';
    await Game.poll();
    this.step();
  },
  // FIX STATS (GBC's): a dual-classed member's spells per day are zeroed
  // first (the former class's would stay the higher); then each class's
  // line for the level the member has sets THAC0, AC, attacks, movement,
  // saves and spells per day through the pending rules, the former class's
  // too once the new class is past its level; AC and THAC0 current follow
  async fixAll() {
    if (!this.levels()) return;
    for (const p of Game.party) if (p.xpi?.former) { const w = new Pending(p); for (let id = 174; id <= 196; id++) w.set(fname(id), 0); await w.flush(); }
    await Game.poll();
    for (const p of Game.party) await this.fixStats(p);
  },
  async fixStats(p) {
    const L = this.levels(), x = p.xpi;
    if (!L || !x) return;
    const passes = x.classes.map(c => ({ cls: c.cls, table: c.tableName, level: c.level, former: false }));
    if (x.former && Game.field(p, 'level_highest_1') > Game.field(p, 'level_highest_2'))
      passes.push({ cls: x.former.cls, table: x.former.tableName, level: x.former.level, former: true });
    for (const ps of passes) {
      const entries = L.sec[`${ps.table} ${ps.level}`];
      if (!entries) continue;
      const w = new Pending(p);
      for (const e of entries) {
        if (!LEVEL_FIELDS.includes(e.name) || e.value < 0 || e.value > 255) continue;
        const v = ps.former && /_spells_\d$/.test(e.name) ? e.value : adjustValue(p, ps.cls, e.name, e.value);
        if (w.ok(e.name, v)) w.set(e.name, v);
      }
      adjustCurrentAcThac0(p, w);
      await w.flush();
    }
  },
};

// DEBUG DUMP (GBC's): where things are in memory, each character's items
async function debugDump() {
  if (Game.g < 0) return;
  const f = Game.f, o = Game.info.o, A = v => '$' + hex(v, 7), at = i => o[i] ? A(Game.at(i)) : '-';
  const lines = [`${GAME_NAMES[Game.g]}  (DOSBox ${Game.dosbox?.version || ''})`, '',
    ` Base address                 ${A(Game.base)}`, ` First character pointer at   ${at(3)}`, ` Active character pointer at  ${at(2)}`,
    ` GEO 1                        ${at(4)}`, ` GEO 2                        ${at(5)}`, ` ECL                          ${at(6)}`,
    ` Map pointer at               ${at(7)}`, ` Map                          ${A(Game.mapAddr)}`, ` Indoors coordinates          ${at(8)}`,
    ` Outdoors coordinates         ${at(12)}`, ` Combat coordinates           ${at(9)}`, ''];
  Game.party.forEach((p, i) => lines.push(`   ${String(i + 1).padStart(2)}   ${Game.name(p).padEnd(16)}   ${A(p.addr)}   ${f.items ? A(far(p.r, f.items[0])) : '-'.padEnd(8)}   ${f.effects ? A(far(p.r, f.effects[0])) : ''}`));
  for (const p of Game.party) {
    lines.push('', `   ${Game.name(p)}'s items`);
    const items = await Items.list(p), L = Items.layout();
    items.forEach((it, i) => lines.push(`      ${String(i + 1).padStart(2)}   ${Items.compose(it).slice(0, 30).padEnd(30)}   ${A(it.addr)}   ` +
      [...it.raw.subarray(L.dax, L.dax + 17)].map(b => hex(b, 2).toLowerCase()).join(' ')));
    for (const e of p.effects || []) lines.push(`      effect $${hex(e.type, 2)} at ${A(e.addr)}: duration ${e.dur}, data ${e.data}`);
  }
  TextWin.open('Debug dump', lines.join('\n'));
}

function download(blob, name) {
  const a = el('a', { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

const logLines = [];
function log(text) {
  logLines.push(`${new Date().toTimeString().slice(0, 8)}  ${text}`);
  if (logLines.length > 500) logLines.shift();
  const l = document.querySelector('#log');
  if (l) { l.textContent = logLines.join('\n'); l.parentElement.scrollTop = 1e9; }
}
const LogWin = {
  open() {
    const d = Dlg.make('logwin', 'Debug log', 640), body = d.querySelector('.body');
    body.style.height = '320px';
    if (!body.querySelector('#log')) body.append(el('div', { id: 'log' }));
    log('Log opened');
  },
};

loop();
</script>
