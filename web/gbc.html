<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold Box Companion</title>
<style>
:root {
  --bg: #000; --text: #dcdcdc; --dim: #6c6c6c; --menu: #1c1c1c; --sel: #2c4a78; --line: #2c2c2c;
  --green: #0a7a0a; --red: #7c0606; --good: #3cd43c; --bad: #ff4848;
  --rock: #a28440; --floor: #ececec; --grid: #d6d6d6; --wall: #5c4a38;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 13px/1.35 Tahoma, Verdana, "Segoe UI", system-ui, sans-serif; }
#app { display: flex; flex-direction: column; height: 100vh; }
#bar { display: flex; align-items: center; gap: 8px; padding: 3px 8px; background: #161616;
  border-bottom: 1px solid var(--line); white-space: nowrap; min-height: 28px; }
#title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.chip { padding: 0 8px; border-radius: 9px; background: #333; font-size: 12px; }
.chip.ok { background: #0b4d0b; } .chip.bad { background: #6a1010; } .chip.warn { background: #6a5410; }
#nodata { cursor: pointer; }
button, select, input, textarea { background: #222; color: var(--text); border: 1px solid #484848; border-radius: 3px;
  padding: 2px 8px; font: inherit; }
button { cursor: pointer; } button:hover { background: #333; }
input[type=number] { width: 70px; }
#hud { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(110px, 1fr); padding: 4px 0 6px;
  border-bottom: 1px solid #333; overflow-x: auto; }
#hud.hidden { display: none; }
.pc { padding: 0 8px; border-right: 1px solid #666; min-width: 0; display: flex; flex-direction: column; }
.pc .fx { font-size: 11px; line-height: 15px; min-height: 60px; flex: 1; overflow: hidden; }
.pc .fx div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc .fx .g { color: #1ab83a; } .pc .fx .b { color: #e03030; }
.pc .icon { width: 48px; height: 48px; margin: 6px auto 4px; border: 1px solid #999; background: #555;
  image-rendering: pixelated; display: block; cursor: pointer; }
.pc .nm { text-align: center; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: #aaa; cursor: pointer; }
.pc .nm.dead { color: var(--bad); }
.pc .xp { height: 5px; background: #191919; margin: 4px 0 5px; } .pc .xp i { display: block; height: 100%; background: #999; }
.pc .hp { position: relative; height: 22px; background: #262626; text-align: center; }
.pc .hp i { position: absolute; left: 0; top: 0; bottom: 0; background: #007700; }
.pc .hp i.low { background: var(--red); }
.pc .hp span { position: relative; line-height: 22px; color: #e8e8e8; }
.pc .drain { color: var(--bad); font-size: 11px; text-align: center; }
#hudmenu { position: fixed; z-index: 35; background: #000; display: flex; flex-direction: column; justify-content: flex-end;
  gap: 7px; padding: 8px 8px 10px; box-sizing: border-box; }
#hudmenu .row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 7px; }
#hudmenu button { background: #000; border: 1px solid #777; border-radius: 0; color: #9fb0c8; font-size: 11px; padding: 3px 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hudmenu button:nth-child(even) { color: #c8a878; }
#hudmenu button:hover:not(:disabled) { color: #fff; border-color: #ddd; }
#hudmenu button:disabled { color: #555; border-color: #444; cursor: default; }
#mapwrap { position: relative; flex: 1; overflow: auto; background: #b2944e; }
#map { display: block; margin: 0 auto; }
#tip { position: fixed; pointer-events: none; background: #fffbe8; color: #222; border: 1px solid #776;
  padding: 3px 7px; font-size: 12px; display: none; z-index: 30; max-width: 460px; white-space: pre-wrap; }
#msg { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); max-width: 600px;
  text-align: center; color: #2b2010; }
#msg h2 { font-weight: normal; }
.menu { position: fixed; background: var(--menu); border: 1px solid #555; min-width: 230px; padding: 3px 0;
  z-index: 50; box-shadow: 3px 3px 10px #000c; user-select: none; }
.menu .mi { padding: 3px 22px 3px 24px; position: relative; display: flex; justify-content: space-between;
  gap: 24px; cursor: default; white-space: nowrap; }
.menu .mi:hover, .menu .mi.open { background: var(--sel); }
.menu .mi.dis { color: var(--dim); }
.menu .mi.chk::before { content: "\2713"; position: absolute; left: 7px; }
.menu .mi.sub::after { content: "\25B8"; position: absolute; right: 8px; }
.menu .mi .k { color: #999; }
.menu .sep { height: 1px; background: #444; margin: 3px 0; }
.dlg { position: fixed; z-index: 40; background: #121212; border: 1px solid #555; box-shadow: 4px 4px 14px #000c;
  display: flex; flex-direction: column; max-height: 92vh; }
.dlg header { display: flex; align-items: center; gap: 8px; padding: 4px 8px; background: #1f1f1f; cursor: move;
  user-select: none; border-bottom: 1px solid #333; }
.dlg header .t { flex: 1; }
.dlg .body { padding: 8px 10px; overflow: auto; }
.list { border-collapse: collapse; width: 100%; font-size: 12px; }
.list td, .list th { padding: 1px 6px; text-align: left; white-space: nowrap; }
.list th { color: #aaa; font-weight: normal; border-bottom: 1px solid #333; position: sticky; top: 0; background: #121212; }
.list tr:hover td { background: #1d2a3d; }
#log { font: 12px/1.3 Consolas, monospace; white-space: pre-wrap; }
.ed { display: grid; grid-template-columns: 150px 1fr; gap: 12px; }
.ed .chars button { display: block; width: 100%; text-align: left; margin-bottom: 3px; }
.ed .chars button.sel { background: var(--sel); }
.cols { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: auto auto; gap: 3px 8px; align-items: center; margin-top: 6px; }
.fields td { padding: 1px 4px; } .fields input, .fields select { padding: 0 4px; }
input.changed, select.changed { border-color: #c8a020; }
fieldset { border: 1px solid #444; } legend { color: #bbb; }
.muted { color: #999; }
.hidden { display: none !important; }
</style>
</head>

<div id="app">
  <div id="bar">
    <span id="title">Gold Box Companion</span>
    <span id="dbg" class="chip warn hidden">Debug</span>
    <span id="game" class="chip hidden"></span>
    <span id="nodata" class="chip warn hidden" title="GBC's folder hasn't been chosen: the character icons, area names, effects and journals come from it. Click to choose it.">No GBC data</span>

    <button id="menuBtn" title="Menu">&#9776;</button>
  </div>
  <div id="hud"></div>
  <div id="mapwrap">
    <canvas id="map" width="512" height="512"></canvas>
    <div id="msg"></div>
  </div>
</div>
<div id="tip"></div>
<input id="folderInput" type="file" webkitdirectory multiple class="hidden">

'use strict';
/* Gold Box Companion for DOSBox Staging - a rewrite of Joonas Hirvonen's
 * Gold Box Companion 2.65 as a web page. It reads and writes the game's memory
 * through DOSBox Staging's HTTP API (/api/v1/memory), which also serves this
 * page.
 *
 * Per game (from GBC's Game.dat): two byte patterns in the program find its
 * base; at fixed distances from the base lie far pointers to the first
 * character and to the current map, the map's GEO/area numbers, the party's
 * position and the party size. Characters form a list (a far pointer to the
 * next one in each record); each has a list of 9-byte effects. The current
 * map is 4 x 256 bytes: N/E walls, S/W walls (a nibble each), events, doors
 * (2 bits per side). */

const $ = (s, r = document) => r.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  for (const k of kids) e.append(k);
  return e;
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hex = (n, w = 4) => n.toString(16).toUpperCase().padStart(w, '0');
const pad2 = n => String(n).padStart(2, '0');

/* ---------------------------------------------------------------- API */

const Api = {
  async read(addr, len) {
    const r = await fetch(`/api/v1/memory/${addr}/${len}`,
      { headers: { Accept: 'application/octet-stream' }, cache: 'no-store' });
    if (!r.ok) throw new Error(`read ${hex(addr, 6)}: HTTP ${r.status}`);
    return new Uint8Array(await r.arrayBuffer());
  },
  async write(addr, bytes) {
    const r = await fetch(`/api/v1/memory/${addr}`, { method: 'PUT',
      headers: { 'Content-Type': 'application/octet-stream' }, body: bytes });
    if (!r.ok) throw new Error(`write ${hex(addr, 6)}: HTTP ${r.status}`);
  },
  async info() {
    const r = await fetch('/api/v1/dosbox/info', { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  },
};
const far = (b, o = 0) => ((b[o + 2] | b[o + 3] << 8) << 4) + (b[o] | b[o + 1] << 8);

/* ------------------------------------------------- browser storage */

const DB = {
  db: null,
  open() {
    return this.db ??= new Promise((res, rej) => {
      const q = indexedDB.open('gbc', 1);
      q.onupgradeneeded = () => { q.result.createObjectStore('files'); q.result.createObjectStore('kv'); };
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  },
  async op(store, mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const q = fn(db.transaction(store, mode).objectStore(store));
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  },
  get: (s, k) => DB.op(s, 'readonly', o => o.get(k)),
  put: (s, k, v) => DB.op(s, 'readwrite', o => o.put(v, k)),
  del: (s, k) => DB.op(s, 'readwrite', o => o.delete(k)),
  keys: s => DB.op(s, 'readonly', o => o.getAllKeys()),
};

const Settings = {

};

// what the GBC folder adds: area names and map drawing modes, effect names,
// XP tables, icon sheets, passwords, world maps, ...
const Data = {
  games: {},   // game index -> { areas: [...], effects: [[good, name]], xp: {class: [xp per level]}, files: {lowercase name: bytes} }
  urls: {},    // game index -> the folder the webserver serves (files fetched when needed)
  async load() {
    for (let g = 0; g < 12; g++) { const v = await DB.get('files', 'game:' + g); if (v) this.games[g] = v; }
  },
  async importGame(g, files) {
    const out = { files: {} };
    for (const [name, buf] of Object.entries(files)) {
      if (/^game\.dat$/i.test(name)) {
        const d = new Uint8Array(buf);
        Object.assign(out, { areas: parseAreas(d), header: parseHeader(d), titles: parseTitles(d), texts: parseTexts(d) });
      }
      // Effects.txt: line n names effect type n ("+ good" / "- bad")
      else if (/^effects\.txt$/i.test(name)) out.effects = new TextDecoder('latin1').decode(buf).split(/\r?\n/)
        .map(l => l.trim()).map(l => [l[0] !== '-', l.slice(1).trim()]);
      else if (/^xp\.txt$/i.test(name)) { out.xp = parseXp(new TextDecoder('latin1').decode(buf)); out.files['xp.txt'] = buf; }
      else if (name === 'format.txt') out.format = parseFormat(new TextDecoder('latin1').decode(buf));
      else out.files[name.toLowerCase()] = buf;
    }
    await DB.put('files', 'game:' + g, out);
    this.games[g] = out;
  },
  // a file of the game's GBC folder by name (any case), fetched from the
  // served folder the first time when that is where the data came from
  async file(g, name) {
    const d = this.games[g], k = name.toLowerCase();
    if (d?.files && k in d.files) return d.files[k];
    if (!this.urls[g] || !d) return null;
    const r = await fetch(this.urls[g] + encodeURIComponent(name), { cache: 'no-store' }).catch(() => null);
    d.files ??= {};
    return d.files[k] = r?.ok ? await r.arrayBuffer() : null;
  },
  text: async (g, name) => { const b = await Data.file(g, name); return b ? new TextDecoder('latin1').decode(b) : null; },
};
// Game.dat's area records (10168 bytes each from 9740): name, width, height,
// GEO, area, ?, the map's four arrays (N/E walls, S/W walls, events, doors;
// 2501 bytes each, rows of `width`), then for each wall type how GBC draws it
// (0 nothing, 1 open where passable, 2 dashed where passable, 3 archway where
// passable, 7 always a wall, 8 wall or door, 9 always a door)
function parseAreas(d) {
  const areas = [], R = 10168;
  for (let o = 0x9740; o + R <= d.length; o += R) {
    const n = d[o];
    if (!n || n > 63) break;
    let name = '';
    for (let k = 0; k < n; k++) name += String.fromCharCode(d[o + 1 + k]);
    const dv = new DataView(d.buffer, d.byteOffset + o + 64, R - 64);
    const modes = Array.from({ length: 16 }, (_, t) => dv.getInt32(20 + 4 * 2501 + 4 * t, true));
    areas.push({ name, w: dv.getInt32(0, true), h: dv.getInt32(4, true), geo: dv.getInt32(8, true), area: dv.getInt32(12, true),
      modes, map: d.slice(o + 84, o + 84 + 4 * 2501) });
  }
  return areas;
}
// Game.dat's header: the saved game file names (CHRDAT%s%d.SAV, ..., with %s
// the slot letter, %d the character) and where SAVGAM%s.DAT keeps the party's
// GEO, area, x, y and direction
function parseHeader(d) {
  const dv = new DataView(d.buffer, d.byteOffset), int = o => dv.getInt32(o, true), files = [];
  for (let o = 0x5B4; o < 0x608;) {
    const n = d[o];
    if (n > 0 && n < 20 && d.subarray(o + 1, o + 1 + n).every(c => c >= 32 && c < 127)) {
      files.push(String.fromCharCode(...d.subarray(o + 1, o + 1 + n))); o += 1 + n;
    } else o++;
  }
  // items: record size, where the 17 bytes from the item tables start (the
  // next-item pointer is just before them) and the fields in those 17 bytes
  const dax = int(0x650);
  return { files, save: { geo: int(0x610), area: int(0x62C), x: int(0x634), y: int(0x638), dir: int(0x63C) },
    item: dax > 4 && dax < 200 ? { size: int(0x60C), dax, next: dax - 4, fields: { base: int(0x658), name: int(0x65C), bonus: int(0x660),
      save: int(0x664), readied: int(0x668), cursed: int(0x66C), unid: int(0x670), weight: int(0x674), amount: int(0x678),
      value: int(0x67C), special: int(0x680) } } : null };
}
// world map titles at 85930: count, ?, ?, then x, y, map, name[32] each
function parseTitles(d) {
  if (d.length < 0x85940) return [];
  const dv = new DataView(d.buffer, d.byteOffset), n = dv.getInt32(0x85930, true), out = [];
  if (n <= 0 || n > 500) return out;
  for (let i = 0, o = 0x8593C; i < n && o + 44 <= d.length; i++, o += 44) {
    const len = Math.min(31, d[o + 12]);
    out.push({ x: dv.getInt32(o, true), y: dv.getInt32(o + 4, true), map: dv.getInt32(o + 8, true),
      name: String.fromCharCode(...d.subarray(o + 13, o + 13 + len)) });
  }
  return out;
}
// the text section: name lists, <items>, <journal N> ... </journal>, random
// name syllables (<male_start> <male_end> <female_start> <female_end> <middle>)
function parseTexts(d) {
  const start = indexOf(d, new TextEncoder().encode('monster\r\n'));
  if (start < 0) return null;
  const lines = new TextDecoder('latin1').decode(d.subarray(start)).split('\r\n');
  const out = { lists: [], items: [], journals: {}, names: {} };
  let sect = 'lists', cur = null;
  for (const l of lines) {
    let m;
    if ((m = l.match(/^<journal (\d+)>$/))) { sect = 'journal'; cur = []; out.journals[+m[1]] = cur; continue; }
    if ((m = l.match(/^<(items|male_start|male_end|female_start|female_end|middle)>$/))) { sect = m[1]; continue; }
    if (/^<\//.test(l)) { sect = 'none'; continue; }
    if (sect === 'lists') out.lists.push(l);
    else if (sect === 'items') out.items.push(l);
    else if (sect === 'journal') cur.push(l);
    else if (sect !== 'none') (out.names[sect] ??= []).push(l);
  }
  for (const k of Object.keys(out.journals)) out.journals[k] = out.journals[k].join('\n');
  return out;
}
// GBC's Resources\Character file formats\NN. <game>.txt: rows of offset (hex,
// decimal), length, description; spell rows ("cleric 1 01  bless") are the
// spells' "known" bytes in spell number order
function parseFormat(text) {
  const fields = [], spells = [], seen = new Set();
  for (const line of text.split(/\r?\n/)) {
    const r = line.match(/^\s+([0-9A-F]{3})(?:\s*-\s*[0-9A-F]{3})?\s+\d+(?:\s*-\s*\d+)?\s+(\d+)\s+(.+?)\s*$/);
    if (!r) continue;
    const off = parseInt(r[1], 16), len = +r[2], [desc, note = ''] = r[3].split(/\s{2,}/);
    const s = desc.match(/^(cleric|mage|druid|paladin|ranger|knight|special)\s+(\d)\s+(\d\d)$/i);
    if (s && len === 1) { spells.push({ off, cls: s[1].toLowerCase(), level: +s[2], name: note }); continue; }
    if (seen.has(off + desc)) continue;
    seen.add(off + desc);
    fields.push({ off, len, desc: desc.trim(), note: note.trim() });
  }
  return { fields, spells };
}
function parseXp(text) {
  const out = {};
  let cls = null;
  for (const line of text.split(/\r?\n/)) {
    const head = line.match(/^\s+([A-Z][A-Z ]+?)\s*$/);
    if (head && !/LEVEL|EXPERIENCE|POOL|CURSE|SECRET|POOLS|CHAMPIONS|DEATH|DARK|GATEWAY|TREASURES|UNLIMITED|COUNTDOWN|MATRIX/.test(head[1])) {
      cls = head[1].toLowerCase().trim(); out[cls] = []; continue;
    }
    const row = line.match(/^\s+(\d+)\s+([\d,]+)\s/);
    if (row && cls) out[cls][+row[1]] = +row[2].replace(/,/g, '');
  }
  return out;
}

/* -------------------------------------------------------- the game */

const Game = {
  g: -1, info: null, base: 0, dosbox: null, ticks: 0, fresh: false,
  party: [], geo: 0, area: 0, x: 0, y: 0, dir: 0, outX: 0, outY: 0, mode: 0, map: null, mapAddr: 0,
  get f() { return FIELDS[this.g + 1]; },
  at(i) { return this.base + this.info.o[i]; },
  async find() {
    const mem = new Uint8Array(0x100000);
    for (let a = 0; a < mem.length; a += 0x10000) mem.set(await Api.read(a, 0x10000), a);
    for (let g = 0; g < GAME_INFO.length; g++) {
      const info = GAME_INFO[g], id1 = hexBytes(info.id1), id2 = hexBytes(info.id2);
      for (let i = indexOf(mem, id1); i >= 0; i = indexOf(mem, id1, i + 1)) {
        const base = i - info.o[14], b2 = base + info.o[15];
        if (b2 < 0 || b2 + id2.length > mem.length) continue;
        if (id2.every((v, k) => mem[b2 + k] === v)) { Object.assign(this, { g, info, base }); return true; }
      }
    }
    return false;
  },
  async poll() {
    const o = this.info.o, rd = (i, n) => o[i] ? Api.read(this.at(i), n) : Promise.resolve(new Uint8Array(n));
    const [first, geo, area, mapPtr, pos, out, mode, size] = await Promise.all([rd(3, 4), rd(4, 1), rd(5, 1), rd(7, 4),
      rd(8, 3), rd(9, 2), rd(11, 1), rd(13, 1)]);
    Object.assign(this, { geo: geo[0], area: area[0], x: pos[0], y: pos[1], dir: pos[2] & 7, outX: out[0], outY: out[1],
      mode: mode[0] });
    // the party: follow the list of characters; in combat the monsters
    // follow the party in the same list
    const f = this.f, all = [];
    let addr = far(first);
    for (let i = 0; i < 40 && addr; i++) {
      const r = await Api.read(addr, this.info.rec);
      all.push({ addr, r });
      addr = far(r, f.next[0]);
    }
    const n = size[0] && size[0] <= all.length ? size[0] : all.filter(p => !(f.hostile && p.r[f.hostile[0]])).length || all.length;
    const party = all.slice(0, Math.min(8, n));
    for (const p of party) p.effects = await this.effects(far(p.r, f.effects[0]));
    this.all = all;
    this.party = party;
    this.inCombat = all.length > party.length && this.info.o[9] > 0;
    if (this.inCombat) {
      // the battlefield: x, y, list number (from 1), ? for each combatant
      const b = await Api.read(this.at(9), 320), sel = far(await Api.read(this.at(2), 4));
      this.combat = [];
      for (let o = 0; o < 320; o += 4) {
        const k = b[o + 2];
        if (!k) break;   // the list ends at the first empty entry
        if (k > all.length) continue;
        const c = all[k - 1];
        if (!c.effects) c.effects = await this.effects(far(c.r, f.effects[0]));
        this.combat.push({ x: b[o], y: b[o + 1], c, active: c.addr === sel });
      }
    } else this.combat = null;
    this.mapAddr = far(mapPtr);
    if (this.mapAddr) this.map = await Api.read(this.mapAddr, 1024);
    this.mv = mapView();
  },
  async effects(addr) {
    const list = [];
    for (let i = 0; i < 32 && addr; i++) {
      const e = await Api.read(addr, 9);
      list.push({ addr, type: e[0], minutes: e[1] | e[2] << 8, data: e[3], flag: e[4] });
      addr = far(e, 5);
    }
    return list;
  },
  field(p, key) {
    const f = this.f[key];
    if (!f) return undefined;
    let v = 0;
    for (let k = f[1] - 1; k >= 0; k--) v = v * 256 + p.r[f[0] + k];
    return v;
  },
  name(p) {
    const f = this.f;
    let s = '';
    if (f.nameLen) { const n = Math.min(15, p.r[f.nameLen[0]]); for (let k = 0; k < n; k++) s += String.fromCharCode(p.r[f.name[0] + k]); }
    else for (let k = 0; k < f.name[1] && p.r[f.name[0] + k]; k++) s += String.fromCharCode(p.r[f.name[0] + k]);
    return s.trim();
  },
  areaRec() { return Data.games[this.g]?.areas?.find(a => a.geo === this.geo && a.area === this.area) || null; },
  areaName() {
    const a = this.areaRec();
    return a ? a.name : `GEO ${this.geo}, area ${this.area}`;
  },
};
const hexBytes = h => Array.from({ length: h.length / 2 }, (_, i) => parseInt(h.slice(i * 2, i * 2 + 2), 16));
function indexOf(mem, bytes, from = 0) {
  outer: for (let i = mem.indexOf(bytes[0], from); i >= 0 && i <= mem.length - bytes.length; i = mem.indexOf(bytes[0], i + 1)) {
    for (let k = 1; k < bytes.length; k++) if (mem[i + k] !== bytes[k]) continue outer;
    return i;
  }
  return -1;
}

/* ------------------------------------------------------------ HUD */

const Hud = {
  last: '',
  draw() {
    const box = $('#hud');
    box.classList.toggle('hidden', !Settings.v.hud);
    $('#nodata').classList.toggle('hidden', Game.g < 0 || !!Data.games[Game.g]);
    if (Game.g < 0) { box.innerHTML = ''; this.last = ''; return; }
    const sig = JSON.stringify(Game.party.map(p => [[...p.r], p.effects.map(e => e.type)]));
    if (sig === this.last) return;
    this.last = sig;
    box.innerHTML = '';
    const fx = Data.games[Game.g]?.effects || [];
    for (const p of Game.party) {
      const col = el('div', { className: 'pc' });
      const fxBox = el('div', { className: 'fx' });
      if (Settings.v.effects) {
        const list = p.effects.map(e => {
          const [good, name] = fx[e.type - 1]?.[1] ? fx[e.type - 1] : [true, `effect $${hex(e.type, 2)}`];
          return { good, name, e };
        }).sort((a, b) => a.name.localeCompare(b.name));
        for (const { good, name, e } of list)
          fxBox.append(el('div', { className: good ? 'g' : 'b', textContent: name, title: `$${hex(e.type, 2)}, ${e.minutes ? e.minutes + ' min' : 'permanent'}` }));
      }
      col.append(fxBox);
      if (Settings.v.icons) col.append(Icons.canvas(p));
      const hp = Game.field(p, 'hp'), hpMax = Game.field(p, 'hpMax'), status = Game.field(p, 'status');
      // status 0 is okay, 1 in the Buck Rogers games
      col.append(el('div', { className: 'nm' + (status !== (Game.g >= 10 ? 1 : 0) ? ' dead' : ''), textContent: Game.name(p),
        title: describeChar(p), onclick: () => Editor.open(Game.party.indexOf(p)) }));
      if (Settings.v.xpMeter) { const fr = xpFraction(p); col.append(el('div', { className: 'xp', title: `${Game.field(p, 'xp')} XP` },
        el('i', { style: `width:${fr * 100}%` }))); }
      const hpf = hpMax ? Math.max(0, Math.min(1, hp / hpMax)) : 0;
      col.append(el('div', { className: 'hp' }, el('i', { className: hpf < 0.5 ? 'low' : '', style: `width:${hpf * 100}%` }),
        el('span', { textContent: `${hp} / ${hpMax}` })));
      const drained = Game.field(p, 'drained');
      if (drained) col.append(el('div', { className: 'drain', textContent: `drained ${drained} level${drained > 1 ? 's' : ''}` }));
      box.append(col);
    }
  },
};

    ];
  },
  show() {

};
$('#hud').addEventListener('mouseenter', () => HudMenu.show());

/* ------------------------------------------------- HUD actions
 * What GBC writes, from tracing it: encamp-fix sets each member's hit points
 * to the maximum, status 0 (okay) and enabled 1; store spells keeps each
 * member's memorized spells field, restore spells writes it back; race hack
 * makes every demihuman human, restore races puts the races back. */

const HUMAN = [7, 7, 6, 5, 6, 6, 6, 7, 5, 5, -1, -1];
const inCombat = () => !!Game.inCombat;
const Party = {
  load() { try { return JSON.parse(localStorage.getItem('gbc.party.' + Game.g) || '{}'); } catch { return {}; } },
  save(v) { try { localStorage.setItem('gbc.party.' + Game.g, JSON.stringify(v)); } catch {} },
};
async function writeField(p, key, value) {
  const f = Game.f[key];
  if (!f) return false;
  const bytes = new Uint8Array(f[1]);
  for (let k = 0; k < f[1]; k++) bytes[k] = value / 256 ** k & 255;
  await Api.write(p.addr + f[0], bytes);
  return true;
}
function notInCombat(what) {
  if (!inCombat()) return true;
  alert(`${what} can not be used in combat.`);
  return false;
}
async function encampFix() {
  if (!notInCombat('Encamp-fix')) return;
  for (const p of Game.party) {
    await writeField(p, 'hp', Game.field(p, 'hpMax'));
    await writeField(p, 'status', Game.g >= 10 ? 1 : 0);   // okay (1 in the Buck Rogers games)
    await writeField(p, 'enabled', 1);
  }
  if (Settings.v.fixDrain) await fixDrain();
  log('Encamp-fix: hit points restored');
  Hud.last = '';
}
// the spells field, or DKoK's spell block behind a pointer
function spellsAt(p) {
  const f = Game.f;
  if (f.memSpells) return [p.addr + f.memSpells[0], f.memSpells[1]];
  if (f.spellsAddr) { const a = far(p.r, f.spellsAddr[0]); return a ? [a, 99] : null; }
  return null;
}
async function storeSpells(quiet) {
  if (!Game.f.memSpells && !Game.f.spellsAddr) return;
  if (quiet !== true && !notInCombat('Store spells')) return;
  const v = Party.load(); v.spells = {};
  for (const p of Game.party) {
    const at = spellsAt(p);
    if (at) v.spells[Game.name(p)] = [...await Api.read(...at)];
  }
  Party.save(v);
  if (quiet !== true) log('Memorized spells stored');
}
async function restoreSpells() {
  if (!notInCombat('Restore spells')) return;
  const v = Party.load();
  if (!v.spells) { alert('No spells stored yet.'); return; }
  let n = 0;
  for (const p of Game.party) {
    const at = spellsAt(p), s = v.spells[Game.name(p)];
    if (at && s && s.length === at[1]) { await Api.write(at[0], Uint8Array.from(s)); n++; }
  }
  log(`Memorized spells restored (${n} characters)`);
}
async function raceHack() {
  const human = HUMAN[Game.g];
  if (human < 0 || !notInCombat('Race hack')) return;
  const v = Party.load(); v.races ??= {};
  for (const p of Game.party) {
    const r = Game.field(p, 'race');
    if (r === human) continue;
    v.races[Game.name(p)] = r;
    await writeField(p, 'race', human);
  }
  Party.save(v);
  log('Race hack: every demihuman is human for now');
}
async function restoreRaces() {
  const v = Party.load();
  if (!v.races || !Object.keys(v.races).length) { alert('No races to restore.'); return; }
  for (const p of Game.party) {
    const r = v.races[Game.name(p)];
    if (r !== undefined) { await writeField(p, 'race', r); delete v.races[Game.name(p)]; }
  }
  Party.save(v);
  log('Races restored');
}
// fix drain (GBC.txt: in Pool of Radiance only within the session the levels
// were lost in): each member's levels and maximum hit points as first seen in
// this session come back when they have dropped or the game counts drained levels
const Snap = {};
function snapshot() {
  for (const p of Game.party) {
    const k = Game.g + ':' + Game.name(p);
    if (Snap[k] || Game.field(p, 'drained')) continue;
    Snap[k] = { levels: Object.fromEntries(CLASS_LEVELS.filter(([f]) => Game.f[f]).map(([f]) => [f, Game.field(p, f)])),
      hpMax: Game.field(p, 'hpMax') };
  }
}
async function fixDrain() {
  for (const p of Game.party) {
    const s = Snap[Game.g + ':' + Game.name(p)];
    if (!s) continue;
    const lower = Object.entries(s.levels).some(([f, lv]) => Game.field(p, f) < lv);
    if (!lower && !Game.field(p, 'drained')) continue;
    for (const [f, lv] of Object.entries(s.levels)) if (Game.field(p, f) < lv) await writeField(p, f, lv);
    if (Game.field(p, 'hpMax') < s.hpMax) { await writeField(p, 'hpMax', s.hpMax); await writeField(p, 'hp', s.hpMax); }
    await writeField(p, 'drained', 0); await writeField(p, 'drainedHp', 0);
    log(`${Game.name(p)}: drained levels fixed`);
  }
}
/* ------------------------------------------------------------ music
 * GBC_Audio: GBC's Music folder (picked): Music\NN. <game>.txt points the
 * world map, combat, victory and each area (by area number) to subfolders;
 * a random file from the folder plays, the next one when it ends. Browsers
 * play MP3, OGG and WAV (not the tracker formats GBC_Audio also took). Esc
 * or right click on the HUD stops it, F1/F2 change the volume. */

const Music = {
  dirs: null, configs: {}, audio: new Audio(), want: '', stopped: false, victory: false,
  pick() {
    const inp = el('input', { type: 'file', webkitdirectory: true, multiple: true });
    inp.onchange = async () => {
      const dirs = {};
      for (const f of inp.files) {
        const parts = f.webkitRelativePath.split('/'), i = parts.findIndex(p => p.toLowerCase() === 'music');
        const rest = (i >= 0 ? parts.slice(i + 1) : parts.slice(1));
        if (rest.length === 1 && /^\d\d\. .*\.txt$/i.test(rest[0])) this.configs[+rest[0].slice(0, 2) - 1] = parseMusic(await f.text());
        else if (rest.length >= 2 && /\.(mp3|ogg|wav|m4a|flac)$/i.test(f.name)) (dirs[rest.slice(0, -1).join('/').toLowerCase()] ??= []).push(f);
      }
      this.dirs = dirs; this.stopped = false; this.want = '';
      log(`Music: ${Object.values(dirs).reduce((n, l) => n + l.length, 0)} files in ${Object.keys(dirs).length} folders`);
      this.update();
    };
    inp.click();
  },
  folder() {
    const c = this.configs[Game.g] || {}, sub = (c.subfolder || '').replace(/\\/g, '/').replace(/\/?$/, '/').replace(/^\/$/, '');
    if (this.victory) return sub + (c.victory || 'Victory');
    if (Game.inCombat) return sub + (c.combat || 'Combat');
    if (Game.world) return sub + (c.world || 'World');
    return sub + (c.areas?.[Game.area] || 'Town');
  },
  update() {
    if (!this.dirs || this.stopped || Game.g < 0) return;
    const want = this.folder().replace(/[\\/]+$/, '').toLowerCase();
    if (want === this.want && !this.audio.paused) return;
    this.want = want;
    const list = this.dirs[want];
    if (!list?.length) { this.audio.pause(); return; }
    const f = list[Math.random() * list.length | 0];
    if (this.audio.src) URL.revokeObjectURL(this.audio.src);
    this.audio.src = URL.createObjectURL(f);
    this.audio.onended = () => { if (this.victory) this.victory = false; this.want = ''; this.update(); };
    this.audio.play().catch(() => {});
  },
  stop() { this.stopped = true; this.audio.pause(); log('Music stopped'); },
  volume(d) { this.audio.volume = Math.max(0, Math.min(1, this.audio.volume + d)); },
};
function parseMusic(text) {
  const tag = name => text.match(new RegExp(`<${name}>\\s*([^<]*?)\\s*</${name}>`, 'i'))?.[1] || '';
  const areas = {};
  for (const m of text.matchAll(/<area_(\d+)_folder>\s*([^<]*?)\s*<\/area_\d+_folder>/gi)) areas[+m[1]] = m[2];
  return { subfolder: tag('subfolder'), world: tag('world_folder'), combat: tag('combat_folder'), victory: tag('victory_folder'), areas };
}
$('#hud').addEventListener('contextmenu', ev => { if (Music.dirs) { ev.preventDefault(); Music.stop(); } });
document.addEventListener('keydown', ev => {
  if (!Music.dirs || ev.target.closest('input, select, textarea')) return;
  if (ev.key === 'F1') { ev.preventDefault(); Music.volume(-0.1); }
  else if (ev.key === 'F2') { ev.preventDefault(); Music.volume(+0.1); }
  else if (ev.key === 'Escape' && !document.querySelector('.dlg, .menu')) Music.stop();

async function fixAllStats() {

async function weakenEnemies() {

// AUTODISABLE QUICKFIGHT: when a combat ends, nobody stays on quickfight

function toggleMap() { const w = $('#mapwrap'); w.classList.toggle('hidden'); }
function toggleWorld() { Render.world = !Render.world; Render.draw(); updateTitle(); }
function saveMap() { Render.canvas.toBlob(b => download(b, `${Game.areaName().replace(/[^\w ]+/g, '')}.png`)); }
function quit() { window.close(); }

function classLevels(p) {
  return CLASS_LEVELS.map(([k, n]) => [n, Game.field(p, k) || 0]).filter(([, l]) => l > 0);
}
function describeChar(p) {
  const lv = classLevels(p).map(([n, l]) => `${n} ${l}`).join(' / ');
  return `${lv}\nXP ${Game.field(p, 'xp')}\nAC ${signed(Game.field(p, 'ac'))}  THAC0 ${Game.field(p, 'thac0')}`;
}
const signed = v => v > 127 ? v - 256 : v;
// share of the way to the next level (the class closest to it)
function xpFraction(p) {
  const tables = Data.games[Game.g]?.xp, xp = Game.field(p, 'xp') || 0, cls = classLevels(p);
  if (!tables || !cls.length) return 0;
  let best = 0;
  for (const [n, l] of cls) {
    const t = tables[n] || tables[n + 's'];
    if (!t || !t[l + 1]) continue;
    const per = xp / cls.length, fr = (per - (t[l] || 0)) / (t[l + 1] - (t[l] || 0));
    best = Math.max(best, Math.max(0, Math.min(1, fr)));
  }
  return best;
}

/* -------------------------------------------------------- combat icons
 * Composed like GBC does from its per-game sheets (Games\NN. ..\): Head.bmp
 * over Body.bmp, 24x24 cells, row = icon size - 1, column = the head or body
 * number, recoloured with the character's six icon colour bytes the way the
 * games do it (the sheets' EGA colours 1 2 3 4 6 7 take the low nibbles of
 * body, arm, leg, hair, shield, weapon, colours 9 10 11 12 14 15 the high
 * ones); Icon.bmp by icon number in the games without heads and bodies;
 * <NAME>_1.bmp for NPCs; Death_1.bmp for the dead. Initials without the GBC
 * folder. */

const EGA = [[0, 0, 0], [0, 0, 170], [0, 170, 0], [0, 170, 170], [170, 0, 0], [170, 0, 170], [170, 85, 0], [170, 170, 170],
  [85, 85, 85], [85, 85, 255], [85, 255, 85], [85, 255, 255], [255, 85, 85], [255, 85, 255], [255, 255, 85], [255, 255, 255]];
const ICON_PARTS = ['icBody', 'icArm', 'icLeg', 'icHair', 'icShield', 'icWeapon'], ICON_BASE = [1, 2, 3, 4, 6, 7];
const isDead = p => Game.field(p, 'status') === (Game.g >= 10 ? 3 : 6);   // the Buck Rogers games number them differently

const Icons = {
  sheets: {},   // `${game}:${file}` -> ImageData, null when missing
  async sheet(name) {
    const k = `${Game.g}:${name.toLowerCase()}`;
    if (k in this.sheets) return this.sheets[k];
    const buf = await Data.file(Game.g, name);
    let img = null;
    if (buf) try {
      const bmp = await createImageBitmap(new Blob([buf]));
      const c = el('canvas', { width: bmp.width, height: bmp.height }), g = c.getContext('2d', { willReadFrequently: true });
      g.drawImage(bmp, 0, 0);
      img = g.getImageData(0, 0, bmp.width, bmp.height);
    } catch {}
    return this.sheets[k] = img;
  },
  // the 24x24 cell (col, row) of a sheet as RGBA bytes
  async cell(name, col, row) {
    const s = await this.sheet(name);
    if (!s || (col + 1) * 24 > s.width || (row + 1) * 24 > s.height) return null;
    const out = new Uint8ClampedArray(24 * 24 * 4);
    for (let y = 0; y < 24; y++) out.set(s.data.subarray(((row * 24 + y) * s.width + col * 24) * 4, ((row * 24 + y) * s.width + col * 24 + 24) * 4), y * 96);
    return out;
  },
  async picture(p) {
    if (isDead(p)) { const d = await this.cell('Death_1.bmp', 0, 0); if (d) return d; }
    const own = await this.cell(Game.name(p) + '_1.bmp', 0, 0);
    if (own) return own;
    if (Game.f.iconHead) {
      const row = Math.max(0, Math.min(1, (Game.field(p, 'iconSize') || 1) - 1));
      const body = await this.cell('Body.bmp', Game.field(p, 'iconBody'), row);
      const head = await this.cell('Head.bmp', Game.field(p, 'iconHead'), row);
      if (!body) return null;
      if (head) for (let i = 0; i < body.length; i += 4)   // the head over the body; 55 55 55 is the background
        if (head[i] !== 85 || head[i + 1] !== 85 || head[i + 2] !== 85) body.set(head.subarray(i, i + 4), i);
      const map = EGA.map((_, i) => i);
      ICON_PARTS.forEach((k, i) => { const v = Game.field(p, k) || 0; map[ICON_BASE[i]] = v & 15; map[ICON_BASE[i] + 8] = v >> 4; });
      for (let i = 0; i < body.length; i += 4) {
        const c = EGA.findIndex(e => e[0] === body[i] && e[1] === body[i + 1] && e[2] === body[i + 2]);
        if (c >= 0 && map[c] !== c) body.set(EGA[map[c]], i);
      }
      return body;
    }
    if (Game.f.icon) return this.cell('Icon.bmp', Game.field(p, 'icon'), 0);
    return null;
  },
  canvas(p) {
    const c = el('canvas', { className: 'icon', width: 48, height: 48 }), g = c.getContext('2d');
    const initials = () => {
      g.fillStyle = '#555'; g.fillRect(0, 0, 48, 48);
      g.fillStyle = '#cfcfcf'; g.font = 'bold 18px Tahoma'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(Game.name(p).slice(0, 2), 24, 25);
    };
    initials();
    this.picture(p).then(px => {
      if (!px) return;
      const t = el('canvas', { width: 24, height: 24 });
      t.getContext('2d').putImageData(new ImageData(px, 24, 24), 0, 0);
      g.imageSmoothingEnabled = false; g.drawImage(t, 0, 0, 48, 48);
    }).catch(() => {});
    return c;
  },
};

/* ------------------------------------------------- explored, notes */

const Store = {
  explored: {}, notes: {}, dirty: new Set(), gen: 0,
  key() { return `${Game.g}:${Game.geo}:${Game.area}`; },
  exp() {
    const k = this.key();
    if (!this.explored[k]) {
      const m = this.explored[k] = new Uint8Array(MW() * MH());
      DB.get('kv', 'exp:' + k).then(b => { if (b) { const o = new Uint8Array(b); for (let i = 0; i < 256; i++) m[i] |= o[i]; this.gen++; Render.draw(); } });
    }
    return this.explored[k];
  },
  mark(x, y) { if (x < 0 || y < 0 || x >= MW() || y >= MH()) return; const m = this.exp(), i = cellOf(x, y); if (!m[i]) { m[i] = 1; this.dirty.add(this.key()); this.gen++; } },
  fill(v) { this.exp().fill(v); this.dirty.add(this.key()); this.gen++; Render.draw(); },
  async notesOf() {
    const k = this.key();
    if (!this.notes[k]) this.notes[k] = (await DB.get('kv', 'notes:' + k)) || {};
    return this.notes[k];
  },
  async setNote(b, id, text) {
    const n = await this.notesOf();
    if (id) n[b] = { id, text }; else delete n[b];
    await DB.put('kv', 'notes:' + this.key(), n);
    Render.draw();
  },
  async clearGame() {
    for (const k of await DB.keys('kv')) if (String(k).startsWith(`exp:${Game.g}:`)) await DB.del('kv', k);
    this.explored = {}; this.gen++; Render.draw();
  },
  flush() {
    for (const k of this.dirty) DB.put('kv', 'exp:' + k, this.explored[k].buffer.slice(0));
    this.dirty.clear();
  },
};
setInterval(() => Store.flush(), 3000);

/* ------------------------------------------------------------ map */

const MV = [[0, -1], [1, 0], [0, 1], [-1, 0]];   // N E S W
// the map the party is on: the live 16x16 arrays, or for the bigger areas of
// The Dark Queen of Krynn the area's arrays from GBC's Game.dat (rows of w)
function mapView() {
  const rec = Game.areaRec();
  if (rec?.map && (rec.w !== 16 || rec.h !== 16 || Game.g === 6))
    return { w: rec.w, h: rec.h, data: rec.map, stride: rec.w, base: [0, 2501, 5002, 7503], live: false };
  return Game.map ? { w: 16, h: 16, data: Game.map, stride: 16, base: [0, 256, 512, 768], live: true } : null;
}
const MW = () => Game.mv?.w || 16, MH = () => Game.mv?.h || 16;
const cellOf = (x, y) => y * MW() + x;
// wall type on side s (0 N, 1 E, 2 S, 3 W) of cell x,y, and its door bits
function wall(x, y, s) {
  const M = Game.mv, i = y * M.stride + x, d = M.data;
  return s === 0 ? d[M.base[0] + i] >> 4 : s === 1 ? d[M.base[0] + i] & 15 : s === 2 ? d[M.base[1] + i] >> 4 : d[M.base[1] + i] & 15;
}
function door(x, y, s) { const M = Game.mv; return (M.data[M.base[3] + y * M.stride + x] >> (s * 2)) & 3; }
function event(x, y) { const M = Game.mv; return M.data[M.base[2] + y * M.stride + x]; }

function partyExplore() {
  if (!Game.mv) return;
  Store.mark(Game.x, Game.y);
  const d = Game.dir >> 1;   // 0..7 -> N E S W
  let x = Game.x, y = Game.y;
  for (let i = 0; i < 3; i++) {
    if (wall(x, y, d) && !door(x, y, d)) break;
    x += MV[d][0]; y += MV[d][1];
    if (x < 0 || y < 0 || x >= MW() || y >= MH()) break;
    Store.mark(x, y);
    for (const s of [(d + 1) & 3, (d + 3) & 3]) if (!wall(x, y, s)) Store.mark(x + MV[s][0], y + MV[s][1]);
    if (wall(x, y, d) || door(x, y, d)) break;
  }
  for (let s = 0; s < 4; s++) if (!wall(Game.x, Game.y, s)) Store.mark(Game.x + MV[s][0], Game.y + MV[s][1]);
}

// GBC's map colours
const MAPC = { bg: '#b2944e', cell: '#aa8c46', flagged: '#a2843e', wall: '#594a2d', door: '#cccccc', party: '#00aa00',
  partyEdge: '#005500', event: '#7a1010', note: '#10306a' };

const Render = {
  canvas: $('#map'), mouse: null, notes: {},
  cellSize() {
    const wrap = $('#mapwrap'), z = Settings.v.zoom;
    return z > 0 ? z : Math.max(8, Math.floor(Math.min(wrap.clientWidth / (MW() + 1), wrap.clientHeight / (MH() + 1))));
  },
  // GBC's look: khaki, explored cells a shade darker (darker still where the
  // event byte has its top bit), walls drawn per explored cell across its
  // edges, doors as grey boxes on the wall, and each wall type drawn the way
  // GBC's Game.dat says for the area (see parseAreas)
  // the combat view: 20x20 cells of the battlefield around the combatants,
  // GBC's squares with hit points (red enemies, green friends, grey the one
  // acting; held or helpless ones lighter)
  combatOrigin: null,
  drawCombat() {
    const list = Game.combat, c = this.canvas, g = c.getContext('2d');
    const cs = Math.max(14, Math.round(this.cellSize() * 16 / 20)), m = Math.round(cs / 2), size = cs * 20 + 2 * m;
    if (c.width !== size) { c.width = size; c.height = size; }
    const xs = list.map(e => e.x), ys = list.map(e => e.y);
    const ox = Math.max(0, Math.round((Math.min(...xs) + Math.max(...xs)) / 2) - 10), oy = Math.max(0, Math.round((Math.min(...ys) + Math.max(...ys)) / 2) - 10);
    this.combatOrigin = { ox, oy, cs, m };
    g.fillStyle = '#a2843e'; g.fillRect(0, 0, size, size);
    g.strokeStyle = MAPC.wall; g.lineWidth = 2; g.strokeRect(1, 1, size - 2, size - 2); g.strokeRect(m - 1, m - 1, cs * 20 + 2, cs * 20 + 2);
    g.fillStyle = '#8a722a';
    for (let i = 0; i <= 20; i++) { g.fillRect(m + i * cs, m, 1, cs * 20); g.fillRect(m, m + i * cs, cs * 20, 1); }
    const f = Game.f, held = e => e.c.effects?.some(x => /^(held|helpless|asleep|paralyzed|stunned)$/i.test(Data.games[Game.g]?.effects?.[x.type - 1]?.[1] || ''));
    g.font = `${Math.max(8, Math.round(cs * 0.45))}px Tahoma, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const e of list) {
      const X = m + (e.x - ox) * cs, Y = m + (e.y - oy) * cs, r = e.c.r;
      if (e.x < ox || e.y < oy || e.x >= ox + 20 || e.y >= oy + 20) continue;
      const st = r[f.status[0]], gone = st >= 4 && st !== 7 && Game.g < 10 || Game.g >= 10 && st >= 2 && st <= 5;
      if (gone) continue;
      const hostile = f.hostile && r[f.hostile[0]];
      const [fill, edge] = e.active ? ['#999', '#444'] : hostile ? ['#cc0000', '#550000'] : ['#00aa00', '#005500'];
      g.fillStyle = edge; g.fillRect(X + 1, Y + 1, cs - 1, cs - 1);
      g.fillStyle = held(e) ? (hostile ? '#e87070' : '#70d070') : fill; g.fillRect(X + 2, Y + 2, cs - 3, cs - 3);
      g.fillStyle = '#fff'; g.fillText(String(r[f.hp[0]]), X + cs / 2 + 0.5, Y + cs / 2 + 1);
    }
  },
  combatAt(ev) {
    const o = this.combatOrigin;
    if (!o || !Game.combat) return null;
    const r = this.canvas.getBoundingClientRect(), k = this.canvas.width / r.width;
    const x = Math.floor(((ev.clientX - r.left) * k - o.m) / o.cs) + o.ox, y = Math.floor(((ev.clientY - r.top) * k - o.m) / o.cs) + o.oy;
    return Game.combat.find(e => e.x === x && e.y === y) || null;
  },
  draw() {
    if (Game.combat?.length) return this.drawCombat();
    this.combatOrigin = null;
    if (this.world) { this.drawWorld(); return; }
    this.worldScale = null;
    if (!Game.mv) return;
    const W = MW(), H = MH(), cs = this.cellSize(), m = this.margin(cs), c = this.canvas, g = c.getContext('2d');
    const sw = cs * W + 2 * m, sh = cs * H + 2 * m;
    if (c.width !== sw || c.height !== sh) { c.width = sw; c.height = sh; }
    g.fillStyle = MAPC.bg; g.fillRect(0, 0, sw, sh);
    g.strokeStyle = MAPC.wall; g.lineWidth = 2; g.strokeRect(1, 1, sw - 2, sh - 2);
    const exp = Store.exp(), all = Settings.v.debug, shown = (x, y) => all || exp[cellOf(x, y)];
    const modes = Game.areaRec()?.modes, wt = Math.max(2, Math.round(cs / 8));
    g.save(); g.translate(m, m);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (!shown(x, y)) continue;
      g.fillStyle = event(x, y) & 0x80 ? MAPC.flagged : MAPC.cell;
      g.fillRect(x * cs + 1, y * cs + 1, cs - 1, cs - 1);
    }
    const boxes = [];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (!shown(x, y)) continue;
      for (let s = 0; s < 4; s++) {
        const w = wall(x, y, s);
        if (!w) continue;
        const pass = door(x, y, s), mode = modes ? modes[w] : 8;
        const look = mode === 7 ? 'wall' : mode === 9 ? 'door' : mode === 1 ? (pass ? '' : 'wall') : mode === 2 ? (pass ? 'dashed' : '')
          : mode === 3 ? (pass ? 'arch' : 'wall') : mode === 0 ? '' : pass ? 'door' : 'wall';
        if (!look) continue;
        // the edge: from (x0,y0) to (x1,y1)
        const x0 = (s === 1 ? x + 1 : x) * cs, y0 = (s === 2 ? y + 1 : y) * cs, horiz = s === 0 || s === 2;
        const x1 = horiz ? x0 + cs : x0, y1 = horiz ? y0 : y0 + cs;
        g.fillStyle = MAPC.wall;
        // whole pixels: wt wide, h of them before the edge
        const h = wt >> 1, line = (a, b) => horiz ? g.fillRect(x0 + a, y0 - h, b - a, wt) : g.fillRect(x0 - h, y0 + a, wt, b - a);
        if (look === 'wall' || look === 'door') line(-h, cs + wt - h);
        else if (look === 'arch') { line(-h, Math.round(cs * 0.23)); line(cs - Math.max(2, Math.round(cs * 0.14)), cs + wt - h); }
        else if (look === 'dashed') {
          g.save(); g.strokeStyle = '#000'; g.lineWidth = Math.max(1, wt / 2); g.setLineDash([Math.max(2, cs / 7), Math.max(2, cs / 7)]);
          g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); g.restore();
        }
        if (look === 'door') boxes.push([x0, y0, horiz]);
      }
    }
    // doors last, so neighbouring walls don't cover them
    const bl = Math.round(cs * 0.6), bw = Math.max(4, Math.round(cs * 0.28));
    for (const [x0, y0, horiz] of boxes) {
      const a = Math.round((cs - bl) / 2), b = bw >> 1;
      const [bx, by, w, h] = horiz ? [x0 + a, y0 - b, bl, bw] : [x0 - b, y0 + a, bw, bl];
      g.fillStyle = MAPC.wall; g.fillRect(bx, by, w, h);
      g.fillStyle = MAPC.door; g.fillRect(bx + 1, by + 1, w - 2, h - 2);
    }
    // event numbers or notes
    g.font = `bold ${Math.max(9, Math.round(cs * 0.4))}px Tahoma, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    if (Settings.v.mapMarks === 'events') for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const e = event(x, y) & 0x7F;
      if (!e || !shown(x, y)) continue;
      g.fillStyle = MAPC.event; g.fillText(String(e), x * cs + cs / 2, y * cs + cs / 2);
    }
    if (Settings.v.mapMarks === 'notes') for (const [b, n] of Object.entries(this.notes)) {
      g.fillStyle = MAPC.note; g.fillText(n.id, (b % W) * cs + cs / 2, Math.floor(b / W) * cs + cs / 2);
    }
    // the party: an arrow in one of 8 directions
    const px = Game.x * cs + cs / 2, py = Game.y * cs + cs / 2, a = Game.dir * Math.PI / 4;
    g.save(); g.translate(px, py); g.rotate(a);
    g.fillStyle = MAPC.party; g.strokeStyle = MAPC.partyEdge; g.lineWidth = Math.max(1, cs / 20); g.beginPath();
    g.moveTo(0, -cs * 0.34); g.lineTo(cs * 0.3, cs * 0.3); g.lineTo(-cs * 0.3, cs * 0.3); g.closePath(); g.fill(); g.stroke();
    g.restore();
    if (this.mouse) { g.strokeStyle = '#ff2020'; g.lineWidth = 1; g.strokeRect(this.mouse.x * cs + 0.5, this.mouse.y * cs + 0.5, cs - 1, cs - 1); }
    g.restore();
  },
  // the world map (menu: World map, or W): GBC's World.bmp (Pools of Darkness:
  // World_<GEO>.bmp), its titles from Game.dat (T toggles them), the party at
  // the outdoor x, y; Ctrl+click teleports there
  world: false, worldImg: null, worldScale: null,
  async drawWorld() {
    const gd = Data.games[Game.g], name = (await Data.file(Game.g, `World_${String(Game.geo).padStart(3, '0')}.bmp`)) ? `World_${String(Game.geo).padStart(3, '0')}.bmp` : 'World.bmp';
    const sheet = await Icons.sheet(name), c = this.canvas, g = c.getContext('2d');
    if (!sheet) { g.fillStyle = MAPC.bg; g.fillRect(0, 0, c.width, c.height); return; }
    const titles = (gd?.titles || []).filter(t => t.name && t.map === (name === 'World.bmp' ? 0 : Game.geo));
    // cells: PoR 24 x 30 (3x scaled EGA), Krynn 8 x 8; else from the titles' extent
    const known = { 0: [24, 30], 4: [8, 8], 5: [8, 8], 6: [8, 8] }[Game.g];
    const ext = [Math.max(1, ...titles.map(t => t.x)) + 3, Math.max(1, ...titles.map(t => t.y)) + 3];
    const [sx, sy] = known || [sheet.width / ext[0], sheet.height / ext[1]];
    const wrap = $('#mapwrap'), k = Math.max(0.5, Math.min(4, Math.min(wrap.clientWidth / sheet.width, wrap.clientHeight / sheet.height)));
    if (c.width !== Math.round(sheet.width * k)) { c.width = Math.round(sheet.width * k); c.height = Math.round(sheet.height * k); }
    this.worldScale = { sx: sx * k, sy: sy * k };
    const t = el('canvas', { width: sheet.width, height: sheet.height }); t.getContext('2d').putImageData(sheet, 0, 0);
    g.imageSmoothingEnabled = false; g.drawImage(t, 0, 0, c.width, c.height);
    if (Settings.v.titles !== false) {
      g.font = `bold ${Math.max(10, Math.round(11 * k))}px Tahoma, sans-serif`; g.textBaseline = 'top';
      for (const ti of titles) {
        const X = ti.x * sx * k, Y = ti.y * sy * k;
        g.fillStyle = '#000'; g.fillText(ti.name, X + 1, Y + 1); g.fillStyle = '#ffffa0'; g.fillText(ti.name, X, Y);
      }
    }
    if (Game.outX || Game.outY) {
      const X = (Game.outX + 0.5) * sx * k, Y = (Game.outY + 0.5) * sy * k;
      g.strokeStyle = '#fff'; g.lineWidth = 3; g.beginPath(); g.arc(X, Y, Math.max(5, sx * k * 0.6), 0, 7); g.stroke();
      g.strokeStyle = '#d00'; g.lineWidth = 2; g.stroke();
    }
  },
  worldAt(ev) {
    const s = this.worldScale;
    if (!s) return null;
    const r = this.canvas.getBoundingClientRect(), k = this.canvas.width / r.width;
    return { x: Math.floor((ev.clientX - r.left) * k / s.sx), y: Math.floor((ev.clientY - r.top) * k / s.sy) };
  },
  margin: cs => Math.round(cs * 0.45),
  cellAt(ev) {
    const r = this.canvas.getBoundingClientRect(), k = this.canvas.width / r.width, cs = this.cellSize(), m = this.margin(cs);
    const x = Math.floor(((ev.clientX - r.left) * k - m) / cs), y = Math.floor(((ev.clientY - r.top) * k - m) / cs);
    return x >= 0 && y >= 0 && x < MW() && y < MH() ? { x, y, b: cellOf(x, y) } : null;
  },
};

function updateTitle() {
  if (Game.g < 0) return;
  let t = `${Game.areaName()} - ${pad2(Game.x)},${pad2(Game.y)} ${DIR8[Game.dir]}`;
  if (Render.mouse) t += `   (${pad2(Render.mouse.x)},${pad2(Render.mouse.y)})`;
  $('#title').textContent = t;
  document.title = t + ' - GBC';
}

/* ------------------------------------------------------- main loop */

async function loop() {
  Settings.load();
  $('#dbg').classList.toggle('hidden', !Settings.v.debug);
  const q = new URLSearchParams(location.search);
  if (q.get('gbcdata')) await importGbcUrl(q.get('gbcdata')).catch(e => log(e.message));
  if (q.get('gamedata')) Files.url = q.get('gamedata').replace(/\/?$/, '/');
  await Data.load();
  try { Game.dosbox = await Api.info(); }
  catch {
    setConn('no API', 'bad');
    $('#msg').innerHTML = '<h2>DOSBox Staging\'s API is not reachable</h2><p>Open this page through DOSBox Staging\'s ' +
      'webserver, e.g. <b>http://localhost:8086/gbc.html</b>, with <code>webserver_enabled = on</code> in its config.</p>';
    return;
  }
  let lastArea = '';
  for (;;) {
    try {
      if (Game.g < 0) {
        setConn('searching', 'warn');
        $('#msg').innerHTML = '<h2>Waiting for a Gold Box game</h2><p>Start the game, load a saved game and begin ' +
          'playing. Gold Box Companion finds the game by itself.</p>';
        if (!await Game.find()) { await sleep(2000); continue; }
        $('#msg').innerHTML = '';
        $('#game').textContent = SHORT[Game.g]; $('#game').title = GAME_NAMES[Game.g]; $('#game').classList.remove('hidden');
        log(`${GAME_NAMES[Game.g]} found, base ${hex(Game.base, 6)}`);
        Game.fresh = true;
      }
      await Game.poll();
      if (!Game.party.length) { await sleep(500); }
      else if (Game.fresh) {   // GBC stores the spells after each search, and fixes stats when that is on
        Game.fresh = false; await storeSpells(true);
        if (Settings.v.fixStats) await fixAllStats();
      }
      snapshot();
      await afterCombat();
      Music.update();
      if (++Game.ticks % 8 === 0) await itemChores();
      setConn(`DOSBox ${Game.dosbox.version.split(' ')[0]}`, 'ok');
      const key = Store.key();
      if (key !== lastArea) { lastArea = key; Render.notes = await Store.notesOf(); }
      partyExplore();
      Hud.draw();
      updateTitle();
      Render.draw();
    } catch (e) {
      setConn('DOSBox not answering', 'bad');
      Game.g = -1;
      await sleep(1500);
    }
    await sleep(250);
  }
}
function setConn(text, cls) { const c = $('#conn'); c.textContent = text; c.className = 'chip ' + cls; }

/* ---------------------------------------------------------- events */

const cv = Render.canvas;
// a combatant's statistics (GBC's statistics window)
function combatantText(e) {
  const f = Game.f, r = e.c.r, V = VALUES[Game.g + 1] || {}, fx = Data.games[Game.g]?.effects || [];
  const lines = [Game.name(e.c), `HP ${r[f.hp[0]]} / ${r[f.hpMax[0]]}   AC ${signed(r[f.ac[0]])}   THAC0 ${r[f.thac0[0]]}`,
    `status ${V.status?.[r[f.status[0]]] ?? r[f.status[0]]}${f.hostile && r[f.hostile[0]] ? ', hostile' : ''}`];
  for (const x of e.c.effects || []) lines.push(`  ${fx[x.type - 1]?.[1] || '$' + hex(x.type, 2)}${x.minutes ? ` (${x.minutes} min)` : ''}`);
  return lines.join('\n');
}
function showTip(ev, text) {
  const tip = $('#tip');
  if (!text) { tip.style.display = 'none'; return; }
  tip.textContent = text; tip.style.display = 'block';
  tip.style.left = Math.min(ev.clientX + 16, innerWidth - tip.offsetWidth - 4) + 'px';
  tip.style.top = Math.min(ev.clientY + 16, innerHeight - tip.offsetHeight - 4) + 'px';
}
cv.addEventListener('mousemove', ev => {
  if (Game.combat) { const e = Render.combatAt(ev); showTip(ev, e && combatantText(e)); return; }
  const c = Render.cellAt(ev);
  Render.mouse = c; updateTitle(); Render.draw();
  const tip = $('#tip');
  if (!c || !Game.mv) { tip.style.display = 'none'; return; }
  const lines = [`${pad2(c.x)},${pad2(c.y)}`];

  if (n) lines.push(`${n.id}: ${n.text}`);
  const e = event(c.x, c.y);
  if (e && (Settings.v.mapMarks === 'events' || Settings.v.debug)) lines.push(`event ${e & 0x7F}`);
  if (Settings.v.debug) lines.push(`walls N${wall(c.x, c.y, 0)} E${wall(c.x, c.y, 1)} S${wall(c.x, c.y, 2)} W${wall(c.x, c.y, 3)}` +
    `  doors ${[0, 1, 2, 3].map(s => door(c.x, c.y, s)).join('')}  event byte ${hex(e, 2)}`);
  tip.textContent = lines.join('\n');
  tip.style.display = 'block';
  tip.style.left = Math.min(ev.clientX + 16, innerWidth - tip.offsetWidth - 4) + 'px';

async function teleport(c) {
  await Api.write(Game.at(8), Uint8Array.of(c.x, c.y));

/* --------------------------------------------------------- GBC data */

function pickFolder() {
  const inp = $('#folderInput');
  inp.value = '';
  inp.onchange = async () => {
    const byGame = {};
    for (const f of inp.files) {
      const parts = f.webkitRelativePath.split('/');
      // Resources\Character file formats\NN. <game>.txt: the record layouts for the editor
      const fm = parts.at(-2)?.toLowerCase() === 'character file formats' && parts.at(-1).match(/^(\d\d)\. .*\.txt$/i);
      if (fm) { (byGame[+fm[1] - 1] ??= {})['format.txt'] = f; continue; }
      const i = parts.findIndex(p => p.toLowerCase() === 'games');
      if (i < 0 || parts.length !== i + 3) continue;
      const m = parts[i + 1].match(/^(\d\d)\. /);
      if (!m) continue;
      (byGame[+m[1] - 1] ??= {})[parts[i + 2]] = f;
    }
    let n = 0;
    for (const [g, files] of Object.entries(byGame)) {
      const bufs = {};
      // the game's own files (not Game.dat.orig and other backups)
      for (const [name, f] of Object.entries(files)) if (/\.(dat|txt|bmp)$/i.test(name)) bufs[name] = await f.arrayBuffer();
      await Data.importGame(+g, bufs); n++;
    }
    log(n ? `GBC data imported for ${n} games` : 'No Games folder found: choose the Gold Box Companion folder');
    Icons.sheets = {}; Hud.last = ''; Render.draw(); updateTitle();
  };
  inp.click();
}
// ?gbcdata=<GBC folder the webserver serves>: the files every game has; the
// rest (NPC icons, world maps) are fetched when needed
async function importGbcUrl(base) {
  if (!base.endsWith('/')) base += '/';
  for (let g = 0; g < 12; g++) {
    const dir = `${base}Games/${encodeURIComponent(GAME_INFO[g].dir)}/`, bufs = {};
    for (const name of ['Game.dat', 'Effects.txt', 'XP.txt', 'Levels.txt', 'Icons.txt', 'Head.bmp', 'Body.bmp', 'Icon.bmp',
      'Death_1.bmp', 'Death_2.bmp', 'Passwords.txt']) {
      const r = await fetch(dir + name, { cache: 'no-store' });
      if (r.ok) bufs[name] = await r.arrayBuffer();
    }
    const fr = await fetch(`${base}Resources/Character%20file%20formats/${encodeURIComponent(GAME_INFO[g].dir)}.txt`, { cache: 'no-store' });
    if (fr.ok) bufs['format.txt'] = await fr.arrayBuffer();
    if (Object.keys(bufs).length) await Data.importGame(g, bufs);
    Data.urls[g] = dir;
  }
  log(`GBC data imported from ${base}`);
}

/* ------------------------------------------------------ game folder
 * Picked with the folder dialog (Chromium: a folder handle that can also
 * write), or served by the webserver (?gamedata=<folder>). Saved games are in
 * the folder itself or in SAVE\. */

const Files = {
  list: null, dir: null, url: '', after: null,
  has() { return !!(this.list || this.dir || this.url); },
  async handle(path) {
    let d = this.dir;
    const parts = path.split('/');
    for (const p of parts.slice(0, -1)) d = await d.getDirectoryHandle(p);
    return d.getFileHandle(parts.at(-1));
  },
  async get(path) {   // { data, date } or null; any case
    try {
      if (this.dir) {
        const parts = path.split('/');
        let d = this.dir;
        for (const p of parts.slice(0, -1)) {
          let next = null;
          for await (const [n, h] of d.entries()) if (h.kind === 'directory' && n.toLowerCase() === p.toLowerCase()) next = h;
          if (!next) return null;
          d = next;
        }
        for await (const [n, h] of d.entries()) if (h.kind === 'file' && n.toLowerCase() === parts.at(-1).toLowerCase()) {
          const f = await h.getFile(); return { data: new Uint8Array(await f.arrayBuffer()), date: f.lastModified, name: n };
        }
        return null;
      }
      if (this.list) {
        const f = this.list.find(f => f.webkitRelativePath.split('/').slice(1).join('/').toLowerCase() === path.toLowerCase());
        return f ? { data: new Uint8Array(await f.arrayBuffer()), date: f.lastModified, name: f.name } : null;
      }
      if (this.url) {
        const r = await fetch(this.url + path, { cache: 'no-store' });
        return r.ok ? { data: new Uint8Array(await r.arrayBuffer()), date: Date.parse(r.headers.get('Last-Modified')) || 0, name: path.split('/').at(-1) } : null;
      }
    } catch {}
    return null;
  },
  // the saved game's files in the folder or SAVE\ (the one that has SAVGAM*)
  async save(name) { return (await this.get(name)) || (await this.get('SAVE/' + name)); },
  async blobUrl(name) {   // for PDFs: a URL to open
    if (this.url) { const r = await fetch(this.url + name, { method: 'HEAD' }).catch(() => null); return r?.ok ? this.url + name : null; }
    const f = await this.get(name);
    return f ? URL.createObjectURL(new Blob([f.data], { type: 'application/pdf' })) : null;
  },
  pick(after) {
    this.after = after || null;
    const done = async () => { log('Game folder chosen'); Wizard.refresh(); if (this.after) { const a = this.after; this.after = null; a(); } };
    if (window.showDirectoryPicker) {
      showDirectoryPicker({ id: 'goldbox', mode: 'readwrite' }).then(d => { Object.assign(this, { dir: d, list: null, url: '' }); done(); },
        e => { if (e.name !== 'AbortError') this.pickInput(done); });
      return;
    }
    this.pickInput(done);
  },
  pickInput(done) {
    const inp = el('input', { type: 'file', webkitdirectory: true, multiple: true });
    inp.onchange = () => { Object.assign(this, { list: [...inp.files].filter(f => f.webkitRelativePath.split('/').length <= 3), dir: null, url: '' }); done(); };
    inp.click();
  },
};

// the saved games A-J: where the party is and when it was saved
async function savedGames() {
  const h = Data.games[Game.g]?.header, areas = Data.games[Game.g]?.areas || [];
  const pat = h?.files?.find(f => /^SAVGAM/i.test(f)) || 'SAVGAM%s.DAT', out = [];
  for (const letter of 'ABCDEFGHIJ') {
    const f = await Files.save(pat.replace(/%s/i, letter));
    if (!f) continue;
    const s = h?.save, at = o => o >= 0 && o < f.data.length ? f.data[o] : -1;
    const geo = s ? at(s.geo) : -1, area = s ? at(s.area) : -1;
    const a = areas.find(a => a.geo === geo && a.area === area);
    out.push({ letter, date: f.date, where: a ? a.name : geo >= 0 ? `GEO ${geo}, area ${area}` : '',
      pos: s ? `${pad2(at(s.x))},${pad2(at(s.y))}` : '' });
  }
  return out.sort((a, b) => b.date - a.date);
}
const fmtDate = ms => { const t = new Date(ms); return `${t.getFullYear()}-${pad2(t.getMonth() + 1)}-${pad2(t.getDate())}  ${pad2(t.getHours())}:${pad2(t.getMinutes())}`; };

// BACKUP SAVE: the newest saved game, all of its files, as a zip
async function backupSave() {
  if (!Files.has()) { alert('Choose the game folder first: the backup takes the saved game from there.'); Files.pick(backupSave); return; }
  const saves = await savedGames();
  if (!saves.length) { alert('No saved games in the game folder.'); return; }
  const s = saves[0], pats = Data.games[Game.g]?.header?.files || ['SAVGAM%s.DAT'], entries = [];
  for (const p of pats) {
    if (!/%d/.test(p)) { const f = await Files.save(p.replace(/%s/i, s.letter)); if (f) entries.push([f.name, f.data]); continue; }
    for (let i = 1; i <= 8; i++) { const f = await Files.save(p.replace(/%s/i, s.letter).replace('%d', i)); if (f) entries.push([f.name, f.data]); }
  }
  const desc = prompt('Description for the backup:', `${s.where} ${s.pos}`.trim());
  if (desc === null) return;
  download(zipStore(entries), `${SHORT[Game.g]} save ${s.letter} ${desc.replace(/[^\w ,.-]+/g, '')} ${new Date().toISOString().slice(0, 16).replace(/[T:]/g, '-')}.zip`);
  log(`Saved game ${s.letter} backed up (${entries.length} files)`);
}
function zipStore(entries) {
  const crcTable = Array.from({ length: 256 }, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
  const crc = d => { let c = 0xFFFFFFFF; for (const b of d) c = crcTable[(c ^ b) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const parts = [], central = [];
  let off = 0;
  for (const [name, data] of entries) {
    const nm = new TextEncoder().encode(name), c = crc(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint32(14, c, true);
    h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nm.length, true);
    parts.push(new Uint8Array(h.buffer), nm, data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint32(16, c, true);
    cd.setUint32(20, data.length, true); cd.setUint32(24, data.length, true); cd.setUint16(28, nm.length, true);
    cd.setUint32(42, off, true);
    central.push(new Uint8Array(cd.buffer), nm);
    off += 30 + nm.length + data.length;
  }
  const size = central.reduce((a, p) => a + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, size, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}

/* ------------------------------------------------------------ items
 * A character's items are a list of records (far pointer to the first in the
 * character): the name as the game shows it (string), the pointer to the
 * next item, then 17 bytes from the item tables (base type, three name parts,
 * bonus, save bonus, readied, cursed, unidentified bits, weight, amount,
 * value, three properties); where they are comes from Game.dat's header. */

// base types of arrows, bolts/quarrels and darts per game (from GBC's item lists)
const AMMO = [[73, 9, 28], [73, 9, 28], [30, 5, 12], [30, 5, 12], [30, 5], [30, 5], [27, 12, 5], [73, 9, 28], [30, 12, 5], null, null, null];
const Items = {
  layout() { return Data.games[Game.g]?.header?.item || null; },
  async list(p) {
    const L = this.layout(), f = Game.f, out = [];
    if (!L || !f.items) return out;
    let a = far(p.r, f.items[0]);
    for (let i = 0; i < 60 && a; i++) {
      const raw = await Api.read(a, Math.max(L.size, L.dax + 17));
      out.push({ addr: a, raw, orig: raw.slice() });
      a = far(raw, L.next);
    }
    return out;
  },
  off(k) { const L = this.layout(); return L.dax + L.fields[k]; },
  get(it, k, n = 1) { const o = this.off(k); return n === 2 ? it.raw[o] | it.raw[o + 1] << 8 : it.raw[o]; },
  set(it, k, v, n = 1) { const o = this.off(k); it.raw[o] = v & 255; if (n === 2) it.raw[o + 1] = v >> 8 & 255; },
  shown(it) { return String.fromCharCode(...it.raw.subarray(1, 1 + Math.min(40, it.raw[0]))).trim(); },
  // the name from its parts, last part first, without the parts the unidentified bits hide
  compose(it) {
    const names = Data.games[Game.g]?.texts?.items || [], o = this.off('name'), hide = this.get(it, 'unid');
    let s = '';
    for (let k = 2; k >= 0; k--) { const id = it.raw[o + k]; if (id && !(hide & 1 << k) && names[id]) s += names[id] + ' '; }
    return s.slice(0, 40);
  },
  async write(it, rename = false) {
    const L = this.layout();
    await Api.write(it.addr + L.dax, it.raw.slice(L.dax, L.dax + 17));
    if (rename) {
      const s = this.compose(it), b = new Uint8Array(1 + s.length);
      b[0] = s.length; for (let k = 0; k < s.length; k++) b[1 + k] = s.charCodeAt(k);
      await Api.write(it.addr, b);
    }
    it.orig = it.raw.slice();
  },
};
// AUTO ID: identify the items in the inventories when their number changes;
// AUTO-AMMO: keep arrows, bolts and darts (up to the plus set) at the amount set
let lastItemCount = -1;
async function itemChores() {
  if (Game.g < 0 || !Items.layout() || inCombat()) return;
  const count = Game.party.reduce((n, p) => n + (Game.field(p, 'nItems') || 0), 0);
  const identify = Settings.v.autoId && count !== lastItemCount;
  lastItemCount = count;
  const ammo = Settings.v.autoAmmo && AMMO[Game.g];
  if (!identify && !ammo) return;
  for (const p of Game.party) for (const it of await Items.list(p)) {

    const sec = c => L.sec[`${c} ${levelOf(c)}`] || {};
    const best = (key, pick) => { const v = all.map(c => sec(c)[key]).filter(x => x !== undefined); return v.length ? pick(...v) : undefined; };
    for (const [key, pick] of [['thac0_base', Math.max], ['attacks', Math.max], ['save_1', Math.min], ['save_2', Math.min], ['save_3', Math.min],
      ['save_4', Math.min], ['save_5', Math.min], ['ac_base', Math.max], ['movement_base', Math.max], ['unarmed_rolls', Math.max],
      ['unarmed_dice', Math.max], ['unarmed_modifier', Math.max], ...Array.from({ length: 8 }, (_, i) => [`thief_${i + 1}`, Math.max])]) {
      const v = best(key, pick), f = byDesc(key.replace(/_/g, ' '));
      if (v !== undefined && f) writes.set(f, v);
    }
    for (const c of all) for (const [k, v] of Object.entries(sec(c))) {
      const m = k.match(/^([a-z]+)_spells_(\d)$/), f = m && byDesc(`${m[1]} spells ${m[2]}`);
      if (!f) continue;
      let n = v;
      if (m[1] === 'cleric' && n > 0) n += (WIS_BONUS[Math.min(18, wis)] || []).filter(x => x === +m[2]).length;
      if (m[1] === 'mage' && +m[2] > intMax(int)) n = 0;
      writes.set(f, n);
    }
    for (const [f, v] of writes) if (typeof f === 'object') notes.push(`${f.desc} = ${v}`);
    return { writes, known, hp, notes };
  },
  // FIX STATS: THAC0, saves, attacks, spells per level as Levels.txt has them
  // for the levels the character has now
  async fixStats(p) {
    if (!this.levels()) return;
    const plan = this.plan(p, []);
    for (const [f, v] of plan.writes) if (typeof f === 'object') {
      const b = new Uint8Array(f.len); for (let k = 0; k < f.len; k++) b[k] = v / 256 ** k & 255;
      if (b.some((x, k) => x !== p.r[f.off + k])) await Api.write(p.addr + f.off, b);
    }
  },
  async apply(p, plan) {
    for (const [f, v] of plan.writes) {
      if (typeof f === 'string') await writeField(p, f, v);
      else { const b = new Uint8Array(f.len); for (let k = 0; k < f.len; k++) b[k] = v / 256 ** k & 255; await Api.write(p.addr + f.off, b); }
    }
    for (const off of plan.known) await Api.write(p.addr + off, Uint8Array.of(1));
    await writeField(p, 'hpMax', (Game.field(p, 'hpMax') || 0) + plan.hp);
    await writeField(p, 'hp', (Game.field(p, 'hp') || 0) + plan.hp);
    if (Game.f.hpRolled) await writeField(p, 'hpRolled', (Game.field(p, 'hpRolled') || 0) + plan.hp);
    log(`${Game.name(p)} leveled up (+${plan.hp} hit points)`);
    Hud.last = '';
  },
};

// DEBUG DUMP: where things are in memory
function debugDump() {
  if (Game.g < 0) return;
  const f = Game.f, lines = [`${GAME_NAMES[Game.g]}  base ${hex(Game.base, 6)}  DOSBox ${Game.dosbox?.version || ''}`, '',
    `map ${hex(Game.mapAddr, 6)}  GEO ${Game.geo} area ${Game.area} (${Game.areaName()})  x,y ${Game.x},${Game.y} dir ${Game.dir}  mode ${Game.mode}`,
    ...Game.info.o.map((v, i) => `o[${i}] ${v ? hex(Game.base + v, 6) : '-'}`), ''];
  for (const p of Game.party) {
    lines.push(`${Game.name(p).padEnd(16)} record ${hex(p.addr, 6)} (${Game.info.rec} bytes)` +
      (f.items ? `  items ${hex(far(p.r, f.items[0]), 6)}` : '') + (f.effects ? `  effects ${hex(far(p.r, f.effects[0]), 6)}` : '') +
      (f.combat ? `  combat ${hex(far(p.r, f.combat[0]), 6)}` : ''));
    for (const e of p.effects) lines.push(`    effect $${hex(e.type, 2)} at ${hex(e.addr, 6)}: ${e.minutes} min, data ${e.data}`);
  }
  TextWin.open('Debug dump', lines.join('\n'));
}

function download(blob, name) {
  const a = el('a', { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

const logLines = [];
function log(text) {
  logLines.push(`${new Date().toTimeString().slice(0, 8)}  ${text}`);
  if (logLines.length > 500) logLines.shift();
  const l = document.querySelector('#log');
  if (l) { l.textContent = logLines.join('\n'); l.parentElement.scrollTop = 1e9; }
}
const LogWin = {
  open() {
    const d = Dlg.make('logwin', 'Debug log', 640), body = d.querySelector('.body');
    body.style.height = '320px';
    if (!body.querySelector('#log')) body.append(el('div', { id: 'log' }));
    log('Log opened');
  },
};

loop();
</script>
