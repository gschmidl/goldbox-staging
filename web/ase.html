<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The All-Seeing Eye</title>
<style>
:root {
  --bg: #1b1610; --text: #e4e0d8; --dim: #7d7466; --menu: #1c1c1c; --sel: #2c4a78; --line: #2c2c2c;
  --rock: #a28440; --floor: #ececec; --grid: #dadada; --wall: #5c4a38;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 13px/1.35 Tahoma, Verdana, "Segoe UI", system-ui, sans-serif; }
#app { display: flex; flex-direction: column; height: 100vh; }
#bar { display: flex; align-items: center; gap: 8px; padding: 3px 8px; background: #161616;
  border-bottom: 1px solid var(--line); white-space: nowrap; min-height: 28px; }
#title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.chip { padding: 0 8px; border-radius: 9px; background: #333; font-size: 12px; }
.chip.ok { background: #0b4d0b; } .chip.bad { background: #6a1010; } .chip.warn { background: #6a5410; }
button, select, input, textarea { background: #222; color: var(--text); border: 1px solid #484848; border-radius: 3px;
  padding: 2px 8px; font: inherit; }
button { cursor: pointer; } button:hover { background: #333; }
input[type=number] { width: 70px; }
#mapwrap { position: relative; flex: 1; overflow: auto; background: var(--rock); }
#map { display: block; margin: 0 auto; }
#tip { position: fixed; pointer-events: none; background: #483929; color: #fff; padding: 0 10px 10px;
  font: 13px/1.4 Consolas, "Courier New", monospace; display: none; z-index: 30; width: 340px; white-space: pre-wrap; }
#msg { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); max-width: 580px;
  text-align: center; color: #2b2010; }
#msg h2 { font-weight: normal; }
.menu { position: fixed; background: var(--menu); border: 1px solid #555; min-width: 230px; padding: 3px 0;
  z-index: 50; box-shadow: 3px 3px 10px #000c; user-select: none; overflow-y: auto; }
.menu .mi { padding: 3px 22px 3px 24px; position: relative; display: flex; justify-content: space-between;
  gap: 24px; cursor: default; white-space: nowrap; }
.menu .mi:hover, .menu .mi.open { background: var(--sel); }
.menu .mi.dis { color: var(--dim); }
.menu .mi.chk::before { content: "\2713"; position: absolute; left: 7px; }
.menu .mi.sub::after { content: "\25B8"; position: absolute; right: 8px; }
.menu .mi .k { color: #999; }
.menu .sep { height: 1px; background: #444; margin: 3px 0; }
.dlg { position: fixed; z-index: 40; background: #121212; border: 1px solid #555; box-shadow: 4px 4px 14px #000c;
  display: flex; flex-direction: column; max-height: 92vh; }
.dlg header { display: flex; align-items: center; gap: 8px; padding: 4px 8px; background: #1f1f1f; cursor: move;
  user-select: none; border-bottom: 1px solid #333; }
.dlg header .t { flex: 1; }
.dlg .body { padding: 8px 10px; overflow: auto; }
.list { border-collapse: collapse; width: 100%; font-size: 12px; }
.list td, .list th { padding: 1px 6px; text-align: left; white-space: nowrap; }
.list th { color: #aaa; font-weight: normal; border-bottom: 1px solid #333; position: sticky; top: 0; background: #121212; }
.list tr.sel td { background: var(--sel); }
.list tr:hover td { background: #1d2a3d; }
.n { text-align: right !important; }
#log { font: 12px/1.3 Consolas, monospace; white-space: pre-wrap; }
.grid2 { display: grid; grid-template-columns: auto auto; gap: 4px 10px; align-items: center; }
.ed { display: grid; grid-template-columns: 170px 1fr; gap: 12px; }
.ed .chars button { display: block; width: 100%; text-align: left; margin-bottom: 3px; }
.ed .chars button.sel { background: var(--sel); }
.ed label { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 3px; }
.cols { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
.muted { color: #999; }
.legend td { padding: 2px 8px; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span id="title">The All-Seeing Eye</span>
    <span id="peek" class="chip warn hidden">Peek</span>
    <span id="dbg" class="chip warn hidden">Debug</span>
    <span id="game" class="chip hidden"></span>
    <span id="conn" class="chip">connecting</span>
    <button id="menuBtn" title="Menu (or right-click the map)">&#9776;</button>
  </div>
  <div id="mapwrap">
    <canvas id="map" width="512" height="512"></canvas>
    <div id="msg"></div>
  </div>
</div>
<div id="tip"></div>
<input id="folderInput" type="file" webkitdirectory multiple class="hidden">

 * bytes each: 4 wall faces N E S W, flags, first item, draw list), the item
 * array (14 bytes per item), the level's 30 monsters, and the wall tables
 * the game builds when it loads a level (wall flags, special wall types).
 * The map is drawn from those like ScummVM's automap does. */

  const e = Object.assign(document.createElement(tag), props);
  for (const k of kids) e.append(k);
  return e;
};

      const [x0, y0] = pts[i], [x1, y1] = pts[(i + 1) % n];
      const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x1 > x0 ? 1 : -1, sy = y1 > y0 ? 1 : -1;
      if (dx >= dy) for (let k = 0; k < dx; k++) g.fillRect(x0 + k * sx, y0 + near(k * (y1 - y0), dx), 1, 1);
      else for (let k = 0; k < dy; k++) g.fillRect(x0 + near(k * (x1 - x0), dy), y0 + k * sy, 1, 1);
    }
  },
};

/* ---------------------------------------------------------------- API */

const Api = {
  async read(addr, len) {
    const r = await fetch(`/api/v1/memory/${addr}/${len}`,
      { headers: { Accept: 'application/octet-stream' }, cache: 'no-store' });
    if (!r.ok) throw new Error(`read ${hex(addr, 6)}: HTTP ${r.status}`);
    return new Uint8Array(await r.arrayBuffer());
  },
  async write(addr, bytes) {
    const r = await fetch(`/api/v1/memory/${addr}`, { method: 'PUT',
      headers: { 'Content-Type': 'application/octet-stream' }, body: bytes });
    if (!r.ok) throw new Error(`write ${hex(addr, 6)}: HTTP ${r.status}`);
  },
  async info() {
    const r = await fetch('/api/v1/dosbox/info', { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  },
};

const DB = {
  db: null,
  open() {
    return this.db ??= new Promise((res, rej) => {
      const q = indexedDB.open('ase', 1);
      q.onupgradeneeded = () => { q.result.createObjectStore('files'); q.result.createObjectStore('kv'); };
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  },
  async op(store, mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const q = fn(db.transaction(store, mode).objectStore(store));
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  },
  get: (s, k) => DB.op(s, 'readonly', o => o.get(k)),
  put: (s, k, v) => DB.op(s, 'readwrite', o => o.put(v, k)),
  del: (s, k) => DB.op(s, 'readwrite', o => o.delete(k)),
  keys: s => DB.op(s, 'readonly', o => o.getAllKeys()),
};

function indexOf(mem, bytes, from = 0) {
  outer: for (let i = mem.indexOf(bytes[0], from); i >= 0 && i <= mem.length - bytes.length; i = mem.indexOf(bytes[0], i + 1)) {
    for (let k = 1; k < bytes.length; k++) if (mem[i + k] !== bytes[k]) continue outer;
    return i;
  }
  return -1;
}

// the game's wall tables: shape map, special types and flags, tableLen entries each
function findTables(mem, cfg) {
  const f = indexOf(mem, cfg.flagPreset);
  if (f < 0) return null;
  const shape = f - 2 * cfg.tableLen, st = f - cfg.tableLen;
  if (mem[st + 3] !== 1 || mem[st + 8] !== 6 || mem[st + 13] !== 1) return null;
  return { shape, special: st, flags: f, data: mem.slice(shape, shape + 3 * cfg.tableLen) };
}

function charOk(mem, o, f) {
  if (!(mem[o + 1] & 1)) return false;
  let n = 0;
  for (; n < 11 && mem[o + 2 + n]; n++) { const c = mem[o + 2 + n]; if (c < 32 || c > 126) return false; }
  if (n < 1 || n > 10) return false;
  for (const i of [0x0D, 0x0E, 0x11, 0x12, 0x13, 0x14, 0x15, 0x16, 0x17, 0x18, 0x19, 0x1A])
    if (mem[o + i] < 3 || mem[o + i] > 25) return false;
  return mem[o + f.hpMax] + (f.hpSize > 1 ? mem[o + f.hpMax + 1] : 0) > 0 && mem[o + f.race] < 12 && mem[o + f.cls] < 15 &&
    mem[o + f.align] < 9 && mem[o + f.food] <= 100 && mem[o + f.level] >= 1 && mem[o + f.level] <= 30;
}
// the first character record whose coordinates (at a fixed distance) make sense
function findCharacters(mem, cfg) {
  for (let o = cfg.charSize; o < mem.length - cfg.charSize * 6; o++) {
    if (!charOk(mem, o, cfg.f) || charOk(mem, o - cfg.charSize, cfg.f)) continue;
    const c = o + cfg.rel.coords;
    if (c < 0 || c + cfg.coordsLen > mem.length) continue;
    const level = mem[c] | mem[c + 1] << 8, block = mem[c + cfg.coordBlock] | mem[c + cfg.coordBlock + 1] << 8;
    if (level >= 1 && level <= cfg.levels && block < 1024 && mem[c + cfg.coordDir] < 4) return o;
  }
  return -1;
}
function itemNames(mem, cfg) {
  const first = indexOf(mem, new TextEncoder().encode(cfg.firstItemName + '\0'));
  if (first < 0) return [];
  const base = first - cfg.firstItemIndex * cfg.itemNameLen, out = [];
  for (let i = 0; i < 256; i++) {
    const o = base + i * cfg.itemNameLen;
    let s = '';
    for (let k = 0; k < cfg.itemNameLen && mem[o + k]; k++) s += String.fromCharCode(mem[o + k]);
    out.push(s);
  }
  return out;
}

// all of the emulated RAM (EOB 3 runs in protected mode and uses all of it)
async function memSize() {
  if (Api.size) return Api.size;
  let lo = 1, hi = 4096;   // MB that can be read / can't
  while (hi - lo > 1) {

/* ------------------------------------------------- explored, notes */

/* Like the original: a working set of explored maps and notes (ASE's <game>\ASE\
 * folder) that is filled from the chosen save slot's copy when the game is found,
 * and copied to a slot (ASE_<n>\) whenever the game saves there (SavePeek).

 * faces N E S W (that is what Explored_NN.dat holds); EOB 3 one byte per cell. */

function toExp(buf) {

  if (!buf) return m;
  const o = new Uint8Array(buf);
  if (o.length === m.length || Game.id === 3) m.set(o.subarray(0, m.length));
  else for (let b = 0; b < Math.min(1024, o.length); b++) if (o[b]) {   // a cell the party stood in: it and the faces around it

const Store = {

  size() { return Game.id === 3 ? 1024 : 5120; },

  skey(slot, level) { return `${Game.id}:${slot}:${level}`; },
  exp(level) {
    const k = this.wkey(level);
    if (!this.work[k]) {

      DB.get('kv', 'exp:' + k).then(b => { if (b) { const o = toExp(b); for (let i = 0; i < m.length; i++) m[i] |= o[i]; this.gen++; } });
    }

  },
  mark(level, i) { const m = this.exp(level); if (!m[i]) { m[i] = 1; this.dirty.add(this.wkey(level)); this.gen++; } },
  fill(level, v) { this.exp(level).fill(v); this.dirty.add(this.wkey(level)); this.gen++; Render.draw(); },
  async workOf(level) {
    if (this.work[this.wkey(level)]) return this.work[this.wkey(level)];
    return toExp(await DB.get('kv', 'exp:' + this.wkey(level)));
  },
  // the working set becomes a copy of the slot's (empty where the slot has
  // none): ASE's start and its "Copy explored from slot"

    this.flush();

    for (let lv = 1; lv <= Game.cfg.levels; lv++) {
      const m = toExp(await DB.get('kv', 'exp:' + this.skey(slot, lv)));
      this.work[this.wkey(lv)] = m;
      await DB.put('kv', 'exp:' + this.wkey(lv), m.buffer.slice(0));
      this.notes[this.wkey(lv)] = (await DB.get('kv', 'notes:' + this.skey(slot, lv))) || {};
      await DB.put('kv', 'notes:' + this.wkey(lv), this.notes[this.wkey(lv)]);
    }

    this.gen++;
    await Render.refreshAux(); Render.draw();
  },
  // the slot's copy becomes the working set: ASE does this when the game has saved there
  async snapshot(slot) {
    this.flush();

      const m = await this.workOf(lv);
      await DB.put('kv', 'exp:' + this.skey(slot, lv), m.buffer.slice(0));
      await DB.put('kv', 'notes:' + this.skey(slot, lv), this.notes[this.wkey(lv)] || (await DB.get('kv', 'notes:' + this.wkey(lv))) || {});
    }

  },
  async clearSlot(slot) {
    for (let lv = 1; lv <= Game.cfg.levels; lv++) { await DB.del('kv', 'exp:' + this.skey(slot, lv)); await DB.del('kv', 'notes:' + this.skey(slot, lv)); }

      .map(k => +k.slice(pre.length).split(':')[0]).filter(n => n > 0));
  },
  async notesOf(level) {
    const k = this.wkey(level);
    if (!this.notes[k]) this.notes[k] = (await DB.get('kv', 'notes:' + k)) || {};
    return this.notes[k];
  },
  async setNote(level, b, text) {
    const n = await this.notesOf(level);

    await DB.put('kv', 'notes:' + this.wkey(level), n);
    this.gen++; Render.draw();

setInterval(() => Store.flush(), 3000);

// ASE copies the working set to a slot when the game saves there: the save
// file of a slot gets a newer date (EOB 1: EOBDATA.SAV; EOB 2: EOBDATA0-5.SAV;
// EOB 3: SAVEGAME\ITEMS_01-12.BIN, ASE3 looks every second); needs the game folder
const SavePeek = {
  last: 0, slot: 0, next: 0, busy: false,
  names() {
    return Game.id === 3 ? Array.from({ length: 12 }, (_, i) => `SAVEGAME/ITEMS_${pad2(i + 1)}.BIN`)
      : Game.id === 1 ? ['EOBDATA.SAV'] : Array.from({ length: 6 }, (_, i) => `EOBDATA${i}.SAV`);
  },
  // the newest save: [slot, date] (the first of equally new ones), [0, 0] without any
  async newest() {
    const names = this.names();
    let slot = 0, date = 0;
    for (let i = 0; i < names.length; i++) { const d = await Files.date(names[i]); if (d && d > date) { date = d; slot = i + 1; } }
    return [slot, date];
  },
  async tick() {
    if (!Files.has() || this.busy || Date.now() < this.next) return;
    this.busy = true;
    try {
      this.next = Date.now() + (Game.id === 3 ? 1000 : 2000);
      const [slot, date] = await this.newest();
      if (!slot) return;
      this.slot = slot;
      const own = Files.written[this.names()[slot - 1].toLowerCase()];   // the page's own writes are not the game saving
      if (this.last && date > this.last && !(own && Math.abs(date - own) < 10000)) {
        await Store.snapshot(slot);
        log(`The game saved to slot ${slot}: the explored maps were copied to that slot`);
      }
      this.last = Math.max(this.last, date);
    } finally { this.busy = false; }
  },
};

/* ------------------------------------------------------ map logic
 * ASE's model, rebuilt every tick: every wall face gets a category from
 * ASE's Blocks.dat (raw wall id x level), cells get a floor flag, a centre
 * feature and the wall decorations that face them; walls are drawn inside
 * the rock cells on the faces towards explored floor. */

const CAT = { floor: 1, wall: 2, buttonDoor: 3, buttonDoorOpen: 4, door: 5, doorOpen: 6, plate: 7, button: 8,
  rubble: 9, niche: 10, up: 11, down: 12, party: 13, switch: 14, cornerFix: 15, keyhole: 16, illusion: 17, hole: 18,
  teleporter: 19, portal: 20, eyeNiche: 21, chain: 22, mount: 23, jewelBox: 24, marker: 25, monster: 26, item: 27,
  pedestal: 28, lightOff: 29, lightOn: 30, bed: 31, wallOfForce: 32, bashable: 33 };
// the names ASE's tooltip uses, and its short ones
const CAT_NAMES = ['-', 'floor', 'wall', 'Closed door with an opening button', 'Opened door with a closing button',
  'Closed door without an opening button', 'Opened door without a closing button', 'Pressure plate', 'Button', 'Rubble',
  'Shelf', 'Upstairs', 'Downstairs', 'party location', 'Switch', 'wall corner fix', 'Keyhole', 'Illusionary wall',
  'Hole in the floor', 'Teleporter', 'Stone portal', 'Eye slot', 'Chain', 'Mounting device', 'Jewel box', 'debug-marker',
  'monster', 'item', 'Pedestal', 'Light pad, off', 'Light pad, on', 'Bed', 'Wall of force', 'Bashable wall'];

  'pressure plate', 'button', 'rubble', 'wall niche', 'upstairs', 'downstairs', 'party location', 'switch', 'wall corner fix',
  'keyhole', 'illusionary wall', 'floor hole', 'teleporter', 'stone portal', 'eye niche', 'chain', 'mounting device',
  'jewel box', 'debug-marker', 'monster', 'item', 'pedestal', 'light off', 'light on', 'bed', 'wall of force', 'bashable wall'];

const DECO_CATS = new Set([8, 10, 14, 16, 20, 21, 22, 23, 24]);                           // things on a wall
const CENTER_CATS = new Set([7, 9, 11, 12, 18, 19, 28, 29, 30, 31, 32]);                 // things in a cell (+ doors, 17, 33)

// ASE's data files for EOB 1 and 2: Blocks.dat and the item files
const AseData = {
  blocks: {}, items: {},
  async load() {
    // a text file's lines as Delphi's TStringList reads them (no empty last line after the last break)
    const lines = b => b ? new TextDecoder('latin1').decode(b).replace(/\r?\n$/, '').split(/\r?\n/) : null;
    for (const id of [1, 2]) {
      const get = name => DB.get('files', `ASE:EOB${id}/${name}`);
      const b = await get('Blocks.dat');
      this.blocks[id] = b ? new Uint8Array(b) : null;
      const [list, type, sub, names] = await Promise.all([get('Item_List.txt'), get('Item_Type.dat'), get('Item_Subtype.dat'), get('Item_Name.txt')]);
      this.items[id] = list || type || sub || names ? { list: lines(list) || [], type: new Uint8Array(type || 0),
        subtype: new Uint8Array(sub || 0), names: lines(names) } : null;
    }
  },
  // the category of a raw wall id on the current level (0 = unknown to ASE, shown as a debug marker)
  category(raw) { return raw <= 100 ? this.blocks[Game.id][raw * Game.cfg.levels + Game.level - 1] : 0; },
};

function fallbackCategory(w) {
  const cfg = Game.cfg, fl = Game.wallFlags(w), st = Game.specialType(w);
  if (fl & 8) return st === 1 ? (fl & 1 ? CAT.buttonDoorOpen : CAT.buttonDoor) : (fl & 1 ? CAT.doorOpen : CAT.door);
  if (cfg.up.includes(w)) return CAT.up;
  if (cfg.down.includes(w)) return CAT.down;
  if (cfg.plate.includes(w)) return CAT.plate;
  if (cfg.pit.includes(w)) return CAT.hole;
  if (cfg.teleporter.includes(w)) return CAT.teleporter;
  if (cfg.illusion.includes(w)) return CAT.illusion;
  if (w === cfg.wallOfForce) return CAT.wallOfForce;
  if (st === 10) return CAT.niche;
  if (st === 20) return CAT.portal;
  if (st >= 3 && st <= 4) return CAT.switch;
  if (st === 2 && Game.shapeMap(w) > 0) return CAT.button;

const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];   // N E S W

// the original's cell information (EOB 1/2), rebuilt every tick
const Cells = {
  level: 0, sides: new Uint8Array(4096), deco: new Uint8Array(4096), floor: new Uint8Array(1024), center: new Uint8Array(1024),
  rot: new Uint8Array(1024), wallDraw: new Uint8Array(4096), monsters: new Uint8Array(1024), items: new Uint8Array(1024),
  monList: [], itemList: [],
  build() {
    const lv = Game.level, e = Store.exp(lv), map = Game.map, s = Game.cfg.cellSize, show = Settings.v.illusionary;
    for (const a of [this.sides, this.deco, this.floor, this.center, this.rot, this.wallDraw, this.monsters, this.items]) a.fill(0);
    this.monList = []; this.itemList = [];
    this.level = lv;
    // the faces' categories and the floor flag
    const blocks = !!AseData.blocks[Game.id];
    for (let b = 0; b < 1024; b++) {
      const seen = expCell(e, b);
      for (let d = 0; d < 4; d++) {
        const raw = map[b * s + d];
        let c = blocks ? AseData.category(raw) : fallbackCategory(raw);
        if (c === 17 || c === 33) { if (seen || show) this.floor[b] = 1; else c = 2; }   // illusionary and bashable walls pass as walls

        this.sides[b * 4 + d] = c;

    for (let b = 0; b < 1024; b++) {

        if (c >= 3 && c <= 6) { this.center[b] = c; this.rot[b] = d + 1; }

    }
    if (Game.id === 2 && lv === 2) {
      const b = 6 << 5 | 19;
      this.wallDraw.set([1, 0, 0, 0], b * 4); this.floor[b] = 0; this.center[b] = 0; this.rot[b] = 0;
      this.wallDraw[(6 << 5 | 20) * 4 + 3] = 0; this.wallDraw[(7 << 5 | 19) * 4] = 0; this.wallDraw[(6 << 5 | 18) * 4 + 1] = 0;

    if (Settings.v.items) this.placeItems(e, lv);
  },

  // others move to the floor cell in front of them (buttons only while shown)
  decorate(b, d, c) {
    let t = b, td = d;

    }
  },
  placeMonsters(e) {
    const s = Game.cfg.monSize, base = Game.addr('monsters');
    for (let i = 0; i < 30; i++) {
      const m = Game.monster(i);
      if (!m.block || m.block > 1023 || m.hpCur <= 0 || !expCell(e, m.block)) continue;
      this.monsters[m.block]++;
      this.monList.push({ b: m.block, name: Game.monsterName(m), hpCur: m.hpCur, hpMax: m.hpMax,
        debug: `$${hex(RAM_WINDOW + base + i * s, 6)}: ${hexBytes(Game.monsters.subarray(i * s), s)}` });

        debug: `${String(i).padStart(4, '0')}. $${hex(RAM_WINDOW + base + i * 14, 6)}: ${hexBytes(Game.items.subarray(i * 14), 14)}` });
    }

function partyExplore() {
  const lv = Game.level, b = Game.block;
  if (Game.id === 3) {   // ASE3: the party's cell and the four next to it
    for (const [dx, dy] of [[0, 0], [0, -1], [1, 0], [0, 1], [-1, 0]]) {
      const x = Game.x + dx, y = Game.y + dy;
      if (x >= 0 && y >= 0 && x < 32 && y < 32) Store.mark(lv, y << 5 | x);
    }
    return;
  }
  // ASE: the party's cell and its four faces, the faces of the four cells
  // around it that look at the party, and those cells entirely when they are
  // floor (as of the last tick's cell information) - nothing further ahead
  for (let f = 0; f < 5; f++) Store.mark(lv, ei(b, f));
  for (let d = 0; d < 4; d++) {
    const n = neighbour(b, d);
    if (n < 0) continue;
    Store.mark(lv, ei(n, (d ^ 2) + 1));
    if (Cells.level === lv && Cells.floor[n]) Store.mark(lv, ei(n, 0));
  }
}

/* ---------------------------------------------------------- hints */

const Hints = {
  cache: {},
  async get(level) {
    const k = `${Game.id}:${level}`;

    const f = await DB.get('files', `ASE:EOB${Game.id}/Hints_${pad2(level)}.txt`);

/* ------------------------------------------------------------ map */

const COLORS = { rock: '#A2843F', rock3: '#A4875F', floor3: '#DDDDDD', wall3: '#5A4B38', party3: '#009900',
  party3edge: '#005500', hover3: '#AA0000', note: '#1060d0' };

// ASE's cell bitmaps: cs x cs, rot = quarter turns clockwise; drawn with the
// original's GDI geometry (3-px walls, 6-px doors, ... whatever the cell size)
const Glyphs = {
  cache: new Map(),
  get(cat, rot, cs) {
    const k = `${cat}:${rot}:${cs}`;
    let c = this.cache.get(k);
    if (c) return c;

    const g = c.getContext('2d');
    if (rot) { const src = this.get(cat, 0, cs); g.translate(cs / 2, cs / 2); g.rotate(rot * Math.PI / 2); g.drawImage(src, -cs / 2, -cs / 2); }

  },
};
function paintGlyph(g, cat, cs) {
  const W = '#584939', mid = cs >> 1;
  const fill = (x1, y1, x2, y2, c) => { g.fillStyle = c; g.fillRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1)); };
  const frame = (x1, y1, x2, y2, c) => { fill(x1, y1, x2, y1 + 1, c); fill(x1, y2 - 1, x2, y2, c); fill(x1, y1, x1 + 1, y2, c); fill(x2 - 1, y1, x2, y2, c); };
  const ellipse = (x1, y1, x2, y2, pen, brush) => Gdi.ellipse(g, x1, y1, x2, y2, pen, brush);
  const poly = (pts, c) => Gdi.polygon(g, pts, c, c);
  const bar = inner => { fill(0, mid - 3, cs, mid + 3, W); fill(0, mid - 2, cs, mid + 2, inner); };
  const stubs = inner => { fill(0, mid - 3, 3, mid + 3, W); fill(0, mid - 2, 2, mid + 2, inner); fill(cs, mid - 3, cs - 3, mid + 3, W); fill(cs, mid - 2, cs - 2, mid + 2, inner); };
  const knob = c => { fill(mid - 3, 0, mid + 3, 5, W); fill(mid - 2, 0, mid + 2, 4, c); };
  const cell = c => fill(0, 0, cs, cs, c);
  switch (cat) {
    case 1: cell('#EEEEEE'); frame(0, 0, cs + 1, cs + 1, '#AAAAAA'); break;
    case 2: fill(0, 0, cs, 3, W); break;
    case 3: bar('#00AA00'); break;
    case 4: stubs('#00AA00'); break;
    case 5: bar('#888888'); break;
    case 6: stubs('#888888'); break;
    case 7: case 29: ellipse(3, 3, cs - 3, cs - 3, '#777777', '#999999'); break;
    case 8: case 14: case 22: knob('#00AA00'); break;
    case 9: case 31: cell('#786959'); break;
    case 10: frame(5, 0, cs - 5, 7, W); fill(6, 0, cs - 6, 6, '#EEEEEE'); break;
    case 11: poly([[3, cs - 3], [mid, 3], [cs - 3, cs - 3]], '#888888'); break;
    case 12: poly([[3, 3], [mid, cs - 3], [cs - 3, 3]], '#888888'); break;
    case 13: poly([[2, cs - 3], [mid, 2], [cs - 3, cs - 3]], '#228822'); break;
    case 15: fill(cs - 3, 0, cs, 3, W); break;
    case 16: case 21: case 23: case 24: knob('#AA0000'); break;
    case 17: cell('#BBBBBB'); break;
    case 18: ellipse(3, 3, cs - 3, cs - 3, '#666666', '#222222'); break;
    case 19: cell('#00AAAA'); g.fillStyle = '#EEEEEE'; Gdi.font(g, Math.round(mid * 4 / 3), 'Tahoma'); Gdi.centred(g, 'T', 0, 0, cs, cs); break;
    case 20: frame(2, 0, cs - 2, 7, W); fill(3, 0, cs - 3, 6, '#FF00CC'); break;
    case 25: cell('#AA0000'); break;
    case 26: ellipse(3, 3, cs - 3, cs - 3, '#770000', '#AA0000'); break;
    case 27: fill(4, 4, cs - 4, cs - 4, '#00EEEE'); frame(4, 4, cs - 4, cs - 4, '#00AAAA'); break;
    case 28: fill(4, 4, cs - 4, cs - 4, W); fill(5, 5, cs - 5, cs - 5, '#999999'); break;
    case 30: ellipse(3, 3, cs - 3, cs - 3, '#770000', '#990000'); break;
    case 32: cell('#288929'); break;
    case 33: cell('#888888'); break;
  }
}

const Render = {
  canvas: $('#map'), mouse: null, lastMouse: { x: -1, y: -1 }, lastXY: [], mouseAt: 0, peekUntil: 0, hintList: [], hintAt: {}, notes: {}, tipTimer: 0,
  cellSize() {
    const wrap = $('#mapwrap'), z = Game.id === 3 ? Settings.v.size3 >> 5 : Settings.v.zoom;
    if (z > 0) return z;
    return Math.max(8, Math.floor(Math.min(wrap.clientWidth, wrap.clientHeight) / 32));
  },
  // ASE3's window is size3 square, its map (32 cells of size3 div 32) in the middle
  side3() { return Settings.v.size3 > 0 ? Settings.v.size3 : this.cellSize() * 32; },
  offset3() { return (this.side3() - this.cellSize() * 32) >> 1; },
  async refreshAux() {
    if (!Game.coords) return;
    this.hintList = await Hints.get(Game.level);
    this.hintAt = {};
    for (const h of this.hintList) this.hintAt[h.y * 32 + h.x] = h;
    this.notes = await Store.notesOf(Game.level);
  },
  // EOB 1/2: ASE's drawing order
  draw() {
    if (!Game.map || !Game.coords) return;
    if (Game.id === 3) return this.draw3();
    const cs = this.cellSize(), c = this.canvas, g = c.getContext('2d'), size = cs * 32, C = Cells, s = Settings.v;
    if (c.width !== size) { c.width = size; c.height = size; }
    g.fillStyle = COLORS.rock; g.fillRect(0, 0, size, size);
    const e = Store.exp(Game.level), peek = Date.now() < this.peekUntil;
    $('#peek').classList.toggle('hidden', !peek);
    const put = (cat, rot, b) => g.drawImage(Glyphs.get(cat, rot & 3, cs), (b & 31) * cs, (b >> 5) * cs);
    for (let b = 0; b < 1024; b++) {
      for (let d = 0; d < 4; d++) {
        if (!(expFace(e, b, d) || peek) || !C.wallDraw[b * 4 + d]) continue;
        put(2, d, b);
        // the wall's end runs on into the cell left of that face unless that is explored floor
        const n = neighbour(b, (d + 3) & 3);
        if (n >= 0 && !(C.floor[n] && expCell(e, n))) put(15, d, n);
      }
      if (!expCell(e, b) && !peek) {   // of an unexplored cell only the shelves and portals of explored faces
        for (let d = 0; d < 4; d++) { const dc = C.deco[b * 4 + d]; if ((dc === 10 || dc === 20) && expFace(e, b, d)) put(dc, d, b); }
        continue;
      }
      if (C.floor[b]) put(1, 0, b);
      for (let d = 0; d < 4; d++) if (C.deco[b * 4 + d]) put(C.deco[b * 4 + d], d, b);
      if (C.center[b]) put(C.center[b], C.rot[b] - 1, b);
      if (!C.sides[b * 4] || !C.sides[b * 4 + 1] || !C.sides[b * 4 + 2] || !C.sides[b * 4 + 3]) put(25, 0, b);   // a wall ASE does not know
    }
    if (s.items) for (const it of C.itemList) put(27, 0, it.b);
    if (s.monsters) for (const m of C.monList) put(26, 0, m.b);
    if (s.hints) for (const h of this.hintList) { const b = h.y * 32 + h.x; if (expCell(e, b) || peek) this.hint(g, h.x * cs, h.y * cs, cs, h.id); }
    if (s.notes) for (const k of Object.keys(this.notes)) { const b = +k; if (expCell(e, b) || peek) this.note(g, (b & 31) * cs, (b >> 5) * cs, cs); }
    if (Game.dir < 4) put(13, Game.dir, Game.block);
  },
  // a clue book hint: a bright green cell with its number
  hint(g, X, Y, cs, id) {
    g.fillStyle = '#00FF00'; g.fillRect(X, Y, cs, cs);
    g.fillStyle = '#000'; Gdi.font(g, Math.max(1, Math.round(Math.trunc(cs / 2.7) * 4 / 3)), 'Arial Narrow');
    Gdi.centred(g, String(id), X, Y, cs, cs);
  },
  // a note: a cyan cell with "!"
  note(g, X, Y, cs) {
    g.fillStyle = '#33CCCC'; g.fillRect(X, Y, cs, cs);
    g.fillStyle = '#000'; Gdi.font(g, Math.round((cs >> 1) * 4 / 3), 'Tahoma', true); Gdi.centred(g, '!', X, Y, cs, cs);
  },
  // EOB 3: ASE3's window, its map in the middle (the same drawing as the saved games' preview)
  draw3() {
    const cs = this.cellSize(), side = this.side3(), off = this.offset3(), c = this.canvas, g = c.getContext('2d'), m = Game.map;
    if (c.width !== side || c.height !== side) { c.width = side; c.height = side; }
    g.fillStyle = COLORS.rock3; g.fillRect(0, 0, side, side);
    const exp = Store.exp(Game.level), peek = Date.now() < this.peekUntil;
    $('#peek').classList.toggle('hidden', !peek);
    g.translate(off, off);
    this.map3(g, cs, m, b => m[b] === 0xFF && (peek || exp[b]), Game,
      this.mouse && Date.now() - this.mouseAt < 2000 ? this.mouse : null, Settings.v.notes ? this.notes : null);
    g.setTransform(1, 0, 0, 1, 0, 0);
  },
  // ASE3's DrawMap of 32 x 32 cells of cs pixels: the explored open cells (a pixel short of the
  // cell's right and bottom edge), a 3-pixel pen line on the cell edges towards cells that aren't
  // open (the map's own edges excepted), the party's triangle (party: x, y, dir), the mouse's
  // cell framed; what falls outside the map's square is cut off, as in ASE3's bitmap
  map3(g, cs, m, shown, party, hover, notes) {
    const size = cs * 32;
    g.save(); g.beginPath(); g.rect(0, 0, size, size); g.clip();
    g.fillStyle = COLORS.rock3; g.fillRect(0, 0, size, size);
    g.fillStyle = COLORS.floor3;
    for (let b = 0; b < 1024; b++) if (shown(b)) g.fillRect((b & 31) * cs, (b >> 5) * cs, cs - 1, cs - 1);
    g.fillStyle = COLORS.wall3;
    for (let b = 0; b < 1024; b++) {
      if (!shown(b)) continue;
      const x = b & 31, y = b >> 5, L = x * cs - 1, T = y * cs - 1, R = (x + 1) * cs - 1, B = (y + 1) * cs - 1;
      if (y > 0 && m[b - 32] !== 0xFF) Gdi.line3(g, L, T, R, T);
      if (x < 31 && m[b + 1] !== 0xFF) Gdi.line3(g, R, T, R, B);
      if (y < 31 && m[b + 32] !== 0xFF) Gdi.line3(g, L, B, R, B);
      if (x > 0 && m[b - 1] !== 0xFF) Gdi.line3(g, L, T, L, B);
    }
    if (notes) {   // the page's notes (ASE3 has none)
      g.font = `bold ${Math.max(9, Math.round(cs * 0.36))}px Tahoma, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = COLORS.note;
      for (const [b, text] of Object.entries(notes)) g.fillText(text.split('\n')[0].slice(0, 3), (b & 31) * cs + cs / 2, (b >> 5) * cs + cs / 2);
    }
    if (party) {   // ASE3's triangle, pointing the way the party faces (N, E, S, else W)
      const c = cs, h = (c * 32) >> 6, X = party.x * cs, Y = party.y * cs;
      const tri = [[[2, c - 4], [h, 2], [c - 4, c - 4]], [[2, 2], [c - 4, h], [2, c - 4]],
        [[2, 2], [h, c - 4], [c - 4, 2]], [[c - 4, 2], [2, h], [c - 4, c - 4]]][Math.min(party.dir, 3)];
      Gdi.polygon(g, tri.map(([x, y]) => [X + x, Y + y]), COLORS.party3edge, COLORS.party3);
    }
    // the mouse's cell (for 2 seconds after the mouse moved): three frames, from a pixel
    // outside the cell inwards
    if (hover) {
      const X = hover.x * cs, Y = hover.y * cs;
      g.fillStyle = COLORS.hover3;
      for (let k = -1; k <= 1; k++) Gdi.frameRect(g, X + k, Y + k, X + cs - 1 - k, Y + cs - 1 - k);
    }
    g.restore();
  },
  // the cell under the mouse; EOB 3: only over ASE3's map square, not the window around it
  cellAt(ev) {
    const r = this.canvas.getBoundingClientRect(), eob3 = Game.id === 3;
    const cs = eob3 ? this.cellSize() : this.canvas.width / 32, off = eob3 ? this.offset3() : 0;
    const px = ev.clientX - r.left - off, py = ev.clientY - r.top - off;
    const x = Math.floor(px / cs), y = Math.floor(py / cs);
    return px >= 0 && py >= 0 && x < 32 && y < 32 ? { x, y, b: y * 32 + x } : null;
  },
};

// the tooltip of a cell (EOB 1/2), as the original decides and fills it: something
// on an explored face, or an explored cell with a feature, shown monsters or
// items, a hint or a note; plain floor and unexplored cells have none
function hasTip(b) {
  const e = Store.exp(Game.level), C = Cells, s = Settings.v;
  for (let d = 0; d < 4; d++) if (C.deco[b * 4 + d] && expFace(e, b, d)) return true;
  if (!expCell(e, b)) return false;
  return C.center[b] > 0 || s.monsters && C.monsters[b] > 0 || s.items && C.items[b] > 0 || s.hints && !!Render.hintAt[b] || s.notes && !!Render.notes[b];
}
function tipText(b) {
  const C = Cells, s = Settings.v, out = ['', `${pad2(b & 31)},${pad2(b >> 5)}`, ''];
  if (C.center[b]) out.push(CAT_NAMES[C.center[b]] || '', '');
  let n = 0;
  for (let d = 0; d < 4; d++) { const c = C.deco[b * 4 + d]; if (c) { out.push(CAT_NAMES[c] || ''); n++; } }
  if (n) out.push('');
  if (s.monsters && C.monsters[b]) {
    out.push('Monsters:');
    for (const m of C.monList) if (m.b === b) { out.push(`- ${m.name} (${m.hpCur} / ${m.hpMax} hit points)`); if (s.debug) out.push(m.debug); }
    out.push('');
  }
  if (s.items && C.items[b]) {
    out.push('Items:');
    for (const it of C.itemList) if (it.b === b) { out.push(`- ${it.name}`); if (s.debug) out.push(it.debug); }
    out.push('');
  }
  const h = Render.hintAt[b];
  if (s.hints && h) out.push(`${h.id}. ${h.text.trim()}`, '');
  if (s.notes && Render.notes[b]) out.push(Render.notes[b].trim());
  if (out.at(-1) === '') out.pop();
  return out.join('\n');
}
// EOB 3: ASE3 has no tooltip; the page shows its notes, and the cell in debug mode
function describeCell3(c) {
  const b = c.b, lines = [`${pad2(c.x + 1)},${pad2(c.y + 1)}`];
  if (!(Settings.v.notes && Render.notes[b]) && !Settings.v.debug) return null;
  if (!(Date.now() < Render.peekUntil || Store.exp(Game.level)[b] || Settings.v.debug)) return lines.join('\n') + '  (unexplored)';
  lines.push(Game.map[b] === 0xFF ? 'open' : 'wall');
  if (Render.notes[b]) lines.push('Note: ' + Render.notes[b]);
  if (Settings.v.debug) lines.push(`map byte ${hex(Game.map[b], 2)} at ${hex(Game.mapAddr + b, 6)}`);
  return lines.join('\n');
}

/* -------------------------------------------------------- title bar */

function updateTitle() {
  if (!Game.coords) return;
  const name = LEVEL_NAMES[Game.id][Game.level - 1] || '';
  let t;
  if (Game.id === 3) {   // ASE3: "Burial glen   [08,25]", counted from 1; the mouse cell for 2 s after it moved
    t = `${name}   [${pad2(Game.x + 1)},${pad2(Game.y + 1)}]`;
    if (Render.mouse && Date.now() - Render.mouseAt < 2000) t += `   [${pad2(Render.mouse.x + 1)},${pad2(Render.mouse.y + 1)}]`;
  } else {
    // the original always adds the cell the mouse was last over ("(-01,-01)" before
    // it ever was), in debug mode also that cell's four wall bytes
    const m = Render.lastMouse, sp2 = v => (v < 0 ? '-' : '') + pad2(Math.abs(v));
    t = `${pad2(Game.x)},${pad2(Game.y)} at level ${Game.level}: "${name}"   (${sp2(m.x)},${sp2(m.y)})` + (Settings.v.debug && m.x >= 0 ? '   ' +
      [...Game.cell(m.y * 32 + m.x).subarray(0, 4)].map(v => hex(v, 2)).join(', ') : '');
  }
  $('#title').textContent = t;
  document.title = `${t} - ASE`;
}

/* ------------------------------------------------------- main loop */

async function loop() {
  Settings.load();
  $('#dbg').classList.toggle('hidden', !Settings.v.debug);
  const q = new URLSearchParams(location.search);
  if (q.get('asedata')) await importAseUrl(q.get('asedata')).catch(e => log(e.message));
  if (q.get('ase3data')) await importAse3Url(q.get('ase3data')).catch(e => log(e.message));
  if (q.get('gamedata')) {
    Files.url = q.get('gamedata').replace(/\/?$/, '/');
    await importExplored3().catch(e => log(e.message));
  }
  await AseData.load();
  try {
    Game.info = await Api.info();
  } catch {
    setConn('no API', 'bad');
    $('#msg').innerHTML = '<h2>DOSBox Staging\'s API is not reachable</h2><p>Open this page through DOSBox Staging\'s ' +
      'webserver, e.g. <b>http://localhost:8086/ase.html</b>, with <code>webserver_enabled = on</code> in its config.</p>';
    return;
  }
  let lastLevel = 0;
  for (;;) {
    try {
      if (!Game.cfg) {
        lastLevel = 0;
        if (Game.hold) {   // EOB 3 search gave up: wait for "Search again"
          setConn('not found', 'warn');
          showMsg('The party was not found', Game.searchNote);
          await sleep(500); continue;
        }
        setConn('searching', 'warn');
        showMsg('Waiting for Eye of the Beholder', 'Start the game and load a saved game. ' +
          'The All-Seeing Eye finds the party by itself.' + (Game.searchNote ? '\n\n' + Game.searchNote : ''));
        if (!await Game.find()) { await sleep(2000); continue; }
        showMsg('');
        $('#game').textContent = Game.cfg.name; $('#game').classList.remove('hidden');
        document.documentElement.style.setProperty('--rock', Game.id === 3 ? COLORS.rock3 : COLORS.rock);
        if (Game.id !== 3) log(`${Game.cfg.name} found: characters at ${hex(Game.char0, 6)}, map at ${hex(Game.addr('map'), 6)}, ` +
          `items at ${hex(Game.addr('items'), 6)}, monsters at ${hex(Game.addr('monsters'), 6)}`);
        if (Store.loadedFor !== Game.id) {   // like ASE's start: the explored maps of the chosen save slot
          Store.loadedFor = Game.id;
          if (Game.id !== 3) await importExplored12();
          // ASE3 starts with the newest save chosen, or the one clicked in its list
          const slot3 = Game.id === 3 ? Saves3.picked || (Files.has() && (await SavePeek.newest())[0]) : 0;
          await Store.loadSlot(slot3 || (Game.cfg.slots === 1 ? 1 : Settings.v.slot));
        }
        if (Game.id === 3) SavePeek.last = 0;   // ASE3's map window takes the newest save's date when it opens
      }
      await Game.poll();
      if (Game.id === 3 ? !Game.valid3() : !(Game.chars[1] & 1) || Game.level < 1 || Game.level > Game.cfg.levels) {
        if (Game.id === 3) {   // ASE3 keeps the explored maps in the newest save's slot before it gives up
          log(`EOB 3: location (${[...Game.coords].map(v => hex(v, 2)).join(' ')}) or map no longer valid, searching again`);
          if (Files.has()) { const [slot] = await SavePeek.newest(); if (slot) await Store.snapshot(slot); }
        }
        Game.cfg = null; $('#tip').style.display = 'none'; continue;
      }
      setConn(`DOSBox ${Game.info.version.split(' ')[0]}`, 'ok');
      if (Game.id === 3 && lastLevel && Game.level !== lastLevel) {
        // a new level: its map may be loaded anywhere
        await sleep(400);
        if (!await Game.find3(true)) { Game.cfg = null; continue; }
        await Game.poll();
        if (!Game.valid3()) { Game.cfg = null; continue; }
      }
      if (Game.level !== lastLevel) { lastLevel = Game.level; await Render.refreshAux(); }
      partyExplore();
      if (Game.id !== 3) Cells.build();
      updateTitle();
      Render.draw();
      Editor.refresh();
      SavePeek.tick();
      Game.tick++;
    } catch (e) {
      setConn('DOSBox not answering', 'bad');
      Game.cfg = null;
      await sleep(1500);
    }
    await sleep(200);
  }
}
function setConn(text, cls) { const c = $('#conn'); c.textContent = text; c.className = 'chip ' + cls; }
function showMsg(title, text = '') {
  const m = $('#msg');
  if (!title) { m.replaceChildren(); return; }
  m.replaceChildren(el('h2', { textContent: title }), ...text.split('\n\n').map(p => el('p', { textContent: p })));
}

/* ---------------------------------------------------------- events */

const cv = Render.canvas;
cv.addEventListener('mousemove', ev => {
  if (ev.clientX === Render.lastXY[0] && ev.clientY === Render.lastXY[1]) return;   // the browser's own (after layout changes)
  Render.lastXY = [ev.clientX, ev.clientY];
  const c = Render.cellAt(ev);
  if (Game.id === 3 && !c) return;   // ASE3: the window around its map takes no mouse
  Render.mouse = c; Render.mouseAt = Date.now();
  if (c) Render.lastMouse = c;
  updateTitle();
  if (Game.id === 3) Render.draw();
  const tip = $('#tip');
  const text = c && Game.map && Game.coords && (Game.id === 3 ? describeCell3(c) : hasTip(c.b) ? tipText(c.b) : null);
  if (!text) { clearTimeout(Render.tipTimer); Render.tipTimer = 0; tip.style.display = 'none'; return; }
  tip.textContent = text;
  tip.style.display = 'block';
  tip.style.left = Math.min(ev.clientX + 16, innerWidth - tip.offsetWidth - 4) + 'px';
  tip.style.top = Math.min(ev.clientY + 16, innerHeight - tip.offsetHeight - 4) + 'px';
  // the original's hint window hides 5 s after it appeared: moving on to other cells with
  // something to tell does not put that off, a cell with nothing hides it at once
  if (!Render.tipTimer) Render.tipTimer = setTimeout(() => { tip.style.display = 'none'; Render.tipTimer = 0; }, 5000);
});
cv.addEventListener('mouseleave', () => {   // the tooltip stays its 5 seconds, as the original's
  if (Game.id === 3) return;   // ASE3 keeps the mouse's cell (framed until its 2 seconds are over)
  Render.mouse = null; Render.draw(); updateTitle();
});
cv.addEventListener('mousedown', ev => {   // Ctrl+click adds a note, like the original
  if (ev.button !== 0 || !ev.ctrlKey) return;
  const c = Render.cellAt(ev);
  if (c) { Render.lastMouse = c; setTimeout(() => addNote(c), 0); }
});
cv.addEventListener('contextmenu', ev => { ev.preventDefault(); Menu.show(ev.clientX, ev.clientY); });
$('#menuBtn').onclick = ev => { const r = ev.target.getBoundingClientRect(); Menu.show(r.right - 240, r.bottom); };
window.addEventListener('resize', () => Render.draw());

document.addEventListener('keydown', ev => {
  if (ev.target.closest('input, select, textarea')) return;
  const k = ev.key.toLowerCase(), s = Settings.v;
  const toggle = key => () => { s[key] = !s[key]; Settings.save(); Render.draw(); };
  // the menus' keys: ASE's PgUp makes the map smaller, ASE3's larger
  const eob12 = Game.id !== 3 ? { b: toggle('buttons'), w: toggle('illusionary'), m: toggle('monsters'), i: toggle('items'),
    h: toggle('hints'), pageup: () => zoomBy(-1), pagedown: () => zoomBy(+1) }
    : { e: () => Editor.open(), pageup: () => size3By(+1), pagedown: () => size3By(-1) };
  const act = ev.ctrlKey ? { e: () => Editor.open(), s: backupSave, m: exportMap, d: toggleDebug, q: quit }[k]
    : { a: addNote, z: peek, x: exploreLevel, t: teleportHere,
      ...eob12, n: toggle('notes'), r: () => openPdf('manual'), c: () => openPdf('cluebook'),
      escape: () => { Menu.hide(); Dlg.closeTop(); } }[k];
  if (act) { ev.preventDefault(); act(); }
});

// the save slot whose explored maps are loaded when the game is found (ASE's
// wizard choice); choosing one now also loads it, like "Copy explored from"
async function setSlot(n) {
  Settings.v.slot = n; Settings.save();
  await Store.loadSlot(n);
  log(`Explored maps of save slot ${n} loaded`);
}

// the original's cell sizes: 14 to 32 in steps of 2
function zoomBy(d) {
  const z = Settings.v.zoom || Render.cellSize();
  Settings.v.zoom = Math.max(14, Math.min(32, (z & ~1) + d * 2)); Settings.save(); Render.draw();
}
// ASE3's window: 30 pixels larger or smaller, not below 480
function size3By(d) {
  const cur = Settings.v.size3 || Math.max(480, Render.side3());
  if (d < 0 && cur <= 480) return;
  Settings.v.size3 = Math.max(480, cur + 30 * d); Settings.save(); Render.draw();
}

// ASE's: for the cell clicked with Ctrl, or the one the mouse was last over; its question
// counts from 1 (its title from 0); an empty note removes it; the notes are shown then
async function addNote(cell) {
  const c = cell || Render.lastMouse;
  if (!Game.coords || !c || c.x < 0) return;
  const old = Render.notes[c.b] || '';
  const text = prompt(`Adding a note at location ${pad2(c.x + 1)},${pad2(c.y + 1)}\n\nEnter a note for this location`, old);
  if (text === null) return;
  await Store.setNote(Game.level, c.b, text.trim());
  Render.notes = await Store.notesOf(Game.level);
  if (!Settings.v.notes) { Settings.v.notes = true; Settings.save(); }
  Render.draw();
}
// every press adds 2 seconds (the original's 10 ticks)
function peek() {
  const now = Date.now();
  Render.peekUntil = Math.max(Render.peekUntil, now) + 2000;
  Render.draw();
  setTimeout(() => Render.draw(), Render.peekUntil - now + 50);
}
function exploreLevel() { if (Game.coords && confirm('Really set the whole level map explored?')) Store.fill(Game.level, 1); }
function unexploreLevel() { if (Game.coords && confirm('Really set the whole level map unexplored?')) Store.fill(Game.level, 0); }
async function teleportHere() {
  if (Game.id === 3) {   // ASE3: to the cell the mouse was last over, wall or not
    const c = Render.lastMouse;
    if (!Game.coords || c.x < 0) return;
    await Api.write(Game.locAddr, Uint8Array.of(c.x, c.y));
    log(`Teleported to ${pad2(c.x + 1)},${pad2(c.y + 1)}`);
    return;
  }
  const c = Render.mouse;
  if (!c || !Game.coords) return;
  await Api.write(Game.addr('coords') + Game.cfg.coordBlock, Uint8Array.of(c.b & 255, c.b >> 8));
  log(`Teleported to ${pad2(c.x)},${pad2(c.y)}`);
}
function searchAgain() {
  Object.assign(Game, { cfg: null, hold: false, searchNote: '', coords: null, map: null, types: null, tweaked: false });
  $('#tip').style.display = 'none';
  Render.draw();
}
// like the original: bit 40 (identified) in byte 2 of every item, the whole table written back
async function identifyAll() {
  const a = Game.addr('items'), out = await Api.read(a, Game.cfg.items * 14);   // afresh, as the original
  for (let i = 0; i < Game.cfg.items; i++) out[i * 14 + 2] |= 0x40;
  await Api.write(a, out);
  log('All items identified');
}
// the original's: in every item type (16 bytes) byte 5 = 3F (all classes) and
// byte 6 = 0 (one hand); checked in the menu after that, and unchecking it
// writes nothing (the game's own values come back when it reloads them)
async function itemTweaks() {
  if (Game.tweaked) { Game.tweaked = false; return; }
  const a = Game.addr('itemTypes'), n = Game.cfg.itemTypes || 57, t = await Api.read(a, n * 16);
  for (let i = 0; i < n; i++) { t[i * 16 + 5] = 0x3F; t[i * 16 + 6] = 0; }
  await Api.write(a, t);
  Game.tweaked = true;
  log('Item usability tweaks applied');
}
// as the original (EOB 2): the monster table read afresh, the low byte of the hit points
// set to 1 where it isn't 0, the table written back
async function weakenMonsters() {
  const s = Game.cfg.monSize, a = Game.addr('monsters'), m = await Api.read(a, 30 * s);
  for (let i = 0; i < 30; i++) if (m[i * s + 14]) m[i * s + 14] = 1;
  await Api.write(a, m);
  log('Monsters weakened to 1 HP');
}
// the original's: flag 20 in byte 16 of every monster whose hit points' low byte isn't 0
async function petrifyMonsters() {
  const s = Game.cfg.monSize, a = Game.addr('monsters'), m = await Api.read(a, 30 * s);
  for (let i = 0; i < 30; i++) if (m[i * s + 14]) m[i * s + 0x16] |= 0x20;
  await Api.write(a, m);
  log('Monsters petrified');
}
// the original's Monsters.txt and Items.txt (the addresses as the original gives them)
function dumpMonsters() {
  const s = Game.cfg.monSize, m = Game.monsters;
  const cols = Array.from({ length: s }, (_, k) => hex(k, 2)).join(' ');
  const lines = [`##   Address      ${cols}      XX,YY   Hit points`, ''];
  for (let i = 0; i < 30; i++) {
    const r = m.subarray(i * s, i * s + s), block = r[2] | r[3] << 8;
    let line = `${pad2(i + 1)}   ${hex(RAM_WINDOW + Game.addr('monsters') + i * s, 8)}     ${[...r].map(v => hex(v, 2) + ' ').join('')}`;
    // the original's: where and how strong a monster is when it is on the map and its hit
    // points' low byte isn't 0 (the bytes, not the words)
    if (block < 1024 && r[14]) line += `     ${pad2(block & 31)},${pad2(block >> 5)}   ${String(r[14]).padStart(3, '0')} / ${String(r[12]).padStart(3, '0')}`;
    lines.push(line);
  }
  download(new Blob([lines.join('\r\n') + '\r\n']), 'Monsters.txt');
}
function dumpItems() {
  const pad = ' '.repeat(67);
  const lines = [pad + 'item name, unidentified', pad + '|  item name, identified (01 = empty, no identified name)',
    pad + '|  |  bits ($80 = magical, $40 = identified)', pad + '|  |  |     item type',
    pad + '|  |  |     | position on ground', pad + '|  |  |     |  |  position on level',
    pad + '|  |  |     |  |  |  |              level', pad + '|  |  |     |  |  |  |              |  plusses or wand/potion/etc. subtype',
    pad + '|  |  |     |  |  |  |              |  |', pad + '|  |  |     |  |  |  |              |  |',
    '###   Address    Hex    Item                                 Byte  00 01 02 03 04 05 06 07 08 09 10 11 12 13     Level: XX,YY', ''];
  for (let i = 0; i < Game.cfg.items; i++) {
    const it = Game.item(i), r = Game.items.subarray(i * 14, i * 14 + 14);
    let line = `${String(i).padStart(3, '0')}   ${hex(RAM_WINDOW + Game.addr('items') + i * 14, 8)}   ${hex(i & 255, 2)}${hex(i >> 8, 2)}   ` +
      `${Game.itemName(it).padEnd(43)}${[...r].map(v => hex(v, 2) + ' ').join('')}`;
    if (r[12]) { const b = r[6] | r[7] << 8; line += `    ${pad2(r[12])}: ${pad2(b & 31)},${pad2(b >> 5)}`; }
    lines.push(line);
  }
  download(new Blob([lines.join('\r\n') + '\r\n']), 'Items.txt');
}
// as the original's: Level_NN.bmp, the map as a 32-bit bitmap (what Delphi's TBitmap saves)
function exportMap() {
  const c = Render.canvas, w = c.width, h = c.height, px = c.getContext('2d').getImageData(0, 0, w, h).data;
  const size = 54 + w * h * 4, b = new DataView(new ArrayBuffer(size));
  b.setUint16(0, 0x4D42, true); b.setUint32(2, size, true); b.setUint32(10, 54, true);
  b.setUint32(14, 40, true); b.setInt32(18, w, true); b.setInt32(22, h, true); b.setUint16(26, 1, true);
  b.setUint16(28, 32, true); b.setUint32(34, w * h * 4, true);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {   // bottom row first, blue green red
    const s = ((h - 1 - y) * w + x) * 4, d = 54 + (y * w + x) * 4;
    b.setUint8(d, px[s + 2]); b.setUint8(d + 1, px[s + 1]); b.setUint8(d + 2, px[s]);
  }
  download(new Blob([b.buffer], { type: 'image/bmp' }), `Level_${pad2(Game.level)}.bmp`);
}

// the ASE or ASE3 folder (hints, Blocks.dat; level maps, item names) and the
// game folder (saves, manuals)
function pickFolder(kind) {
  const inp = $('#folderInput');
  inp.value = '';
  inp.onchange = async () => {
    const files = [...inp.files];
    if (kind === 'ase') {
      let n = 0;
      for (const f of files) {
        const p = f.webkitRelativePath.split('/').slice(1).join('/');
        let m = p.match(/^EOB([12])\/(Hints_\d\d\.txt|Blocks\.dat|Item_(?:List|Name)\.txt|Item_(?:Type|Subtype)\.dat)$/i);
        if (m) { await DB.put('files', `ASE:EOB${m[1]}/${normalAseName(m[2])}`, await f.arrayBuffer()); n++; continue; }
        m = p.match(/^Maps\/(\d\d)\.dat$/i);
        if (m) { await DB.put('files', `ASE3:Maps/${m[1]}.dat`, await f.arrayBuffer()); n++; continue; }
        if (/^Items\.txt$/i.test(p)) { await DB.put('files', 'ASE3:Items.txt', await f.arrayBuffer()); n++; }
      }
      Hints.cache = {}; Maps3.cache = {}; await AseData.load(); await Render.refreshAux(); Render.draw();
      log(n ? `ASE data imported (${n} files)` : 'No ASE or ASE3 data files in that folder');
    } else {
      const top = files.filter(f => f.webkitRelativePath.split('/').length <= 3);
      Object.assign(Files, { game: top, dir: null, url: '' });
      for (const f of top) if (/^(manual|cluebook)\.pdf$/i.test(f.name)) await DB.put('files', 'PDF:' + f.name.toLowerCase().replace('.pdf', ''), f);
      log(`Game folder chosen (${top.length} files)`);
      await afterGameFolder();
    }
  };
  if (kind === 'game' && window.showDirectoryPicker) {
    // a folder handle can also write (Apply to save, the save editor)
    showDirectoryPicker({ id: 'eobgame', mode: 'readwrite' }).then(async d => {
      Object.assign(Files, { dir: d, game: null, url: '' });
      log(`Game folder chosen: ${d.name}`);
      await afterGameFolder();
    }, e => { if (e.name !== 'AbortError') inp.click(); });
    return;
  }
  inp.click();
}
async function afterGameFolder() {
  await importExplored3();
  if (Game.cfg && Game.id !== 3) await importExplored12();
  Saves3.refresh();
  if (Files.after) { const a = Files.after; Files.after = null; a(); }
}
// the manual or clue book from the game folder, else the copy kept from an earlier pick
async function findPdf(key) {
  if (Files.dir) {
    for await (const [name, h] of Files.dir.entries()) if (h.kind === 'file' && name.toLowerCase() === key + '.pdf') return h.getFile();
  } else if (Files.url) {
    for (const name of [key.toUpperCase() + '.pdf', key[0].toUpperCase() + key.slice(1) + '.pdf', key + '.pdf']) {
      const r = await fetch(Files.url + name, { method: 'HEAD' }).catch(() => null);
      if (r?.ok) return Files.url + name;
    }
  }
  return DB.get('files', 'PDF:' + key);
}
// the game folder: files picked with the folder dialog, a folder handle
// (Chromium's File System Access API: also writable), or a folder the
// webserver serves (?gamedata=<folder>, read only)
const Files = {
  game: null, dir: null, url: '', after: null, written: {},
  has() { return !!(this.game || this.dir || this.url); },
  async handle(path) {
    let d = this.dir;
    const parts = path.split('/');
    for (const p of parts.slice(0, -1)) d = await d.getDirectoryHandle(p);
    return d.getFileHandle(parts.at(-1));
  },
  // { data: Uint8Array, date: ms } or null
  async get(path) {
    try {
      if (this.dir) { const f = await (await this.handle(path)).getFile(); return { data: new Uint8Array(await f.arrayBuffer()), date: f.lastModified }; }
      if (this.game) { const f = gameFile(path); return f ? { data: new Uint8Array(await f.arrayBuffer()), date: f.lastModified } : null; }
      if (this.url) {
        const r = await fetch(this.url + path, { cache: 'no-store' });
        return r.ok ? { data: new Uint8Array(await r.arrayBuffer()), date: Date.parse(r.headers.get('Last-Modified')) || 0 } : null;
      }
    } catch {}
    return null;
  },
  async read(path) { return (await this.get(path))?.data || null; },
  // the file's date (ms), 0 when it is not there
  async date(path) {
    try {
      if (this.dir) return (await (await this.handle(path)).getFile()).lastModified;
      if (this.game) return gameFile(path)?.lastModified || 0;
      if (this.url) {
        let r = await fetch(this.url + path, { method: 'HEAD', cache: 'no-store' }).catch(() => null);
        if (r && !r.ok && r.status !== 404) r = await fetch(this.url + path, { cache: 'no-store' }).catch(() => null);
        return r?.ok ? Date.parse(r.headers.get('Last-Modified')) || 0 : 0;
      }
    } catch {}
    return 0;
  },
  // writes into the game folder when it is writable, else offers a download
  async write(path, data) {
    if (this.dir) {
      try {
        if (await this.dir.requestPermission({ mode: 'readwrite' }) === 'granted') {
          const w = await (await this.handle(path)).createWritable();
          await w.write(data); await w.close();
          this.written[path.toLowerCase()] = Date.now();   // not the game saving (SavePeek)
          return true;
        }
      } catch (e) { log(`Writing ${path}: ${e.message}`); }
    }
    download(new Blob([data]), path.split('/').at(-1));
    alert(`The game folder can't be written from here, so ${path.split('/').at(-1)} was downloaded instead. ` +
      `Copy it into the game's ${path.split('/').slice(0, -1).join('/') || 'main'} folder.`);
    return false;
  },
};
const normalAseName = n => {
  const l = n.toLowerCase();
  if (l.startsWith('hints_')) return 'Hints_' + n.slice(6, 8) + '.txt';
  return { 'blocks.dat': 'Blocks.dat', 'item_list.txt': 'Item_List.txt', 'item_name.txt': 'Item_Name.txt', 'item_type.dat': 'Item_Type.dat',
    'item_subtype.dat': 'Item_Subtype.dat' }[l] || n;
};
// a file of the chosen game folder by its path below it ("SAVEGAME/ITEMS_01.BIN")
function gameFile(path) {
  path = path.toLowerCase();
  return Files.game?.find(f => f.webkitRelativePath.split('/').slice(1).join('/').toLowerCase() === path) || null;
}

// ?asedata=<folder> (ASE's) and ?ase3data=<folder> (ASE3's): data from a
// folder the webserver serves (relative to this page)
async function importAseUrl(base) {
  if (!base.endsWith('/')) base += '/';
  let n = 0;
  for (const id of [1, 2]) for (const name of ['Blocks.dat', 'Item_List.txt', 'Item_Name.txt', 'Item_Type.dat', 'Item_Subtype.dat',
    ...Array.from({ length: 16 }, (_, i) => `Hints_${pad2(i + 1)}.txt`)]) {
    const r = await fetch(`${base}EOB${id}/${name}`, { cache: 'no-store' });
    if (!r.ok) continue;
    await DB.put('files', `ASE:EOB${id}/${name}`, await r.arrayBuffer()); n++;
  }
  log(`ASE data imported from ${base} (${n} files)`);
}
async function importAse3Url(base) {
  if (!base.endsWith('/')) base += '/';
  let n = 0;
  for (const name of [...Array.from({ length: 14 }, (_, i) => `Maps/${pad2(i + 1)}.dat`), 'Items.txt']) {
    const r = await fetch(base + name, { cache: 'no-store' });
    if (!r.ok) continue;
    await DB.put('files', 'ASE3:' + name, await r.arrayBuffer()); n++;
  }
  Maps3.cache = {};
  log(`ASE3 data imported from ${base} (${n} files)`);
}
// ASE3 kept explored maps in <game>\ASE\Explored_NN.dat (per save slot, 14
// levels x 1024 bytes, column by column: x * 32 + y)
// a file of the game folder is taken over once per version (date and size), so
// clearing its slot in the page is not undone at the next start
async function newFile(path) {
  const f = await Files.get(path);
  if (!f) return null;
  const sig = `${f.date}:${f.data.length}`, key = 'imported:' + path.toLowerCase();
  if ((await DB.get('kv', key)) === sig) return null;
  await DB.put('kv', key, sig);
  return f.data;
}
async function importExplored3() {
  let n = 0;
  for (let slot = 1; slot <= 12; slot++) {
    const d = await newFile(`ASE/Explored_${pad2(slot)}.dat`);
    if (!d) continue;
    for (let lv = 1; lv <= 14 && lv * 1024 <= d.length; lv++) {
      const k = `3:${slot}:${lv}`, old = await DB.get('kv', 'exp:' + k), m = new Uint8Array(1024);
      if (old) m.set(new Uint8Array(old).subarray(0, 1024));
      for (let i = 0; i < 1024; i++) m[i] |= d[(lv - 1) * 1024 + ((i & 31) << 5 | i >> 5)] ? 1 : 0;
      await DB.put('kv', 'exp:' + k, m.buffer);
    }
    n++;
  }
  if (n) log(`Explored maps of ${n} save slot(s) taken over from ASE3`);
}
// ASE (EOB 1/2) kept them per level in <game>\ASE\Explored_NN.dat (the working
// set) and a copy per save slot in <game>\ASE_<slot>\: the slot copies are merged in
async function importExplored12() {
  if (!Files.has() || !Game.cfg || Game.id === 3) return;
  let n = 0;
  for (let slot = 1; slot <= (Game.cfg.slots || 6); slot++) for (let lv = 1; lv <= Game.cfg.levels; lv++) {
    const d = await newFile(`ASE_${slot}/Explored_${pad2(lv)}.dat`);
    if (!d || d.length < 5120) continue;
    const k = Store.skey(slot, lv), m = toExp(await DB.get('kv', 'exp:' + k));
    for (let i = 0; i < 5120; i++) if (d[i]) m[i] = 1;
    await DB.put('kv', 'exp:' + k, m.buffer);
    n++;
  }
  if (n) log(`Explored maps taken over from ASE (${n} files)`);
}

async function backupSave() {
  if (!Files.has()) { alert('Choose the game folder: the backup takes the saved games from there.'); Files.after = backupSave; pickFolder('game'); return; }
  const entries = [];
  if (Game.id === 3) {   // SAVEGAME\: the directory, each slot's ITEMS_NN.BIN and LVLnn_NN.BIN
    const names = ['SAVEGAME/SAVEGAME.DIR'];
    for (let s = 0; s <= 12; s++) {
      names.push(`SAVEGAME/ITEMS_${pad2(s)}.BIN`);
      for (let lv = 1; lv <= 14; lv++) names.push(`SAVEGAME/LVL${pad2(lv)}_${pad2(s)}.BIN`);
    }
    for (const n of names) { const d = await Files.read(n); if (d) entries.push([n.split('/').at(-1), d]); }
    if (!entries.length) { alert('No saved games (SAVEGAME\\) in the game folder.'); return; }
    const stamp = new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-');
    download(zipStore(entries), `EOB3 saves ${stamp}.zip`);
    log(`Saved games backed up (${entries.length} files)`);
    return;
  }
  // ASE's: a comment asked for, then LEVELS.TMP, the newest saved game and the explored maps
  // kept for its slot go into "Save backups\<date> - <time> - <comment>\" - here a zip of that name
  const comment = prompt('Backup a saved game\n\nEnter a comment for the saved game', `Level ${Game.level}`);
  if (comment === null) return;
  const [slot] = await SavePeek.newest();
  if (!slot) { alert('No saved games (EOBDATA*.SAV) in the game folder.'); return; }
  for (const n of ['LEVELS.TMP', SavePeek.names()[slot - 1]]) { const d = await Files.read(n); if (d) entries.push([n, d]); }
  Store.flush();
  const notes = [];
  for (let lv = 1; lv <= Game.cfg.levels; lv++) {
    const m = await DB.get('kv', 'exp:' + Store.skey(slot, lv));
    if (m) entries.push([`ASE_${slot}/Explored_${pad2(lv)}.dat`, new Uint8Array(m)]);
    const n = await DB.get('kv', 'notes:' + Store.skey(slot, lv)) || {};
    for (const b of Object.keys(n).map(Number).sort((a, c) => a - c)) notes.push(`#${lv},${pad2((b & 31) + 1)},${pad2((b >> 5) + 1)}`, n[b]);
  }
  if (notes.length) entries.push([`ASE_${slot}/Notes.txt`, new TextEncoder().encode(notes.join('\r\n') + '\r\n')]);
  const t = new Date(), stamp = `${t.getFullYear()}-${pad2(t.getMonth() + 1)}-${pad2(t.getDate())} - ${pad2(t.getHours())}.${pad2(t.getMinutes())}`;
  download(zipStore(entries), `${stamp} - ${comment}.zip`);
  log(`Saved game of slot ${slot} backed up (${entries.length} files)`);
}
// the wizard's "Clear explored maps": the chosen slot's, and so the map's
async function clearExplored12() {
  if (!confirm('Really clear explored maps from this save slot?')) return;
  const slot = Game.cfg.slots === 1 ? 1 : Settings.v.slot;
  await Store.clearSlot(slot);
  for (let lv = 1; lv <= Game.cfg.levels; lv++) { Store.exp(lv).fill(0); Store.dirty.add(Store.wkey(lv)); }
  Store.gen++; Render.draw();
  log(`Explored maps of save slot ${slot} cleared`);
}

function download(blob, name) {
  const a = el('a', { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

function zipStore(entries) {
  const crcTable = Array.from({ length: 256 }, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
  const crc = d => { let c = 0xFFFFFFFF; for (const b of d) c = crcTable[(c ^ b) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const parts = [], central = [];
  let off = 0;
  for (const [name, data] of entries) {
    const nm = new TextEncoder().encode(name), c = crc(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint32(14, c, true);
    h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nm.length, true);
    parts.push(new Uint8Array(h.buffer), nm, data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint32(16, c, true);
    cd.setUint32(20, data.length, true); cd.setUint32(24, data.length, true); cd.setUint16(28, nm.length, true);
    cd.setUint32(42, off, true);
    central.push(new Uint8Array(cd.buffer), nm);
    off += 30 + nm.length + data.length;
  }
  const size = central.reduce((a, p) => a + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, size, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}

      let first = null, done = false, timer = 0;
      const finish = v => { if (done) return; done = true; clearInterval(timer); d.remove(); resolve(v); };
      d.querySelector('header button').onclick = () => finish(-1);
      const rows = locs.map(a => { const tr = el('tr', { onclick: () => finish(a), style: 'cursor:pointer' }); t.append(tr); return tr; });
      const tick = async () => {
        const vals = await Promise.all(locs.map(a => Api.read(a, 4).catch(() => null)));
        if (done) return;
        first ??= vals.map(v => v?.join());
        const changed = [];
        vals.forEach((v, i) => {
          const ok = v && v[0] < 32 && v[1] < 32 && v[2] < 4 && v[3] >= 1 && v[3] <= 14;
          rows[i].replaceChildren(el('td', { textContent: hex(locs[i], 6) }),

          if (ok && v.join() !== first[i]) changed.push(i);
        });
        if (changed.length === 1 && vals.filter(v => v).length > 1) finish(locs[changed[0]]);
      };
      timer = setInterval(tick, 500); tick();
    });
  },
};

// SAVEGAME\SAVEGAME.DIR names the 12 slots (line n = ITEMS_nn.BIN); the
// party's x, y, direction and level are bytes 252-255 of ITEMS_nn.BIN
const Saves3 = {
  list: null, sel: 0, picked: 0,
  async load() {
    const dir = await Files.read('SAVEGAME/SAVEGAME.DIR');
    if (!dir) return this.list = null;
    const names = new TextDecoder('latin1').decode(dir).split(/\r\n|\r|\n/);
    const list = [];
    for (let slot = 1; slot <= 12; slot++) {
      // as ASE3 has it: a slot is used when its ITEMS_NN.BIN holds 256 bytes or more, whatever
      // SAVEGAME.DIR calls it (unused slots are "_____")
      const f = await Files.get(`SAVEGAME/ITEMS_${pad2(slot)}.BIN`), used = !!f && f.data.length >= 256;
      list.push({ slot, used, name: used ? (names[slot - 1] || '').replace(/\0.*$/s, '').trimEnd() : '',
        items: used ? f.data : null, date: used ? f.date : 0, loc: used ? f.data.slice(252, 256) : null });
    }
    return this.list = list;
  },
  async newestLocation() {
    const list = await this.load();
    const used = (list || []).filter(s => s.loc).sort((a, b) => b.date - a.date);
    return used[0]?.loc || null;
  },
  refresh() { if (document.getElementById('saves3')) this.open(); },
  // a click on a saved game, as ASE3's: its party location into the fields below and,
  // when the slot is used, its explored maps loaded for the map (and the preview)
  async pick(slot) {
    this.sel = slot;
    if (this.list?.[slot - 1]?.loc) {
      this.picked = slot;
      if (Game.cfg && Game.id === 3) await Store.loadSlot(slot);
    }
    this.open();
  },
  async open() {
    const d = Dlg.make('saves3', 'EOB 3 saved games', 980), body = d.querySelector('.body');
    if (!Files.has()) {
      body.replaceChildren(el('p', { textContent: 'Choose the game folder (the one with SAVEGAME\\ in it) to see the saved games.' }),
        el('button', { textContent: 'Game folder…', onclick: () => pickFolder('game') }));
      return;
    }
    const list = await this.load();
    if (!list) { body.replaceChildren(el('p', { textContent: 'No SAVEGAME\\SAVEGAME.DIR in the game folder.' })); return; }
    if (!this.sel) this.sel = Store.loadedSlot || [...list].filter(s => s.loc).sort((a, b) => b.date - a.date)[0]?.slot || 1;
    const fmtDate = ms => { if (!ms) return ''; const t = new Date(ms); return `${t.getFullYear()}-${pad2(t.getMonth() + 1)}-${pad2(t.getDate())}  ${pad2(t.getHours())}:${pad2(t.getMinutes())}`; };
    const rows = el('table', { className: 'list', style: 'font-family:Consolas,monospace' });
    for (const s of list) {
      const n = s.used && s.loc[3] >= 1 && s.loc[3] <= 14 ? s.loc[3] : 0;   // ASE3: level 00 without a name outside 1-14
      rows.append(el('tr', { className: s.slot === this.sel ? 'sel' : '', style: 'cursor:pointer', onclick: () => this.pick(s.slot) },
        el('td', { textContent: s.used ? pad2(s.slot) : '' }), el('td', { textContent: s.name }),   // unused: an empty line
        el('td', { textContent: s.used ? `${pad2(n)}: ${n ? LEVEL_NAMES[3][n - 1] : ''}` : '' }),
        el('td', { textContent: s.used ? fmtDate(s.date) : '' })));
    }
    const s = list[this.sel - 1];
    const full = el('input', { type: 'checkbox', checked: !!Settings.v.previewFull });
    const cv = el('canvas', { width: 480, height: 480, style: 'background:var(--rock);cursor:crosshair' });
    const level = el('select');
    LEVEL_NAMES[3].forEach((n, i) => level.append(el('option', { value: i + 1, textContent: `${pad2(i + 1)}: ${n}` })));
    const xIn = el('input', { type: 'number', min: 1, max: 32, style: 'width:56px' }), yIn = el('input', { type: 'number', min: 1, max: 32, style: 'width:56px' });
    if (s.loc) { level.value = s.loc[3]; xIn.value = s.loc[0] + 1; yIn.value = s.loc[1] + 1; }
    const draw = () => this.preview(cv, s, +level.value, +xIn.value - 1, +yIn.value - 1, full.checked);
    full.onchange = () => { Settings.v.previewFull = full.checked; Settings.save(); draw(); };
    level.onchange = draw;   // ASE3 redraws for a level and a click on the map, not for typed coordinates
    cv.onmousedown = ev => {
      const r = cv.getBoundingClientRect(), cs = cv.width / 32;
      xIn.value = Math.floor((ev.clientX - r.left) / cs) + 1; yIn.value = Math.floor((ev.clientY - r.top) / cs) + 1; draw();
    };
    const apply = el('button', { textContent: 'Apply to save', disabled: !s.items, onclick: async () => {
      const x = +xIn.value - 1, y = +yIn.value - 1, lv = +level.value;
      if (!(x >= 0 && x < 32 && y >= 0 && y < 32)) { alert('X and Y go from 1 to 32.'); return; }
      const data = s.items.slice();
      data[252] = x; data[253] = y; data[255] = lv;
      if (await Files.write(`SAVEGAME/ITEMS_${pad2(s.slot)}.BIN`, data))
        log(`Save slot ${s.slot}: party set to level ${lv} at ${pad2(x + 1)},${pad2(y + 1)}`);
      this.open();
    } });
    const slotNote = el('span', { className: 'muted', textContent: 'Explored maps are kept per save slot: a click on a saved game loads ' +
      'its explored maps, and when the game saves they go to the slot it saved in' +
      (Store.loadedSlot ? ` (the map shows slot ${Store.loadedSlot}'s).` : '.') });
    body.replaceChildren(el('div', { className: 'cols' },
      el('div', { style: 'flex:1;min-width:420px' },
        el('fieldset', {}, el('legend', { textContent: ' Saved games ' }), rows),
        el('p', {}, slotNote),
        el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' },
          el('button', { textContent: 'Refresh saved games', onclick: () => this.open() }),
          el('button', { textContent: 'Edit characters in save file', disabled: !s.items, onclick: () => Editor3.openFile(s.slot) }),
          el('button', { textContent: 'Clear explored', onclick: () => this.clearExplored(s.slot) }),
          el('button', { textContent: 'Backup save game', onclick: backupSave }))),
      el('div', {}, cv,
        el('div', {}, el('label', { style: 'display:inline-flex;gap:6px;margin:4px 0' }, full, 'Show preview map as fully explored')),
        el('fieldset', {}, el('legend', { textContent: ' Party location in this save game ' }),
          el('div', { style: 'display:flex;gap:6px;align-items:center' }, level, xIn, yIn, apply)))));
    draw();
  },
  // ASE3's preview: its map drawing on 480 x 480 pixels, the level's map from ASE3's
  // Maps\NN.dat (the game's own when there is none), the party where the fields say,
  // facing the save's way
  async preview(cv, s, level, px, py, full) {
    const g = cv.getContext('2d');
    g.fillStyle = COLORS.rock3; g.fillRect(0, 0, cv.width, cv.height);
    const m = await Maps3.get(level) || (Game.id === 3 && Game.map && Game.level === level ? Game.map : null);
    if (!m) {
      g.fillStyle = '#2b2010'; g.font = '14px Tahoma'; g.textAlign = 'center';
      g.fillText('No map of this level: import ASE3\'s folder (menu: ASE / ASE3 data folder)', cv.width / 2, cv.height / 2);
      return;
    }
    // the slot's explored maps as they are kept for it (ASE3's Explored_NN.dat)
    const exp = full ? null : new Uint8Array(await DB.get('kv', `exp:3:${s.slot}:${level}`) || new ArrayBuffer(1024));
    const party = s.used && px >= 0 && py >= 0 && px < 32 && py < 32 ? { x: px, y: py, dir: s.loc[2] } : null;
    Render.map3(g, cv.width >> 5, m, b => m[b] === 0xFF && (full || !!exp[b]), party, null, null);
  },
  // ASE3 empties the explored maps it has loaded, writes them to the slot and loads the slot again
  async clearExplored(slot) {
    if (!confirm('Really clear explored maps from this save slot?')) return;
    if (!this.list?.[slot - 1]?.used) return;
    await Store.clearSlot(slot);
    if (Game.id === 3 && Store.loadedSlot === slot) for (let lv = 1; lv <= 14; lv++) { Store.exp(lv).fill(0); Store.dirty.add(Store.wkey(lv)); }
    Store.gen++; Render.draw();
    log(`Explored maps of save slot ${slot} cleared`);
    await this.pick(slot);
  },
};

// ASE's character editor for EOB 1/2: statistics, hit points, armor class,
// race, class, alignment, food and experience can be changed (levels are
// shown only), spells are a count per spell with Learn / Unlearn, the
// inventory is set from the item list
const Editor = {
  cur: 0, kind: 'mage', spell: -1, slot: -1, filter: '',
  open() {
    if (Game.id === 3) return Editor3.open();
    if (!Game.chars) return;
    Dlg.make('editor', 'Character editor', 980);
    this.render();
  },
  refresh() { /* values are read when the editor is drawn; live fields keep the user's input */ },
  rec() { const cs = Game.cfg.charSize; return Game.chars.subarray(this.cur * cs, (this.cur + 1) * cs); },
  base() { return Game.char0 + this.cur * Game.cfg.charSize; },
  // ASE's view of the spells: -1 unknown ("-"), else the number of memorized copies
  spellCounts(r, kind) {
    const F = Game.cfg.f, list = SPELLS[Game.id][kind], counts = new Array(list.length).fill(0);
    if (kind === 'mage') {
      const known = r[F.known] | r[F.known + 1] << 8 | r[F.known + 2] << 16 | r[F.known + 3] << 24;

  get(r, off, size = 1, signed = false) {

function charOk3(m, n) {
  let len = 0;
  while (len < 20 && m[n + len]) { const c = m[n + len]; if (c < 32 || c > 126) return false; len++; }
  if (len < 1 || len > 19) return false;

    let slotSel = -1;
    const eq = el('table', { className: 'list', style: 'font-family:Consolas,monospace' });
    const setSlot = async (k, v) => { const o = C3.slots + 2 * k; rec3.set(rd, o, v, 2); fill(); await this.now(r, [o, o + 1]); };
    const eqRows = kind === 'mem' ? [] : SLOTS3.map(([name, k], i) => {
      const tr = el('tr', { style: 'cursor:pointer', onclick: () => { slotSel = i; eqRows.forEach((x, j) => x.classList.toggle('sel', j === i)); } });
      tr.ondblclick = () => {
        const v = prompt('Enter item number (decimal)', '');
        if (v !== null && /^\d+$/.test(v.trim())) setSlot(k, +v);
      };
      eq.append(tr);
      return tr;
    });
    const fill = () => eqRows.forEach((tr, i) => {
      const v = rec3.get(rd, C3.slots + 2 * SLOTS3[i][1], 2);
      tr.replaceChildren(el('td', { textContent: SLOTS3[i][0] }), el('td', { className: 'n', textContent: v === 0xFFFF ? '-' : String(v).padStart(4, '0') }),
        el('td', { textContent: v === 0xFFFF ? '-' : items.get(v) || '?' }));
    });
    fill();
    const list = el('select', { size: 18, style: 'width:100%;font-family:Consolas,monospace' }), filter = el('input', { type: 'text', placeholder: 'Filter' });
    const fillList = () => {
      list.replaceChildren();
      for (const [n, name] of items) if (!filter.value || name.toLowerCase().includes(filter.value.toLowerCase()))
        list.append(el('option', { value: n, textContent: `${String(n).padStart(4, '0')}  ${name}` }));
    };
    filter.oninput = fillList; fillList();
    const setItem = () => { if (slotSel >= 0 && list.value) setSlot(SLOTS3[slotSel][1], +list.value); };
    const clearItem = () => { if (slotSel >= 0) setSlot(SLOTS3[slotSel][1], 0xFFFF); };
    const equip = el('fieldset', {}, el('legend', { textContent: ' Equipment ' }), el('div', { style: 'display:flex;gap:10px' },
      el('div', { style: 'max-height:430px;overflow:auto' }, kind === 'mem'
        ? el('p', { className: 'muted', style: 'width:300px', textContent: 'The equipment is edited in a saved game (Saved games…), as in ASE3.' }) : eq),
      el('div', { style: 'width:330px' }, items.size ? list : el('p', { className: 'muted',
        textContent: "No item names: import ASE3's folder (menu: ASE / ASE3 data folder) for its Items.txt. Double-click a slot to enter an item number." }),
        el('div', { style: 'display:flex;gap:6px;margin-top:4px' }, el('button', { textContent: 'Set item', onclick: setItem }),
          el('button', { textContent: 'Clear item', onclick: clearItem }), filter))));
    body.replaceChildren(el('div', { className: 'ed', style: 'grid-template-columns:150px 1fr' }, chars,
      el('div', {}, el('div', { className: 'cols' }, stats, equip),
        el('div', { className: 'cols' }, spellBox('Mage spells', MAGE3, C3.mage), spellBox('Cleric spells', CLERIC3, C3.cleric)),
        el('p', { className: 'muted', textContent: 'Changes are kept per character until "Apply changes". Some items may crash the game; ' +
          'back up your saves before editing.' }))));
  },
  // what ASE3 writes at once (a spell, an equipment slot): into memory, or into the saved
  // game when its folder can be written; otherwise it goes with "Apply changes" (a download)
  async now(r, offs) {
    if (this.src.kind === 'mem') {
      for (const off of offs) {
        const i = off - C3.from;
        await Api.write(r.at + off, r.data.subarray(i, i + 1));
        r.orig[i] = r.data[i];
      }
      return;
    }
    for (const off of offs) this.src.file[r.at + off] = r.data[off - C3.from];
    if (Files.dir) await Files.write(`SAVEGAME/ITEMS_${pad2(this.src.slot)}.BIN`, this.src.file);
  },
  async apply() {
    const { kind, recs } = this.src;
    if (kind === 'mem') {
      // only the bytes that were changed, like ASE3, so the game's own changes to the rest stay
      const changed = recs.filter(r => r.data.some((v, i) => v !== r.orig[i]));
      for (const r of changed) {
        for (let i = 0; i < r.data.length;) {
          if (r.data[i] === r.orig[i]) { i++; continue; }
          let j = i;
          while (j < r.data.length && r.data[j] !== r.orig[j]) j++;
          await Api.write(r.at + C3.from + i, r.data.subarray(i, j));
          i = j;
        }
        r.orig = r.data.slice();
      }
      log(changed.length ? `Characters written to memory: ${changed.map(r => rec3.name(r.data)).join(', ')}` : 'Nothing changed');
    } else {
      const f = this.src.file.slice();
      for (const r of recs) f.set(r.data, r.at + C3.from);
      if (await Files.write(`SAVEGAME/ITEMS_${pad2(this.src.slot)}.BIN`, f)) {
        this.src.file = f;
        log(`Characters written to ITEMS_${pad2(this.src.slot)}.BIN`);
      }
    }
  },
};

/* -------------------------------------------------------- log */

const logLines = [];
function log(text) {
  logLines.push(`${new Date().toTimeString().slice(0, 8)}  ${text}`);
  if (logLines.length > 500) logLines.shift();
  const l = document.querySelector('#log');
  if (l) { l.textContent = logLines.join('\n'); l.parentElement.scrollTop = 1e9; }
}
const LogWin = {
  open() {
    const d = Dlg.make('logwin', 'Debug log', 640), body = d.querySelector('.body');
    body.style.height = '320px';
    if (!body.querySelector('#log')) body.append(el('div', { id: 'log' }));
    log('Log opened');
  },
};

loop();
</script>
</body>
