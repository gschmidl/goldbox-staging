<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The All-Seeing Eye</title>
<style>
:root {
  --bg: #1b1610; --text: #e4e0d8; --dim: #7d7466; --menu: #1c1c1c; --sel: #2c4a78; --line: #2c2c2c;
  --rock: #a28440; --floor: #ececec; --grid: #dadada; --wall: #5c4a38;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 13px/1.35 Tahoma, Verdana, "Segoe UI", system-ui, sans-serif; }
#app { display: flex; flex-direction: column; height: 100vh; }
#bar { display: flex; align-items: center; gap: 8px; padding: 3px 8px; background: #161616;
  border-bottom: 1px solid var(--line); white-space: nowrap; min-height: 28px; }
#title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.chip { padding: 0 8px; border-radius: 9px; background: #333; font-size: 12px; }
.chip.ok { background: #0b4d0b; } .chip.bad { background: #6a1010; } .chip.warn { background: #6a5410; }
button, select, input, textarea { background: #222; color: var(--text); border: 1px solid #484848; border-radius: 3px;
  padding: 2px 8px; font: inherit; }
button { cursor: pointer; } button:hover { background: #333; }
input[type=number] { width: 70px; }
#mapwrap { position: relative; flex: 1; overflow: auto; background: var(--rock); }
#map { display: block; margin: 0 auto; }
#tip { position: fixed; pointer-events: none; background: #483929; color: #fff; padding: 0 10px 10px;
  font: 13px/1.4 Consolas, "Courier New", monospace; display: none; z-index: 30; width: 340px; white-space: pre-wrap; }
#msg { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); max-width: 580px;
  text-align: center; color: #2b2010; }
#msg h2 { font-weight: normal; }
.menu { position: fixed; background: var(--menu); border: 1px solid #555; min-width: 230px; padding: 3px 0;
  z-index: 50; box-shadow: 3px 3px 10px #000c; user-select: none; }
.menu .mi { padding: 3px 22px 3px 24px; position: relative; display: flex; justify-content: space-between;
  gap: 24px; cursor: default; white-space: nowrap; }
.menu .mi:hover, .menu .mi.open { background: var(--sel); }
.menu .mi.dis { color: var(--dim); }
.menu .mi.chk::before { content: "\2713"; position: absolute; left: 7px; }
.menu .mi.sub::after { content: "\25B8"; position: absolute; right: 8px; }
.menu .mi .k { color: #999; }
.menu .sep { height: 1px; background: #444; margin: 3px 0; }
.dlg { position: fixed; z-index: 40; background: #121212; border: 1px solid #555; box-shadow: 4px 4px 14px #000c;
  display: flex; flex-direction: column; max-height: 92vh; }
.dlg header { display: flex; align-items: center; gap: 8px; padding: 4px 8px; background: #1f1f1f; cursor: move;
  user-select: none; border-bottom: 1px solid #333; }
.dlg header .t { flex: 1; }
.dlg .body { padding: 8px 10px; overflow: auto; }
.list { border-collapse: collapse; width: 100%; font-size: 12px; }
.list td, .list th { padding: 1px 6px; text-align: left; white-space: nowrap; }
.list th { color: #aaa; font-weight: normal; border-bottom: 1px solid #333; position: sticky; top: 0; background: #121212; }
.list tr.sel td { background: var(--sel); }
.list tr:hover td { background: #1d2a3d; }
.n { text-align: right !important; }
#log { font: 12px/1.3 Consolas, monospace; white-space: pre-wrap; }
.grid2 { display: grid; grid-template-columns: auto auto; gap: 4px 10px; align-items: center; }
.ed { display: grid; grid-template-columns: 170px 1fr; gap: 12px; }
.ed .chars button { display: block; width: 100%; text-align: left; margin-bottom: 3px; }
.ed .chars button.sel { background: var(--sel); }
.ed label { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 3px; }
.cols { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
.muted { color: #999; }
.legend td { padding: 2px 8px; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span id="title">The All-Seeing Eye</span>
    <span id="peek" class="chip warn hidden">Peek</span>
    <span id="dbg" class="chip warn hidden">Debug</span>
    <span id="game" class="chip hidden"></span>
    <span id="conn" class="chip">connecting</span>
    <button id="menuBtn" title="Menu (or right-click the map)">&#9776;</button>
  </div>
  <div id="mapwrap">
    <canvas id="map" width="512" height="512"></canvas>
    <div id="msg"></div>
  </div>
</div>
<div id="tip"></div>
<input id="folderInput" type="file" webkitdirectory multiple class="hidden">

<script>
'use strict';
/* The All-Seeing Eye for DOSBox Staging - a rewrite of Joonas Hirvonen's
 * automapper for Eye of the Beholder 1 and 2 (ASE 1.10) and 3 (ASE3) as a web
 * page. It reads and writes the game's memory through DOSBox Staging's HTTP
 * API (/api/v1/memory), which also serves this page.
 *
 * Eye of the Beholder 1/2 keep in memory: the party (6 character records),
 * the party's level/block/direction, the current level's 32x32 blocks (9
 * bytes each: 4 wall faces N E S W, flags, first item, draw list), the item
 * array (14 bytes per item), the level's 30 monsters, and the wall tables
 * the game builds when it loads a level (wall flags, special wall types).
 * The map is drawn from those like ScummVM's automap does. */

const $ = (s, r = document) => r.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  for (const k of kids) e.append(k);
  return e;
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hex = (n, w = 4) => n.toString(16).toUpperCase().padStart(w, '0');
const pad2 = n => String(n).padStart(2, '0');

/* ---------------------------------------------------------------- API */

const Api = {
  async read(addr, len) {
    const r = await fetch(`/api/v1/memory/${addr}/${len}`,
      { headers: { Accept: 'application/octet-stream' }, cache: 'no-store' });
    if (!r.ok) throw new Error(`read ${hex(addr, 6)}: HTTP ${r.status}`);
    return new Uint8Array(await r.arrayBuffer());
  },
  async write(addr, bytes) {
    const r = await fetch(`/api/v1/memory/${addr}`, { method: 'PUT',
      headers: { 'Content-Type': 'application/octet-stream' }, body: bytes });
    if (!r.ok) throw new Error(`write ${hex(addr, 6)}: HTTP ${r.status}`);
  },
  async info() {
    const r = await fetch('/api/v1/dosbox/info', { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  },
};

/* ------------------------------------------------- browser storage */

const DB = {
  db: null,
  open() {
    return this.db ??= new Promise((res, rej) => {
      const q = indexedDB.open('ase', 1);
      q.onupgradeneeded = () => { q.result.createObjectStore('files'); q.result.createObjectStore('kv'); };
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  },
  async op(store, mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const q = fn(db.transaction(store, mode).objectStore(store));
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  },
  get: (s, k) => DB.op(s, 'readonly', o => o.get(k)),
  put: (s, k, v) => DB.op(s, 'readwrite', o => o.put(v, k)),
  del: (s, k) => DB.op(s, 'readwrite', o => o.delete(k)),
  keys: s => DB.op(s, 'readonly', o => o.getAllKeys()),
};

const Settings = {
  v: { buttons: true, illusionary: false, monsters: false, items: false, hints: false, notes: false,
       debug: false, zoom: 0, slot: 1 },
  load() { try { Object.assign(this.v, JSON.parse(localStorage.getItem('ase.settings') || '{}')); } catch {} },
  save() { try { localStorage.setItem('ase.settings', JSON.stringify(this.v)); } catch {} },
};

/* ------------------------------------------------------ game data */

const LEVEL_NAMES = {
  1: ['Upper sewer level', 'Middle sewer level', 'Lower sewer level', 'Upper level of dwarven ruins',
    'Dwarven ruins and camp', 'Bottom level of dwarven ruins', 'Upper reaches of the drow', 'Drow outcasts',
    'Lower reaches of the drow', "Xanathar's outer sanctum, mantis hive", "Xanathar's outer sanctum, lower reaches",
    "Xanathar's inner sanctum"],
  2: ['Catacomb, level 1', 'Catacomb, level 2', 'Catacomb, level 3', 'Forest', 'Temple, entrance hall',
    'Temple, level 2', 'Silver tower, level 1', 'Silver tower, level 2', 'Silver tower, level 3', 'Azure tower, level 1',
    'Azure tower, level 2', 'Azure tower, level 3', 'Azure tower, level 4', 'Frost giant prison',
    'Crimson tower, level 1', 'Crimson tower, level 2'],
  3: ["Warrior's tomb 1", "Warrior's tomb 2", 'Burial glen', 'Forest trail', 'Guildhall quarter ruins',
    "Mages' guild 1", "Mages' guild 2", "Mages' guild 3", "Mages' guild 4", 'Temple quarter ruins',
    'Temple of Lathander 1', 'Temple of Lathander 2', 'Temple of Lathander 3', 'Temple of Lathander 4'],
};
// ASE's monster names (EOB 1 only; type 11 really is "???"), other types show their number
const MONSTER_NAMES = {
  1: ['Kobold', 'Leech', 'Skeleton', 'Zombie', 'Kuo-Toa', 'Flind', 'Spider', 'Dwarf', 'Skeletal lord',
    'Displacer beast', 'Mantis warrior', '???', 'Drow', 'Golem', 'Wizard', 'Drider', 'Kenku', 'Mind flayer',
    'Rust monster', 'Xorn', 'Hell hound', 'Xanathar'],
  2: [],
};
const RACES = ['Human', 'Elf', 'Half-elf', 'Dwarf', 'Gnome', 'Halfling'];
const CLASSES = ['Fighter', 'Ranger', 'Paladin', 'Mage', 'Cleric', 'Thief', 'Fighter/Cleric', 'Fighter/Thief',
  'Fighter/Mage', 'Fighter/Mage/Thief', 'Thief/Mage', 'Cleric/Thief', 'Fighter/Cleric/Mage', 'Ranger/Cleric',
  'Cleric/Mage'];
const CLASSES12 = CLASSES.map(c => c.replaceAll('/', ' / '));   // as ASE writes them
const ALIGN = ['Lawful good', 'Neutral good', 'Chaotic good', 'Lawful neutral', 'True neutral', 'Chaotic neutral',
  'Lawful evil', 'Neutral evil', 'Chaotic evil'];
const DIRS = ['north', 'east', 'south', 'west'];

// item subtypes as ASE names them (the item's value byte picks the entry)
const POTIONS = ['Giant Strength', 'Healing', 'Extra Healing', 'Poison', 'Vitality', 'Speed', 'Invisibility', 'Cure Poison'];
const WANDS = { 1: ['Stick', 'Lightning', 'Frost', 'Curing', 'Fireball', 'Silvias', 'Magic Missile'],
  2: ['Stick', 'Lightning', 'Frost', 'Curing', 'Fireball', 'Starfire', 'Magic Missile', 'Dispel Magic'] };
const RINGS = ['Adornment', 'Wizardry', 'Sustenance', 'Feather Fall'];
// item types whose value is a "+N" (ASE's bitmap)
const PLUS_TYPES = new Set([0, 1, 2, 4, 5, 7, 10, 11, 13, 14, 15, 18, 19, 20, 21, 22, 24, 25, 27, 32, 41, 42, 43, 45]);
// the spell lists of ASE's editor (and of the scrolls): [name, level] in the game's spell numbering
const spellList = (...levels) => levels.flatMap((names, i) => names.split('|').map(n => [n, i + 1]));
const SPELLS = {
  1: { mage: spellList('Armor|(Burning Hands)|Detect Magic|Magic Missile|(Read Magic)|Shield|Shocking Grasp',
         "Invisibility|(Knock)|Melf's Acid Arrow|(Stinking Cloud)",
         "Dispel Magic|Fireball|Flame Arrow|Haste|Hold Person|Invisibility, 10'|Lightning Bolt|Vampiric Touch",
         'Fear|Ice Storm|Stoneskin', '(Cloudkill)|Cone of Cold|Hold Monster'),
       cleric: spellList('Bless|Cure Light Wounds|Cause Light Wounds|Detect Magic|Protection from Evil',
         'Aid|Flame Blade|Hold Person|Slow Poison', 'Create Food|Dispel Magic|Magical Vestment|Prayer|Remove Paralysis',
         "Cure Serious Wounds|Cause Serious Wounds|Neutralize Poison|Protection from Evil, 10'|(Protection from Lightning)",
         'Cure Critical Wounds|Cause Critical Wounds|Flame Strike|Raise Dead') },
  2: { mage: spellList('Armor|Burning Hands|Detect Magic|Magic Missile|Shield|Shocking Grasp',
         "Blur|Detect Invisible|Improved Identify|Invisibility|Melf's Acid Arrow",
         "Dispel Magic|Fireball|Haste|Hold Person|Invisibility, 10'|Lightning Bolt|Vampiric Touch",
         'Fear|Ice Storm|Improved Invisibility|Remove Curse', 'Cone of Cold|Hold Monster|Wall of Force',
         "Disintegrate|Flesh to Stone|Stone to Flesh|True Seeing|(7: Finger of Death)|(7: Power Word, Stun)|(8: Bigby's Clenched Fist)"),
       cleric: spellList('Bless|Cause Light Wounds|Cure Light Wounds|Detect Magic|Protection from Evil',
         'Aid|Flame Blade|Hold Person|Slow Poison', 'Create Food|Dispel Magic|Magical Vestment|Prayer|Remove Paralysis',
         "Cause Serious Wounds|Cure Serious Wounds|Neutralize Poison|Protection from Evil, 10'",
         'Cause Critical Wounds|Cure Critical Wounds|Flame Strike|Raise Dead|Slay Living|True Seeing',
         'Harm|Heal|(7: Resurrection)') },
};
// the editor's inventory slots in ASE's order; offsets from the "Hand left" slot
const SLOTS12 = [['Helmet', 0x26], ['Armor', 0x22], ['Medallion', 0x28], ['Bracers', 0x24], ['Ring 1', 0x32], ['Ring 2', 0x34],
  ['Boots', 0x2A], ['Ammunition', 0x20], ['Belt 1', 0x2C], ['Belt 2', 0x2E], ['Belt 3', 0x30], ['Hand left', 0], ['Hand right', 2],
  ...Array.from({ length: 14 }, (_, i) => [`Backpack ${i + 1}`, 4 + 2 * i])];

// per game: record sizes, the wall-flag preset that begins the game's flag
// table, the special block wall ids (as in ScummVM's automap), and where the
// structures lie relative to the first character record
const GAMES = {
  1: { name: 'EOB 1', levels: 12, charSize: 243, items: 500, monSize: 28, cellSize: 9, cellItem: 5,
       coordsLen: 5, coordBlock: 2, coordDir: 4,
       flagPreset: [0x07, 0x00, 0x40, 0xA8, 0x88, 0x88, 0x88, 0x9F, 0xA8, 0x88, 0x88, 0x88, 0x9F, 0xAA, 0x8A, 0x8A, 0x8A, 0x9F],
       tableLen: 70, teleporter: [52], illusion: [67, 64, 66, 57], plate: [28], pit: [27], up: [23], down: [24],
       wallOfForce: -1, firstItemName: 'Leather armor', firstItemIndex: 2, itemNameLen: 35, itemTypes: 57, slots: 1,
       // character record fields (EOB 1 keeps HP in single bytes)
       f: { hp: 0x1B, hpMax: 0x1C, hpSize: 1, ac: 0x1D, race: 0x1F, cls: 0x20, align: 0x21, food: 0x23, level: 0x24,
            xp: 0x27, mage: 0x37, cleric: 0x55, known: 0x73, spellLevels: 5, spellSlots: 6, inv: 0x77 },
       rel: { coords: 0x648, map: -0x3CEC, items: -0x67B0, monsters: -0x6AFE, itemTypes: -0x4B90 } },
  2: { name: 'EOB 2', levels: 16, charSize: 345, items: 600, monSize: 30, cellSize: 10, cellItem: 6,
       coordsLen: 7, coordBlock: 4, coordDir: 6,
       flagPreset: [0x07, 0x00, 0x40, 0xA8, 0x88, 0x88, 0x88, 0x9F, 0xA8, 0x88, 0x88, 0x88, 0x9F, 0xA8, 0x88, 0x88, 0x88, 0x9F],
       tableLen: 80, teleporter: [44], illusion: [46], plate: [35, 36], pit: [38], up: [23], down: [24],
       wallOfForce: 74, firstItemName: 'Leather armor', firstItemIndex: 2, itemNameLen: 35, itemTypes: 64,
       f: { hp: 0x1B, hpMax: 0x1D, hpSize: 2, ac: 0x1F, race: 0x21, cls: 0x22, align: 0x23, food: 0x25, level: 0x26,
            xp: 0x29, mage: 0x39, cleric: 0x89, known: 0xD9, spellLevels: 8, spellSlots: 10, inv: 0xDD },
       rel: { coords: -0x783A, map: -0x42A8, items: -0x743E, monsters: -0x77DE, itemTypes: -0x519A } },
  // EOB 3 runs on the AESOP engine, which puts its arrays wherever its heap has
  // room: the level map (32x32 bytes, FF open, walls 0 or 1 in a checkerboard)
  // and the party's x, y, direction and level are found by their structure
  3: { name: 'EOB 3', levels: 14, slots: 12 },
};
// AESOP.EXE's own message, in conventional memory while EOB 3 runs
const EOB3_SIGN = new TextEncoder().encode('Eye of the Beholder III requires');

/* -------------------------------------------------------- the game */

const Game = {
  id: 0, cfg: null, char0: 0, tables: null, info: null,
  chars: null, coords: null, map: null, items: null, monsters: null, names: [],
  mapAddr: 0, locAddr: 0,   // EOB 3
  get level() { return this.id === 3 ? this.coords[3] : this.coords[0] | this.coords[1] << 8; },
  get block() {
    if (this.id === 3) return this.coords[1] << 5 | this.coords[0];
    const o = this.cfg.coordBlock; return this.coords[o] | this.coords[o + 1] << 8;
  },
  get dir() { return this.coords[this.id === 3 ? 2 : this.cfg.coordDir] & 3; },
  get x() { return this.block & 31; },
  get y() { return this.block >> 5; },
  addr(key) { return this.char0 + this.cfg.rel[key]; },

  async find() {
    const mem = new Uint8Array(0x100000);
    for (let a = 0; a < mem.length; a += 0x10000) mem.set(await Api.read(a, 0x10000), a);
    for (const id of [1, 2]) {
      const cfg = GAMES[id];
      const t = findTables(mem, cfg);
      if (!t) continue;
      const c0 = findCharacters(mem, cfg);
      if (c0 < 0) continue;
      Object.assign(this, { id, cfg, char0: c0, tables: t, types: null, tweaked: false });
      this.names = itemNames(mem, cfg);
      if (!this.names.length && AseData.items[id]?.names) this.names = AseData.items[id].names;   // ASE's Item_Name.txt
      return true;
    }
    if (indexOf(mem, EOB3_SIGN) >= 0) return this.find3();
    return false;
  },
  // EOB 3: read all of the emulated RAM, find the party location (after the
  // list of party members) and the level map that goes with it
  async find3(keepLocation = false) {
    setConn('searching EOB 3', 'warn');
    const mem = await readAll(), maps = findMaps3(mem);
    if (!maps.length) { this.searchNote = 'EOB 3 runs, but no level map is in memory yet.'; return false; }
    let locs = keepLocation ? [this.locAddr] : findLocations3(mem, true).filter(l => maps.some(m => fits3(mem, m, l)));
    if (!locs.length) {
      // ASE3's way: the location in the newest saved game, exactly
      const saved = await Saves3.newestLocation();
      if (saved) {
        for (let i = indexOf(mem, saved); i >= 0; i = indexOf(mem, saved, i + 1))
          if (maps.some(m => fits3(mem, m, i))) locs.push(i);
        log(`Party location of the newest saved game (${[...saved].map(v => hex(v, 2)).join(' ')}): ${locs.length} matches`);
      }
    }
    if (!locs.length || locs.length > 40) {
      this.searchNote = locs.length ? 'Too many possible party locations. Move the party and choose "Search again" in the menu.'
        : 'EOB 3 runs, but the party location was not found. Choose the game folder (menu) so the location in the newest ' +
          'saved game can be searched for, load that game and choose "Search again".';
      this.hold = true;
      return false;
    }
    let loc = locs[0];
    if (locs.length > 1) {
      log(`${locs.length} possible party locations: ${locs.map(l => hex(l, 6)).join(' ')}`);
      loc = await LocationChooser.choose(locs);
      if (loc < 0) { this.searchNote = 'Search cancelled. Choose "Search again" in the menu to retry.'; this.hold = true; return false; }
    }
    const level = mem[loc + 3], map = await bestMap3(mem, maps, loc, level);
    if (map < 0) { this.searchNote = `No level map in memory fits the party on level ${level}.`; return false; }
    Object.assign(this, { id: 3, cfg: GAMES[3], locAddr: loc, mapAddr: map, searchNote: '' });
    log(`EOB 3: party location at ${hex(loc, 6)} (${mem[loc]},${mem[loc + 1]} facing ${DIRS[mem[loc + 2]]}, level ${level}), ` +
      `level map at ${hex(map, 6)}${maps.length > 1 ? ` (${maps.length} maps in memory: ${maps.map(m => hex(m, 6)).join(' ')})` : ''}`);
    return true;
  },
  async poll3() {
    const [map, loc] = await Promise.all([Api.read(this.mapAddr, 1024), Api.read(this.locAddr, 4)]);
    Object.assign(this, { map, coords: loc });
  },
  // the location still makes sense and the map is a map with the party on open floor
  valid3() {
    const c = this.coords;
    return c[0] < 32 && c[1] < 32 && c[2] < 4 && c[3] >= 1 && c[3] <= 14 && isMap3(this.map, 0) && this.map[this.block] === 0xFF;
  },
  async poll() {
    if (this.id === 3) return this.poll3();
    const cfg = this.cfg;
    const [chars, coords, map, items, monsters, tables] = await Promise.all([
      Api.read(this.char0, cfg.charSize * 6), Api.read(this.addr('coords'), cfg.coordsLen),
      Api.read(this.addr('map'), 1024 * cfg.cellSize), Api.read(this.addr('items'), cfg.items * 14),
      Api.read(this.addr('monsters'), 30 * cfg.monSize), Api.read(this.tables.shape, cfg.tableLen * 3)]);
    Object.assign(this, { chars, coords, map, items, monsters });
    this.tables.data = tables;
    if (!this.types) this.types = await Api.read(this.addr('itemTypes'), (cfg.itemTypes || 57) * 16);
  },
  party() {
    const list = [];
    for (let i = 0; i < 6; i++) {
      const o = i * this.cfg.charSize, r = this.chars.subarray(o, o + this.cfg.charSize);
      if (!(r[1] & 1)) continue;
      let name = '';
      for (let k = 2; k < 13 && r[k]; k++) name += String.fromCharCode(r[k]);
      list.push({ slot: i, off: o, name, r });
    }
    return list;
  },
  wallFlags(w) { return this.tables.data[2 * this.cfg.tableLen + w] ?? 0; },
  specialType(w) { return this.tables.data[this.cfg.tableLen + w] ?? 0; },
  shapeMap(w) { const v = this.tables.data[w]; return v > 127 ? v - 256 : v ?? 0; },
  cell(b) { const s = this.cfg.cellSize; return this.map.subarray(b * s, b * s + s); },
  cellItem(b) { const c = this.cell(b), o = this.cfg.cellItem; return c[o] | c[o + 1] << 8; },
  item(i) {
    const o = i * 14, e = this.items;
    return { index: i, nameUnid: e[o], nameId: e[o + 1], flags: e[o + 2], icon: e[o + 3], type: e[o + 4], pos: e[o + 5],
      block: e[o + 6] | e[o + 7] << 8, next: e[o + 8] | e[o + 9] << 8, prev: e[o + 10] | e[o + 11] << 8,
      level: e[o + 12], value: e[o + 13] > 127 ? e[o + 13] - 256 : e[o + 13] };
  },
  // the item's name the way ASE builds it: its Item_List.txt entry while the
  // item still has the type and value it started the game with, else the game's
  // name table (the identified name when there is one, the identified flag is
  // not consulted); then the potion, wand, ring and scroll subtypes and the
  // "+N" of enchanted things
  itemName(it) {
    const g = this.id, A = AseData.items[g], v = it.value & 255, sv = it.value;

  },
  placeMonsters(e) {
    const s = Game.cfg.monSize, base = Game.addr('monsters');
    for (let i = 0; i < 30; i++) {
      const m = Game.monster(i);
      if (!m.block || m.block > 1023 || m.hpCur <= 0 || !expCell(e, m.block)) continue;
      this.monsters[m.block]++;
      this.monList.push({ b: m.block, name: Game.monsterName(m), hpCur: m.hpCur, hpMax: m.hpMax,
        debug: `$${hex(base + i * s, 6)}: ${hexBytes(Game.monsters.subarray(i * s), s)}` });
    }
  },
  // items of this level in cells with anything explored (in niches too)
  placeItems(e, lv) {
    const base = Game.addr('items');
    for (let i = 0; i < Game.cfg.items; i++) {
      const it = Game.item(i), b = it.block;
      if (b > 1023 || it.level !== lv) continue;
      if (!expCell(e, b) && !expFace(e, b, 0) && !expFace(e, b, 1) && !expFace(e, b, 2) && !expFace(e, b, 3)) continue;
      this.items[b]++;
      this.itemList.push({ b, name: Game.itemName(it),
        debug: `${String(i).padStart(4, '0')}. $${hex(base + i * 14, 6)}: ${hexBytes(Game.items.subarray(i * 14), 14)}` });
    }
  },
};

function partyExplore() {
  const lv = Game.level, b = Game.block;
  if (Game.id === 3) {   // ASE3: the party's cell and the four next to it
    for (const [dx, dy] of [[0, 0], [0, -1], [1, 0], [0, 1], [-1, 0]]) {
      const x = Game.x + dx, y = Game.y + dy;
      if (x >= 0 && y >= 0 && x < 32 && y < 32) Store.mark(lv, y << 5 | x);
    }
    return;
  }
  // ASE: the party's cell, the faces of the four cells around it that look
  // at the party, and those cells entirely when they are floor (as of the
  // last tick's cell information) - nothing further ahead
  Store.mark(lv, ei(b, 0));
  for (let d = 0; d < 4; d++) {
    const n = neighbour(b, d);
    if (n < 0) continue;
    Store.mark(lv, ei(n, (d ^ 2) + 1));
    if (Cells.level === lv && Cells.floor[n]) Store.mark(lv, ei(n, 0));
  }
}

/* ---------------------------------------------------------- hints */

const Hints = {
  cache: {},
  async get(level) {
    const k = `${Game.id}:${level}`;
    if (this.cache[k] !== undefined) return this.cache[k];
    const f = await DB.get('files', `ASE:EOB${Game.id}/Hints_${pad2(level)}.txt`);
    const list = [];
    if (f) {
      const text = new TextDecoder('latin1').decode(f);
      for (const part of text.split(/\r?\n(?=#\d)/)) {
        const m = part.match(/^#(\d+),(\d+)\s*\r?\n(\S*)\s*\r?\n([\s\S]*)$/);
        if (m) list.push({ x: +m[1] - 1, y: +m[2] - 1, id: m[3], text: m[4].trim() });   // the files count from 1
      }
    }
    return this.cache[k] = list;
  },
};

/* ------------------------------------------------------------ map */

const COLORS = { rock: '#A2843F', rock3: '#A4875F', floor3: '#DDDDDD', wall3: '#5A4B38', party3: '#009900',
  party3edge: '#005500', hover3: '#AA0000', note: '#1060d0' };

// ASE's cell bitmaps: cs x cs, rot = quarter turns clockwise; drawn with the
// original's GDI geometry (3-px walls, 6-px doors, ... whatever the cell size)
const Glyphs = {
  cache: new Map(),
  get(cat, rot, cs) {
    const k = `${cat}:${rot}:${cs}`;
    let c = this.cache.get(k);
    if (c) return c;
    c = el('canvas', { width: cs, height: cs });
    const g = c.getContext('2d');
    if (rot) { const src = this.get(cat, 0, cs); g.translate(cs / 2, cs / 2); g.rotate(rot * Math.PI / 2); g.drawImage(src, -cs / 2, -cs / 2); }
    else paintGlyph(g, cat, cs);
    this.cache.set(k, c);
    return c;
  },
};
function paintGlyph(g, cat, cs) {
  const W = '#584939', mid = cs >> 1;
  const fill = (x1, y1, x2, y2, c) => { g.fillStyle = c; g.fillRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1)); };
  const frame = (x1, y1, x2, y2, c) => { fill(x1, y1, x2, y1 + 1, c); fill(x1, y2 - 1, x2, y2, c); fill(x1, y1, x1 + 1, y2, c); fill(x2 - 1, y1, x2, y2, c); };
  const ellipse = (x1, y1, x2, y2, pen, brush) => {
    g.beginPath(); g.ellipse((x1 + x2) / 2, (y1 + y2) / 2, (x2 - x1 - 1) / 2, (y2 - y1 - 1) / 2, 0, 0, 7);
    g.fillStyle = brush; g.fill(); g.strokeStyle = pen; g.lineWidth = 1; g.stroke();
  };
  const poly = (pts, c) => {
    g.beginPath(); g.moveTo(pts[0][0] + 0.5, pts[0][1] + 0.5); for (const p of pts.slice(1)) g.lineTo(p[0] + 0.5, p[1] + 0.5); g.closePath();
    g.fillStyle = c; g.fill(); g.strokeStyle = c; g.lineWidth = 1; g.stroke();
  };
  const bar = inner => { fill(0, mid - 3, cs, mid + 3, W); fill(0, mid - 2, cs, mid + 2, inner); };
  const stubs = inner => { fill(0, mid - 3, 3, mid + 3, W); fill(0, mid - 2, 2, mid + 2, inner); fill(cs, mid - 3, cs - 3, mid + 3, W); fill(cs, mid - 2, cs - 2, mid + 2, inner); };
  const knob = c => { fill(mid - 3, 0, mid + 3, 5, W); fill(mid - 2, 0, mid + 2, 4, c); };
  const cell = c => fill(0, 0, cs, cs, c);
  switch (cat) {
    case 1: cell('#EEEEEE'); frame(0, 0, cs + 1, cs + 1, '#AAAAAA'); break;
    case 2: fill(0, 0, cs, 3, W); break;
    case 3: bar('#00AA00'); break;
    case 4: stubs('#00AA00'); break;
    case 5: bar('#888888'); break;
    case 6: stubs('#888888'); break;
    case 7: case 29: ellipse(3, 3, cs - 3, cs - 3, '#777777', '#999999'); break;
    case 8: case 14: case 22: knob('#00AA00'); break;
    case 9: case 31: cell('#786959'); break;
    case 10: frame(5, 0, cs - 5, 7, W); fill(6, 0, cs - 6, 6, '#EEEEEE'); break;
    case 11: poly([[3, cs - 3], [mid, 3], [cs - 3, cs - 3]], '#888888'); break;
    case 12: poly([[3, 3], [mid, cs - 3], [cs - 3, 3]], '#888888'); break;
    case 13: poly([[2, cs - 3], [mid, 2], [cs - 3, cs - 3]], '#228822'); break;
    case 15: fill(cs - 3, 0, cs, 3, W); break;
    case 16: case 21: case 23: case 24: knob('#AA0000'); break;
    case 17: cell('#BBBBBB'); break;
    case 18: ellipse(3, 3, cs - 3, cs - 3, '#666666', '#222222'); break;
    case 19: cell('#00AAAA'); g.fillStyle = '#EEEEEE'; g.font = `${Math.round(mid * 4 / 3)}px Tahoma, sans-serif`;
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('T', mid, mid); break;
    case 20: frame(2, 0, cs - 2, 7, W); fill(3, 0, cs - 3, 6, '#FF00CC'); break;
    case 25: cell('#AA0000'); break;
    case 26: ellipse(3, 3, cs - 3, cs - 3, '#770000', '#AA0000'); break;
    case 27: fill(4, 4, cs - 4, cs - 4, '#00EEEE'); frame(4, 4, cs - 4, cs - 4, '#00AAAA'); break;
    case 28: fill(4, 4, cs - 4, cs - 4, W); fill(5, 5, cs - 5, cs - 5, '#999999'); break;
    case 30: ellipse(3, 3, cs - 3, cs - 3, '#770000', '#990000'); break;
    case 32: cell('#288929'); break;
    case 33: cell('#888888'); break;
  }
}

const Render = {
  canvas: $('#map'), mouse: null, lastMouse: { x: -1, y: -1 }, mouseAt: 0, peekUntil: 0, hintList: [], hintAt: {}, notes: {}, tipTimer: 0,
  cellSize() {
    const wrap = $('#mapwrap'), z = Settings.v.zoom;
    if (z > 0) return z;
    return Math.max(8, Math.floor(Math.min(wrap.clientWidth, wrap.clientHeight) / 32));
  },
  async refreshAux() {
    if (!Game.coords) return;
    this.hintList = await Hints.get(Game.level);
    this.hintAt = {};
    for (const h of this.hintList) this.hintAt[h.y * 32 + h.x] = h;
    this.notes = await Store.notesOf(Game.level);
  },
  // EOB 1/2: ASE's drawing order
  draw() {
    if (!Game.map || !Game.coords) return;
    if (Game.id === 3) return this.draw3();
    const cs = this.cellSize(), c = this.canvas, g = c.getContext('2d'), size = cs * 32, C = Cells, s = Settings.v;
    if (c.width !== size) { c.width = size; c.height = size; }
    g.fillStyle = COLORS.rock; g.fillRect(0, 0, size, size);
    const e = Store.exp(Game.level), peek = Date.now() < this.peekUntil;
    $('#peek').classList.toggle('hidden', !peek);
    const put = (cat, rot, b) => g.drawImage(Glyphs.get(cat, rot & 3, cs), (b & 31) * cs, (b >> 5) * cs);
    for (let b = 0; b < 1024; b++) {
      for (let d = 0; d < 4; d++) {
        if (!(expFace(e, b, d) || peek) || !C.wallDraw[b * 4 + d]) continue;
        put(2, d, b);
        // the wall's end runs on into the cell left of that face unless that is explored floor
        const n = neighbour(b, (d + 3) & 3);
        if (n >= 0 && !(C.floor[n] && expCell(e, n))) put(15, d, n);
      }
      if (!expCell(e, b) && !peek) {   // of an unexplored cell only the shelves and portals of explored faces
        for (let d = 0; d < 4; d++) { const dc = C.deco[b * 4 + d]; if ((dc === 10 || dc === 20) && expFace(e, b, d)) put(dc, d, b); }
        continue;
      }
      if (C.floor[b]) put(1, 0, b);
      for (let d = 0; d < 4; d++) if (C.deco[b * 4 + d]) put(C.deco[b * 4 + d], d, b);
      if (C.center[b]) put(C.center[b], C.rot[b] - 1, b);
      if (!C.sides[b * 4] || !C.sides[b * 4 + 1] || !C.sides[b * 4 + 2] || !C.sides[b * 4 + 3]) put(25, 0, b);   // a wall ASE does not know
    }
    if (s.items) for (const it of C.itemList) put(27, 0, it.b);
    if (s.monsters) for (const m of C.monList) put(26, 0, m.b);
    if (s.hints) for (const h of this.hintList) { const b = h.y * 32 + h.x; if (expCell(e, b) || peek) this.hint(g, h.x * cs, h.y * cs, cs, h.id); }
    if (s.notes) for (const k of Object.keys(this.notes)) { const b = +k; if (expCell(e, b) || peek) this.note(g, (b & 31) * cs, (b >> 5) * cs, cs); }
    if (Game.dir < 4) put(13, Game.dir, Game.block);
  },
  // a clue book hint: a bright green cell with its number
  hint(g, X, Y, cs, id) {
    g.fillStyle = '#00FF00'; g.fillRect(X, Y, cs, cs);
    g.fillStyle = '#000'; g.font = `${Math.max(1, Math.round(Math.trunc(cs / 2.7) * 4 / 3))}px "Arial Narrow", "Liberation Sans Narrow", Arial, sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(id, X + cs / 2, Y + cs / 2);
  },
  // a note: a cyan cell with "!"
  note(g, X, Y, cs) {
    g.fillStyle = '#33CCCC'; g.fillRect(X, Y, cs, cs);
    g.fillStyle = '#000'; g.font = `bold ${Math.round((cs >> 1) * 4 / 3)}px Tahoma, sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('!', X + cs / 2, Y + cs / 2);
  },
  // EOB 3 like ASE3: explored open cells, 3-px walls on the edges towards wall cells
  draw3() {
    const cs = this.cellSize(), c = this.canvas, g = c.getContext('2d'), size = cs * 32, m = Game.map;
    if (c.width !== size) { c.width = size; c.height = size; }
    g.fillStyle = COLORS.rock3; g.fillRect(0, 0, size, size);
    const exp = Store.exp(Game.level), peek = Date.now() < this.peekUntil;
    $('#peek').classList.toggle('hidden', !peek);
    const open = b => m[b] === 0xFF && (peek || exp[b]);
    g.fillStyle = COLORS.floor3;
    for (let b = 0; b < 1024; b++) if (open(b)) g.fillRect((b & 31) * cs, (b >> 5) * cs, cs, cs);
    g.fillStyle = COLORS.wall3;
    for (let b = 0; b < 1024; b++) {
      if (!open(b)) continue;
      const x = b & 31, y = b >> 5, X = x * cs, Y = y * cs;
      if (y > 0 && m[b - 32] !== 0xFF) g.fillRect(X - 1, Y - 1, cs + 2, 3);
      if (x < 31 && m[b + 1] !== 0xFF) g.fillRect(X + cs - 1, Y - 1, 3, cs + 2);
      if (y < 31 && m[b + 32] !== 0xFF) g.fillRect(X - 1, Y + cs - 1, cs + 2, 3);
      if (x > 0 && m[b - 1] !== 0xFF) g.fillRect(X - 1, Y - 1, 3, cs + 2);
    }
    if (Settings.v.notes) {
      g.font = `bold ${Math.max(9, Math.round(cs * 0.36))}px Tahoma, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = COLORS.note;
      for (const [b, text] of Object.entries(this.notes)) g.fillText(text.split('\n')[0].slice(0, 3), (b & 31) * cs + cs / 2, (b >> 5) * cs + cs / 2);
    }
    // the party: a triangle 2 px inside the cell, green with a dark green outline
    const px = Game.x * cs + 2, py = Game.y * cs + 2, d = Game.dir, w = cs - 4;
    const pts = [[0.5, 0], [1, 1], [0, 1]].map(([u, v]) => {
      const [rx, ry] = d === 0 ? [u, v] : d === 1 ? [1 - v, u] : d === 2 ? [1 - u, 1 - v] : [v, 1 - u];
      return [px + rx * w, py + ry * w];
    });
    g.beginPath(); g.moveTo(...pts[0]); g.lineTo(...pts[1]); g.lineTo(...pts[2]); g.closePath();
    g.fillStyle = COLORS.party3; g.fill(); g.strokeStyle = COLORS.party3edge; g.lineWidth = 1; g.stroke();
    // the cell under the mouse, for 2 seconds after the mouse moved
    if (this.mouse && Date.now() - this.mouseAt < 2000) {
      g.strokeStyle = COLORS.hover3; g.lineWidth = 3;
      g.strokeRect(this.mouse.x * cs + 1.5, this.mouse.y * cs + 1.5, cs - 3, cs - 3);
    }
  },
  cellAt(ev) {
    const r = this.canvas.getBoundingClientRect(), cs = this.canvas.width / 32;
    const x = Math.floor((ev.clientX - r.left) / cs), y = Math.floor((ev.clientY - r.top) / cs);
    return x >= 0 && y >= 0 && x < 32 && y < 32 ? { x, y, b: y * 32 + x } : null;
  },
};

// the tooltip of a cell (EOB 1/2), as the original decides and fills it: something
// on an explored face, or an explored cell with a feature, shown monsters or
// items, a hint or a note; plain floor and unexplored cells have none
function hasTip(b) {
  const e = Store.exp(Game.level), C = Cells, s = Settings.v;
  for (let d = 0; d < 4; d++) if (C.deco[b * 4 + d] && expFace(e, b, d)) return true;
  if (!expCell(e, b)) return false;
  return C.center[b] > 0 || s.monsters && C.monsters[b] > 0 || s.items && C.items[b] > 0 || s.hints && !!Render.hintAt[b] || s.notes && !!Render.notes[b];
}
function tipText(b) {
  const C = Cells, s = Settings.v, out = ['', `${pad2(b & 31)},${pad2(b >> 5)}`, ''];
  if (C.center[b]) out.push(CAT_NAMES[C.center[b]] || '', '');
  let n = 0;
  for (let d = 0; d < 4; d++) { const c = C.deco[b * 4 + d]; if (c) { out.push(CAT_NAMES[c] || ''); n++; } }
  if (n) out.push('');
  if (s.monsters && C.monsters[b]) {
    out.push('Monsters:');
    for (const m of C.monList) if (m.b === b) { out.push(`- ${m.name} (${m.hpCur} / ${m.hpMax} hit points)`); if (s.debug) out.push(m.debug); }
    out.push('');
  }
  if (s.items && C.items[b]) {
    out.push('Items:');
    for (const it of C.itemList) if (it.b === b) { out.push(`- ${it.name}`); if (s.debug) out.push(it.debug); }
    out.push('');
  }
  const h = Render.hintAt[b];
  if (s.hints && h) out.push(`${h.id}. ${h.text.trim()}`, '');
  if (s.notes && Render.notes[b]) out.push(Render.notes[b].trim());
  if (out.at(-1) === '') out.pop();
  return out.join('\n');
}
// EOB 3: the cell's contents
function describeCell3(c) {
  const b = c.b, lines = [`${pad2(c.x + 1)},${pad2(c.y + 1)}`];
  if (!(Date.now() < Render.peekUntil || Store.exp(Game.level)[b] || Settings.v.debug)) return lines.join('\n') + '  (unexplored)';
  lines.push(Game.map[b] === 0xFF ? 'open' : 'wall');
  if (Render.notes[b]) lines.push('Note: ' + Render.notes[b]);
  if (Settings.v.debug) lines.push(`map byte ${hex(Game.map[b], 2)} at ${hex(Game.mapAddr + b, 6)}`);
  return lines.join('\n');
}

/* -------------------------------------------------------- title bar */

function updateTitle() {
  if (!Game.coords) return;
  const name = LEVEL_NAMES[Game.id][Game.level - 1] || '';
  let t;
  if (Game.id === 3) {   // ASE3: "Burial glen   [08,25]", counted from 1; the mouse cell for 2 s after it moved
    t = `${name}   [${pad2(Game.x + 1)},${pad2(Game.y + 1)}]`;
    if (Render.mouse && Date.now() - Render.mouseAt < 2000) t += `   [${pad2(Render.mouse.x + 1)},${pad2(Render.mouse.y + 1)}]`;
  } else {
    // the original always adds the cell the mouse was last over ("(-01,-01)" before
    // it ever was), in debug mode also that cell's four wall bytes
    const m = Render.lastMouse, sp2 = v => (v < 0 ? '-' : '') + pad2(Math.abs(v));
    t = `${pad2(Game.x)},${pad2(Game.y)} at level ${Game.level}: "${name}"   (${sp2(m.x)},${sp2(m.y)})` + (Settings.v.debug && m.x >= 0 ? '   ' +
      [...Game.cell(m.y * 32 + m.x).subarray(0, 4)].map(v => hex(v, 2)).join(', ') : '');
  }
  $('#title').textContent = t;
  document.title = `${t} - ASE`;
}

/* ------------------------------------------------------- main loop */

async function loop() {
  Settings.load();
  $('#dbg').classList.toggle('hidden', !Settings.v.debug);
  const q = new URLSearchParams(location.search);
  if (q.get('asedata')) await importAseUrl(q.get('asedata')).catch(e => log(e.message));
  if (q.get('ase3data')) await importAse3Url(q.get('ase3data')).catch(e => log(e.message));
  if (q.get('gamedata')) {
    Files.url = q.get('gamedata').replace(/\/?$/, '/');
    await importExplored3().catch(e => log(e.message));
  }
  await AseData.load();
  try {
    Game.info = await Api.info();
  } catch {
    setConn('no API', 'bad');
    $('#msg').innerHTML = '<h2>DOSBox Staging\'s API is not reachable</h2><p>Open this page through DOSBox Staging\'s ' +
      'webserver, e.g. <b>http://localhost:8086/ase.html</b>, with <code>webserver_enabled = on</code> in its config.</p>';
    return;
  }
  let lastLevel = 0;
  for (;;) {
    try {
      if (!Game.cfg) {
        lastLevel = 0;
        if (Game.hold) {   // EOB 3 search gave up: wait for "Search again"
          setConn('not found', 'warn');
          showMsg('The party was not found', Game.searchNote);
          await sleep(500); continue;
        }
        setConn('searching', 'warn');
        showMsg('Waiting for Eye of the Beholder', 'Start the game and load a saved game. ' +
          'The All-Seeing Eye finds the party by itself.' + (Game.searchNote ? '\n\n' + Game.searchNote : ''));
        if (!await Game.find()) { await sleep(2000); continue; }
        showMsg('');
        $('#game').textContent = Game.cfg.name; $('#game').classList.remove('hidden');
        document.documentElement.style.setProperty('--rock', Game.id === 3 ? COLORS.rock3 : COLORS.rock);
        if (Game.id !== 3) log(`${Game.cfg.name} found: characters at ${hex(Game.char0, 6)}, map at ${hex(Game.addr('map'), 6)}, ` +
          `items at ${hex(Game.addr('items'), 6)}, monsters at ${hex(Game.addr('monsters'), 6)}`);
        if (Store.loadedFor !== Game.id) {   // like ASE's start: the explored maps of the chosen save slot
          Store.loadedFor = Game.id;
          if (Game.id !== 3) await importExplored12();
          await Store.loadSlot(Game.cfg.slots === 1 ? 1 : Settings.v.slot);
        }
      }
      await Game.poll();
      if (Game.id === 3 ? !Game.valid3() : !(Game.chars[1] & 1) || Game.level < 1 || Game.level > Game.cfg.levels) {
        if (Game.id === 3) log(`EOB 3: location (${[...Game.coords].map(v => hex(v, 2)).join(' ')}) or map no longer valid, searching again`);
        Game.cfg = null; $('#tip').style.display = 'none'; continue;
      }
      setConn(`DOSBox ${Game.info.version.split(' ')[0]}`, 'ok');
      if (Game.id === 3 && lastLevel && Game.level !== lastLevel) {
        // a new level: its map may be loaded anywhere
        await sleep(400);
        if (!await Game.find3(true)) { Game.cfg = null; continue; }
        await Game.poll();
        if (!Game.valid3()) { Game.cfg = null; continue; }
      }
      if (Game.level !== lastLevel) { lastLevel = Game.level; await Render.refreshAux(); }
      partyExplore();
      if (Game.id !== 3) Cells.build();
      updateTitle();
      Render.draw();
      Editor.refresh();
      SavePeek.tick();
    } catch (e) {
      setConn('DOSBox not answering', 'bad');
      Game.cfg = null;
      await sleep(1500);
    }
    await sleep(200);
  }
}
function setConn(text, cls) { const c = $('#conn'); c.textContent = text; c.className = 'chip ' + cls; }
function showMsg(title, text = '') {
  const m = $('#msg');
  if (!title) { m.replaceChildren(); return; }
  m.replaceChildren(el('h2', { textContent: title }), ...text.split('\n\n').map(p => el('p', { textContent: p })));
}

/* ---------------------------------------------------------- events */

const cv = Render.canvas;
cv.addEventListener('mousemove', ev => {
  const c = Render.cellAt(ev);
  Render.mouse = c; Render.mouseAt = Date.now();
  if (c) Render.lastMouse = c;
  updateTitle();
  if (Game.id === 3) Render.draw();
  const tip = $('#tip');
  clearTimeout(Render.tipTimer);
  const text = c && Game.map && Game.coords && (Game.id === 3 ? describeCell3(c) : hasTip(c.b) ? tipText(c.b) : null);
  if (!text) { tip.style.display = 'none'; return; }
  tip.textContent = text;
  tip.style.display = 'block';
  tip.style.left = Math.min(ev.clientX + 16, innerWidth - tip.offsetWidth - 4) + 'px';

// like the original: bit 40 (identified) in byte 2 of every item, the whole table written back
async function identifyAll() {
  const out = Game.items.slice();
  for (let i = 0; i < Game.cfg.items; i++) out[i * 14 + 2] |= 0x40;
  await Api.write(Game.addr('items'), out);
  log('All items identified');
}
// the original's: in every item type (16 bytes) byte 5 = 3F (all classes) and
// byte 6 = 0 (one hand); checked in the menu after that, and unchecking it
// writes nothing (the game's own values come back when it reloads them)
async function itemTweaks() {
  if (Game.tweaked) { Game.tweaked = false; return; }
  const a = Game.addr('itemTypes'), n = Game.cfg.itemTypes || 57, t = await Api.read(a, n * 16);
  for (let i = 0; i < n; i++) { t[i * 16 + 5] = 0x3F; t[i * 16 + 6] = 0; }
  await Api.write(a, t);
  Game.tweaked = true;
  log('Item usability tweaks applied');
}
async function weakenMonsters() {
  const s = Game.cfg.monSize, m = Game.monsters.slice();
  for (let i = 0; i < 30; i++) if ((m[i * s + 14] | m[i * s + 15] << 8) > 1) { m[i * s + 14] = 1; m[i * s + 15] = 0; }
  await Api.write(Game.addr('monsters'), m);
  log('Monsters weakened to 1 HP');
}
// what the original does (EOB 2): flag 20 in byte 16 of every monster with hit points
async function petrifyMonsters() {
  const s = Game.cfg.monSize, m = Game.monsters.slice();
  for (let i = 0; i < 30; i++) if (m[i * s + 12] | m[i * s + 13]) m[i * s + 0x16] |= 0x20;
  await Api.write(Game.addr('monsters'), m);
  log('Monsters petrified');
}
// the original's Monsters.txt and Items.txt (addresses are linear ones here)
function dumpMonsters() {
  const s = Game.cfg.monSize, m = Game.monsters;
  const cols = Array.from({ length: s }, (_, k) => hex(k, 2)).join(' ');
  const lines = [`##   Address      ${cols}      XX,YY   Hit points`, ''];
  for (let i = 0; i < 30; i++) {
    const r = m.subarray(i * s, i * s + s), block = r[2] | r[3] << 8;
    let line = `${pad2(i + 1)}   ${hex(Game.addr('monsters') + i * s, 8)}     ${[...r].map(v => hex(v, 2) + ' ').join('')}`;
    if (block) line += `     ${pad2(block & 31)},${pad2(block >> 5)}   ${String(r[14] | r[15] << 8).padStart(3, '0')} / ${String(r[12] | r[13] << 8).padStart(3, '0')}`;

function dumpItems() {
  const pad = ' '.repeat(67);
  const lines = [pad + 'item name, unidentified', pad + '|  item name, identified (01 = empty, no identified name)',
    pad + '|  |  bits ($80 = magical, $40 = identified)', pad + '|  |  |     item type',

  for (let i = 0; i < Game.cfg.items; i++) {

// the ASE or ASE3 folder (hints, Blocks.dat; level maps, item names) and the
// game folder (saves, manuals)
function pickFolder(kind) {
  const inp = $('#folderInput');
  inp.value = '';
  inp.onchange = async () => {
    const files = [...inp.files];
    if (kind === 'ase') {
      let n = 0;
      for (const f of files) {
        const p = f.webkitRelativePath.split('/').slice(1).join('/');
        let m = p.match(/^EOB([12])\/(Hints_\d\d\.txt|Blocks\.dat|Item_(?:List|Name)\.txt|Item_(?:Type|Subtype)\.dat)$/i);
        if (m) { await DB.put('files', `ASE:EOB${m[1]}/${normalAseName(m[2])}`, await f.arrayBuffer()); n++; continue; }
        m = p.match(/^Maps\/(\d\d)\.dat$/i);
        if (m) { await DB.put('files', `ASE3:Maps/${m[1]}.dat`, await f.arrayBuffer()); n++; continue; }
        if (/^Items\.txt$/i.test(p)) { await DB.put('files', 'ASE3:Items.txt', await f.arrayBuffer()); n++; }
      }
      Hints.cache = {}; Maps3.cache = {}; await AseData.load(); await Render.refreshAux(); Render.draw();
      log(n ? `ASE data imported (${n} files)` : 'No ASE or ASE3 data files in that folder');
    } else {
      const top = files.filter(f => f.webkitRelativePath.split('/').length <= 3);
      Object.assign(Files, { game: top, dir: null, url: '' });
      for (const f of top) if (/^(manual|cluebook)\.pdf$/i.test(f.name)) await DB.put('files', 'PDF:' + f.name.toLowerCase().replace('.pdf', ''), f);
      log(`Game folder chosen (${top.length} files)`);
      await afterGameFolder();
    }
  };
  if (kind === 'game' && window.showDirectoryPicker) {
    // a folder handle can also write (Apply to save, the save editor)
    showDirectoryPicker({ id: 'eobgame', mode: 'readwrite' }).then(async d => {
      Object.assign(Files, { dir: d, game: null, url: '' });
      log(`Game folder chosen: ${d.name}`);
      await afterGameFolder();
    }, e => { if (e.name !== 'AbortError') inp.click(); });
    return;
  }
  inp.click();
}
async function afterGameFolder() {
  await importExplored3();
  if (Game.cfg && Game.id !== 3) await importExplored12();
  Saves3.refresh();
  if (Files.after) { const a = Files.after; Files.after = null; a(); }
}
// the manual or clue book from the game folder, else the copy kept from an earlier pick
async function findPdf(key) {
  if (Files.dir) {
    for await (const [name, h] of Files.dir.entries()) if (h.kind === 'file' && name.toLowerCase() === key + '.pdf') return h.getFile();
  } else if (Files.url) {
    for (const name of [key.toUpperCase() + '.pdf', key[0].toUpperCase() + key.slice(1) + '.pdf', key + '.pdf']) {
      const r = await fetch(Files.url + name, { method: 'HEAD' }).catch(() => null);
      if (r?.ok) return Files.url + name;
    }
  }
  return DB.get('files', 'PDF:' + key);
}
// the game folder: files picked with the folder dialog, a folder handle
// (Chromium's File System Access API: also writable), or a folder the
// webserver serves (?gamedata=<folder>, read only)
const Files = {
  game: null, dir: null, url: '', after: null,
  has() { return !!(this.game || this.dir || this.url); },
  async handle(path) {
    let d = this.dir;
    const parts = path.split('/');
    for (const p of parts.slice(0, -1)) d = await d.getDirectoryHandle(p);
    return d.getFileHandle(parts.at(-1));
  },
  // { data: Uint8Array, date: ms } or null
  async get(path) {
    try {
      if (this.dir) { const f = await (await this.handle(path)).getFile(); return { data: new Uint8Array(await f.arrayBuffer()), date: f.lastModified }; }
      if (this.game) { const f = gameFile(path); return f ? { data: new Uint8Array(await f.arrayBuffer()), date: f.lastModified } : null; }
      if (this.url) {
        const r = await fetch(this.url + path, { cache: 'no-store' });
        return r.ok ? { data: new Uint8Array(await r.arrayBuffer()), date: Date.parse(r.headers.get('Last-Modified')) || 0 } : null;
      }
    } catch {}
    return null;
  },
  async read(path) { return (await this.get(path))?.data || null; },
  // the file's date (ms), 0 when it is not there
  async date(path) {
    try {
      if (this.dir) return (await (await this.handle(path)).getFile()).lastModified;
      if (this.game) return gameFile(path)?.lastModified || 0;
      if (this.url) {
        let r = await fetch(this.url + path, { method: 'HEAD', cache: 'no-store' }).catch(() => null);
        if (r && !r.ok && r.status !== 404) r = await fetch(this.url + path, { cache: 'no-store' }).catch(() => null);
        return r?.ok ? Date.parse(r.headers.get('Last-Modified')) || 0 : 0;
      }
    } catch {}
    return 0;
  },
  // writes into the game folder when it is writable, else offers a download
  async write(path, data) {
    if (this.dir) {
      try {
        if (await this.dir.requestPermission({ mode: 'readwrite' }) === 'granted') {
          const w = await (await this.handle(path)).createWritable();
          await w.write(data); await w.close();
          return true;
        }
      } catch (e) { log(`Writing ${path}: ${e.message}`); }
    }
    download(new Blob([data]), path.split('/').at(-1));
    alert(`The game folder can't be written from here, so ${path.split('/').at(-1)} was downloaded instead. ` +
      `Copy it into the game's ${path.split('/').slice(0, -1).join('/') || 'main'} folder.`);
    return false;
  },
};
const normalAseName = n => {
  const l = n.toLowerCase();
  if (l.startsWith('hints_')) return 'Hints_' + n.slice(6, 8) + '.txt';
  return { 'blocks.dat': 'Blocks.dat', 'item_list.txt': 'Item_List.txt', 'item_name.txt': 'Item_Name.txt', 'item_type.dat': 'Item_Type.dat',
    'item_subtype.dat': 'Item_Subtype.dat' }[l] || n;
};
// a file of the chosen game folder by its path below it ("SAVEGAME/ITEMS_01.BIN")
function gameFile(path) {
  path = path.toLowerCase();
  return Files.game?.find(f => f.webkitRelativePath.split('/').slice(1).join('/').toLowerCase() === path) || null;
}

// ?asedata=<folder> (ASE's) and ?ase3data=<folder> (ASE3's): data from a
// folder the webserver serves (relative to this page)
async function importAseUrl(base) {
  if (!base.endsWith('/')) base += '/';
  let n = 0;
  for (const id of [1, 2]) for (const name of ['Blocks.dat', 'Item_List.txt', 'Item_Name.txt', 'Item_Type.dat', 'Item_Subtype.dat',
    ...Array.from({ length: 16 }, (_, i) => `Hints_${pad2(i + 1)}.txt`)]) {
    const r = await fetch(`${base}EOB${id}/${name}`, { cache: 'no-store' });
    if (!r.ok) continue;
    await DB.put('files', `ASE:EOB${id}/${name}`, await r.arrayBuffer()); n++;
  }
  log(`ASE data imported from ${base} (${n} files)`);
}
async function importAse3Url(base) {
  if (!base.endsWith('/')) base += '/';
  let n = 0;
  for (const name of [...Array.from({ length: 14 }, (_, i) => `Maps/${pad2(i + 1)}.dat`), 'Items.txt']) {
    const r = await fetch(base + name, { cache: 'no-store' });
    if (!r.ok) continue;
    await DB.put('files', 'ASE3:' + name, await r.arrayBuffer()); n++;
  }
  Maps3.cache = {};
  log(`ASE3 data imported from ${base} (${n} files)`);
}
// ASE3 kept explored maps in <game>\ASE\Explored_NN.dat (per save slot, 14
// levels x 1024 bytes, column by column: x * 32 + y)
// a file of the game folder is taken over once per version (date and size), so
// clearing its slot in the page is not undone at the next start
async function newFile(path) {
  const f = await Files.get(path);
  if (!f) return null;
  const sig = `${f.date}:${f.data.length}`, key = 'imported:' + path.toLowerCase();
  if ((await DB.get('kv', key)) === sig) return null;
  await DB.put('kv', key, sig);
  return f.data;
}
async function importExplored3() {
  let n = 0;
  for (let slot = 1; slot <= 12; slot++) {
    const d = await newFile(`ASE/Explored_${pad2(slot)}.dat`);
    if (!d) continue;
    for (let lv = 1; lv <= 14 && lv * 1024 <= d.length; lv++) {
      const k = `3:${slot}:${lv}`, old = await DB.get('kv', 'exp:' + k), m = new Uint8Array(1024);
      if (old) m.set(new Uint8Array(old).subarray(0, 1024));
      for (let i = 0; i < 1024; i++) m[i] |= d[(lv - 1) * 1024 + ((i & 31) << 5 | i >> 5)] ? 1 : 0;
      await DB.put('kv', 'exp:' + k, m.buffer);
    }
    n++;
  }
  if (n) log(`Explored maps of ${n} save slot(s) taken over from ASE3`);
}
// ASE (EOB 1/2) kept them per level in <game>\ASE\Explored_NN.dat (the working
// set) and a copy per save slot in <game>\ASE_<slot>\: the slot copies are merged in
async function importExplored12() {
  if (!Files.has() || !Game.cfg || Game.id === 3) return;
  let n = 0;
  for (let slot = 1; slot <= (Game.cfg.slots || 6); slot++) for (let lv = 1; lv <= Game.cfg.levels; lv++) {
    const d = await newFile(`ASE_${slot}/Explored_${pad2(lv)}.dat`);
    if (!d || d.length < 5120) continue;
    const k = Store.skey(slot, lv), m = toExp(await DB.get('kv', 'exp:' + k));
    for (let i = 0; i < 5120; i++) if (d[i]) m[i] = 1;
    await DB.put('kv', 'exp:' + k, m.buffer);
    n++;
  }
  if (n) log(`Explored maps taken over from ASE (${n} files)`);
}

async function backupSave() {
  if (!Files.has()) { alert('Choose the game folder: the backup takes the saved games from there.'); Files.after = backupSave; pickFolder('game'); return; }
  const names = [];
  if (Game.id === 3) {   // SAVEGAME\: the directory, each slot's ITEMS_NN.BIN and LVLnn_NN.BIN
    names.push('SAVEGAME/SAVEGAME.DIR');
    for (let s = 0; s <= 12; s++) {
      names.push(`SAVEGAME/ITEMS_${pad2(s)}.BIN`);
      for (let lv = 1; lv <= 14; lv++) names.push(`SAVEGAME/LVL${pad2(lv)}_${pad2(s)}.BIN`);
    }
  } else names.push('EOBDATA.SAV', ...Array.from({ length: 9 }, (_, i) => `EOBDATA${i + 1}.SAV`));
  const entries = [];
  for (const n of names) { const d = await Files.read(n); if (d) entries.push([n.split('/').at(-1), d]); }
  if (!entries.length) { alert(`No saved games (${Game.id === 3 ? 'SAVEGAME\\' : 'EOBDATA*.SAV'}) in the game folder.`); return; }
  // like the original: the explored maps go with the saved games (ASE's Explored_NN.dat files)
  if (Game.id !== 3) for (let lv = 1; lv <= Game.cfg.levels; lv++) { const m = await Store.workOf(lv); if (m.some(v => v)) entries.push([`Explored_${pad2(lv)}.dat`, m]); }
  const stamp = new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-');
  download(zipStore(entries), `EOB${Game.id} saves ${stamp}.zip`);
  log(`Saved games backed up (${entries.length} files)`);
}

function download(blob, name) {
  const a = el('a', { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

function zipStore(entries) {
  const crcTable = Array.from({ length: 256 }, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
  const crc = d => { let c = 0xFFFFFFFF; for (const b of d) c = crcTable[(c ^ b) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const parts = [], central = [];
  let off = 0;
  for (const [name, data] of entries) {
    const nm = new TextEncoder().encode(name), c = crc(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint32(14, c, true);
    h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nm.length, true);
    parts.push(new Uint8Array(h.buffer), nm, data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint32(16, c, true);
    cd.setUint32(20, data.length, true); cd.setUint32(24, data.length, true); cd.setUint16(28, nm.length, true);
    cd.setUint32(42, off, true);
    central.push(new Uint8Array(cd.buffer), nm);
    off += 30 + nm.length + data.length;
  }
  const size = central.reduce((a, p) => a + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, size, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}

// several places in memory look like the party location: list them live; the
// one that changes when the party moves is it (picked by itself when only one
// changes, or by a click)
const LocationChooser = {
  choose(locs) {
    return new Promise(resolve => {
      const d = Dlg.make('locchoose', 'Possible location addresses', 420), body = d.querySelector('.body');
      const t = el('table', { className: 'list' });
      body.replaceChildren(el('p', { textContent: 'Found several possible party locations in memory. Move the party or ' +
        'turn in the game: the row that changes with it is the party. It is picked by itself when only one row changes, ' +
        'or click it. Close the window to cancel.' }), t);
      t.append(el('tr', {}, ...['address', 'x,y', 'facing', 'level'].map(h => el('th', { textContent: h }))));
      let first = null, done = false, timer = 0;
      const finish = v => { if (done) return; done = true; clearInterval(timer); d.remove(); resolve(v); };
      d.querySelector('header button').onclick = () => finish(-1);
      const rows = locs.map(a => { const tr = el('tr', { onclick: () => finish(a), style: 'cursor:pointer' }); t.append(tr); return tr; });
      const tick = async () => {
        const vals = await Promise.all(locs.map(a => Api.read(a, 4).catch(() => null)));
        if (done) return;
        first ??= vals.map(v => v?.join());
        const changed = [];
        vals.forEach((v, i) => {
          const ok = v && v[0] < 32 && v[1] < 32 && v[2] < 4 && v[3] >= 1 && v[3] <= 14;
          rows[i].replaceChildren(el('td', { textContent: hex(locs[i], 6) }),
            el('td', { textContent: ok ? `${pad2(v[0] + 1)},${pad2(v[1] + 1)}` : '-' }),
            el('td', { textContent: ok ? DIRS[v[2]] : '' }), el('td', { textContent: ok ? String(v[3]) : '' }));
          if (ok && v.join() !== first[i]) changed.push(i);
        });
        if (changed.length === 1 && vals.filter(v => v).length > 1) finish(locs[changed[0]]);
      };
      timer = setInterval(tick, 500); tick();
    });
  },
};

// SAVEGAME\SAVEGAME.DIR names the 12 slots (line n = ITEMS_nn.BIN); the
// party's x, y, direction and level are bytes 252-255 of ITEMS_nn.BIN
const Saves3 = {
  list: null, sel: 0,
  async load() {
    const dir = await Files.read('SAVEGAME/SAVEGAME.DIR');
    if (!dir) return this.list = null;
    const names = new TextDecoder('latin1').decode(dir).split('\r\n');
    const list = [];
    for (let slot = 1; slot <= 12; slot++) {
      const name = (names[slot - 1] || '').replace(/[\x1a\0].*$/s, '').trimEnd();
      const used = !!name && !/^_+$/.test(name);
      const f = used ? await Files.get(`SAVEGAME/ITEMS_${pad2(slot)}.BIN`) : null;
      list.push({ slot, name: used ? name : '', items: f?.data || null, date: f?.date || 0,
        loc: f && f.data.length >= 256 ? f.data.slice(252, 256) : null });
    }
    return this.list = list;
  },
  async newestLocation() {
    const list = await this.load();
    const used = (list || []).filter(s => s.loc).sort((a, b) => b.date - a.date);
    return used[0]?.loc || null;
  },
  refresh() { if (document.getElementById('saves3')) this.open(); },
  async open() {
    const d = Dlg.make('saves3', 'EOB 3 saved games', 980), body = d.querySelector('.body');
    if (!Files.has()) {
      body.replaceChildren(el('p', { textContent: 'Choose the game folder (the one with SAVEGAME\\ in it) to see the saved games.' }),
        el('button', { textContent: 'Game folder…', onclick: () => pickFolder('game') }));
      return;
    }
    const list = await this.load();
    if (!list) { body.replaceChildren(el('p', { textContent: 'No SAVEGAME\\SAVEGAME.DIR in the game folder.' })); return; }
    if (!this.sel) this.sel = [...list].filter(s => s.loc).sort((a, b) => b.date - a.date)[0]?.slot || 1;
    const fmtDate = ms => { if (!ms) return ''; const t = new Date(ms); return `${t.getFullYear()}-${pad2(t.getMonth() + 1)}-${pad2(t.getDate())}  ${pad2(t.getHours())}:${pad2(t.getMinutes())}`; };
    const rows = el('table', { className: 'list', style: 'font-family:Consolas,monospace' });
    for (const s of list) {
      const lv = s.loc ? `${pad2(s.loc[3])}: ${LEVEL_NAMES[3][s.loc[3] - 1] || ''}` : '';
      rows.append(el('tr', { className: s.slot === this.sel ? 'sel' : '', style: 'cursor:pointer',
        onclick: () => { this.sel = s.slot; this.open(); }, ondblclick: () => setSlot(s.slot).then(() => this.open()) },
        el('td', { textContent: pad2(s.slot) }), el('td', { textContent: s.name }),
        el('td', { textContent: lv }), el('td', { textContent: s.name ? fmtDate(s.date) : '' })));
    }
    const s = list[this.sel - 1];
    const full = el('input', { type: 'checkbox', checked: !!Settings.v.previewFull });
    const cv = el('canvas', { width: 480, height: 480, style: 'background:var(--rock);cursor:crosshair' });
    const level = el('select');
    LEVEL_NAMES[3].forEach((n, i) => level.append(el('option', { value: i + 1, textContent: `${pad2(i + 1)}: ${n}` })));
    const xIn = el('input', { type: 'number', min: 1, max: 32, style: 'width:56px' }), yIn = el('input', { type: 'number', min: 1, max: 32, style: 'width:56px' });
    if (s.loc) { level.value = s.loc[3]; xIn.value = s.loc[0] + 1; yIn.value = s.loc[1] + 1; }
    const draw = () => this.preview(cv, s, +level.value, +xIn.value - 1, +yIn.value - 1, full.checked);
    full.onchange = () => { Settings.v.previewFull = full.checked; Settings.save(); draw(); };
    level.onchange = xIn.oninput = yIn.oninput = draw;
    cv.onmousedown = ev => {
      const r = cv.getBoundingClientRect(), cs = cv.width / 32;
      xIn.value = Math.floor((ev.clientX - r.left) / cs) + 1; yIn.value = Math.floor((ev.clientY - r.top) / cs) + 1; draw();
    };
    const apply = el('button', { textContent: 'Apply to save', disabled: !s.items, onclick: async () => {
      const x = +xIn.value - 1, y = +yIn.value - 1, lv = +level.value;
      if (!(x >= 0 && x < 32 && y >= 0 && y < 32)) { alert('X and Y go from 1 to 32.'); return; }
      const data = s.items.slice();
      data[252] = x; data[253] = y; data[255] = lv;
      if (await Files.write(`SAVEGAME/ITEMS_${pad2(s.slot)}.BIN`, data))
        log(`Save slot ${s.slot}: party set to level ${lv} at ${pad2(x + 1)},${pad2(y + 1)}`);
      this.open();
    } });
    const slotNote = el('span', { className: 'muted', textContent: `Explored maps are kept per save slot; the map shows slot ${Settings.v.slot}` +
      ' (double-click a saved game to use its slot).' });
    body.replaceChildren(el('div', { className: 'cols' },
      el('div', { style: 'flex:1;min-width:420px' },
        el('fieldset', {}, el('legend', { textContent: ' Saved games ' }), rows),
        el('p', {}, slotNote),
        el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' },
          el('button', { textContent: 'Refresh saved games', onclick: () => this.open() }),
          el('button', { textContent: 'Edit characters in save file', disabled: !s.items, onclick: () => Editor3.openFile(s.slot) }),
          el('button', { textContent: 'Clear explored', onclick: () => this.clearExplored(s.slot) }),
          el('button', { textContent: 'Backup save game', onclick: backupSave }))),
      el('div', {}, cv,
        el('div', {}, el('label', { style: 'display:inline-flex;gap:6px;margin:4px 0' }, full, 'Show preview map as fully explored')),
        el('fieldset', {}, el('legend', { textContent: ' Party location in this save game ' }),
          el('div', { style: 'display:flex;gap:6px;align-items:center' }, level, xIn, yIn, apply)))));
    draw();
  },
  async preview(cv, s, level, px, py, full) {
    const g = cv.getContext('2d'), cs = cv.width / 32;
    g.fillStyle = COLORS.rock3; g.fillRect(0, 0, cv.width, cv.height);
    // the live map when the game is on that level, else ASE3's map of it
    const m = Game.id === 3 && Game.map && Game.level === level ? Game.map : await Maps3.get(level);
    if (!m) {
      g.fillStyle = '#2b2010'; g.font = '14px Tahoma'; g.textAlign = 'center';
      g.fillText('No map of this level: import ASE3\'s folder (menu: ASE / ASE3 data folder)', cv.width / 2, cv.height / 2);
      return;
    }
    const exp = full ? null : new Uint8Array(await DB.get('kv', `exp:3:${s.slot}:${level}`) || new ArrayBuffer(1024));
    const live = s.slot === (SavePeek.slot || Settings.v.slot) ? Store.work[`3:work:${level}`] : null;   // the working set goes to this slot
    const open = b => m[b] === 0xFF && (full || exp[b] || live?.[b]);
    g.fillStyle = COLORS.floor3;
    for (let b = 0; b < 1024; b++) if (open(b)) g.fillRect((b & 31) * cs, (b >> 5) * cs, cs, cs);
    g.fillStyle = COLORS.wall3;
    for (let b = 0; b < 1024; b++) {
      if (!open(b)) continue;
      const x = b & 31, y = b >> 5, X = x * cs, Y = y * cs;
      if (y > 0 && m[b - 32] !== 0xFF) g.fillRect(X - 1, Y - 1, cs + 2, 3);
      if (x < 31 && m[b + 1] !== 0xFF) g.fillRect(X + cs - 1, Y - 1, 3, cs + 2);
      if (y < 31 && m[b + 32] !== 0xFF) g.fillRect(X - 1, Y + cs - 1, cs + 2, 3);
      if (x > 0 && m[b - 1] !== 0xFF) g.fillRect(X - 1, Y - 1, 3, cs + 2);
    }
    if (px >= 0 && py >= 0 && px < 32 && py < 32) {
      g.fillStyle = COLORS.party3; g.beginPath(); g.arc(px * cs + cs / 2, py * cs + cs / 2, cs * 0.35, 0, 7); g.fill();
      g.strokeStyle = COLORS.party3edge; g.lineWidth = 1; g.stroke();
    }
  },
  async clearExplored(slot) {
    if (!confirm('Really clear explored maps from this save slot?')) return;
    await Store.clearSlot(slot);
    if (slot === (SavePeek.slot || Settings.v.slot)) for (let lv = 1; lv <= 14; lv++) { Store.exp(lv).fill(0); Store.dirty.add(Store.wkey(lv)); }
    Store.gen++; Render.draw(); this.open();
    log(`Explored maps of save slot ${slot} cleared`);
  },
};

// ASE's character editor for EOB 1/2: statistics, hit points, armor class,
// race, class, alignment, food and experience can be changed (levels are
// shown only), spells are a count per spell with Learn / Unlearn, the
// inventory is set from the item list
const Editor = {
  cur: 0, kind: 'mage', spell: -1, slot: -1, filter: '',
  open() {
    if (Game.id === 3) return Editor3.open();
    if (!Game.chars) return;
    Dlg.make('editor', 'Character editor', 980);
    this.render();
  },
  refresh() { /* values are read when the editor is drawn; live fields keep the user's input */ },
  rec() { const cs = Game.cfg.charSize; return Game.chars.subarray(this.cur * cs, (this.cur + 1) * cs); },
  base() { return Game.char0 + this.cur * Game.cfg.charSize; },
  // ASE's view of the spells: -1 unknown ("-"), else the number of memorized copies
  spellCounts(r, kind) {
    const F = Game.cfg.f, list = SPELLS[Game.id][kind], counts = new Array(list.length).fill(0);
    if (kind === 'mage') {
      const known = r[F.known] | r[F.known + 1] << 8 | r[F.known + 2] << 16 | r[F.known + 3] << 24;
      for (let i = 0; i < list.length; i++) if (!(known >> i & 1)) counts[i] = -1;
    }
    const start = kind === 'mage' ? F.mage : F.cleric, nLev = Math.max(...list.map(s => s[1]));
    for (let i = 0; i < nLev * F.spellSlots; i++) { const n = r[start + i]; if (n >= 1 && n <= list.length) counts[n - 1]++; }
    return counts;
  },
  // written as ASE writes it: the known bitmap (mage spells), then every
  // level's slots filled with its memorized spells in list order
  async writeSpells(kind, counts) {
    const F = Game.cfg.f, list = SPELLS[Game.id][kind], base = this.base();
    if (kind === 'mage') {
      let known = 0;
      counts.forEach((c, i) => { if (c >= 0) known |= 1 << i; });
      await Api.write(base + F.known, Uint8Array.of(known & 255, known >> 8 & 255, known >> 16 & 255, known >>> 24));
    }
    const nLev = Math.max(...list.map(s => s[1])), rows = new Uint8Array(nLev * F.spellSlots);
    for (let L = 1; L <= nLev; L++) {
      let k = 0;
      list.forEach(([, lv], i) => { if (lv === L) for (let c = 0; c < counts[i] && k < F.spellSlots; c++) rows[(L - 1) * F.spellSlots + k++] = i + 1; });
    }
    await Api.write(base + (kind === 'mage' ? F.mage : F.cleric), rows);
  },
  async learn(delta) {
    if (this.spell < 0) return;
    const F = Game.cfg.f, counts = this.spellCounts(this.rec(), this.kind);
    counts[this.spell] = Math.max(-1, Math.min(F.spellSlots, counts[this.spell] + delta));
    await this.writeSpells(this.kind, counts);
    await Game.poll(); this.render();
  },
  async setItem(index) {
    if (this.slot < 0) return;
    await Api.write(this.base() + Game.cfg.f.inv + SLOTS12[this.slot][1], Uint8Array.of(index & 255, index >> 8));
    log(`${SLOTS12[this.slot][0]} = item ${hex(index)}`);
    await Game.poll(); this.render();
  },
  render() {
    const d = document.getElementById('editor');
    if (!d) return;
    const body = d.querySelector('.body'), party = Game.party(), cfg = Game.cfg, F = cfg.f;
    if (!party.some(p => p.slot === this.cur)) this.cur = party[0]?.slot ?? 0;
    const chars = el('div', { className: 'chars' });
    for (const p of party) chars.append(el('button', { className: p.slot === this.cur ? 'sel' : '', textContent: p.name,
      onclick: () => { this.cur = p.slot; this.render(); } }));
    chars.append(el('button', { textContent: 'Refresh', onclick: () => this.render(), style: 'margin-top:8px' }));
    const r = this.rec(), base = this.base(), pending = {};
    const rd = (off, size) => size === 1 ? r[off] : size === 2 ? r[off] | r[off + 1] << 8 : (r[off] | r[off + 1] << 8 | r[off + 2] << 16 | r[off + 3] << 24) >>> 0;
    const num = (label, off, size = 1, max = 255) => {
      const inp = el('input', { type: 'number', min: 0, max, value: rd(off, size) });

  get(r, off, size = 1, signed = false) {

  let len = 0;
  while (len < 20 && m[n + len]) { const c = m[n + len]; if (c < 32 || c > 126) return false; len++; }
  if (len < 1 || len > 19) return false;

      log(changed.length ? `Characters written to memory: ${changed.map(r => rec3.name(r.data)).join(', ')}` : 'Nothing changed');
    } else {
      const f = this.src.file.slice();
      for (const r of recs) f.set(r.data, r.at + C3.from);
      if (await Files.write(`SAVEGAME/ITEMS_${pad2(this.src.slot)}.BIN`, f)) {
        this.src.file = f;
        log(`Characters written to ITEMS_${pad2(this.src.slot)}.BIN`);
      }
    }
  },
};

/* -------------------------------------------------------- log */

const logLines = [];
function log(text) {
  logLines.push(`${new Date().toTimeString().slice(0, 8)}  ${text}`);
  if (logLines.length > 500) logLines.shift();
  const l = document.querySelector('#log');
  if (l) { l.textContent = logLines.join('\n'); l.parentElement.scrollTop = 1e9; }
}
const LogWin = {
  open() {
    const d = Dlg.make('logwin', 'Debug log', 640), body = d.querySelector('.body');
    body.style.height = '320px';
    if (!body.querySelector('#log')) body.append(el('div', { id: 'log' }));
    log('Log opened');
  },
};

loop();
</script>
</body>
